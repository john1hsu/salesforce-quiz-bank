id: sf-001564
product_area: automation
true_statement: An enhanced letterhead can be attached only to Lightning email templates that don't use Salesforce Merge Language.
false_statement: An enhanced letterhead can be attached only to Classic Visualforce email templates that use Salesforce Merge Language.
explanation: The EnhancedLetterhead object supplies a header and footer for Lightning templates, and only those without Salesforce Merge Language. It is not a Visualforce template feature.
