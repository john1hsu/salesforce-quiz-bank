id: sf-000866
product_area: automation
true_statement: A scheduled path's batch size defaults to 200, which is also its maximum, and can be lowered to 1.
false_statement: A scheduled path's batch size defaults to 200 and can be raised to 2,000 for large volumes.
explanation: Records due in the same minute are batched at up to 200; lowering the size helps the path's actions stay within governor limits. It cannot go above 200.
