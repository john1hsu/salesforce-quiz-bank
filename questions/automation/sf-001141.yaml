id: sf-001141
product_area: automation
true_statement: In Salesforce debug logs, flow events such as interview start, element errors and fault paths are logged under the Workflow category.
false_statement: In Salesforce debug logs, flow events such as interview start, element errors and fault paths are logged under the Apex Code category.
explanation: Flow interview and element events belong to the Workflow log category, mostly at INFO to FINER levels. The Apex Code category covers Apex execution, not flow events.
