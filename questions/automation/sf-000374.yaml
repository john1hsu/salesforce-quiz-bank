id: sf-000374
product_area: automation
true_statement: Trigger order values apply only to before-save and after-save flows and have no effect on asynchronous or scheduled paths.
false_statement: Trigger order values apply equally to before-save, after-save, asynchronous and scheduled paths of record-triggered flows.
explanation: Ordering covers only before-save and after-save flows. Asynchronous and scheduled paths ignore it, and Trailhead notes asynchronous flows can't be guaranteed to run in the listed order.
