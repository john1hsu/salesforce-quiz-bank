id: sf-001566
product_area: automation
true_statement: When a publisher push-upgrades a packaged flow template, the subscriber's clone made from it stays unchanged.
false_statement: When a publisher push-upgrades a packaged flow template, the subscriber's clone made from it is updated to match.
explanation: A clone is a separate flow owned by the subscriber. Upgrades reach only the original template, so the subscriber maintains the clone itself.
