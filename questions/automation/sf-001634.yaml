id: sf-001634
product_area: automation
true_statement: Action plan status doesn't follow task progress automatically; admins clone and activate the Update Action Plan Status flow template to keep it in sync.
false_statement: Action plan status follows task progress automatically, so no flow is needed to mark a plan complete when its tasks are done.
explanation: Out of the box the plan's status stays where it was set; the provided flow template must be cloned and activated to update it from task completion. The false version assumes built-in syncing.
