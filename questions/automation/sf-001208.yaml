id: sf-001208
product_area: automation
true_statement: Apex inserts of leads or cases fire auto-response rules according to the triggerAutoResponseEmail flag on Database.DMLOptions.emailHeader.
false_statement: Apex inserts of leads or cases fire auto-response rules according to the useDefaultRule flag on Database.DMLOptions.assignmentRuleHeader.
explanation: The emailHeader's triggerAutoResponseEmail setting controls whether auto-responses send for records created with Apex DML. The assignment rule header governs assignment rules, not auto-response emails.
