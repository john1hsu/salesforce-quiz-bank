id: sf-001845
product_area: automation
true_statement: A flow's Create, Update and Delete Records elements can together write at most 10,000 records by DML in one transaction.
false_statement: A flow's Create, Update and Delete Records elements can together write at most 50,000 records by DML in one transaction.
explanation: The per-transaction limit is 10,000 records created, updated or deleted, which is why an unfiltered scheduled flow touching every Contact can fail. 50,000 overstates it.
