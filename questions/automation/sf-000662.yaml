id: sf-000662
product_area: automation
true_statement: A flow version's API version for running the flow doesn't move forward with new releases; it changes only when a Manage Flow user edits it.
false_statement: A flow version's API version for running the flow moves forward automatically with each new release, unless a Manage Flow user pins it.
explanation: Each version keeps the runtime API version it was saved with until someone with Manage Flow changes it, ideally after reading the release notes in between. It is not upgraded automatically.
