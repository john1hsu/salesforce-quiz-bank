id: sf-001708
product_area: automation
true_statement: In a custom property editor for an invocable action, generic sObject inputs are addressed with a T__ prefix and outputs with a U__ prefix.
false_statement: In a custom property editor for an invocable action, generic sObject inputs are addressed with a U__ prefix and outputs with a T__ prefix.
explanation: T__ marks input type mappings and U__ marks output mappings, and the text after the prefix must match the @InvocableVariable name. The false version swaps the prefixes.
