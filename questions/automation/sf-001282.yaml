id: sf-001282
product_area: automation
true_statement: In a Wait for Conditions element, if no wait configuration's conditions are met, the interview doesn't pause and follows the default path instead.
false_statement: In a Wait for Conditions element, if no wait configuration's conditions are met, the interview pauses until the first configuration's resume event occurs.
explanation: Wait conditions decide at run time whether the interview waits at all. With none met, it skips the pause and takes the default connector.
