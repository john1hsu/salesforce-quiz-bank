id: sf-001002
product_area: automation
true_statement: In a subscriber org, Flow Builder shows only packaged invocable methods and variables that are declared global.
false_statement: In a subscriber org, Flow Builder shows packaged invocable methods and variables declared either public or global.
explanation: Packaged invocable code is visible to subscriber flows only when it is global. Public members stay hidden outside the package's namespace.
