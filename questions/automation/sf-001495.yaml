id: sf-001495
product_area: automation
true_statement: A Flow formula resource stores no value and is recalculated each time an element references it, so its result can change mid-flow.
false_statement: A Flow formula resource is calculated once when the interview starts and keeps that value, so its result cannot change mid-flow.
explanation: Flow recomputes a formula on every reference, so if an input variable changes the formula's result changes too. To freeze a value, copy it into a variable with an Assignment.
