id: sf-000801
product_area: automation
true_statement: Running flow tests with the sf flow run test command requires the View All Data permission.
false_statement: Running flow tests with the sf flow run test command requires only the Run Flows permission.
explanation: The CLI reference lists View All Data as required for sf flow run test. Run Flows on its own is not enough to run tests from the command line.
