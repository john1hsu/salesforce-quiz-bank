id: sf-000727
product_area: automation
true_statement: An Apex class can contain only one @InvocableMethod, and that method takes at most one parameter, typically a list.
false_statement: An Apex class can contain several @InvocableMethod methods, and each one takes at most one parameter, typically a list.
explanation: Salesforce limits the annotation to a single static, public or global method per outer class. The parameter rule is the same in both versions; the count of methods is what's wrong.
