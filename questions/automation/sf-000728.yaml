id: sf-000728
product_area: automation
true_statement: When an autolaunched flow is run through the Invocable Actions API, a flow admin always runs the latest version, while other flow users run the active one.
false_statement: When an autolaunched flow is run through the Invocable Actions API, a flow admin always runs the active version, while other flow users run the latest one.
explanation: Ordinary flow users get the active version (or the latest if none is active), but a flow admin always gets the newest version. The false version swaps the two callers.
