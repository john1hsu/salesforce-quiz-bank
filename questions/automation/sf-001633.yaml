id: sf-001633
product_area: automation
true_statement: An action plan item assigned to a role held by two or more users falls back to the plan creator.
false_statement: An action plan item assigned to a role held by two or more users falls back to the target record's owner.
explanation: When a role does not resolve to exactly one user, or no user resolves at all, the item goes to whoever created the plan. The record owner is not the fallback.
