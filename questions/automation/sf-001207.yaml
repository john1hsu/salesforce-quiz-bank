id: sf-001207
product_area: automation
true_statement: Salesforce evaluates auto-response rule entries in order and sends only the template of the first entry that matches.
false_statement: Salesforce evaluates auto-response rule entries in order and sends the template of every entry that matches.
explanation: Rule entries are checked by sort order and evaluation stops at the first match, so later matching entries are ignored. That is why specific entries go first and a catch-all goes last.
