id: sf-001841
product_area: automation
true_statement: Rows in one Flow Assignment element run in the order listed, so a later row can use a value that an earlier row just set.
false_statement: Rows in one Flow Assignment element are evaluated together, so a later row sees only values from before the element ran.
explanation: Salesforce executes Assignment rows sequentially, which makes row order meaningful. A later row reads the updated value, not a snapshot from before the element.
