id: sf-001350
product_area: automation
true_statement: To appear in Flow Builder, a custom screen component's .js-meta.xml must set isExposed to true and list lightning__FlowScreen as a target.
false_statement: To appear in Flow Builder, a custom screen component's .js-meta.xml must set isExposed to true and list lightning__RecordPage as a target.
explanation: The lightning__FlowScreen target is what makes an exposed Lightning web component available on flow screens. lightning__RecordPage exposes it to Lightning App Builder record pages instead, not to screen flows.
