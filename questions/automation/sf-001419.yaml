id: sf-001419
product_area: automation
true_statement: The Flow Data Table screen component can show up to 1,500 records, of which the user can select up to 200.
false_statement: The Flow Data Table screen component can show up to 1,500 records, of which the user can select up to 50.
explanation: Salesforce Help caps the Data Table at 1,500 displayed records and 200 selected rows. Fifty understates the selection limit.
