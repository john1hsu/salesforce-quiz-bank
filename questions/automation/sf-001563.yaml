id: sf-001563
product_area: automation
true_statement: For a custom object to be chosen as a Lightning email template's Related Entity Type, the object needs Allow Activities enabled.
false_statement: For a custom object to be chosen as a Lightning email template's Related Entity Type, the object needs Allow Reports enabled.
explanation: The related entity drives which merge fields a Lightning template can use, and custom objects qualify only when Allow Activities is turned on in Object Manager. Allow Reports has no bearing on it.
