id: sf-000107
product_area: automation
true_statement: Automation on the after-undelete event must be built with an Apex trigger, because record-triggered flows do not support that event.
false_statement: Automation on the after-undelete event must be built with a record-triggered flow, because Apex triggers do not support that event.
explanation: Flow has no after-undelete support, which leaves Apex triggers as the only option for that event. The false statement swaps which tool handles it.
