id: sf-001352
product_area: automation
true_statement: In a custom property editor, Flow Builder shows only the count of errors returned by validate(), so the editor must display the messages itself.
false_statement: In a custom property editor, Flow Builder shows every error message returned by validate(), so the editor doesn't need to display them itself.
explanation: The editor's validate() runs when the admin clicks Done and returns key/error pairs, but Flow Builder surfaces only how many errors there are. Showing the actual messages is the editor's job.
