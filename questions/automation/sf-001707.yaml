id: sf-001707
product_area: automation
true_statement: An invocable Apex action names its custom property editor through the configurationEditor modifier on its @InvocableMethod annotation.
false_statement: An invocable Apex action names its custom property editor through a configurationEditor element in the Apex class's -meta.xml file.
explanation: For actions the editor is declared on the annotation itself; only screen components register it in their .js-meta.xml targetConfig. The Apex class metadata file has no such element.
