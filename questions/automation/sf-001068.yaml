id: sf-001068
product_area: automation
true_statement: Joining two collections in a Flow Transform element keeps only inner-join matches, so records with no partner in the other collection are dropped.
false_statement: Joining two collections in a Flow Transform element works as a left outer join, so records with no partner in the other collection are kept.
explanation: A Transform join returns only rows whose key exists in both collections. Unmatched records are discarded rather than kept as in an outer join.
