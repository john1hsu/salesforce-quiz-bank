id: sf-001353
product_area: automation
true_statement: A quick action that creates a detail record in a master-detail relationship must be an object-specific action rather than a global action.
false_statement: A quick action that creates a detail record in a master-detail relationship must be a global action rather than an object-specific action.
explanation: A detail record needs its master, so the action must run with record context, which only object-specific actions have. Global actions carry no record context.
