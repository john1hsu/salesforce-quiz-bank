id: sf-000377
product_area: automation
true_statement: The 24-hour limit on schedule-triggered flow interviews is 250,000 or the org's user licenses times 200, whichever is greater.
false_statement: The 24-hour limit on schedule-triggered flow interviews is 250,000 or the org's user licenses times 200, whichever is smaller.
explanation: The org-wide daily cap takes the greater of the two figures, so large orgs get more than 250,000 interviews. Exceeding it produces a flow error email.
