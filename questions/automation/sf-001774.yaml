id: sf-001774
product_area: automation
true_statement: A Flow Decision element takes only the first outcome, in Outcome Order, whose conditions are met, even if later outcomes would also match.
false_statement: A Flow Decision element runs every outcome whose conditions are met, one after another in Outcome Order.
explanation: Decision outcomes are checked in sequence and the first match wins, so just one path runs. That is why the most specific outcome should go first.
