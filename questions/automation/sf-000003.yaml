id: sf-000003
product_area: automation
true_statement: A before-save (fast field updates) record-triggered flow can change fields only on the record that triggered it.
false_statement: A before-save (fast field updates) record-triggered flow can update fields on related records as well as on the record that triggered it.
explanation: Before-save flows support only Assignment, Decision, Get Records and Loop elements and can change fields only on the triggering record. Creating, updating or deleting related records requires an after-save path.
