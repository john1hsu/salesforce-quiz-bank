id: sf-000513
product_area: automation
true_statement: Each case escalation rule entry can have up to five escalation actions, each firing at a longer case age.
false_statement: Each case escalation rule entry can have up to ten escalation actions, each firing at a longer case age.
explanation: Salesforce allows a maximum of five timed escalation actions per rule entry, set over increasing Age Over periods. Ten exceeds that cap.
