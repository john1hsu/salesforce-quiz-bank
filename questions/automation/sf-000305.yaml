id: sf-000305
product_area: automation
true_statement: In a record-triggered flow, adding a fault path to a failing element lets the triggering record change still complete even though the flow failed.
false_statement: In a record-triggered flow, adding a fault path to a failing element still blocks the triggering record change and shows the error to the user.
explanation: A fault path marks the error as handled, so the triggering save goes through and earlier work is not undone automatically. Blocking the save with a message is what happens with no fault path, or when the path ends in a Custom Error element.
