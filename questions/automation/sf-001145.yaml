id: sf-001145
product_area: automation
true_statement: To debug a flow as another user, the admin needs both the Manage Flow and View All Data permissions.
false_statement: To debug a flow as another user, the admin needs both the Manage Flow and Modify All Data permissions.
explanation: Salesforce Help ties choosing a different running user in flow debug to holders of Manage Flow plus View All Data. Modify All Data is not the stated requirement.
