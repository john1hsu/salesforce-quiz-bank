id: sf-000590
product_area: automation
true_statement: If a referenced subflow has no active version, the call succeeds only for flow admins and fails at runtime for other users.
false_statement: If a referenced subflow has no active version, the call succeeds for all users by running its latest saved version.
explanation: Falling back to an inactive latest version only works when a flow admin runs the parent. For ordinary users the subflow call fails at runtime, so the child must be activated.
