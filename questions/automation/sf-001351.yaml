id: sf-001351
product_area: automation
true_statement: When conditional visibility hides a custom flow screen component, Flow sets all of its outputs to null as the user leaves the screen.
false_statement: When conditional visibility hides a custom flow screen component, Flow keeps its last output values as the user leaves the screen.
explanation: Salesforce documents that a hidden component's outputs are cleared to null on leaving the screen, so downstream elements can't rely on stale values. Keeping the previous values is the behaviour developers often wrongly assume.
