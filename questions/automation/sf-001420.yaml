id: sf-001420
product_area: automation
true_statement: Confirming an inline edit in a Flow Data Table doesn't save it; the changes come back in the Edited Rows output for an Update Records element.
false_statement: Confirming an inline edit in a Flow Data Table saves the record immediately, so no Update Records element is needed afterward.
explanation: Since Spring '26 the table supports inline editing, but a confirmed edit only updates the Edited Rows collection. The flow must pass that collection to Update Records to commit it.
