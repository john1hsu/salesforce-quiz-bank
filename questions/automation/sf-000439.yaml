id: sf-000439
product_area: automation
true_statement: An org can keep several case assignment rules, but only one case assignment rule can be active at a time.
false_statement: An org can keep several case assignment rules, and up to five case assignment rules can be active at a time.
explanation: Each of leads and cases allows exactly one active rule; alternates such as a holiday rule are kept inactive and swapped in. Multiple active rules are not possible.
