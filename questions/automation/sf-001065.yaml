id: sf-001065
product_area: automation
true_statement: For bulk flow errors other than governor limits, Salesforce retries saving the successful record changes up to three times.
false_statement: For bulk flow errors other than governor limits, Salesforce retries saving the successful record changes up to ten times.
explanation: When a non-limit error occurs in a bulk flow operation, the platform makes up to three attempts to save the records that succeeded. Ten is not the documented retry count.
