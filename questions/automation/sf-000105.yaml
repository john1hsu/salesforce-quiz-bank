id: sf-000105
product_area: automation
true_statement: An approval process's default submission action locks the record so that only approvers and admins can edit it while the request is pending.
false_statement: An approval process's default submission action locks the record so that only the submitter and admins can edit it while the request is pending.
explanation: By default, submitting for approval locks the record, leaving edit rights with approvers and administrators. The submitter is not the one who keeps edit access.
