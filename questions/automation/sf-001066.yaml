id: sf-001066
product_area: automation
true_statement: When a Data Loader update of 100 cases runs a flow, the flow's Get Records step is bulkified into a single SOQL query across the interviews.
false_statement: When a Data Loader update of 100 cases runs a flow, the flow's Get Records step issues one SOQL query per case, 100 queries in total.
explanation: The Flow runtime collects interviews waiting at the same Get Records element and runs one shared query for them. Per-record queries only happen when the element sits inside a loop within one interview.
