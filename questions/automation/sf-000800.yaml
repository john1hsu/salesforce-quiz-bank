id: sf-000800
product_area: automation
true_statement: A single flow test simulates either a record create or a record update, so a flow that reacts to both needs separate tests.
false_statement: A single flow test can simulate both a record create and a record update, so one test covers a flow that reacts to both.
explanation: Each flow test is tied to one trigger event, Created or Updated. Covering both events therefore takes two tests.
