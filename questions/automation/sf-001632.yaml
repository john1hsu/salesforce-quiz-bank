id: sf-001632
product_area: automation
true_statement: In an action plan template, a task can depend on up to three prerequisite tasks, and dependent tasks are created only after their prerequisites are completed.
false_statement: In an action plan template, a task can depend on up to ten prerequisite tasks, and all tasks are created when the plan starts regardless of prerequisites.
explanation: Action plans support at most three prerequisites per task, and only tasks without prerequisites exist at launch; the rest appear as their predecessors finish. The false version raises the limit and creates everything up front.
