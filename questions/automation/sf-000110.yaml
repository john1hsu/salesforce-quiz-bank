id: sf-000110
product_area: automation
true_statement: In a reactive screen flow, the $Flow global variable is reactive, while $Organization, $Profile and custom labels are not.
false_statement: In a reactive screen flow, the $Profile global variable is reactive, while $Flow, $Organization and custom labels are not.
explanation: Only $Flow reacts to changes on the screen; $Organization, $Profile, custom labels and custom settings do not, so the false statement swaps the one reactive global variable.
