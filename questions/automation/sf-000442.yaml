id: sf-000442
product_area: automation
true_statement: A platform event-triggered flow interview runs in the context of the user who published the event, so created records show that publisher in CreatedById.
false_statement: A platform event-triggered flow interview runs as the Automated Process user, so created records show Automated Process in CreatedById.
explanation: Only the debug logs go under Automated Process; the interview itself runs as the publishing user. Running as Automated Process is the default for platform event Apex triggers, not flows.
