id: sf-000585
product_area: automation
true_statement: When an orchestration work item is assigned to a queue, the first member to finish its screen flow completes it and it disappears for the others.
false_statement: When an orchestration work item is assigned to a queue, every member must finish its screen flow before it is marked complete.
explanation: 'Group and queue work items are first-come, first-served: one completion closes the item and a simultaneous second submission errors. No requirement exists for all members to complete it.'
