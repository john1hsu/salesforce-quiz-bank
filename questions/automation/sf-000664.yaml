id: sf-000664
product_area: automation
true_statement: The Automated Process User Email Address used as the sender for scheduled flow emails must be an organization-wide email address.
false_statement: The Automated Process User Email Address used as the sender for scheduled flow emails must be the Default Workflow User's own email address.
explanation: Process Automation Settings requires an organization-wide email address as the sender for scheduled flow email. The Default Workflow User sets the running user, not the sender address.
