id: sf-001846
product_area: automation
true_statement: A before-save flow that changes the triggering record saves it only once, so assignment, workflow and auto-response rules run only once.
false_statement: A before-save flow that changes the triggering record saves it a second time, so assignment, workflow and auto-response rules run again.
explanation: Before-save changes are applied in the same save, which is why it is the faster choice for same-record updates. No extra save means the rules don't run a second time.
