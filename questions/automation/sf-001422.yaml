id: sf-001422
product_area: automation
true_statement: In Flow, the filter conditions of Update Records and Delete Records elements also use a SOQL query, just as each Get Records element does.
false_statement: In Flow, only Get Records elements use a SOQL query; the filter conditions of Update Records and Delete Records don't count as queries.
explanation: Trailhead notes that filtering in Update Records or Delete Records requires a query, so those elements count against the 100-query limit alongside Get Records. Treating them as query-free leads to surprise limit errors.
