id: sf-000108
product_area: automation
true_statement: A top-level screen flow runs in user context by default, so the running user's object and field permissions apply.
false_statement: A top-level screen flow runs in system context without sharing by default, so the running user's object and field permissions are ignored.
explanation: Screen flows default to user context, applying the launching user's profile and permission sets; system context is an opt-in choice, and system without sharing is meant to be used sparingly.
