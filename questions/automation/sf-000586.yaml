id: sf-000586
product_area: automation
true_statement: Orchestration work items assigned to a public group are owned by the automated process user rather than by any group member.
false_statement: Orchestration work items assigned to a public group are owned by the group member who was added to the group first.
explanation: Only items assigned directly to a user are owned by that user; group items, and queue items whose queue isn't tied to the work item object, belong to the automated process user.
