id: sf-001354
product_area: automation
true_statement: On a quick action, a predefined field value takes precedence over the field's own default value.
false_statement: On a quick action, the field's own default value takes precedence over a predefined field value.
explanation: Predefined values are applied by the action and override the field's default, which lets admins drop those fields from the action layout. The false version reverses that order.
