id: sf-001775
product_area: automation
true_statement: When an outcome in a Flow Decision has several conditions, Flow Builder applies All Conditions Are Met (AND) by default.
false_statement: When an outcome in a Flow Decision has several conditions, Flow Builder applies Any Condition Is Met (OR) by default.
explanation: New condition rows are combined with AND unless the builder switches the requirement to OR or custom logic.
