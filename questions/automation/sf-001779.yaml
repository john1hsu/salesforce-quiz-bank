id: sf-001779
product_area: automation
true_statement: In a screen flow running in system context, components that query data themselves, such as lookups and file upload, still apply the user's permissions.
false_statement: In a screen flow running in system context, components that query data themselves, such as lookups and file upload, also bypass the user's permissions.
explanation: The flow's elevated context doesn't extend to screen components that run their own queries. Those components enforce the running user's access regardless of the flow's mode.
