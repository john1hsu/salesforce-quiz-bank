true_statement: A Salesforce org processes up to 1,000 time-based flow resume events per hour, and extra events slip to the next hour.
false_statement: A Salesforce org processes up to 250 time-based flow resume events per hour, and extra events are discarded.
explanation: The documented cap is 1,000 time-based resume events per hour; anything beyond it is deferred to the following hour rather than dropped.
