id: sf-001280
product_area: automation
true_statement: The cap of 2,000 executed elements per flow interview applied only to API version 56.0 and earlier; API version 57.0 removed it.
false_statement: The cap of 2,000 executed elements per flow interview applies to every API version, including flows saved at API version 57.0 and later.
explanation: The executed-element ceiling is a legacy limit tied to older flow API versions. From API 57.0 it no longer applies, though per-transaction governor limits still do.
