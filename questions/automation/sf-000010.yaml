id: sf-000010
product_area: automation
true_statement: In Flow Builder, Run and Debug always execute the most recently saved version of the flow, not unsaved edits.
false_statement: In Flow Builder, Run and Debug always execute the currently active version of the flow, not unsaved edits.
explanation: Run and Debug use whatever version was saved last, even if a different version is the one activated for users. Activation only controls which version users run.
