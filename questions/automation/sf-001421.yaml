id: sf-001421
product_area: automation
true_statement: With multiple selection in a Flow Data Table, the First Selected Row output holds the row the user clicked first, not necessarily the first row in the table.
false_statement: With multiple selection in a Flow Data Table, the First Selected Row output always holds the topmost selected row in table order.
explanation: Trailhead warns that First Selected Row follows the order of the user's clicks. Selected Rows is the output that lists picks in table order.
