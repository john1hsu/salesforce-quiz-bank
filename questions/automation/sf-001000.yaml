id: sf-001000
product_area: automation
true_statement: An @InvocableMethod must return a list the same size and order as its input list, so failed inputs still get a result entry.
false_statement: An @InvocableMethod may return a shorter list than its input, so failed inputs can simply be dropped from the results.
explanation: The i-th output answers the i-th input, which is what lets the action run in bulk. Dropping failed rows breaks that mapping, so the pattern is a result wrapper that reports success or failure.
