id: sf-000511
product_area: automation
true_statement: In Apex, BusinessHours.addGmt returns a GMT datetime, while BusinessHours.add returns a datetime in local time.
false_statement: In Apex, BusinessHours.add returns a GMT datetime, while BusinessHours.addGmt returns a datetime in local time.
explanation: The add and nextStartDate methods give local-time results and addGmt gives GMT. Swapping them, as the false statement does, is exactly the kind of mix-up that causes time-zone offset bugs in SLA code.
