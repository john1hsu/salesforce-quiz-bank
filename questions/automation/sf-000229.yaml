id: sf-000229
product_area: automation
true_statement: Once a classic approval process has been activated, you can't add, delete or reorder its steps, even after deactivating it.
false_statement: Once a classic approval process has been activated, you can add, delete or reorder its steps as soon as you deactivate it.
explanation: Activation permanently fixes a classic process's step structure and reject or skip behaviour; deactivating doesn't reopen it. Testing in a sandbox first avoids having to rebuild the process.
