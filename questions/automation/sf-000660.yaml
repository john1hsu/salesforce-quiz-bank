id: sf-000660
product_area: automation
true_statement: A Salesforce flow can have up to 50 versions in every edition, and inactive old versions count toward that cap.
false_statement: A Salesforce flow can have up to 100 versions in every edition, and inactive old versions count toward that cap.
explanation: The cap is 50 versions per flow, and unused versions still count, so they should be deleted before the limit is hit. 100 doubles the real figure.
