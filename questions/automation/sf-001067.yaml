id: sf-001067
product_area: automation
true_statement: When a Flow Transform element aggregates a collection with Count or Sum, the result must be written to a Number target field.
false_statement: When a Flow Transform element aggregates a collection with Count or Sum, the result must be written to a Text target field.
explanation: Transform aggregation only writes to a Number field in the target resource. A Text field cannot receive a Count or Sum result.
