id: sf-001567
product_area: automation
true_statement: A flow approval process version needs a description before it can be saved as a template.
false_statement: A flow approval process version needs to be activated before it can be saved as a template.
explanation: The documented steps save the approval process as a new version with a description and then select Template under Show Advanced. A missing description, not activation status, is what blocks saving it as a template.
