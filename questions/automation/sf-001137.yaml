id: sf-001137
product_area: automation
true_statement: In Flow's Collection Sort, empty strings and nulls sort last by default, because the nulls-first flag on each sort option defaults to false.
false_statement: In Flow's Collection Sort, empty strings and nulls sort first by default, because the nulls-first flag on each sort option defaults to true.
explanation: Each sort option's flag for putting empty values first defaults to false, so nulls and blanks end up at the end unless the builder changes it.
