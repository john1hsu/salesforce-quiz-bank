id: sf-000441
product_area: automation
true_statement: If an org has no assignment rules, leads or cases saved via API version 30.0 or later stay unassigned rather than getting a default owner.
false_statement: If an org has no assignment rules, leads or cases saved via API version 30.0 or later are given a predefined default owner.
explanation: From API 30.0 the record is left unassigned when no rules exist. Assigning a predefined default owner was the behaviour for API 29.0 and earlier.
