id: sf-001706
product_area: automation
true_statement: Since Spring '26, Agentforce for Flow can change an existing flow, showing each proposed change for the builder to accept or reject.
false_statement: Since Spring '26, Agentforce for Flow can change an existing flow, applying each proposed change automatically and saving a new version.
explanation: The Agentforce panel proposes edits such as adding a Decision or a fault path, and the builder approves or rejects each one. Changes are not applied without the builder's review.
