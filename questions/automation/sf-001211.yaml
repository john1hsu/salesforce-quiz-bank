id: sf-001211
product_area: automation
true_statement: An element inside two nested Flow loops of 5 items each runs 25 times, which is why Trailhead warns against nested loops.
false_statement: An element inside two nested Flow loops of 5 items each runs 10 times, which is why Trailhead warns against nested loops.
explanation: Nested loops multiply executions, so 5 times 5 gives 25 runs. Ten would be the count if the loops added rather than multiplied.
