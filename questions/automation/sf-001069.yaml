id: sf-001069
product_area: automation
true_statement: A Transform element is used to turn records into a text collection of Ids because the In operator in Flow data elements accepts only collections of simple values.
false_statement: A Transform element is used to turn records into a single text value of Ids because the In operator in Flow data elements accepts only single values.
explanation: The In operator needs a collection of simple values such as Ids, not a record collection, so a Transform extracts the Id field into a text collection first.
