id: sf-000663
product_area: automation
true_statement: When flows are deployed as active, flows with screens are exempt from the flow test coverage requirement, while autolaunched flows are not.
false_statement: When flows are deployed as active, autolaunched flows are exempt from the flow test coverage requirement, while flows with screens are not.
explanation: The Apex coverage requirement applies to active processes and autolaunched flows; screen flows are excluded. The false statement reverses the exemption.
