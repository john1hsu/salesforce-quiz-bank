id: sf-000307
product_area: automation
true_statement: Event processes in Process Builder evaluate platform event messages in replay-ID order, in batches of up to 2,000 messages, in their own transaction.
false_statement: Event processes in Process Builder evaluate platform event messages in replay-ID order, in batches of up to 200 messages, in their own transaction.
explanation: Event-triggered processes take platform event messages asynchronously in batches as large as 2,000. The 200 figure understates the batch size.
