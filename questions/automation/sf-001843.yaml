id: sf-001843
product_area: automation
true_statement: The Remove Uncommon operator in a Flow Assignment keeps only the collection items that also appear in a second collection.
false_statement: The Remove Uncommon operator in a Flow Assignment removes the collection items that also appear in a second collection.
explanation: Remove Uncommon strips out items the second collection lacks, leaving the shared ones. Removing the shared items is the opposite of what it does.
