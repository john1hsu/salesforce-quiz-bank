id: sf-000009
product_area: automation
true_statement: In a record-triggered flow, invocable Apex actions can be called only from the after-save (Actions and Related Records) context.
false_statement: In a record-triggered flow, invocable Apex actions can be called only from the before-save (Fast Field Updates) context.
explanation: Invocable Apex is limited to after-save record-triggered flows. Before-save flows are meant for cheap updates to the triggering record itself and cannot call invocable actions.
