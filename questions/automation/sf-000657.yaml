id: sf-000657
product_area: automation
true_statement: A Business Rules Engine decision matrix returns one row even if several match, while a decision table can return multiple matching outcomes.
false_statement: A Business Rules Engine decision table returns one row even if several match, while a decision matrix can return multiple matching outcomes.
explanation: Matrices are simple lookups that return a single matching row. Decision tables support comparison operators and can return several outcome sets; the false statement swaps them.
