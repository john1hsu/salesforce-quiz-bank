id: sf-000865
product_area: automation
true_statement: Email alerts are object-specific, so an alert built on Case can't be fired for an Account record.
false_statement: Email alerts are object-agnostic, so an alert built on Case can be fired for an Account record.
explanation: Each alert is defined on one object and fills merge fields from that object's record. A different object needs its own alert.
