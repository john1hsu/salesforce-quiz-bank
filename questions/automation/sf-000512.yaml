id: sf-000512
product_area: automation
true_statement: Change sets don't support business hours on entitlement processes, so the process must be recreated, deployed another way, or stripped of its hours first.
false_statement: Change sets fully support business hours on entitlement processes, so the process deploys with its hours intact like any other component.
explanation: Salesforce lists business hours on entitlement processes as unsupported in change sets. Its workarounds are recreating the process in the target org, using another deployment method, or removing the hours before packaging.
