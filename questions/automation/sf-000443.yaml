id: sf-000443
product_area: automation
true_statement: A platform event-triggered flow can receive up to 200 event messages in one batch, keeping their order within the batch.
false_statement: A platform event-triggered flow can receive up to 2,000 event messages in one batch, keeping their order within the batch.
explanation: Flow subscribers get batches of at most 200 messages, processed in replay ID order. The 2,000 figure is far above the flow batch size.
