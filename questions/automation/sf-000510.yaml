id: sf-000510
product_area: automation
true_statement: Whether a Salesforce Holiday record recurs can be set only when the holiday is created, not changed afterwards.
false_statement: Whether a Salesforce Holiday record recurs can be switched on or off at any time after the holiday is created.
explanation: The Holiday object fixes the recurring setting at creation; only then can you choose it. Toggling recurrence later on an existing holiday isn't possible, so a new record is needed instead.
