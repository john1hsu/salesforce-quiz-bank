id: sf-001778
product_area: automation
true_statement: The Run Flows permission lets a user run active, unrestricted flows, while running inactive flows requires Manage Flow.
false_statement: The Run Flows permission lets a user run both active and inactive flows, while Manage Flow is needed only to edit them.
explanation: Run Flows covers active flows whose access isn't restricted. Starting an inactive flow is a builder-level task that needs Manage Flow.
