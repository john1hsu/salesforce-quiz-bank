id: sf-001283
product_area: automation
true_statement: Deactivating a flow version doesn't stop its paused interviews, and a flow version that still has paused interviews can't be deleted.
false_statement: Deactivating a flow version cancels its paused interviews, after which the flow version can be deleted right away.
explanation: Paused interviews survive deactivation and keep the version in use, which blocks deletion. Admins must deal with them through the Paused and Failed Flow Interviews list.
