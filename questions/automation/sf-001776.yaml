id: sf-001776
product_area: automation
true_statement: In a record-triggered flow, a Decision outcome can be set to count as met only when the record changes to meet its conditions.
false_statement: In a record-triggered flow, only the Start element can require a record change to meet conditions; Decision outcomes always evaluate current values.
explanation: Decision rules carry their own option to require that the record was changed to meet the criteria, similar to the Start element's setting for the whole flow. Both help avoid repeating actions on later edits.
