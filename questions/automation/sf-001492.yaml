id: sf-001492
product_area: automation
true_statement: A decision table's incremental refresh fails when changes exceed 2,000 records, and a full refresh is then required.
false_statement: A decision table's incremental refresh fails when changes exceed 50,000 records, and a full refresh is then required.
explanation: Incremental refresh only handles up to 2,000 changed source records; beyond that it fails and a full refresh must run, so bulk loads should be followed by a full refresh. The 50,000 figure is wrong.
