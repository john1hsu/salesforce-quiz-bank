id: sf-001004
product_area: automation
true_statement: When migrating a process, Migrate to Flow lets you send individual criteria to separate flows instead of putting all of them in one flow.
false_statement: When migrating a process, Migrate to Flow always puts all of the process's criteria into one flow and can't split them into separate flows.
explanation: The tool lets an admin migrate every criterion to one flow or pick specific criteria and migrate them to separate flows, so splitting is supported.
