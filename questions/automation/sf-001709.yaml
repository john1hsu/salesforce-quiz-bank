id: sf-001709
product_area: automation
true_statement: A custom property editor runs only at design time in Flow Builder; the component or action it configures is what runs when the flow executes.
false_statement: A custom property editor runs both in Flow Builder and at flow runtime, where it replaces the screen component's interface for end users.
explanation: The editor exists to help admins configure inputs while building the flow. At runtime, users see the configured screen component or the action simply executes.
