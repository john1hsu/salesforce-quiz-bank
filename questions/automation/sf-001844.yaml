id: sf-001844
product_area: automation
true_statement: Records removed by a flow's Delete Records element go to the Recycle Bin.
false_statement: Records removed by a flow's Delete Records element are hard-deleted and bypass the Recycle Bin.
explanation: Delete Records behaves like a normal delete, so the records land in the Recycle Bin. Trailhead still advises deleting only records that should never have existed and testing in a sandbox first.
