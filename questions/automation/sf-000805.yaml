id: sf-000805
product_area: automation
true_statement: Record-triggered flows can use the action-level new-transaction setting only on asynchronous or scheduled paths.
false_statement: Record-triggered flows can use the action-level new-transaction setting only on the Run Immediately path.
explanation: Since Winter '26 every flow type has the setting, but record-triggered flows are restricted to async or scheduled paths. The immediate path stays in the triggering save's transaction.
