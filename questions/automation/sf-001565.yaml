id: sf-001565
product_area: automation
true_statement: A flow installed from a managed package can be opened and cloned by the subscriber only if the packaged flow is marked as a template.
false_statement: A flow installed from a managed package can be opened and cloned by the subscriber only if the packaged flow is left active.
explanation: Packaged flows are normally protected as the publisher's intellectual property. The Template flag is the exception that lets subscribers view, clone and customize a copy; activation status doesn't grant that.
