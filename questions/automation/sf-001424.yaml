id: sf-001424
product_area: automation
true_statement: In Experience Cloud screen flows, Salesforce advises against storing all fields from Get Records when the records feed screen components, as the data can show in browser developer tools.
false_statement: In Experience Cloud screen flows, Salesforce advises storing all fields from Get Records when the records feed screen components, as unused fields are stripped before reaching the browser.
explanation: Fields loaded into records passed to screen components travel to the browser, where developer tools can reveal them. Storing only the needed fields limits that exposure; nothing strips them automatically.
