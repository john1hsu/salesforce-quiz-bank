id: sf-000104
product_area: automation
true_statement: If an autolaunched flow element exceeds a governor limit, the whole transaction rolls back even when that element has a fault connector.
false_statement: If an autolaunched flow element exceeds a governor limit and has a fault connector, only that element's work rolls back and the flow follows the fault path.
explanation: Limit breaches cannot be caught by a fault connector; the entire transaction is rolled back. The false statement treats a limit breach like an ordinary handled fault.
