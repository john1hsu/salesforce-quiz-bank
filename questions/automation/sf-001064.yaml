id: sf-001064
product_area: automation
true_statement: If one flow interview in a bulk transaction hits a governor limit, every interview in that transaction fails and its operations roll back with no retry.
false_statement: If one flow interview in a bulk transaction hits a governor limit, only that interview fails and the other interviews' operations are saved.
explanation: Bulkified interviews share one transaction, so a governor-limit breach in any of them fails the whole batch and nothing is retried. Isolating the failing interview is not how limit errors behave.
