id: sf-001497
product_area: automation
true_statement: A Flow Assignment element's Add operator can add numbers and currency or shift a date by days, without needing a formula resource.
false_statement: A Flow Assignment element's Add operator can add numbers and currency or shift a date by months, without needing a formula resource.
explanation: Trailhead suggests the Add operator for simple arithmetic, and for dates it moves the value by a number of days. Shifting by months is not what the operator does.
