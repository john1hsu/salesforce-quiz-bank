id: sf-000231
product_area: automation
true_statement: The Migrate to Flow tool converts workflow rules whose only actions are same-record field updates into fast field update (before-save) flows.
false_statement: The Migrate to Flow tool converts workflow rules whose only actions are same-record field updates into scheduled-path after-save flows.
explanation: Rules limited to same-record field updates become before-save fast field update flows. Scheduled paths are where time-dependent actions map, not plain field updates.
