id: sf-000803
product_area: automation
true_statement: After a Wait element, resumed flow interviews of the same flow version and running user share one batch transaction and its governor limits.
false_statement: After a Wait element, each resumed flow interview runs in its own transaction with its own set of governor limits.
explanation: Resumed interviews are grouped into a batch transaction, so their combined SOQL and DML can exceed limits. They do not each get a fresh limit budget.
