id: sf-000102
product_area: automation
true_statement: To start an autolaunched flow from a record page layout, use a custom button, because actions can call only screen flows.
false_statement: To start an autolaunched flow from a record page layout, use an action, because custom buttons can call only screen flows.
explanation: Actions look like buttons but can launch only screen flows, so a screenless autolaunched flow needs a custom button. The false statement reverses which one is restricted.
