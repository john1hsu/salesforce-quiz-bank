id: sf-001001
product_area: automation
true_statement: An @InvocableVariable must be a public or global instance variable; static, final and private variables can't be used.
false_statement: An @InvocableVariable can be a static or private variable, as long as the annotation sets a label for it.
explanation: Invocable variables must be public or global instance members. Static, local, final, private and protected variables are not allowed, and a label doesn't change that.
