id: sf-000802
product_area: automation
true_statement: The sf flow run test command runs flow tests asynchronously by default and returns a test run ID unless --synchronous is passed.
false_statement: The sf flow run test command runs flow tests synchronously by default and returns results unless --async is passed.
explanation: The command is asynchronous by default, handing back a run ID; the --synchronous flag makes it wait. There is no --async flag because async is already the default.
