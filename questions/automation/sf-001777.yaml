id: sf-001777
product_area: automation
true_statement: A flow in system context with sharing can use every object and field, but record visibility still follows the user's sharing settings.
false_statement: A flow in system context with sharing sees every record regardless of sharing, but the user's object and field permissions still apply.
explanation: '''With sharing'' keeps record-level rules such as org-wide defaults and sharing rules, while object and field permissions are not enforced. The false statement swaps which layer is enforced.'
