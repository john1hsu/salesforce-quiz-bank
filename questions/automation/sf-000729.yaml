true_statement: Email sent through the emailAlert invocable action counts against the org's daily workflow email limit.
false_statement: Email sent through the emailAlert invocable action counts against the org's daily single email limit for Apex.
explanation: The emailAlert action reuses workflow email alerts, so it draws on the daily workflow email allocation. It isn't charged to the Apex single email limit.
