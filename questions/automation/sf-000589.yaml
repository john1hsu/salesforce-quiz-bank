id: sf-000589
product_area: automation
true_statement: Subflow input and output variables with API names longer than 40 characters cause a save error in the calling flow.
false_statement: Subflow input and output variables with API names longer than 80 characters cause a save error in the calling flow.
explanation: The cutoff that breaks saving the parent flow is 40 characters for the child's input and output variable API names, so names between 41 and 80 characters would already fail.
