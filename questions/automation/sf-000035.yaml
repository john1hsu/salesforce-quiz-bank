id: sf-000035
product_area: automation
true_statement: Orchestration steps that run at the same time are batched into one transaction, so their SOQL, DML and CPU time add up together.
false_statement: Orchestration steps that run at the same time each get their own transaction, so their SOQL, DML and CPU time are counted separately.
explanation: Concurrent steps are grouped by user context and flow version and executed in a single transaction, so governor limit usage accumulates across the batch. Treating each step as its own transaction is the mistake the false statement makes.
