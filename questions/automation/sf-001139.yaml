id: sf-001139
product_area: automation
true_statement: The Process Automation Setting that lets admins debug flows as other users is available only in sandbox environments.
false_statement: The Process Automation Setting that lets admins debug flows as other users is available only in production orgs.
explanation: Salesforce Help restricts debugging as another user to sandboxes, where impersonated runs can't harm live data. It is not a production-only option.
