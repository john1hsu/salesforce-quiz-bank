id: sf-001493
product_area: automation
true_statement: A Business Rules Engine decision table can combine a primary source object with up to four related objects.
false_statement: A Business Rules Engine decision table can combine a primary source object with up to two related objects.
explanation: Multi-object decision tables allow four objects related to the primary source, letting one lookup return values from several of them. The limit is four, not two.
