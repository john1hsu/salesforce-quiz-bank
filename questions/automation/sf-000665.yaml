id: sf-000665
product_area: automation
true_statement: Process Automation Settings can send flow error emails to the Apex Exception Email recipients instead of the last person who modified the flow.
false_statement: Process Automation Settings can send flow error emails to the Default Workflow User instead of the last person who modified the flow.
explanation: The error-email option reroutes unhandled flow fault emails to the Apex Exception Email recipients. The Default Workflow User is the running user for time-based automation, not an error recipient.
