id: sf-000306
product_area: automation
true_statement: Each Update Records action in a Process Builder process costs one SOQL query plus one DML statement against the transaction's governor limits.
false_statement: Each Update Records action in a Process Builder process costs one DML statement only, with no SOQL query counted against the transaction's governor limits.
explanation: Process limits count an Update Records action as both a query and a DML statement, while Create a Record or a quick action costs one DML statement. The false version drops the query and so understates the cost.
