id: sf-000103
product_area: automation
true_statement: Autolaunched and screen flows can be called as subflows, but record-triggered flows cannot be referenced from another flow.
false_statement: Autolaunched and record-triggered flows can be called as subflows, but screen flows cannot be referenced from another flow.
explanation: Both autolaunched and screen flows work as subflows; record-triggered flows cannot be called from a parent flow. That is why shared logic usually lives in an autolaunched flow.
