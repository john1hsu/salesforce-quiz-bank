product_area: automation
true_statement: In a Flow Assignment element, a text variable offers only the Equals and Add operators.
false_statement: In a Flow Assignment element, a text variable offers the Equals, Add and Subtract operators.
explanation: Text variables can be replaced with Equals or appended to with Add. Subtract is for number, currency and date values, not text.
