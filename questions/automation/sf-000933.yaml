id: sf-000933
product_area: automation
true_statement: Each org gets 5,000 Einstein Next Best Action strategy requests a month at no charge, and every load or refresh of a page with the component counts.
false_statement: Each org gets 50,000 Einstein Next Best Action strategy requests a month at no charge, and only accepted recommendations count as requests.
explanation: The free entitlement is 5,000 requests a month, with an add-on adding 10,000. Page loads, refreshes, field updates on the page, strategy tests and REST calls all consume requests.
