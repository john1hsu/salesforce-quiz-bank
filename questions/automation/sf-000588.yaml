id: sf-000588
product_area: automation
true_statement: A flow that contains a Wait element can't be referenced by a Subflow element in another flow.
false_statement: A flow that contains a Loop element can't be referenced by a Subflow element in another flow.
explanation: Salesforce Help excludes flows with a Wait element from being called as subflows. Loop elements carry no such restriction.
