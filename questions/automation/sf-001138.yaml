id: sf-001138
product_area: automation
true_statement: When a flow's filter criteria are known at query time, Salesforce recommends filtering in Get Records rather than with a Collection Filter element.
false_statement: When a flow's filter criteria are known at query time, Salesforce recommends querying broadly with Get Records and then narrowing with a Collection Filter element.
explanation: Filtering in Get Records is described as more efficient; Collection Filter is meant for criteria that only become known later in the flow, such as from screen input.
