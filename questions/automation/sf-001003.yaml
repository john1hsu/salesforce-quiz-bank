id: sf-001003
product_area: automation
true_statement: After converting a workflow rule, Migrate to Flow's Switch Activations button deactivates the rule and activates the new flow in a single step.
false_statement: After converting a process, Migrate to Flow's Switch Activations button deactivates the process and activates the new flow in a single step.
explanation: Switch Activations is offered only for migrated workflow rules. For processes, the admin must activate the flow and then deactivate the process in Process Builder manually.
