id: sf-001637
product_area: automation
true_statement: A Flow picklist choice set can't be filtered, so it shows all of the field's values even where a record type narrows that picklist.
false_statement: A Flow picklist choice set is filtered by the record's record type, so it shows only the values that record type allows for that picklist.
explanation: Picklist choice sets read every value of the field with no filtering, so record-type restrictions seen on page layouts don't apply in the flow. The false version assumes record-type filtering.
