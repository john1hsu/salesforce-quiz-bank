id: sf-001636
product_area: automation
true_statement: A multi-select choice component in a screen flow returns one text string of values separated by semicolons rather than a collection.
false_statement: A multi-select choice component in a screen flow returns a text collection variable with one item per selected value.
explanation: Multi-select selections come back as a single semicolon-delimited string, which elements expecting a real collection cannot use without conversion. The false version claims a ready-made collection.
