id: sf-000033
product_area: automation
true_statement: In Flow Orchestrator, an interactive step runs a screen flow and creates a work item, while a background step runs an autolaunched flow.
false_statement: In Flow Orchestrator, an interactive step runs an autolaunched flow and creates a work item, while a background step runs a screen flow.
explanation: Interactive steps need a person, so they run an active screen flow and create a work item for the assignee. Background steps need no user and run an autolaunched flow; the false statement swaps the flow types.
