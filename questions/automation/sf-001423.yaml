id: sf-001423
product_area: automation
true_statement: To check that a Get Records result isn't empty, the Is Empty operator in a Decision catches both a null value and an empty collection.
false_statement: To check that a Get Records result isn't empty, the Is Null operator in a Decision catches both a null value and an empty collection.
explanation: The Admins guidance recommends Is Empty because it covers null and empty collections alike. Is Null misses a collection that exists but holds no records.
