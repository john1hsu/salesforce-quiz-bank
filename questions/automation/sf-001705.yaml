id: sf-001705
product_area: automation
true_statement: Salesforce Help lists Data 360 being provisioned and enabled as a prerequisite for drafting flows with Agentforce for Flow.
false_statement: Salesforce Help says Agentforce for Flow drafting works without Data 360, needing only Einstein generative AI to be turned on.
explanation: Drafting requires Einstein generative AI, Data 360 and the Agentforce flow automation option in Process Automation Settings. Leaving out Data 360 misses one of the stated prerequisites.
