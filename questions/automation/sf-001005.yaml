id: sf-001005
product_area: automation
true_statement: A recursive process could evaluate a record up to six times per save, but the flow Migrate to Flow generates from it evaluates the record only once.
false_statement: A recursive process could evaluate a record up to six times per save, and the flow Migrate to Flow generates from it keeps that same six-pass recursion.
explanation: Migrated flows evaluate the record a single time, so logic that relied on the process's recursion can silently behave differently after conversion.
