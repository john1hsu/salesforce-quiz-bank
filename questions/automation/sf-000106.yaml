id: sf-000106
product_area: automation
true_statement: Salesforce Help calls before-save flows the best-performing record-triggered option, because they are limited to updating the triggering record.
false_statement: Salesforce Help calls after-save flows the best-performing record-triggered option, because they are limited to updating the triggering record.
explanation: Before-save (fast field update) flows change the triggering record inside the original save without an extra DML, which is why Salesforce rates them fastest. After-save flows can touch other records and need additional DML, so they are not the fastest option.
