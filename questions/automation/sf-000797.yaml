id: sf-000797
product_area: automation
true_statement: Flow's HTTP Callout action needs no OpenAPI specification, because Flow infers the request and response schema from sample JSON.
false_statement: Flow's HTTP Callout action needs an uploaded OpenAPI specification, because Flow cannot infer the schema from sample JSON.
explanation: HTTP Callout builds its data structures from sample JSON or a live Connect for Schema call. Uploading an OpenAPI spec is the route for registering an external service from Setup.
