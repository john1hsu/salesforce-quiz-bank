product_area: automation
true_statement: Flow resume events share a combined org total of 20,000 time-based automations with process scheduled actions and workflow rule time triggers.
false_statement: Flow resume events have their own separate org total of 20,000 time-based automations, apart from process scheduled actions and workflow rule time triggers.
explanation: The 20,000 figure is one shared pool across flow resumes, scheduled actions in processes and legacy workflow time triggers. Heavy use in one reduces what's left for the others.
