id: sf-000312
product_area: automation
true_statement: A time trigger can be added to a workflow rule only while the rule is inactive and has no pending actions in the time-based queue.
false_statement: A time trigger can be added to a workflow rule only while the rule is active and has no pending actions in the time-based queue.
explanation: Salesforce requires the rule to be deactivated, with nothing queued and without the create-and-every-edit evaluation setting, before a time trigger can be added. The false version wrongly says the rule must be active.
