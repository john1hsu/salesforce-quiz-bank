id: sf-001494
product_area: automation
true_statement: With the Any Value result filter, a decision table returns an output only when every matching row agrees, otherwise an empty response.
false_statement: With the First Match result filter, a decision table returns an output only when every matching row agrees, otherwise an empty response.
explanation: Any Value is the filter that returns a result only if all matching rows give the same output. First Match simply returns the output of the first matching row.
