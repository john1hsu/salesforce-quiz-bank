id: sf-000011
product_area: automation
true_statement: The Salesforce Architects decision guide recommends Flow for record-triggered automation on objects with fewer than 15 automations per object.
false_statement: The Salesforce Architects decision guide recommends Flow for record-triggered automation on objects with fewer than 50 automations per object.
explanation: The guide's density table treats fewer than 15 automations per object as low density, where Flow fits. Higher-density objects and complex cross-object logic are steered toward Apex triggers instead.
