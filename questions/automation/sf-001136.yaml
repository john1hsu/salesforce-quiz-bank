id: sf-001136
product_area: automation
true_statement: Flow's Collection Sort element modifies the selected collection in place, while Collection Filter writes its results to a new output collection.
false_statement: Flow's Collection Filter element modifies the selected collection in place, while Collection Sort writes its results to a new output collection.
explanation: Sort overwrites the source variable with the sorted, possibly truncated list; Filter leaves its input alone and produces a separate output that later elements must reference. The false statement swaps them.
