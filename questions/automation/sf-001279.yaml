id: sf-001279
product_area: automation
true_statement: An Enterprise or Unlimited Edition org can have 2,000 active flows and 4,000 total flows per flow type.
false_statement: An Enterprise or Unlimited Edition org can have 500 active flows and 1,000 total flows per flow type.
explanation: The per-org allocation for Enterprise, Unlimited, Performance and Developer editions is 2,000 active and 4,000 total per flow type. Essentials and Professional are the editions capped far lower, at 5 of each.
