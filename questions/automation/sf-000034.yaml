id: sf-000034
product_area: automation
true_statement: An orchestration fails if a step's flow receives more than 32,768 combined characters of input, so pass a record ID instead of a whole record.
false_statement: An orchestration fails if a step's flow receives more than 65,536 combined characters of input, so pass a record ID instead of a whole record.
explanation: The documented input cap for a step's called flow is 32,768 combined characters, and passing whole records is the usual way to exceed it. 65,536 is not the limit.
