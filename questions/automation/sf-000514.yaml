id: sf-000514
product_area: automation
true_statement: With the escalation clock set to start at case creation but disable once the case is first modified, any edit permanently stops escalation for that case.
false_statement: With the escalation clock set to start at case creation but disable once the case is first modified, any edit restarts the escalation clock from zero.
explanation: The disable-after-first-modified option switches escalation off for the case after any change, even a trivial one. Restarting the clock on every edit is the separate last-modified option.
