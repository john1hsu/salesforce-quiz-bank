id: sf-000308
product_area: automation
true_statement: The Migrate to Flow tool converts record change processes, but it does not convert event or invocable processes or processes that have scheduled actions.
false_statement: The Migrate to Flow tool converts record change, event and invocable processes, including processes that have scheduled actions.
explanation: Only record change processes with supported actions are converted; event processes, invocable processes and anything with scheduled actions or field traversals must be rebuilt by hand. The false version claims the tool covers every process type.
