id: sf-000225
product_area: security-and-sharing
true_statement: Sharing rules can only widen access; they can never make access stricter than the organization-wide default.
false_statement: Sharing rules can widen or narrow access, making it stricter than the organization-wide default for selected users.
explanation: Sharing rules add lateral exceptions on top of a restrictive baseline. To narrow what users see, a different control such as restriction rules is needed.
