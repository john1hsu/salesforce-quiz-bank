id: sf-000574
product_area: security-and-sharing
true_statement: The permissions on a standard profile can't be edited, though admins can still change its session settings and password policies.
false_statement: The session settings and password policies on a standard profile can't be edited, though admins can still change its permissions.
explanation: Standard profiles lock their permissions, but a few settings such as custom app and tab settings, session settings and password policies stay editable. The false statement swaps which part is locked.
