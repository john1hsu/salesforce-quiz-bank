id: sf-001834
product_area: security-and-sharing
true_statement: Detail records in a master-detail relationship have no share object of their own, so they can't be manually shared apart from their parent.
false_statement: Detail records in a master-detail relationship have their own share object, so they can be manually shared apart from their parent.
explanation: Access to a detail record is controlled by its master, and there is no share table for the detail. Manual sharing has to happen on the parent record.
