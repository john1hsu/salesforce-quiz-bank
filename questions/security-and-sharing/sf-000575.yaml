id: sf-000575
product_area: security-and-sharing
true_statement: Moving a user to a profile on a different license type frees a seat in the old license pool and uses one in the new pool.
false_statement: Moving a user to a profile on a different license type keeps the seat in the old license pool and adds one in the new pool.
explanation: A profile is bound to a user license, so switching to a profile on another license type moves the user's seat from one pool to the other. The old seat is released rather than held alongside the new one.
