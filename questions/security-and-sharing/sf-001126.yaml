id: sf-001126
product_area: security-and-sharing
true_statement: For a SOQL query run WITH USER_MODE, QueryException.getInaccessibleFields() returns every field the user can't read, not just the first one.
false_statement: For a SOQL query run WITH USER_MODE, QueryException.getInaccessibleFields() returns only the first field the user can't read.
explanation: User mode reports all FLS errors, and getInaccessibleFields exposes the full set. Reporting only the first error is the behavior of WITH SECURITY_ENFORCED.
