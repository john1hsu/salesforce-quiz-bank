id: sf-001694
product_area: security-and-sharing
true_statement: Setup Audit Trail records that most configuration changes happened but not their full before-and-after values.
false_statement: Setup Audit Trail records full before-and-after values for every configuration change, so any old setting can be restored from it.
explanation: Entries describe who changed what and when, but usually not the prior value, so the trail rarely tells you what an old setting was. It also misses some changes, such as list view edits.
