id: sf-001055
product_area: security-and-sharing
true_statement: To write a URL parameter such as retURL into a JavaScript string on a Visualforce page safely, wrap the merge field in JSENCODE.
false_statement: To write a URL parameter such as retURL into a JavaScript string on a Visualforce page safely, wrap the merge field in URLENCODE.
explanation: Encoding must match the output context, and a JavaScript string needs JavaScript encoding, which JSENCODE provides. URL encoding targets a different context.
