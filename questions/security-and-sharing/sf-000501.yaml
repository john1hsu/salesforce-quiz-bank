id: sf-000501
product_area: security-and-sharing
true_statement: To delete FieldHistoryArchive rows, the template record must supply every field in the big object's index; partial indexes and wildcards are rejected.
false_statement: To delete FieldHistoryArchive rows, the template record may supply a partial index or wildcards to match many rows at once.
explanation: Archive deletion via deleteByExample() or Database.deleteImmediate() follows big-object index rules, so the full index must be given. Partial or wildcard templates fail.
