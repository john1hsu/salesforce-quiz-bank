id: sf-001696
product_area: security-and-sharing
true_statement: If an object's org-wide default is Public Read Only, a sharing set mapping for it can grant only Read/Write access.
false_statement: If an object's org-wide default is Public Read Only, a sharing set mapping for it can grant only Read Only access.
explanation: Users already have read access under a Public Read Only default, so the only meaningful upgrade a sharing set can offer is Read/Write. Public Read/Write objects can't be added at all.
