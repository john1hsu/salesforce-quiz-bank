id: sf-000221
product_area: security-and-sharing
true_statement: Restriction rules don't limit users with View All Data or View All Records, who still see every record.
false_statement: Restriction rules also limit users with View All Data or View All Records, overriding those permissions.
explanation: Broad permissions such as View All Data, View All Records and Modify All bypass restriction rules, as does code running in system mode.
