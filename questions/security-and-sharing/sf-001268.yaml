id: sf-001268
product_area: security-and-sharing
true_statement: Account Role Optimization delays creating external roles for a Customer Community Plus account until a second user joins that account.
false_statement: Account Role Optimization delays creating external roles for a Customer Community Plus account until a tenth user joins that account.
explanation: The optimization skips role creation while an account has only one external user, then creates roles once a second one arrives. That keeps role counts down at scale.
