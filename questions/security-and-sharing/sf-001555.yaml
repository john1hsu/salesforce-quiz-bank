id: sf-001555
product_area: security-and-sharing
true_statement: In a managed package, a protected custom permission can't be referenced from subscriber orgs, letting ISVs keep internal feature switches hidden.
false_statement: In a managed package, a protected custom permission can be referenced from subscriber orgs, letting ISVs expose feature switches to customers.
explanation: Marking a packaged custom permission as protected (IsProtected) hides it from subscriber orgs, which is how ISVs ship hidden switches.
