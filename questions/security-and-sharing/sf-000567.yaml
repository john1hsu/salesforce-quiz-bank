id: sf-000567
product_area: security-and-sharing
true_statement: A permission set with Session Activation Required grants its permissions only while a session is activated for it, and they lapse at logout or timeout.
false_statement: A permission set with Session Activation Required grants its permissions from the user's next login, and they last until the assignment is removed.
explanation: Session-based permission sets tie access to an activated session, so the permissions end when the session ends through logout, timeout or an admin. The false statement describes an ordinary standing assignment.
