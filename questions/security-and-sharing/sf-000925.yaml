id: sf-000925
product_area: security-and-sharing
true_statement: A permission set license on its own grants nothing visible; it unlocks permissions that a permission set or profile then has to switch on.
false_statement: A permission set license on its own grants its feature immediately, with no permission set or profile needed to switch it on.
explanation: Licenses set the ceiling. Admins assign the PSL and then give the user a permission set or profile that actually enables the feature.
