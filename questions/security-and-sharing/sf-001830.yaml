id: sf-001830
product_area: security-and-sharing
true_statement: SOQL's WITH DATA CATEGORY clause accepts at most three category conditions, joined only by AND.
false_statement: SOQL's WITH DATA CATEGORY clause accepts at most three category conditions, joined only by OR.
explanation: Conditions in the clause can only be combined with AND, up to three of them. Several categories within one group go in a parenthesized list rather than an OR.
