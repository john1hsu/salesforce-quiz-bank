id: sf-000568
product_area: security-and-sharing
true_statement: Leave a permission set's LicenseId empty when the set will be assigned to users on different license types.
false_statement: Set a permission set's LicenseId to one user license when the set will be assigned to users on different license types.
explanation: A permission set tied to a license is meant for users on that license, so a set shared across license types should leave LicenseId blank. Setting a specific license fits only sets used by one license type or drawing on a permission set license.
