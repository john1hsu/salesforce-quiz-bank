id: sf-000990
product_area: security-and-sharing
true_statement: On a UserLicense record, a null MonthlyLoginsEntitlement means the license is billed per user rather than per login.
false_statement: On a UserLicense record, a null MonthlyLoginsEntitlement means the license is billed per login rather than per user.
explanation: MonthlyLoginsEntitlement is populated only for login-based portal licenses. When it is empty, the license is a per-user license.
