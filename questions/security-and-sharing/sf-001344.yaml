id: sf-001344
product_area: security-and-sharing
true_statement: Security.stripInaccessible() never removes the Id field, so DML on the records it returns still works.
false_statement: Security.stripInaccessible() removes the Id field when the user lacks access to it, so DML on the returned records can fail.
explanation: The Id is always preserved on the sanitized sObjects. That keeps update and delete calls on getRecords() working even when other fields were stripped.
