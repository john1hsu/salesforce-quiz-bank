product_area: security-and-sharing
true_statement: In the Salesforce Architects security governance model, the risk-based security strategy and its guiding principles are reviewed at least once a year.
false_statement: In the Salesforce Architects security governance model, the risk-based security strategy and its guiding principles are reviewed only when a security incident occurs.
explanation: The model asks for a yearly review at minimum, covering areas such as authentication and data access. Waiting for an incident would leave principles stale.
