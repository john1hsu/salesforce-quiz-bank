id: sf-001124
product_area: security-and-sharing
true_statement: The accessLevel argument is optional on Database.query but required on Database.queryWithBinds, so bind-variable dynamic SOQL always states its mode.
false_statement: The accessLevel argument is required on Database.query but optional on Database.queryWithBinds, so plain dynamic SOQL always states its mode.
explanation: Only the WithBinds variants make the access level mandatory; Database.query and similar methods accept it optionally. The false statement reverses which method requires it.
