true_statement: Related lists ignore scoping rules except contact roles, which a Contact scoping rule filters on accounts, opportunities, cases and contracts.
false_statement: Related lists ignore scoping rules except activity history, which a Task scoping rule filters on accounts, opportunities, cases and contracts.
explanation: 'Scope generally doesn''t apply to related lists, but contact roles are the documented exception: a Contact rule silently filters them on related records. Activity history is not named as an exception.'
