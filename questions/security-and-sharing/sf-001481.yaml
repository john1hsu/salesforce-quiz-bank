id: sf-001481
product_area: security-and-sharing
true_statement: The OpportunityTeamMember field OpportunityAccessLevel can be used in Apex triggers but not in workflow or validation rules.
false_statement: The OpportunityTeamMember field OpportunityAccessLevel can be used in validation rules but not in Apex triggers or workflow.
explanation: The access-level picklist (Read, Edit, All) is available to triggers, while workflow and validation rules can't reference it. The false statement reverses where it works.
