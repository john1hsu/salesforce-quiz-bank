product_area: security-and-sharing
true_statement: Querying the SecurityHealthCheck and SecurityHealthCheckRisks Tooling API objects requires the View Setup and Configuration permission.
false_statement: Querying the SecurityHealthCheck and SecurityHealthCheckRisks Tooling API objects requires the Modify All Data permission.
explanation: Health Check's Tooling API objects can be queried by any user holding View Setup and Configuration, which makes scripted monitoring practical. Modify All Data is not the gating permission.
