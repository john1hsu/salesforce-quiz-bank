id: sf-000505
product_area: security-and-sharing
true_statement: In a production org, a new Probabilistic tenant secret for Shield Platform Encryption can be generated only once every 24 hours.
false_statement: In a production org, a new Probabilistic tenant secret for Shield Platform Encryption can be generated only once every 7 days.
explanation: Production orgs may generate a fresh Probabilistic tenant secret once per 24 hours, not once per week. Each secret type is also capped at 50 active and archived secrets.
