id: sf-001767
product_area: security-and-sharing
true_statement: A custom object with no account or contact lookup can't be selected in a sharing set for high-volume users.
false_statement: A custom object with no account or contact lookup can be selected in a sharing set, which then grants access through record ownership.
explanation: Sharing sets work by matching a record's account or contact lookup to the user's own account or contact. Without such a lookup there is nothing to match, so the object can't be chosen.
