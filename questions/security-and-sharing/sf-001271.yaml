id: sf-001271
product_area: security-and-sharing
true_statement: Salesforce advises wrapping untrusted prompt input in a random-sequence enclosure generated fresh for each inference, instead of quote-style delimiters.
false_statement: Salesforce advises wrapping untrusted prompt input in a fixed quote-style delimiter reused for every inference, instead of random-sequence enclosures.
explanation: A securely generated token per inference is hard for an attacker to guess and close. Static quote-style delimiters are easy to break out of, which is why the guidance moves away from them.
