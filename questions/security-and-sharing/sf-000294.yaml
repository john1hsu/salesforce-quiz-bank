id: sf-000294
product_area: security-and-sharing
true_statement: The Defer Sharing Calculations permission is off by default, and an org gets it by contacting Salesforce.
false_statement: The Defer Sharing Calculations permission is off by default, and an admin turns it on under Sharing Settings in Setup.
explanation: 'Deferring sharing calculations is not self-service: the permission starts disabled and Salesforce enables it on request. An admin cannot switch it on from Sharing Settings.'
