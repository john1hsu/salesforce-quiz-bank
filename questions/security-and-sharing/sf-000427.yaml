id: sf-000427
product_area: security-and-sharing
true_statement: A user who can see a child opportunity, case or contact gets read-only access to its parent account through parent implicit sharing.
false_statement: A user who can see a child opportunity, case or contact gets read/write access to its parent account through parent implicit sharing.
explanation: 'Parent implicit sharing is view-only: the user can open the account but not edit it. Edit access to the account needs some other grant.'
