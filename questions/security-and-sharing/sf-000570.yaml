id: sf-000570
product_area: security-and-sharing
true_statement: In Salesforce's permission-set-led model, the Minimum Access - Salesforce profile is the baseline, with access added through permission sets.
false_statement: In Salesforce's permission-set-led model, the Standard User profile is the baseline, with access added through permission sets.
explanation: Trailhead recommends Minimum Access - Salesforce, or a clone, because it grants very few permissions. Standard profiles can grant more than users need and their object permissions can't be edited.
