product_area: security-and-sharing
true_statement: Because of sharing recalculation cost, Salesforce guidance suggests keeping structural hierarchy changes to roughly once a quarter.
false_statement: Because of sharing recalculation cost, Salesforce guidance suggests keeping structural hierarchy changes to roughly once a week.
explanation: Each structural hierarchy change triggers sharing recalculation, so the guidance treats it as a design constraint and suggests about quarterly changes. Weekly restructuring would cause far more recalculation than recommended.
