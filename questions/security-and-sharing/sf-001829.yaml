true_statement: A categorized Knowledge article is visible only if the user can see at least one of its categories in each category group applied to it.
false_statement: A categorized Knowledge article is visible if the user can see at least one of its categories in any one of the category groups applied to it.
explanation: 'Data category visibility is enforced group by group: every applied group must grant at least one matching category. Passing one group is not enough when the article is categorized in others.'
