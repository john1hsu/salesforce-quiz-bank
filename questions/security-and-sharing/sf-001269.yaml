id: sf-001269
product_area: security-and-sharing
true_statement: A Customer Community user can be upgraded to Customer Community Plus, but once the user holds a license that needs a role, the change can't be reversed.
false_statement: A Customer Community user can be upgraded to Customer Community Plus, and the user can later be downgraded back as long as no external role was assigned.
explanation: 'The upgrade is one way: after the user has a role-requiring license, there is no return to Customer Community. The upgrade also strips sharing set and permission set assignments.'
