id: sf-000295
product_area: security-and-sharing
true_statement: Apex sharing recalculation classes can be associated only with custom objects, whose org-wide default must not already be Public Read/Write.
false_statement: Apex sharing recalculation classes can be associated with standard or custom objects, whose org-wide default must not already be Public Read/Write.
explanation: The Apex Sharing Recalculations setting exists only for custom objects that use Apex managed sharing. Standard objects cannot have a recalculation class attached.
