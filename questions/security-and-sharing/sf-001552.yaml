id: sf-001552
product_area: security-and-sharing
true_statement: Compliant Data Sharing participant groups can nest other groups up to five levels, and the most permissive access a user reaches wins.
false_statement: Compliant Data Sharing participant groups can nest other groups up to five levels, and the most restrictive access a user reaches wins.
explanation: When a user is linked to a record through several participant groups with different levels, CDS grants the most permissive one. It never narrows access to the lowest level.
