id: sf-001431
product_area: security-and-sharing
true_statement: WITH SECURITY_ENFORCED doesn't support traversing polymorphic lookups such as What.Name, except for the Owner, CreatedBy and LastModifiedBy relationships.
false_statement: WITH SECURITY_ENFORCED doesn't support traversing polymorphic lookups such as What.Name, except for the Who, Parent and RelatedTo relationships.
explanation: Polymorphic relationship fields are generally unsupported by the clause; the documented exceptions are Owner, CreatedBy and LastModifiedBy. Who, Parent and RelatedTo aren't on that list.
