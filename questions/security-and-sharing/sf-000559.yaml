id: sf-000559
product_area: security-and-sharing
true_statement: The August 2025 Salesloft Drift data theft used stolen OAuth tokens from that integration, not a flaw in core Salesforce.
false_statement: The August 2025 Salesloft Drift data theft exploited a flaw in the core Salesforce API, not stolen tokens from that integration.
explanation: Google's threat intelligence team found the attacker queried orgs with stolen Drift OAuth tokens and said core Salesforce was not at fault. Blaming a platform flaw gets the attack vector wrong.
