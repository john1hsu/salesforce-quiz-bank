id: sf-001554
product_area: security-and-sharing
true_statement: A custom permission imported into a Lightning web component evaluates to undefined for users who lack it, so code should test it for truthiness.
false_statement: A custom permission imported into a Lightning web component evaluates to false for users who lack it, so code should compare it to false.
explanation: The static import from @salesforce/customPermission returns true for holders and undefined otherwise, so a strict comparison to false would fail.
