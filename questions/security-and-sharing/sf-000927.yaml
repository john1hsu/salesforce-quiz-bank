id: sf-000927
product_area: security-and-sharing
true_statement: An org can have up to 200 active user access policies, and each policy can hold up to 20 actions.
false_statement: An org can have up to 20 active user access policies, and each policy can hold up to 200 actions.
explanation: Since GA, the active-policy ceiling is 200 per org, while a single policy is capped at 20 grant or revoke actions. Twenty active policies was the old closed-beta limit.
