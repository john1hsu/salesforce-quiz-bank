id: sf-000578
product_area: security-and-sharing
true_statement: New transaction security policies are created disabled and are switched on with the Status toggle on the Actions tab.
false_statement: New transaction security policies are created enabled and are switched off with the Status toggle on the Actions tab.
explanation: A freshly created policy starts inactive, so it does nothing until an author with Modify Transaction Security Policies turns it on. It is not live on save.
