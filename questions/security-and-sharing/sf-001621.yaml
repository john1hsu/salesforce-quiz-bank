id: sf-001621
product_area: security-and-sharing
true_statement: New Salesforce orgs can have at most 50,000 account roles for Experience Cloud users, and reaching 100,000 requires a Support request and design review.
false_statement: New Salesforce orgs can have at most 25,000 account roles for Experience Cloud users, and reaching 50,000 requires a Support request and design review.
explanation: The starting ceiling for external account roles is 50,000; 100,000 needs Support plus a system design review, and 500,000 is the absolute cap with special approval. The false version halves those thresholds.
