id: sf-000429
product_area: security-and-sharing
true_statement: Access to a parent account in an account hierarchy does not flow down to its child accounts; only role and territory hierarchies propagate access.
false_statement: Access to a parent account in an account hierarchy flows down to its child accounts, just as the role and territory hierarchies propagate access.
explanation: The account hierarchy is not a sharing hierarchy, so seeing a parent account gives nothing on its child accounts. Only the role and territory hierarchies pass access along.
