id: sf-001553
product_area: security-and-sharing
true_statement: In Apex, FeatureManagement.checkPermission(apiName) returns true when the running user has the named custom permission enabled.
false_statement: In Apex, UserInfo.checkPermission(apiName) returns true when the running user has the named custom permission enabled.
explanation: Apex checks custom permissions through the FeatureManagement class's checkPermission method. UserInfo is not the documented class for this check.
