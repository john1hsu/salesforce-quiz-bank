id: sf-000432
product_area: security-and-sharing
true_statement: In an Apex test, Test.calculatePermissionSetGroup() forces a group's recalculation so the test can assign it, and the call counts against CPU limits.
false_statement: In an Apex test, Test.calculatePermissionSetGroup() forces a group's recalculation so the test can assign it, and the call is exempt from CPU limits.
explanation: Recalculation in tests consumes Apex CPU time, so large groups can push a test over the limit. Salesforce suggests calculating once in @testSetup and reusing it.
