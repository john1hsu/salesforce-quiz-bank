id: sf-000504
product_area: security-and-sharing
true_statement: Shield Platform Encryption requires deterministic encryption for custom fields marked Unique or External ID.
false_statement: Shield Platform Encryption requires probabilistic encryption for custom fields marked Unique or External ID.
explanation: Unique and External ID custom fields must be matched on exact values, so they need the deterministic scheme. Probabilistic is the default for ordinary fields but can't serve these.
