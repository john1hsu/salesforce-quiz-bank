id: sf-000565
product_area: security-and-sharing
true_statement: If a permission set grants View All Fields on an object, the FieldPermissions object reports PermissionsRead as true for every field on it.
false_statement: If a permission set grants View All Fields on an object, the FieldPermissions object reports PermissionsEdit as true for every field on it.
explanation: View All Fields overrides per-field settings for reading, so PermissionsRead shows true across the object. It is a read grant and does not make every field editable.
