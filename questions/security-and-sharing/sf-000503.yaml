id: sf-000503
product_area: security-and-sharing
true_statement: Shield Platform Encryption becomes available in sandboxes only after it has been provisioned for the production org.
false_statement: Shield Platform Encryption can be provisioned in a sandbox for testing before it has been provisioned for the production org.
explanation: Sandbox availability follows the production licence, so rehearsals happen once production is provisioned. A sandbox-first trial isn't how it is enabled.
