id: sf-000561
product_area: security-and-sharing
true_statement: Without Shield, Enterprise, Unlimited and Performance Editions get seven Event Monitoring log types free, each kept for one day.
false_statement: Without Shield, Enterprise, Unlimited and Performance Editions get seven Event Monitoring log types free, each kept for 30 days.
explanation: The free tier covers seven log types, such as Login and Logout, with only one-day retention. Longer retention and the other log types need Shield or the Event Monitoring add-on.
