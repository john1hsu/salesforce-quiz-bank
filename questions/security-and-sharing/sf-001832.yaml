id: sf-001832
product_area: security-and-sharing
true_statement: Besides the owner, users with Full Access to the record, Modify All Records on the object or Modify All Data can create manual shares.
false_statement: Besides the owner, users with Read access to the record, View All Records on the object or View All Data can create manual shares.
explanation: 'Sharing a record manually takes owner-level privilege: Full Access, Modify All Records or Modify All Data. Read or View All permissions let a user see records but not share them.'
