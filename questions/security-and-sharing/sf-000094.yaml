id: sf-000094
product_area: security-and-sharing
true_statement: When a record's owner changes, its manual shares are deleted, but its Apex managed shares are kept.
false_statement: When a record's owner changes, its Apex managed shares are deleted, but its manual shares are kept.
explanation: Apex managed shares survive an ownership change or owner deactivation, while user-managed manual shares are removed when the owner changes. The false statement swaps which kind persists.
