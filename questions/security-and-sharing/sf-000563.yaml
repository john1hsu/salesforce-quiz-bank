id: sf-000563
product_area: security-and-sharing
true_statement: Event log objects can be queried with SOQL roughly 25 to 45 minutes after an event, and they keep the data for 30 days.
false_statement: Event log objects can be queried with SOQL roughly 25 to 45 minutes after an event, and they keep the data for one year.
explanation: The event log object channel holds its data for 30 days and requires the View Event Log Object Data permission. The one-year default is for paid event log files, not these objects.
