id: sf-001200
product_area: security-and-sharing
true_statement: For the AppExchange security review, Trailhead says queries that use WITH SECURITY_ENFORCED should be on API version 48.0 or later.
false_statement: For the AppExchange security review, Trailhead says queries that use WITH SECURITY_ENFORCED should be on API version 40.0 or later.
explanation: Trailhead sets API version 48.0 as the minimum for WITH SECURITY_ENFORCED queries submitted for security review. Version 40.0 is too old to meet that guidance.
