id: sf-000566
product_area: security-and-sharing
true_statement: Field-level security on formula and auto-number fields can grant only Read access, since those fields can't be edited.
false_statement: Field-level security on formula and auto-number fields can grant only Edit access, since those fields can't be hidden.
explanation: Formula and auto-number fields accept only the Read field permission, because their values aren't entered by users. The false statement invents an Edit-only rule that the platform doesn't have.
