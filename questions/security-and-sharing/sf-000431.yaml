id: sf-000431
product_area: security-and-sharing
true_statement: A permission muted in a permission set group is still granted to users who get it from their profile or a directly assigned permission set.
false_statement: A permission muted in a permission set group is removed from the user even if they also get it from their profile or a directly assigned permission set.
explanation: Muting only affects what flows through that group; it is not a deny rule. Any other source of the same permission still grants it.
