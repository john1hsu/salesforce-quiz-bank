id: sf-001267
product_area: security-and-sharing
true_statement: Salesforce provisions login-based Customer Community licenses at a 1-to-20 ratio, so buying 1,000 monthly logins gives 20,000 login licenses.
false_statement: Salesforce provisions login-based Customer Community licenses at a 1-to-5 ratio, so buying 1,000 monthly logins gives 5,000 login licenses.
explanation: Each purchased monthly login comes with twenty provisioned login licenses. A one-to-five ratio would provision far fewer users than Salesforce actually does.
