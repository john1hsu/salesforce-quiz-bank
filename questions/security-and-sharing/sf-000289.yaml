product_area: security-and-sharing
true_statement: The Sales Territories implementation guide allows up to four territory models per org including clones, or two in Enterprise Edition.
false_statement: The Sales Territories implementation guide allows up to ten territory models per org including clones, or four in Enterprise Edition.
explanation: The guide gives four models per org (two in Enterprise Edition), clones counted, with only one active at a time. Ten and four overstate those figures.
