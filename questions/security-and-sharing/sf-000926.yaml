id: sf-000926
product_area: security-and-sharing
true_statement: ISV permission set license definitions work only in second-generation managed packages, and only for net-new packages.
false_statement: ISV permission set license definitions work in both first- and second-generation managed packages, including existing packages.
explanation: PermissionSetLicenseDefinition is a 2GP-only feature limited to net-new packages and US-based paying production subscribers, so 1GP and existing packages can't use it.
