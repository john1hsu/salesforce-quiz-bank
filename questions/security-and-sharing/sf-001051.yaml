id: sf-001051
product_area: security-and-sharing
true_statement: Lightning's CSP sets script-src to 'self', so a third-party JavaScript library must be uploaded as a static resource rather than loaded from a CDN.
false_statement: Lightning's CSP sets script-src to any Trusted URL, so a third-party JavaScript library can be loaded from a CDN once its host is trusted.
explanation: Script sources stay locked to the org, and Trusted URL flags cover connect, font, frame, image, media and style directives but not scripts. Libraries therefore go in static resources.
