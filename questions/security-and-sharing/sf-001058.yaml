id: sf-001058
product_area: security-and-sharing
true_statement: Sessions that use JWT-based access tokens ignore the Session Settings timeout and follow the connected app or external client app policy instead.
false_statement: Sessions that use JWT-based access tokens ignore the connected app or external client app policy and follow the Session Settings timeout instead.
explanation: For JWT-based access tokens the timeout is owned by the app's policy, not the org-wide page. The org setting only governs ordinary UI sessions.
