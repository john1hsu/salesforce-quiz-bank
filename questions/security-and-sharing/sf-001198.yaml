id: sf-001198
product_area: security-and-sharing
true_statement: Salesforce's secure coding guidance recommends declaring inherited sharing on Apex entry points such as controllers and REST services.
false_statement: Salesforce's secure coding guidance recommends declaring without sharing on Apex entry points such as controllers and REST services.
explanation: Trailhead advises inherited sharing for entry points so they run in the caller's sharing context, with with sharing as the normal choice. Without sharing is reserved for places where elevated access is deliberately intended, not for general entry points.
