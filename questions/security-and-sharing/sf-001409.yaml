id: sf-001409
product_area: security-and-sharing
true_statement: Security Agent in Security Center needs Security Center, Event Monitoring and an Agentforce Platform add-on, because it reads Event Monitoring logs.
false_statement: Security Agent in Security Center needs only Security Center and Security Health Check, because it reads Health Check scores rather than event logs.
explanation: Security Agent summarizes a user's activity from login, report and API logs, which come from Event Monitoring, and it runs on Agentforce. All three licences are required.
