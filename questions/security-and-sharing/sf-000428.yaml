id: sf-000428
product_area: security-and-sharing
true_statement: The access an account owner gets to the account's child contacts, opportunities and cases is set on the owner's role in the role hierarchy.
false_statement: The access an account owner gets to the account's child contacts, opportunities and cases is set on the account's organization-wide default.
explanation: Child implicit sharing levels (View, Edit or No access) are defined per child object when the role is set up. The organization-wide default does not configure this owner access.
