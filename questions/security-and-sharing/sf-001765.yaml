product_area: security-and-sharing
true_statement: External Apps is one of the high-volume Experience Cloud license types, so its users have no roles.
false_statement: Customer Community Plus is one of the high-volume Experience Cloud license types, so its users have no roles.
explanation: The high-volume category spans Customer Community, High Volume Customer Portal, Authenticated Website and External Apps. Customer Community Plus is a role-based license, used when external users need the role hierarchy or sharing rules.
