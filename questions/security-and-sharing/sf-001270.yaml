id: sf-001270
product_area: security-and-sharing
true_statement: In indirect prompt injection, the attacker plants instructions in a resource the system later ingests, such as a document, rather than typing them as the application's user.
false_statement: In direct prompt injection, the attacker plants instructions in a resource the system later ingests, such as a document, rather than typing them as the application's user.
explanation: NIST's taxonomy calls it indirect when a third party hides instructions in ingested content. Direct injection is when the system's own user appends instructions to override the system prompt.
