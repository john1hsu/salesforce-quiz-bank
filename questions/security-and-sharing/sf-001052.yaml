id: sf-001052
product_area: security-and-sharing
true_statement: Salesforce advises keeping an org's generated CSP header under 12 KB, since problems have been reported as headers approach 16 KB.
false_statement: Salesforce advises keeping an org's generated CSP header under 64 KB, since problems have been reported as headers approach 128 KB.
explanation: Every Trusted URL adds to the header, and trouble starts around 16 KB, so the guidance is to stay under 12 KB. The larger figures are far beyond what proxies and browsers tolerate here.
