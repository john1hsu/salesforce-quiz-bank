id: sf-000924
product_area: security-and-sharing
true_statement: Each Salesforce user has exactly one user license but can hold several permission set licenses on top of it.
false_statement: Each Salesforce user has exactly one permission set license but can hold several user licenses on top of it.
explanation: The user license is the single base license; permission set licenses are optional add-ons that unlock extra features, and a user can have many.
