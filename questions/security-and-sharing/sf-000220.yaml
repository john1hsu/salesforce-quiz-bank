id: sf-000220
product_area: security-and-sharing
true_statement: An object can have two active restriction rules in Enterprise and Developer editions, and five in Performance and Unlimited.
false_statement: An object can have five active restriction rules in Enterprise and Developer editions, and ten in Performance and Unlimited.
explanation: The per-object cap is two in Enterprise and Developer and five in Performance and Unlimited. For any one user, only one restriction or scoping rule per object should apply.
