id: sf-000571
product_area: security-and-sharing
true_statement: A permission granted by both a user's profile and a permission set stays in effect until it is removed from both.
false_statement: A permission granted by both a user's profile and a permission set is revoked once it is removed from the profile.
explanation: Access is the union of every source, so taking a permission off the profile leaves the permission set's grant in place. It has to be removed in both places.
