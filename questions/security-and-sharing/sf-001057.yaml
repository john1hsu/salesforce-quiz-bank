true_statement: The org-wide session timeout picklist in Session Settings ranges from 15 minutes to 24 hours.
false_statement: The org-wide session timeout picklist in Session Settings ranges from 5 minutes to 12 hours.
explanation: The timeout values run from FifteenMinutes up to TwentyFourHours, with 90 minutes added in API 58.0. Neither 5 minutes nor a 12-hour ceiling matches the picklist.
