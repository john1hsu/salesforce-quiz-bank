id: sf-001551
product_area: security-and-sharing
true_statement: Compliant Data Sharing writes a share row for a participant only when the participant role's access level exceeds the object's organization-wide default.
false_statement: Compliant Data Sharing writes a share row for every participant, even when the participant role's access level equals the object's organization-wide default.
explanation: If the OWD already grants the role's access, no share row is needed; changing the OWD re-evaluates participants and adds or removes rows accordingly. That is also why CDS does nothing under Public Read/Write.
