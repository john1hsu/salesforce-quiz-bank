id: sf-000434
product_area: security-and-sharing
true_statement: Records owned by a queue are routed only to the queue's members, never to their managers, even when those managers can see the records.
false_statement: Records owned by a queue are routed to the queue's members and also to their role-hierarchy managers when Grant Access Using Hierarchies is on.
explanation: Grant Access Using Hierarchies only gives managers visibility. Work assignment and routing go to members alone.
