id: sf-001625
product_area: security-and-sharing
true_statement: Each share group is tied to a sharing set and applies across all Experience Cloud sites in the org.
false_statement: Each share group is tied to a public group and applies only to the one Experience Cloud site where it was activated.
explanation: Share groups are configured from a sharing set's Share Group Settings tab and take effect org-wide across sites. They are not built on public groups, which high-volume users cannot join.
