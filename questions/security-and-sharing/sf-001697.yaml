id: sf-001697
product_area: security-and-sharing
true_statement: Record access granted through a sharing set isn't extended to users above the recipient in a role hierarchy.
false_statement: Record access granted through a sharing set is automatically extended to users above the recipient in the role hierarchy.
explanation: Sharing sets grant access to the matched site users only; nothing rolls up to managers through roles. The false version applies role-hierarchy inheritance that sharing sets don't use.
