id: sf-001345
product_area: security-and-sharing
true_statement: The enforceRootObjectCRUD argument of Security.stripInaccessible() defaults to true, and when that object-level check fails the method throws instead of stripping.
false_statement: The enforceRootObjectCRUD argument of Security.stripInaccessible() defaults to false, and when that object-level check fails the method returns an empty list instead of throwing.
explanation: Object-level CRUD is checked by default, and a failed check raises an exception rather than degrading gracefully. Field-level gaps are the ones that get stripped quietly.
