id: sf-000856
product_area: security-and-sharing
true_statement: For a public group, the doesIncludeBosses field behind Grant Access Using Hierarchies is documented as defaulting to true.
false_statement: For a public group, the doesIncludeBosses field behind Grant Access Using Hierarchies is documented as defaulting to false.
explanation: Regular groups default to sharing upward to members' managers in the role hierarchy. Admins clear the setting when a team's records shouldn't flow to their managers.
