id: sf-001195
product_area: security-and-sharing
true_statement: A scoping rule only sets which records a user sees by default, so preventing users from seeing records calls for a restriction rule instead.
false_statement: A restriction rule only sets which records a user sees by default, so preventing users from seeing records calls for a scoping rule instead.
explanation: Scoping rules narrow default views but leave access unchanged, and users can widen the scope to reach other records they can see. Restriction rules actually remove access, so the false statement reverses the two features.
