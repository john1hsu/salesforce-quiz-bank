id: sf-001127
product_area: security-and-sharing
true_statement: Salesforce Data Detect scans only text-based fields, and for Rich Text fields it checks only the plain-text content.
false_statement: Salesforce Data Detect scans text, number and date fields, and for Rich Text fields it also checks embedded images.
explanation: Data Detect covers Text, Text Area, Long Text Area, Rich Text and encrypted text fields, reading only plain text from Rich Text. Number and date fields and images are outside its scope.
