product_area: security-and-sharing
true_statement: Creating or editing queues requires the Customize Application and Manage Public List Views permissions.
false_statement: Creating or editing queues requires the Manage Users and Manage Public Groups permissions.
explanation: Customize Application plus Manage Public List Views lets an admin create and edit queues. Manage Users is needed only to edit queues created by someone else.
