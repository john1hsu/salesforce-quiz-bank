id: sf-000499
product_area: security-and-sharing
true_statement: In a Field Audit Trail retention policy, archiveRetentionYears is only a reminder; archived history is never deleted automatically.
false_statement: In a Field Audit Trail retention policy, archived history is deleted automatically once archiveRetentionYears has elapsed.
explanation: The setting records an intended retention period but triggers no purge. Orgs that must destroy data after a period need their own scheduled deletion job.
