id: sf-001411
product_area: security-and-sharing
true_statement: In SOQL, WITH SECURITY_ENFORCED goes after the WHERE clause, or after FROM if there is none, and before ORDER BY, LIMIT or OFFSET.
false_statement: In SOQL, WITH SECURITY_ENFORCED goes at the very end of the query, after any ORDER BY, LIMIT or OFFSET clauses.
explanation: 'The clause has a fixed position: following WHERE (or FROM) and preceding ORDER BY, LIMIT, OFFSET and aggregate clauses. Putting it last breaks the query syntax.'
