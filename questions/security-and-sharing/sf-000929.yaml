id: sf-000929
product_area: security-and-sharing
true_statement: User access policies can use profiles and roles as criteria, but can't assign or revoke a profile or role as an action.
false_statement: User access policies can use profiles and roles as criteria, and can also assign a new profile or role to matching users as an action.
explanation: Policy actions cover permission sets, groups, licenses, public groups and queues only. Profiles and roles can filter users but aren't assignable through a policy.
