id: sf-001480
product_area: security-and-sharing
true_statement: Opportunity team roles come from a picklist shared with account teams, so deleting a role value also removes it from account teams.
false_statement: Opportunity team roles come from their own picklist, separate from account teams, so deleting a role value leaves account teams unchanged.
explanation: Admins edit one Team Roles picklist that serves both opportunity and account teams, so a rename or deletion hits both. There is no separate picklist for opportunity teams.
