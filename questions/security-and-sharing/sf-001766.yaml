true_statement: High-volume Experience Cloud users can't join account, opportunity or case teams, and can't be assigned to territories.
false_statement: High-volume Experience Cloud users can join case teams, though they can't join account teams or be assigned to territories.
explanation: Team membership of every kind is off-limits to high-volume users, alongside owning accounts and territory assignment. Case teams are no exception.
