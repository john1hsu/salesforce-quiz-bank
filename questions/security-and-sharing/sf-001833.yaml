id: sf-001833
product_area: security-and-sharing
true_statement: Inserting a higher-access manual share for a user who already has one on the record updates the existing share row rather than adding a second.
false_statement: Inserting a higher-access manual share for a user who already has one on the record adds a second share row alongside the existing one.
explanation: Share rows are unique per record, user or group and row cause, so a higher grant upgrades the current row. No duplicate row is created.
