id: sf-000569
product_area: security-and-sharing
true_statement: A permission set assignment with an expiration date ends at 11:59 PM on that date in the time zone chosen for it.
false_statement: A permission set assignment with an expiration date ends at 12:00 AM at the start of that date in the time zone chosen for it.
explanation: With assignment expiration enabled, access runs through the whole end date and expires at 11:59 PM in the selected time zone. It does not end at the very start of that day.
