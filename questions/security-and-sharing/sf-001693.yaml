id: sf-001693
product_area: security-and-sharing
true_statement: Since API version 35.0, SetupAuditTrail records the delegate user when an admin made a change while logged in as another user.
false_statement: Since API version 35.0, SetupAuditTrail records only the impersonated user when an admin made a change while logged in as another user.
explanation: The object captures the delegate user behind a Login-As session, so changes can be traced to the admin who actually made them. Recording only the impersonated user would hide that.
