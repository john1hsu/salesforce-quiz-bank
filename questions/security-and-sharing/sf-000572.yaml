id: sf-000572
product_area: security-and-sharing
true_statement: Trailhead's least-privilege guidance for agents and integrations says to start read-only and add write access only after testing and approval.
false_statement: Trailhead's least-privilege guidance for agents and integrations says to start with edit access and remove what goes unused after testing.
explanation: The guidance favours starting read-only, returning only required data, and adding write access once the read-only design is tested and approved. Starting broad and trimming later is the opposite approach.
