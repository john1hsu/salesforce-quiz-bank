product_area: security-and-sharing
true_statement: In Compliant Data Sharing, an object can have at most 10 active participant roles.
false_statement: In Compliant Data Sharing, an object can have at most 50 active participant roles.
explanation: Trailhead's participant-setup limits cap each object at 10 active participant roles, and only active roles can be assigned. 50 is not the stated limit.
