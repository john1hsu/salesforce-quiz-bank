id: sf-000293
product_area: security-and-sharing
true_statement: On the Defer Sharing Calculations page, suspending group membership calculation also suspends sharing rule calculation.
false_statement: On the Defer Sharing Calculations page, suspending group membership calculation leaves sharing rule calculation running.
explanation: Pausing group membership calculation pauses sharing rule calculation along with it, and resuming group membership then calls for a full sharing rule recalculation. The two engines cannot be split that way, so sharing rules do not keep calculating on their own.
