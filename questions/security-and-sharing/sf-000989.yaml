id: sf-000989
product_area: security-and-sharing
true_statement: From API 64.0, the UsedLicenses field on UserLicense can't be filtered in a SOQL WHERE clause, so rows must be filtered after retrieval.
false_statement: From API 64.0, the TotalLicenses field on UserLicense can't be filtered in a SOQL WHERE clause, so rows must be filtered after retrieval.
explanation: The filtering restriction applies to UsedLicenses, the count of assigned seats. Audit queries retrieve the rows and filter in code; TotalLicenses is not the field named.
