true_statement: Contact Manager and Group Editions can only assign standard profiles, while Professional Edition and above can create custom profiles.
false_statement: Professional Edition can only assign standard profiles, while Contact Manager and Group Editions and above can create custom profiles.
explanation: Custom profiles are available in Professional, Enterprise, Unlimited, Performance and Developer Editions. Contact Manager and Group Editions are the ones limited to the standard profiles, so the false statement reverses the editions.
