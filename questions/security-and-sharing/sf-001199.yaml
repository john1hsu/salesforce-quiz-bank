id: sf-001199
product_area: security-and-sharing
true_statement: To avoid CSRF in Lightning components, Salesforce advises moving DML out of controller initialisation and into a user action such as a button click.
false_statement: To avoid CSRF in Lightning components, Salesforce advises moving DML out of button click handlers and into controller initialisation.
explanation: The platform protects user-triggered actions against CSRF, but data changes that run when a component initialises bypass that protection. So state-changing DML belongs behind a user action, not in init code.
