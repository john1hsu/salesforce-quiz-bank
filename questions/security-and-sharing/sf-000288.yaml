id: sf-000288
product_area: security-and-sharing
true_statement: An opportunity gets at most one territory, chosen by an Apex class that implements the OpportunityTerritory2AssignmentFilter interface.
false_statement: An opportunity gets up to three territories, chosen by an Apex class that implements the OpportunityTerritory2AssignmentFilter interface.
explanation: Accounts can sit in several territories, but an opportunity is limited to one. The filter class picks it from the parent account's territories, using priority or custom logic when there are several.
