id: sf-001407
product_area: security-and-sharing
true_statement: In Security Center, a production parent tenant can connect production or sandbox children, but a sandbox parent can connect only sandbox children.
false_statement: In Security Center, a sandbox parent tenant can connect production or sandbox children, but a production parent can connect only production children.
explanation: Trailhead says sandbox parents are limited to sandbox children, while production parents can take either kind. That is why a production org is the usual parent for an estate-wide view.
