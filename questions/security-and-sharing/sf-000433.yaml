id: sf-000433
product_area: security-and-sharing
true_statement: Salesforce places no cap on the number of queues an org can create, and each queue gets its own list view named after its label.
false_statement: Salesforce caps an org at 50 queues, and each queue gets its own list view named after its label.
explanation: There is no queue limit per org; every queue simply gets a list view where members see the records it owns. The 50-queue cap is invented.
