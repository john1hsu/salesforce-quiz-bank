id: sf-000287
product_area: security-and-sharing
true_statement: A new Sales Territories model starts in the Planning state, which grants no record access until the model is activated.
false_statement: A new Sales Territories model starts in the Active state, which grants record access to territory members as soon as it is saved.
explanation: Planning is the default state for a new model and lets admins build and preview it without affecting access. Users get territory-based access only after the model is activated.
