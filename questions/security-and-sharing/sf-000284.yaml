id: sf-000284
product_area: security-and-sharing
true_statement: Each custom object can have up to 10 Apex sharing reasons, and deleting a reason deletes all sharing on the object that uses it.
false_statement: Each custom object can have up to 25 Apex sharing reasons, and deleting a reason deletes all sharing on the object that uses it.
explanation: The limit is 10 Apex sharing reasons per custom object, not 25. Because deleting a reason also deletes every share row using it, reasons should be removed with care.
