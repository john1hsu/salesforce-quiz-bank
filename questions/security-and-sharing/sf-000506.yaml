id: sf-000506
product_area: security-and-sharing
true_statement: Enabling Shield Platform Encryption encrypts only data created or updated afterward; existing values need a sync or background encryption process.
false_statement: Enabling Shield Platform Encryption immediately encrypts all existing values of the selected fields, along with any data created afterward.
explanation: Encryption applies going forward only. Values already stored are brought into line through the Encryption Statistics and Data Sync pages or a background process, not automatically at enablement.
