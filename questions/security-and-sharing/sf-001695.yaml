id: sf-001695
product_area: security-and-sharing
true_statement: Each profile can belong to only one sharing set, so all access mappings for that profile's users live together.
false_statement: Each profile can belong to up to five sharing sets, so access mappings for one profile can be split across several sets.
explanation: A profile can appear in just one sharing set, which keeps every mapping for those users in one container. The false version lets a profile span multiple sets.
