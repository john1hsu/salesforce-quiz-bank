id: sf-000854
product_area: security-and-sharing
true_statement: GroupMember rows exist only for a public group's direct members, so users who inherit membership through a role or subgroup aren't listed.
false_statement: GroupMember rows list every user a public group covers, including users who inherit membership through a role or subgroup.
explanation: Only direct members get GroupMember rows; role, territory and nested-group members are represented by their group IDs. Querying GroupMember alone therefore misses inherited users.
