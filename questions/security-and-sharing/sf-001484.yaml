id: sf-001484
product_area: security-and-sharing
true_statement: Health Check's Fix Risks action applies recommended values to several non-compliant settings at once, so testing it in a sandbox first is advised.
false_statement: Health Check's Edit link applies recommended values to several non-compliant settings at once, so testing it in a sandbox first is advised.
explanation: Fix Risks is the bulk action that changes many flagged settings in one go, which can break integrations or access. Edit only opens the page for a single setting so you change it on its own.
