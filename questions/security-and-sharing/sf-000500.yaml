id: sf-000500
product_area: security-and-sharing
true_statement: Deleting a production record removes its live field history but leaves its Field Audit Trail archive rows until they are purged.
false_statement: Deleting a production record removes both its live field history and its Field Audit Trail archive rows.
explanation: Archived copies in FieldHistoryArchive survive record deletion; removing them needs an explicit deleteByExample() or Database.deleteImmediate() call with the right permissions.
