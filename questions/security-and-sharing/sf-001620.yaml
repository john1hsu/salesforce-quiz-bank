id: sf-001620
product_area: security-and-sharing
true_statement: Each enabled partner account gets one account role by default, and the Digital Experiences settings allow up to three.
false_statement: Each enabled partner account gets three account roles by default, and the Digital Experiences settings allow up to five.
explanation: Partner accounts start with a single role and can be raised to a maximum of three, though Salesforce recommends staying at one for performance. The false version inflates both numbers.
