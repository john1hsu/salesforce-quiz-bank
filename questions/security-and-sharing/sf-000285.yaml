id: sf-000285
product_area: security-and-sharing
true_statement: A share row inserted from Apex without a custom sharing reason gets the Manual row cause and is removed when the record owner changes.
false_statement: A share row inserted from Apex without a custom sharing reason gets an Apex row cause and is kept when the record owner changes.
explanation: Without an Apex sharing reason, code-inserted shares default to the Manual cause and behave like user-managed sharing, which ownership changes wipe out. Only rows with a custom reason survive owner changes.
