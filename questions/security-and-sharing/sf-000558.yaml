id: sf-000558
product_area: security-and-sharing
true_statement: A Salesforce Health Check score reflects org security settings, so it would not reveal an over-scoped integration token.
false_statement: A Salesforce Health Check score includes connected app token scopes, so it would reveal an over-scoped integration token.
explanation: Health Check measures configuration settings against a baseline, not people or third-party apps. An integration token with excessive scope sits outside what it scores.
