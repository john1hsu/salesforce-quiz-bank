id: sf-001410
product_area: security-and-sharing
true_statement: WITH SECURITY_ENFORCED checks only fields in a query's SELECT and FROM clauses, so a field used only in WHERE or ORDER BY isn't evaluated.
false_statement: WITH SECURITY_ENFORCED checks every field a query references, including fields used only in its WHERE and ORDER BY clauses.
explanation: The clause enforces object and field permissions on what the query returns, meaning the SELECT and FROM parts. Filter and sort fields slip past it, one reason user mode is now preferred.
