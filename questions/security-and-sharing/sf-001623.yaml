id: sf-001623
product_area: security-and-sharing
true_statement: Salesforce emails the admin when share group activation finishes, but sends no email when a share group deactivation finishes.
false_statement: Salesforce emails the admin when share group deactivation finishes, but sends no email when a share group activation finishes.
explanation: Activation runs in the background and ends with a confirmation email; deactivation, which strips everyone else's access to the records, finishes silently. The false version swaps the two.
