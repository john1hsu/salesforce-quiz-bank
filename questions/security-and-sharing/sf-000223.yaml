id: sf-000223
product_area: security-and-sharing
true_statement: Guest user sharing rules can grant only Read Only access to unauthenticated site visitors.
false_statement: Guest user sharing rules can grant Read Only or Read/Write access to unauthenticated site visitors.
explanation: Guest rules are limited to Read Only. With secure guest record access on, they are the only way to share records with guests, and they expose every matching record at once.
