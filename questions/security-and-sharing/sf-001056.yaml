id: sf-001056
product_area: security-and-sharing
true_statement: Lightning Web Security sanitizes HTML and SVG strings that components insert via innerHTML, but it does not sanitize input text.
false_statement: Lightning Web Security sanitizes input text that users type into components, but it does not sanitize HTML strings inserted via innerHTML.
explanation: LWS filters markup written to the DOM through properties like innerHTML down to allowlisted elements and attributes. It leaves raw input text alone, so output encoding is still needed.
