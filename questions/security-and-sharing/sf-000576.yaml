id: sf-000576
product_area: security-and-sharing
true_statement: In Lightning Experience, the MFA action on a List View or Report Event transaction security policy isn't supported and is upgraded to Block.
false_statement: In Lightning Experience, the MFA action on a List View or Report Event transaction security policy isn't supported and is downgraded to Notify.
explanation: Salesforce replaces the unsupported MFA action with the stricter Block action for these events in Lightning. It does not fall back to a notification, which would stop nothing.
