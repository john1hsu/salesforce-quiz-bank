id: sf-000564
product_area: security-and-sharing
true_statement: Declaring an Apex class with sharing enforces record sharing for its queries, but it does not enforce field-level security.
false_statement: Declaring an Apex class with sharing enforces field-level security for its queries, but it does not enforce record sharing.
explanation: The with sharing keyword controls which records the code can see; field access still needs user mode, stripInaccessible or describe checks. The false statement swaps the two layers.
