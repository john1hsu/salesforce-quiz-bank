id: sf-001482
product_area: security-and-sharing
true_statement: When an opportunity's owner changes through the API, the previous owner stays on the team with Read Only or the org-wide default, whichever is greater.
false_statement: When an opportunity's owner changes through the API, the previous owner is removed from the team and keeps no access beyond the org-wide default.
explanation: An API owner change keeps the old owner as a team member at Read Only or the org-wide default level, whichever is higher. In the UI, the user picks that level instead; the old owner is not dropped.
