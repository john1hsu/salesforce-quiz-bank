id: sf-001340
product_area: security-and-sharing
true_statement: Salesforce Security Center aggregates security metrics from child tenants into a parent tenant and can deploy versioned security policies to chosen tenants.
false_statement: Salesforce Security Center aggregates security metrics from a parent tenant into each child tenant and can deploy versioned security policies only to the parent.
explanation: The parent tenant is the monitoring hub that collects metrics from child orgs and pushes policies out to selected ones. The data flows up from children, not down from the parent.
