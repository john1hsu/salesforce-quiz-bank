id: sf-000224
product_area: security-and-sharing
true_statement: Per the archived Summer '20 Security Guide, an object can have 300 sharing rules, of which up to 50 may be criteria-based or guest rules.
false_statement: Per the archived Summer '20 Security Guide, an object can have 300 sharing rules, of which up to 200 may be criteria-based or guest rules.
explanation: The guide caps the total at 300 per object with a sub-limit of 50 for criteria-based and guest user rules. Check your org's current allocations before relying on them.
