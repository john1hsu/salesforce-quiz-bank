id: sf-000095
product_area: security-and-sharing
true_statement: Full Access to a record can come only from managed sharing such as ownership; a manual share is limited to lower access levels.
false_statement: Full Access to a record can be granted through a manual share, in addition to managed sharing such as ownership.
explanation: Full Access (the All level) is reserved for platform-managed grants like ownership. Manual shares cannot hand it out, so the false statement overstates what manual sharing can do.
