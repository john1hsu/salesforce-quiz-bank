id: sf-001343
product_area: security-and-sharing
true_statement: Passing AggregateResult records to Security.stripInaccessible() throws an exception, so aggregate queries need another way to enforce field-level security.
false_statement: Passing AggregateResult records to Security.stripInaccessible() strips inaccessible grouped fields, so aggregate queries can be secured the same way as sObject queries.
explanation: The method works on sObjects and rejects AggregateResult input with an exception. Aggregate queries need user mode or another enforcement method instead.
