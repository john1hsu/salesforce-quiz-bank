id: sf-000577
product_area: security-and-sharing
true_statement: In a transaction security Apex condition, evaluate() returning true fires the policy's action, while returning false lets the user proceed.
false_statement: In a transaction security Apex condition, evaluate() returning false fires the policy's action, while returning true lets the user proceed.
explanation: A class implementing TxnSecurity.EventCondition signals a match by returning true, which triggers the block, MFA or notification. The false version inverts the return values.
