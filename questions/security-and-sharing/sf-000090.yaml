id: sf-000090
product_area: security-and-sharing
true_statement: Salesforce orgs created in Spring '21 or later can have up to 5,000 roles, while older orgs start at 500.
false_statement: Salesforce orgs created in Spring '21 or later can have up to 10,000 roles, while older orgs start at 1,000.
explanation: The sharing architecture guide gives 5,000 roles for newer orgs and 500 for older ones, which can request more from Support. The 10,000 and 1,000 figures are inflated.
