id: sf-001763
product_area: security-and-sharing
true_statement: An account team member's contact access level can't be set when the org's default contact access is Controlled by Parent.
false_statement: An account team member's case access level can't be set when the org's default case access is Controlled by Parent.
explanation: The contact grant, added in API version 10.0, is unavailable when contacts are Controlled by Parent, because contact access then simply follows the account. The restriction is specific to contacts.
