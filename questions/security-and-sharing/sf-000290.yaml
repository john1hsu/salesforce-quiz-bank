id: sf-000290
product_area: security-and-sharing
true_statement: Implicit sharing covers standard objects only; custom objects fall outside it and need other mechanisms to open record access.
false_statement: Implicit sharing covers standard and custom objects alike, so custom objects need no other mechanism to open record access.
explanation: Salesforce's sharing guidance flags that implicit sharing does not reach custom objects, an edge case scenario questions hinge on. Assuming custom objects inherit implicit parent or child access is the mistake in the false version.
