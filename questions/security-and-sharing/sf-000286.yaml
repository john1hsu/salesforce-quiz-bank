id: sf-000286
product_area: security-and-sharing
true_statement: Creating an Apex sharing reason requires the Author Apex permission, while adding or changing shares that use a reason requires Modify All Data.
false_statement: Creating an Apex sharing reason requires the Modify All Data permission, while adding or changing shares that use a reason requires Author Apex.
explanation: Defining the reason is an Author Apex task, whereas managing the reason-based share rows themselves needs Modify All Data. The false statement swaps the two permissions.
