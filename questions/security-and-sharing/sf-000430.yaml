id: sf-000430
product_area: security-and-sharing
true_statement: A permission set group can contain at most one muting permission set.
false_statement: A permission set group can contain up to five muting permission sets.
explanation: Each group allows a single muting permission set, which disables chosen permissions for that group only. There is no allowance for several muting sets.
