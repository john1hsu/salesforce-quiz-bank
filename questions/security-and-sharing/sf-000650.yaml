id: sf-000650
product_area: security-and-sharing
true_statement: Seeing the unmasked value of a Classic Encryption field requires the View Encrypted Data permission.
false_statement: Seeing the unmasked value of a Classic Encryption field requires the Manage Encryption Keys permission.
explanation: Users without View Encrypted Data see a masked value. Manage Encryption Keys is a Platform Encryption permission and has no role in Classic Encryption.
