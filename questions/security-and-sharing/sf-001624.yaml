id: sf-001624
product_area: security-and-sharing
true_statement: Share group members can be internal users and external users from the same parent account as the high-volume user who owns the records.
false_statement: Share group members can be internal users and any authenticated external user of the same Experience Cloud site as the high-volume record owner.
explanation: External membership is limited to users under the owner's parent account, alongside chosen internal users. Site membership alone does not make an external user eligible.
