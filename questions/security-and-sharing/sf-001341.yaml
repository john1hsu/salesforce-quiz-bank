true_statement: The example risk audit in Salesforce's Well-Architected Security Policy Template reviews all org access and sensitive-field access quarterly.
false_statement: The example risk audit in Salesforce's Well-Architected Security Policy Template reviews all org access and sensitive-field access every two years.
explanation: The template's sample audit runs every quarter. A two-year cycle would leave access drift unchecked far longer than the template suggests.
