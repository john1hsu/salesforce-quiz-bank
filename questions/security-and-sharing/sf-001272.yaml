id: sf-001272
product_area: security-and-sharing
true_statement: Salesforce's partner guidance limits where packaged Agentforce prompts may be stored to prompt templates, protected custom settings and protected custom metadata.
false_statement: Salesforce's partner guidance limits where packaged Agentforce prompts may be stored to static resources, public custom settings and Apex string constants.
explanation: AgentExchange guidance allows only prompt templates and protected settings or metadata for packaged prompts, and bars secrets inside them. Public settings and code constants are not on that list.
