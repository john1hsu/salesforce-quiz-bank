id: sf-000001
product_area: security-and-sharing
true_statement: An object's Default External Access can never be set more permissively than its Default Internal Access.
false_statement: An object's Default External Access can be set more permissively than its Default Internal Access, so partner users can see more than employees.
explanation: Each object has separate internal and external organization-wide defaults, and the external value can never be more permissive than the internal one. Salesforce recommends setting every external default to Private.
