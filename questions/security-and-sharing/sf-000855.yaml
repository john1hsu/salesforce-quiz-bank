id: sf-000855
product_area: security-and-sharing
true_statement: The GroupMember object supports create, delete, query and retrieve, but not update.
false_statement: The GroupMember object supports create, update, delete and query, so a membership row can be repointed to another user.
explanation: GroupMember has no update call; to change membership you delete one row and insert another. Inserting a duplicate just returns the existing row.
