id: sf-000560
product_area: security-and-sharing
true_statement: Salesforce calls MFA, permission sets and login IP restrictions customer 'configurables', and paid add-ons such as Shield 'enhanceables'.
false_statement: Salesforce calls Shield and Security Center customer 'configurables', and MFA, permission sets and login IP restrictions paid 'enhanceables'.
explanation: In Salesforce's shared responsibility framing, configurables are the built-in settings customers must set up, while enhanceables are paid products layered on top. The false version swaps the two groups.
