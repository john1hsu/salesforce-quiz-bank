id: sf-001196
product_area: security-and-sharing
true_statement: A scoping rule's SOQL() record-criteria operator is available only when the rule is created through the API, not in Object Manager.
false_statement: A scoping rule's SOQL() record-criteria operator is available only when the rule is created in Object Manager, not through the API.
explanation: The SOQL() operator, used for criteria that depend on another object such as a junction object, can be set only through the API. Its subquery must also include USING SCOPE EVERYTHING and may reference only $User.Id.
