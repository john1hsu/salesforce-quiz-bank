id: sf-001622
product_area: security-and-sharing
true_statement: Raising the number of roles allowed per partner account doesn't add roles to partner accounts that were already enabled.
false_statement: Raising the number of roles allowed per partner account automatically adds the extra roles to partner accounts that were already enabled.
explanation: The higher role count only applies to accounts enabled afterwards, so existing partner accounts keep the roles they already have. The false version claims the change is retroactive.
