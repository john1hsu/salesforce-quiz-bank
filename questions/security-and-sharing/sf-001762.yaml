product_area: security-and-sharing
true_statement: AccountShare rows with the Team row cause are read-only; integrations change them by writing account team member records instead.
false_statement: AccountShare rows with the Team row cause can be inserted or updated directly by integrations, just like Manual rows.
explanation: Only Manual share rows can be created, edited or deleted directly. Team rows follow team membership, so code must add or change team members to alter that access.
