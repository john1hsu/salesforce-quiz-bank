product_area: security-and-sharing
true_statement: Account teams are off by default, and an admin turns them on in Setup by selecting Account Teams Enabled.
false_statement: Account teams are on by default, and an admin only needs to add the Account Team related list to page layouts.
explanation: The feature must be enabled first in the Account Teams settings. Choosing page layouts for the related list is part of that enablement, not a substitute for it.
