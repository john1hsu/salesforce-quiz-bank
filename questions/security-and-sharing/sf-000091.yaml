id: sf-000091
product_area: security-and-sharing
true_statement: The Grant Access Using Hierarchies setting can be cleared only for custom objects; for standard objects, hierarchy access is always on.
false_statement: The Grant Access Using Hierarchies setting can be cleared only for standard objects; for custom objects, hierarchy access is always on.
explanation: Standard objects always grant access up the role hierarchy, while custom objects expose a checkbox (checked by default) that can switch it off. The false statement reverses the two.
