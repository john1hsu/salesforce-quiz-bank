id: sf-001692
product_area: security-and-sharing
true_statement: The SetupAuditTrail object exposes Setup changes for at least the last 180 days, and older entries can't be recovered natively.
false_statement: The SetupAuditTrail object exposes Setup changes for at least the last 10 years, so older entries never need exporting.
explanation: Setup Audit Trail keeps roughly 180 days of history; audits needing a longer look-back must export or archive entries. The false version claims long-term retention.
