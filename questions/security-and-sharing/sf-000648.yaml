product_area: security-and-sharing
true_statement: A Classic Encryption Text (Encrypted) custom field can hold at most 175 characters.
false_statement: A Classic Encryption Text (Encrypted) custom field can hold at most 255 characters.
explanation: The encrypted text type caps values at 175 characters, which is why Classic Encryption suits short values like ID numbers. 255 is the limit for a plain Text field.
