id: sf-001125
product_area: security-and-sharing
true_statement: Security.stripInaccessible() silently removes fields the user can't access, whereas a user-mode operation throws an exception on an access violation.
false_statement: Security.stripInaccessible() throws an exception on fields the user can't access, whereas a user-mode operation silently removes them.
explanation: stripInaccessible is the graceful-degradation option that drops inaccessible fields; user mode fails loudly with a SecurityException or QueryException. The false statement swaps their behaviors.
