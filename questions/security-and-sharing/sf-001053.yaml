id: sf-001053
product_area: security-and-sharing
true_statement: In API versions 50.0 to 58.0, a Trusted URL saved with no directive flags set silently defaulted to img-src only.
false_statement: In API versions 50.0 to 58.0, a Trusted URL saved with no directive flags set silently defaulted to connect-src only.
explanation: Older API versions fell back to the image directive when no flag was chosen. Since API 59.0 at least one directive or permission flag must be true explicitly.
