id: sf-001054
product_area: security-and-sharing
true_statement: Visualforce standard components escape their output by default, and setting escape="false" makes the developer responsible for validating it.
false_statement: Visualforce standard components leave their output unescaped by default, and setting escape="true" makes the platform responsible for validating it.
explanation: Escaping is on by default for standard Visualforce components. Turning it off with escape="false" is what opens the door to XSS unless the developer validates the output.
