id: sf-000064
product_area: devops-and-alm
true_statement: Just-in-time Salesforce CLI plugins, such as code-analyzer, install automatically the first time one of their commands runs.
false_statement: Just-in-time Salesforce CLI plugins, such as code-analyzer, must be installed manually with sf plugins install before their first use.
explanation: Just-in-time plugins are fetched automatically on first use and then kept current by sf update. Manual sf plugins install is how user-installed plugins are added.
