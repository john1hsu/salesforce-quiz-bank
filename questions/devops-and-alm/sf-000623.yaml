id: sf-000623
product_area: devops-and-alm
true_statement: Salesforce prefers namespaced scratch orgs for package development, using the --no-namespace flag mainly to test an installed package.
false_statement: Salesforce prefers scratch orgs created with --no-namespace for package development, using namespaced ones mainly to test an installed package.
explanation: Scratch orgs inherit the project namespace so new metadata gets the package prefix, which is the preferred development setup. The --no-namespace flag is for testing an installed package; the false statement swaps the roles.
