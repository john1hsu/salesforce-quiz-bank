id: sf-000759
product_area: devops-and-alm
true_statement: Salesforce processes only one deployment per org at a time, so a long deployment blocks other releases to that org.
false_statement: Salesforce processes up to five deployments per org in parallel, so a long deployment doesn't block other releases to that org.
explanation: Deployments to an org are handled one at a time, which is part of why pre-validating shortens the blocking window. Parallel deployments to one org aren't supported.
