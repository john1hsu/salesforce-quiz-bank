id: sf-000263
product_area: devops-and-alm
true_statement: In Salesforce Code Analyzer, the --rule-selector flag defaults to Recommended when you run sf code-analyzer run without it.
false_statement: In Salesforce Code Analyzer, the --rule-selector flag defaults to all rules when you run sf code-analyzer run without it.
explanation: The run command uses the Recommended selector unless you choose engines, severities, names or tags yourself. It does not run every one of the 500-plus built-in rules by default.
