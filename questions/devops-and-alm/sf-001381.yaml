id: sf-001381
product_area: devops-and-alm
true_statement: A release update's Enable Test Run toggle can be switched on and off until its Complete Steps By date, though sandbox test periods can end sooner.
false_statement: A release update's Enable Test Run toggle can be switched on only once, and after that the update stays enforced in the org.
explanation: The test run is a reversible toggle that turns the new behaviour on immediately for evaluation and can be turned off again until the deadline. Sandbox test windows may close earlier.
