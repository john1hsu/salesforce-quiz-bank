id: sf-000691
product_area: devops-and-alm
true_statement: A destructiveChangesPost.xml manifest deletes components after the deployment's additions and updates are applied, but before Apex tests run.
false_statement: A destructiveChangesPost.xml manifest deletes components after the deployment's additions and updates are applied, and only after Apex tests run.
explanation: Post-destructive deletions happen once additions and updates are in, yet ahead of the test run. That ordering is why tests can catch references left behind; the false version puts the deletes after testing.
