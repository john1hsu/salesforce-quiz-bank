id: sf-000692
product_area: devops-and-alm
true_statement: In package.xml, custom fields are listed under the CustomField type, named in Object.Field__c form.
false_statement: In package.xml, custom fields are listed under the CustomObject type, named in Object.Field__c form.
explanation: Fields have their own metadata type, CustomField, using the object-qualified full name. CustomObject is the type for standard and custom objects themselves.
