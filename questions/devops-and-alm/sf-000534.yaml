id: sf-000534
product_area: devops-and-alm
true_statement: A managed package namespace prefix can be up to 15 alphanumeric characters, must start with a letter and can't contain two consecutive underscores.
false_statement: A managed package namespace prefix can be up to 40 alphanumeric characters, must start with a letter and can't contain two consecutive underscores.
explanation: Namespace prefixes are globally unique and capped at 15 alphanumeric characters with the letter and underscore rules. 40 characters is far above the allowed length.
