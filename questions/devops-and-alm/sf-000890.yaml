product_area: devops-and-alm
true_statement: Building a managed 2GP version on anything other than the highest promoted version requires the --skip-ancestor-check flag.
false_statement: Building a managed 2GP version on anything other than the highest promoted version requires the --branch flag.
explanation: Branching away from the highest promoted version, for example to abandon a flawed release, must be acknowledged with sf package version create --skip-ancestor-check.
