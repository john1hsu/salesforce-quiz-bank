id: sf-001802
product_area: devops-and-alm
true_statement: For the AgentExchange Go-To-Market App, a customer counts as net-new per product, so one who bought App A offline can still buy App B through it.
false_statement: For the AgentExchange Go-To-Market App, a customer counts as net-new per partner, so one who bought any of the partner's apps offline can't buy another through it.
explanation: Net-new status is judged product by product. Buying one app offline only means more licenses of that same app stay on the original channel until its contract ends; other products can still go through the GTM App.
