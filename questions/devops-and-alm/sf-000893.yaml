id: sf-000893
product_area: devops-and-alm
true_statement: A Salesforce Data Mask job bypasses triggers, validation rules and flows, and deletes the masked object's Field History Tracking when it finishes.
false_statement: A Salesforce Data Mask job runs triggers, validation rules and flows, and logs each masked value in the object's Field History Tracking.
explanation: Masking skips automation, including managed-package automation, to run efficiently, and it wipes field history for the masked object so old values aren't left behind.
