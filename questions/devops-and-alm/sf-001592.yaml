id: sf-001592
product_area: devops-and-alm
true_statement: A SandboxPostCopy script runs at the end of the sandbox copy as a hidden Automated Process user, with that user's permissions.
false_statement: A SandboxPostCopy script runs at the end of the sandbox copy as the user who requested the sandbox, with that user's permissions.
explanation: Salesforce executes the post-copy class under a special Automated Process user that isn't visible in the org. Its limited access is why some setup steps can fail inside the script.
