id: sf-000136
product_area: devops-and-alm
true_statement: A managed 2GP package version can be promoted to released only if code coverage was computed and is at least 75%.
false_statement: A managed 2GP package version can be promoted to released only if code coverage was computed and is at least 50%.
explanation: Promotion requires a version created with code coverage calculated and at least 75% Apex coverage, with every trigger covered. Versions built with --skip-validation can't be promoted.
