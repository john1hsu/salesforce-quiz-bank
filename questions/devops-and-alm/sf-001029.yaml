true_statement: Salesforce posts its seasonal upgrade dates on the Trust site up to a year in advance.
false_statement: Salesforce posts its seasonal upgrade dates on the Trust site up to 3 months in advance.
explanation: Upgrade dates appear on Trust up to a year ahead, letting teams plan backward from the next two or three releases. About 3 months is when a release cycle begins, not how far ahead dates are published.
