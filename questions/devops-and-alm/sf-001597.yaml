id: sf-001597
product_area: devops-and-alm
true_statement: Salesforce advises installing an unmanaged package only while the org that uploaded it still exists, because installs can fail once that org is gone.
false_statement: Salesforce advises that an unmanaged package installs reliably even after the org that uploaded it has been deleted, because the package is self-contained.
explanation: The packaging guide warns that installs depend on the source org, so the uploading org should be kept for as long as the package will be installed.
