id: sf-000965
product_area: devops-and-alm
true_statement: In the Gitflow model for Salesforce, a develop branch feeds the test orgs, release branches are cut for production and hotfixes branch off main.
false_statement: In the Gitflow model for Salesforce, only main lives long, and short-lived feature branches are cut from it and merged straight back.
explanation: Gitflow adds develop, release and hotfix branches and suits a fixed release cadence. A lone long-lived main with short feature branches describes simple feature branching instead.
