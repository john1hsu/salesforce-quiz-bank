id: sf-001240
product_area: devops-and-alm
true_statement: An org shape captures Metadata API settings with Boolean fields, but settings with integer or string fields must be added to the definition file manually.
false_statement: An org shape captures Metadata API settings with integer or string fields, but settings with Boolean fields must be added to the definition file manually.
explanation: The shape records the source org's Boolean Metadata API settings along with its edition, features, limits and package licenses. Integer and string settings are left out and have to be added to the scratch org definition by hand.
