id: sf-001454
product_area: devops-and-alm
true_statement: A post install script runs as a special system user that represents the package, not as the admin who installed it.
false_statement: A post install script runs as the admin who installed the package, using that admin's profile and permissions.
explanation: The platform executes the script under a dedicated package user, readable through UserInfo at runtime. The installer's identity is only available through InstallContext.installerId().
