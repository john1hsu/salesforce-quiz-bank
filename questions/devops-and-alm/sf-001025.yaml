product_area: devops-and-alm
true_statement: Data Mask & Seed can seed from a production org, a sandbox or a backup, but seeding from a backup requires Backup & Recover.
false_statement: Data Mask & Seed can seed from a production org, a sandbox or a backup, and seeding from a backup needs no other product.
explanation: Backups are a valid seeding source only when Backup & Recover is in place, which is why the product integrates with it.
