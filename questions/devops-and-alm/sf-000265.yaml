true_statement: Code Analyzer v5 added the Flow Scanner engine, which audits Flows for security issues.
false_statement: Code Analyzer v5 added the RetireJS engine, which audits Flows for security issues.
explanation: Flow Scanner, along with Regex, was new in v5 and is the engine that checks Flows. RetireJS instead checks third-party JavaScript libraries for known vulnerabilities.
