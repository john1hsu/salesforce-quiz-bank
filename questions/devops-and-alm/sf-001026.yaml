product_area: devops-and-alm
true_statement: A Data Mask & Seed Levels template takes root objects and a number of related-object levels below them to include.
false_statement: A Data Mask & Seed Generate template takes root objects and a number of related-object levels below them to include.
explanation: Levels templates choose roots plus a depth of related objects. Generate templates create synthetic records instead of copying from a source, and Nodes templates add each object explicitly.
