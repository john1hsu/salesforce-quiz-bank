product_area: devops-and-alm
true_statement: Environment Hub SSO matches users first by an explicit user mapping, then by Federation ID, then by a username formula, and the first match wins.
false_statement: Environment Hub SSO matches users first by Federation ID, then by a username formula, then by an explicit user mapping, and the first match wins.
explanation: The hub checks an explicit mapping before Federation ID and the username formula, so a defined mapping always takes priority. The false order puts the mapping last.
