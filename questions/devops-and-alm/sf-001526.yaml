id: sf-001526
product_area: devops-and-alm
true_statement: A scratch org snapshot can be taken only from a scratch org that has no namespace and was not itself created from a snapshot.
false_statement: A scratch org snapshot can be taken only from a scratch org that has a namespace and was itself created from an org shape.
explanation: Snapshot sources must be namespace-free scratch orgs that weren't built from another snapshot. The false statement reverses the namespace rule and adds an org shape requirement that doesn't exist.
