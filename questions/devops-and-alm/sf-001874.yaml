id: sf-001874
product_area: devops-and-alm
true_statement: The ISV Customer Debugger allows one session at a time per License Management Org, runs only in sandboxes and caps a session at 4 hours.
false_statement: The ISV Customer Debugger allows one session at a time per License Management Org, runs only in sandboxes and caps a session at 24 hours.
explanation: A debugger session started from the Subscriber Support Console is limited to four hours, one at a time, in a subscriber sandbox. Twenty-four hours overstates the cap.
