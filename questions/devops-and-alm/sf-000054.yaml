id: sf-000054
product_area: devops-and-alm
true_statement: Change sets can move only between orgs affiliated with the same production org, such as production and one of its sandboxes.
false_statement: Change sets can move between any two Salesforce orgs, such as two separate production orgs, once a deployment connection is set up.
explanation: Deployment connections can link only orgs that share a production org, like production and its sandboxes or two sibling sandboxes. Unrelated orgs, including separate production orgs, cannot exchange change sets.
