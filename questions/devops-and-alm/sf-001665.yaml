id: sf-001665
product_area: devops-and-alm
true_statement: A Trialforce source org must be 1 GB or smaller, and by default it can hold at most 10 Trialforce templates.
false_statement: A Trialforce source org must be 10 GB or smaller, and by default it can hold at most 50 Trialforce templates.
explanation: Trialforce caps the source org at 1 GB and allows 10 templates per source org unless Partner Support raises it. The false version inflates both limits.
