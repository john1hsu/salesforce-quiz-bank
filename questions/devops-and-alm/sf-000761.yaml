id: sf-000761
product_area: devops-and-alm
true_statement: A scratch org snapshot expires after 90 days, and its slot in the Dev Hub's snapshot quota is freed as soon as it expires or is deleted.
false_statement: A scratch org snapshot expires after 30 days, and its slot in the Dev Hub's snapshot quota is freed as soon as it expires or is deleted.
explanation: Snapshots live for 90 days, with a quota equal to the hub's active scratch org allocation. Thirty days understates the lifetime.
