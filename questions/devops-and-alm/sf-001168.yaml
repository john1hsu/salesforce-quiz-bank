id: sf-001168
product_area: devops-and-alm
true_statement: Push upgrades for managed packages are switched on by logging a case with Salesforce Partner Support, while for unlocked packages they're enabled by default.
false_statement: Push upgrades for unlocked packages are switched on by logging a case with Salesforce Partner Support, while for managed packages they're enabled by default.
explanation: Managed 1GP and 2GP packages need a Partner Support case to get push upgrades, whereas unlocked packages have the capability out of the box. The false version swaps the two package types.
