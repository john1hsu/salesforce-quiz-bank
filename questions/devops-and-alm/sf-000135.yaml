product_area: devops-and-alm
true_statement: Deleting a scratch org frees an active slot, but its creation still counts against the Dev Hub's daily allocation.
false_statement: Deleting a scratch org frees an active slot and also refunds its creation from the Dev Hub's daily allocation.
explanation: Active and daily limits are tracked separately. The daily count is a rolling 24-hour tally of successful creations, so deletion doesn't give it back.
