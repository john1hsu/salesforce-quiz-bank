id: sf-001734
product_area: devops-and-alm
true_statement: To change the installation key on an existing package version, run sf package version update with a new --installation-key value.
false_statement: To change the installation key on an existing package version, run sf package install with a new --installation-key value.
explanation: The update command targets the version by alias or 04t ID and sets the new key. The install command's --installation-key flag only supplies a key when installing; it cannot change one.
