product_area: devops-and-alm
true_statement: A Partner Business Org ships with two Sales & Service Cloud Enterprise Edition licenses for the partner's internal use.
false_statement: A Partner Business Org ships with ten Sales & Service Cloud Unlimited Edition licenses for the partner's internal use.
explanation: The PBO is an internal production org that comes with two Enterprise Edition licenses, enough for a small operations team. The false statement inflates both the count and the edition.
