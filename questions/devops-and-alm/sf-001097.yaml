id: sf-001097
product_area: devops-and-alm
true_statement: The Apex Interactive Debugger includes one licence in Performance and Unlimited Edition orgs, can be bought for Enterprise Edition, and isn't available in Developer Edition.
false_statement: The Apex Interactive Debugger includes one licence in Enterprise and Developer Edition orgs, can be bought for Performance Edition, and isn't available in Unlimited Edition.
explanation: Interactive debugging is bundled with Performance and Unlimited, sold as an add-on for Enterprise, and unavailable in Trial and Developer Edition orgs. The false version shuffles those editions.
