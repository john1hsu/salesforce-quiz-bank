id: sf-001099
product_area: devops-and-alm
true_statement: With Deploy on Save in VS Code, only one deployment runs at a time, and files saved meanwhile are queued into the next deployment.
false_statement: With Deploy on Save in VS Code, each saved file starts its own deployment immediately, so several deployments can run at the same time.
explanation: 'Deploy on Save serializes deployments: saves made while one is running are batched into the following deploy rather than launched in parallel.'
