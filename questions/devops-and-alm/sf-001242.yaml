id: sf-001242
product_area: devops-and-alm
true_statement: An org shape can be created from a Developer, Group, Professional, Enterprise or Unlimited edition org, but never from a sandbox or scratch org.
false_statement: An org shape can be created from a Developer, Group, Professional, Enterprise or Unlimited edition org, or from a Full sandbox, but not a scratch org.
explanation: Org shape supports production-type source orgs of those editions only; sandboxes and scratch orgs can't be the source. A Full sandbox is therefore not a valid shape source, which is why sandboxes remain a separate tool.
