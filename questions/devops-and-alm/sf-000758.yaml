product_area: devops-and-alm
true_statement: Quick deploy doesn't support source tracking; it overwrites the matching metadata in the org instead of merging.
false_statement: Quick deploy supports source tracking, merging the validated metadata with changes made in the org since validation.
explanation: Quick deploy pushes the validated component set as-is and replaces what's in the org. It has no source tracking or merge step.
