id: sf-000131
product_area: devops-and-alm
true_statement: In a Salesforce DX project, custom objects are decomposed into subdirectories by default to ease navigation and reduce merge conflicts.
false_statement: In a Salesforce DX project, custom objects stay as one large file by default and are decomposed only after opting in with sourceBehaviorOptions.
explanation: Source format splits custom objects and their translations into subfolders out of the box. The opt-in sourceBehaviorOptions setting is for other types, such as permission sets and custom labels.
