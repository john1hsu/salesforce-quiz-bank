id: sf-001596
product_area: devops-and-alm
true_statement: When an unmanaged package's Apex class clashes with an existing class name in the target org, the installation is blocked.
false_statement: When an unmanaged package's Apex class clashes with an existing class name in the target org, the class is renamed automatically and installation continues.
explanation: Only some types, such as reports, dashboards, documents and list views, are auto-renamed on conflict. A clash on an Apex class, custom object or Visualforce page stops the install.
