id: sf-000891
product_area: devops-and-alm
true_statement: A managed 2GP patch version can never be the direct ancestor of a non-patch version.
false_statement: A managed 2GP patch version can be the direct ancestor of a non-patch version if both share the same major number.
explanation: Patches may chain to other patches with matching major and minor numbers, but a non-patch version must name a non-patch ancestor, or use HIGHEST.
