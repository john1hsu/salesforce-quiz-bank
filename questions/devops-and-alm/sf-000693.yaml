id: sf-000693
product_area: devops-and-alm
true_statement: When sf project generate manifest builds from an org, it leaves out managed and unlocked package metadata unless --include-packages is set.
false_statement: When sf project generate manifest builds from an org, it includes managed and unlocked package metadata unless --excluded-metadata is set.
explanation: Package-owned components are excluded by default and are added only with --include-packages. The --excluded-metadata flag drops whole metadata types; it doesn't control package metadata.
