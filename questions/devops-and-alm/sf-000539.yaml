id: sf-000539
product_area: devops-and-alm
true_statement: Salesforce's dependency support matrix lets an unlocked package depend on managed 1GP, managed 2GP and other unlocked packages.
false_statement: Salesforce's dependency support matrix lets an unlocked package depend only on other unlocked packages, not on managed ones.
explanation: The matrix allows unlocked packages to depend on first-generation managed, second-generation managed and unlocked packages. Restricting them to unlocked-only is wrong; it is managed 2GP depending on unlocked that is marked not recommended.
