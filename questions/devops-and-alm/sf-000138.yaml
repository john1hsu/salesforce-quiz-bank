id: sf-000138
product_area: devops-and-alm
true_statement: A beta version of a managed 2GP package can't be upgraded, so betas should be kept out of sandboxes in the release pipeline.
false_statement: A beta version of a managed 2GP package can be upgraded in place to a released version, so betas are safe in pipeline sandboxes.
explanation: Package versions start as beta and must be promoted to become managed-released. An installed beta has no upgrade path, which makes it a dead end in any org you plan to keep.
