product_area: devops-and-alm
true_statement: The beta RunRelevantTests level lets Salesforce choose tests from the deployment payload, and @IsTest(critical=true) forces a test to be included.
false_statement: The beta RunRelevantTests level lets Salesforce choose tests from the deployment payload, and @IsTest(critical=true) excludes a test from the run.
explanation: RunRelevantTests analyzes the payload and its dependencies to pick tests; marking a test critical, or using testFor, makes sure it always runs.
