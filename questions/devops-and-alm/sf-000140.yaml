id: sf-000140
product_area: devops-and-alm
true_statement: The Dev Hub setting that enables source tracking in sandboxes applies only to sandboxes created or refreshed after it is turned on.
false_statement: The Dev Hub setting that enables source tracking in sandboxes applies at once to all existing sandboxes, with no refresh needed.
explanation: The org-wide switch in production affects sandboxes created or refreshed afterward, so existing ones need a refresh. The per-sandbox setting is the alternative and tracks only later changes.
