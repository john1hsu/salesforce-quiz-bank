id: sf-000889
product_area: devops-and-alm
true_statement: In a managed 2GP, setting ancestorVersion to HIGHEST always resolves to the highest promoted version, keeping the upgrade path linear.
false_statement: In a managed 2GP, setting ancestorVersion to HIGHEST always resolves to the newest beta build, keeping the upgrade path linear.
explanation: Only versions promoted to managed-released can be ancestors, and HIGHEST picks the highest of those. Beta builds never qualify as ancestors.
