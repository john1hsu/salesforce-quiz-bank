id: sf-000536
product_area: devops-and-alm
true_statement: A 1GP patch version can't add or delete components; that kind of change needs a new major or minor version.
false_statement: A 1GP patch version can add new components but can't delete them; only deletions need a new major or minor version.
explanation: 'Patches are deliberately narrow: they can''t add or delete components, add global modifiers, new web services or new dependencies. Adding a component therefore requires a major or minor release, not a patch.'
