id: sf-001593
product_area: devops-and-alm
true_statement: The sf org create sandbox command has no flag for a post-copy Apex class, so the class must be named in a sandbox definition file.
false_statement: The sf org create sandbox command takes an --apex-class flag for the post-copy Apex class, so no sandbox definition file is needed.
explanation: Only the name and license type are available as flags. A post-copy class is set with apexClassName or apexClassId in the definition file, and only one of the two may be used.
