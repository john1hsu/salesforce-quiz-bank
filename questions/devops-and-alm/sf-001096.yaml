true_statement: The Metadata Coverage Report is versioned by release, so coverage should be checked against the API version you actually deploy with.
false_statement: The Metadata Coverage Report is a single unversioned page, so coverage only needs to be checked against the latest release.
explanation: Each release has its own versioned report back to Spring '20, and coverage changes between releases, so the matching version matters rather than only the newest page.
