true_statement: 'Salesforce Help groups release updates into four statuses: Needs Action, Due Soon, Overdue and Archived.'
false_statement: 'Salesforce Help groups release updates into four statuses: Needs Action, In Progress, Enforced and Archived.'
explanation: The Release Updates home page uses Needs Action, Due Soon (deadline approaching), Overdue (deadline passed with steps open) and Archived (complete). In Progress and Enforced aren't the documented status groups.
