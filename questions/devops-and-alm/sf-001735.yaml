id: sf-001735
product_area: devops-and-alm
true_statement: Roll-up summary fields deleted through the Metadata API are purged immediately, even when purgeOnDelete isn't set.
false_statement: Roll-up summary fields deleted through the Metadata API go to the Recycle Bin unless purgeOnDelete is set.
explanation: Most deleted components land in the Recycle Bin unless purgeOnDelete is used, but roll-up summary fields are an exception and are purged regardless. A rollback plan should treat those deletions as permanent.
