true_statement: In the AgentExchange Go-To-Market App, Stripe bundles settled customer payments into one daily payout to the partner, net of Salesforce fees.
false_statement: In the AgentExchange Go-To-Market App, Stripe bundles settled customer payments into one monthly payout to the partner, net of Salesforce fees.
explanation: Payout records reflect a single payout per day that Stripe sends after deducting Salesforce's fees. Payouts are not batched monthly.
