id: sf-000964
product_area: devops-and-alm
true_statement: For a branch created by hand to sync with a DevOps Center work item, its name must match the work item ID.
false_statement: For a branch created by hand to sync with a DevOps Center work item, its name must match the target stage branch.
explanation: DevOps Center links commits to work items through the branch name, so a manually created branch has to carry the work item ID for CLI commits to appear on it.
