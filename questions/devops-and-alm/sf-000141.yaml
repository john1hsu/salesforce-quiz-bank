id: sf-000141
product_area: devops-and-alm
true_statement: Salesforce CLI learns what changed in an org for source tracking by reading the SourceMember object through the Tooling API.
false_statement: Salesforce CLI learns what changed in an org for source tracking by reading the Setup Audit Trail through the Metadata API.
explanation: After a deployment the CLI waits for SourceMember, a Tooling API object, to update and reads it to detect server-side changes. Deployments themselves still go through the Metadata API.
