id: sf-001804
product_area: devops-and-alm
true_statement: To move a Channel Order App contract to the Go-To-Market App, the partner cancels the service order at least 7 days before renewal.
false_statement: To move a Channel Order App contract to the Go-To-Market App, the partner cancels the service order at least 30 days before renewal.
explanation: The migration path is to cancel the COA service order at least seven days ahead of renewal and send a GTM offer starting when the old order expires, so licenses don't lapse. Thirty days is not the stated lead time.
