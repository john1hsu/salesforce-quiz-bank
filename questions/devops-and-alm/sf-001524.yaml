id: sf-001524
product_area: devops-and-alm
true_statement: Dev Hub is disabled in a newly provisioned Partner Business Org and must be switched on in Setup before packaging work can begin.
false_statement: Dev Hub is enabled by default in a newly provisioned Partner Business Org, so packaging work can begin without any Setup change.
explanation: Although Salesforce wants partners to use the PBO as their Dev Hub, the feature starts off and has to be enabled first. The false statement assumes it is on from day one.
