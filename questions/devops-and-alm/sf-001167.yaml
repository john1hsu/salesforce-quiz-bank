id: sf-001167
product_area: devops-and-alm
true_statement: Agentforce Vibes IDE installs extensions from Open VSX because it can't reach the Microsoft VS Code Marketplace, so some desktop extensions may be missing.
false_statement: Agentforce Vibes IDE installs extensions from the Microsoft VS Code Marketplace because it can't reach Open VSX, so some desktop extensions may be missing.
explanation: The browser IDE draws extensions from the Open VSX registry and has no access to Microsoft's marketplace. Teams that need Marketplace-only extensions should use desktop VS Code with Salesforce Extensions.
