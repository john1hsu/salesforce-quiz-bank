id: sf-000132
product_area: devops-and-alm
true_statement: In sfdx-project.json, only one packageDirectories entry can be the default, and that directory receives retrieved changes.
false_statement: In sfdx-project.json, several packageDirectories entries can be marked default, and retrieved changes are split across them.
explanation: The packageDirectories list is required and allows exactly one default directory. That default gets retrieved source and is used for second-generation packages.
