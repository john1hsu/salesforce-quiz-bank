true_statement: In a Partner Business Org, Environment Hub, the License Management App and the Channel Order App are preinstalled, but the Feature Management App is not.
false_statement: In a Partner Business Org, Environment Hub, the License Management App and the Feature Management App are preinstalled, but the Channel Order App is not.
