id: sf-000058
product_area: devops-and-alm
true_statement: In a DevOps Center pipeline, each stage has its own source control branch, and promotion merges it into the next stage's branch before deploying.
false_statement: In a DevOps Center pipeline, all stages share one source control branch, and promotion deploys that branch straight to the next stage's org.
explanation: Every pipeline stage maps to its own branch; promoting merges the current stage's branch into the next one and then deploys to that stage's org. Stages do not share a single branch.
