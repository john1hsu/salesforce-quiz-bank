product_area: devops-and-alm
true_statement: In the org-based development model the production org is the source of truth, while the package-based model makes the source control repository the source of truth.
false_statement: In the org-based development model the source control repository is the source of truth, while the package-based model makes the production org the source of truth.
explanation: Org-based teams treat production as the authoritative record and ship changes together in one manifest-driven deployment. Package-based teams build scratch orgs from repository source, so version control holds the truth; the false statement swaps the two models.
