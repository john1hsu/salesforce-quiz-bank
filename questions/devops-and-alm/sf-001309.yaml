id: sf-001309
product_area: devops-and-alm
true_statement: A Tooling API query on MetadataComponentDependency returns at most 2,000 records, while a Bulk API 2.0 query can return up to 100,000.
false_statement: A Tooling API query on MetadataComponentDependency returns at most 50,000 records, while a Bulk API 2.0 query can return up to 100,000.
explanation: The Tooling API path is capped at 2,000 rows, which is why large dependency sets go through Bulk API 2.0 with its 100,000-row ceiling. A 50,000-row Tooling cap overstates it.
