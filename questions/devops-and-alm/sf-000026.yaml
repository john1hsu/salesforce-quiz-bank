id: sf-000026
product_area: devops-and-alm
true_statement: Uninstalling an unlocked package deletes the components it contains, so package boundaries and deprecation plans need care up front.
false_statement: Uninstalling an unlocked package leaves its components in the org as unpackaged metadata, so package boundaries can be changed freely later.
explanation: Removing an unlocked package removes its components along with it, which is why the article warns to plan boundaries and deprecation early. The components are not left behind as loose metadata.
