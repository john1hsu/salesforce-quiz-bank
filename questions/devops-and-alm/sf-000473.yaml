id: sf-000473
product_area: devops-and-alm
true_statement: In Agentforce DX, sf agent generate test-spec writes an agent's test cases to a YAML file, chosen because it reads and diffs well in source control.
false_statement: In Agentforce DX, sf agent generate test-spec writes an agent's test cases to a CSV file, chosen because it opens directly in spreadsheet tools.
explanation: The spec-first test flow uses YAML, which Salesforce picked for readability and clean diffs. sf agent test create then turns that spec into a test in the org.
