true_statement: Retrieving the Agent:<name> pseudo type also pulls the agent's action Apex and flows, but deleting it leaves that Apex and those flows in place.
false_statement: Retrieving the Agent:<name> pseudo type also pulls the agent's action Apex and flows, and deleting it removes that Apex and those flows too.
explanation: 'Agent: is a convenience pseudo type, not real metadata. Its retrieve expands to the supporting Apex and flows, but deploy and delete operations don''t touch them.'
