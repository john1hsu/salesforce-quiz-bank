product_area: devops-and-alm
true_statement: A deployment run list records the manual steps to do before and after a deployment, while a change list records what each person changed.
false_statement: A change list records the manual steps to do before and after a deployment, while a deployment run list records what each person changed.
explanation: The run list captures setup that metadata can't carry, so it isn't forgotten; the change list tracks each person's changes in their development org. The false version swaps their roles.
