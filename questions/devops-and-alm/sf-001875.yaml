id: sf-001875
product_area: devops-and-alm
true_statement: In second-generation packaging, enabling Subscriber Debug Logs for a package turns logging on for every package in that namespace.
false_statement: In second-generation packaging, enabling Subscriber Debug Logs for a package turns logging on for that one package only.
explanation: With 2GP the setting works at namespace level, so all packages sharing the namespace start logging and expose unobfuscated Apex until it is switched off. It is not limited to one package.
