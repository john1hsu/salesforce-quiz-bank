id: sf-001732
product_area: devops-and-alm
true_statement: sf package version create requires either --installation-key or --installation-key-bypass, so every new version needs an explicit key decision.
false_statement: sf package version create applies the previous version's installation key by default, so only the first version needs an explicit key decision.
explanation: The key is set per package version, and the create command refuses to run without one of the two flags. CI scripts therefore have to pass a key or the bypass flag on every build.
