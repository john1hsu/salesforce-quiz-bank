product_area: devops-and-alm
true_statement: RunLocalTests is the default test level for Metadata API production deployments that contain Apex.
false_statement: RunAllTestsInOrg is the default test level for Metadata API production deployments that contain Apex.
explanation: Production deployments with Apex default to RunLocalTests, which skips tests from installed managed and unlocked packages. RunAllTestsInOrg must be chosen explicitly.
