id: sf-001525
product_area: devops-and-alm
true_statement: Managed package versions built from a scratch org snapshot can't be promoted to Released, while unlocked package versions built from one can.
false_statement: Unlocked package versions built from a scratch org snapshot can't be promoted to Released, while managed package versions built from one can.
explanation: A snapshot can speed up package builds, but a managed release candidate must be rebuilt without the snapshot before promotion; unlocked versions have no such restriction. The false statement swaps the two package types.
