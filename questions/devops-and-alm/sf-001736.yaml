id: sf-001736
product_area: devops-and-alm
true_statement: A destructive changes manifest doesn't support wildcards and is deployed with a companion package.xml that lists no components.
false_statement: A destructive changes manifest supports wildcards such as * and is deployed with a companion package.xml that lists no components.
explanation: Each component to delete must be named explicitly in the destructive manifest, because wildcards aren't accepted. The empty package.xml alongside it is required either way.
