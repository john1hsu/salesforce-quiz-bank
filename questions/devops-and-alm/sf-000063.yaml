id: sf-000063
product_area: devops-and-alm
true_statement: For CI, the recommended Salesforce CLI login is the JWT flow, which needs a certificate, its private key and an external client app.
false_statement: For CI, the recommended Salesforce CLI login is the web flow, which opens a browser and uses the default Salesforce CLI connected app.
explanation: The JWT flow runs headless and is the recommended CI option. The web flow opens a browser, so it suits interactive work rather than unattended pipelines.
