true_statement: In the Channel Order App, only Draft service orders can be submitted, and the order's start date must be today or later.
false_statement: In the Channel Order App, only Draft service orders can be submitted, and the order's start date may be up to 30 days in the past.
explanation: Submission requires Draft status and a start date no earlier than today. Backdating an order by 30 days isn't allowed.
