id: sf-001238
product_area: devops-and-alm
true_statement: In DevOps Testing, creating a review for a work item or promoting it automatically runs every test suite assigned to that pipeline stage.
false_statement: In DevOps Testing, test suites assigned to a pipeline stage run only when a user starts them manually from the Test Suites tab.
explanation: 'DevOps Testing runs are event-driven: a review or promotion triggers all suites assigned to the stage as one job. Manual re-runs exist for failures, but they are not the only way suites run.'
