true_statement: DevOps Center creates a temporary feature branch for a work item when the work item moves to In Progress.
false_statement: DevOps Center creates a temporary feature branch for a work item when the work item is first promoted to the Integration stage.
explanation: The development stage has no stage branch; instead each work item gets its own feature branch, such as feature/WI-000001, as soon as work starts on it.
