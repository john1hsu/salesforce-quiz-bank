id: sf-001239
product_area: devops-and-alm
true_statement: When a suite is created or edited in a test provider, it doesn't appear in DevOps Testing until someone runs a sync from the Test Providers tab.
false_statement: When a suite is created or edited in a test provider, DevOps Testing picks it up automatically on the next pipeline promotion without a sync.
explanation: Provider-side changes reach DevOps Testing only through a manual sync from the Test Providers tab. A promotion runs the suites already synced; it doesn't pull new or changed suites.
