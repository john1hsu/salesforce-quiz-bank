id: sf-001666
product_area: devops-and-alm
true_statement: A Trialforce source org can create templates only while it is itself a trial org, not after it is converted to an active, paying org.
false_statement: A Trialforce source org can create templates only after it is converted to an active, paying org, not while it is still a trial org.
explanation: Template creation is tied to the source org's trial status; converting it to a paid org removes that ability. The false version reverses the requirement.
