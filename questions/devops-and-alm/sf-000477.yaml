id: sf-000477
product_area: devops-and-alm
true_statement: The Tooling API composite resource can bundle several Tooling API requests into one call that counts once against API limits.
false_statement: Tooling API requests don't count against the org's API limits, so bundling them with the composite resource saves nothing.
explanation: Tooling API calls consume the org's API request allocation. The composite resource, available from API 40.0, reduces consumption by counting several requests as one.
