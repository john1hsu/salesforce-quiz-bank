id: sf-001527
product_area: devops-and-alm
true_statement: Scratch org snapshots don't capture connected apps, external credentials or named credentials, so integrations must be set up again in each new org.
false_statement: Scratch org snapshots capture connected apps, external credentials and named credentials, so integrations work unchanged in each new org.
explanation: Snapshots copy packages, features, settings, metadata and data, but leave out connected apps and credential setups. Integrations therefore need to be reconfigured in orgs created from a snapshot.
