id: sf-001095
product_area: devops-and-alm
true_statement: In the Metadata Coverage Report, a footnoted packaging check means the component can go only in a package that has no namespace.
false_statement: In the Metadata Coverage Report, a footnoted packaging check means the component can go only in a namespaced managed package.
explanation: The footnote marks types, such as Territory2, that are packageable only without a namespace, for example in a no-namespace unlocked package. Namespaced managed packages are exactly where they can't go.
