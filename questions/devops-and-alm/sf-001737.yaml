id: sf-001737
product_area: devops-and-alm
true_statement: The Salesforce CLI's --ignore-errors deploy flag shouldn't be used against production, because skipping failed components can leave the org inconsistent.
false_statement: The Salesforce CLI's --ignore-errors deploy flag is recommended for production, because it rolls back failed components while keeping successful ones consistent.
explanation: With --ignore-errors, components that succeed are saved and failures are skipped, so a release can land half-applied. The CLI reference warns against using it on production.
