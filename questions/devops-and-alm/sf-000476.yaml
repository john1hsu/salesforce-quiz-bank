product_area: devops-and-alm
true_statement: A synchronous Tooling API test run through /runTestsSynchronous/ must keep all of its test methods in a single class.
false_statement: A synchronous Tooling API test run through /runTestsSynchronous/ can include test methods from up to five classes.
explanation: Synchronous runs are restricted to one test class; running several classes needs the asynchronous resource. The five-class allowance is invented.
