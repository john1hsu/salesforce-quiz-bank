id: sf-001733
product_area: devops-and-alm
true_statement: Until an installer enters a package version's installation key, the package's name and component list stay hidden.
false_statement: Before an installer enters a package version's installation key, the package's name and component list are shown so they can review it first.
explanation: The key is the very first step of installation and it guards the package's contents, not just the install button. Nothing about the package is revealed until the key is supplied.
