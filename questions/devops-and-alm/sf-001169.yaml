id: sf-001169
product_area: devops-and-alm
true_statement: A 1GP package owner can keep subscriber orgs out of a push with the Push Upgrade Exclusion List, which takes up to 500 comma-separated org IDs.
false_statement: A 1GP package owner can keep subscriber orgs out of a push with the Push Upgrade Exclusion List, which takes up to 5,000 comma-separated org IDs.
explanation: The exclusion list caps out at 500 org IDs entered as a comma-separated list. 5,000 overstates the limit tenfold.
