id: sf-000892
product_area: devops-and-alm
true_statement: The legacy Salesforce Data Mask package is installed in production, but its masking jobs run only in sandboxes.
false_statement: The legacy Salesforce Data Mask package is installed in each sandbox, and its masking jobs can run in production as well.
explanation: Data Mask is installed in the production org so configurations carry into refreshed sandboxes, yet jobs execute only in sandboxes to prevent masking real production records by accident.
