id: sf-000827
product_area: devops-and-alm
true_statement: Org Check blocks its API calls once the org's daily API request usage reaches 90%, and warns between 70% and 90%.
false_statement: Org Check blocks its API calls once the org's daily API request usage reaches 70%, and warns between 50% and 70%.
explanation: Below 70% Org Check runs normally, from 70% to 90% it runs with a warning, and at 90% or more it stops until the rolling 24-hour count drops.
