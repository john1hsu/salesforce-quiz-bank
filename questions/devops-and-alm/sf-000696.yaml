id: sf-000696
product_area: devops-and-alm
true_statement: Partial Copy sampling keeps children with their parents only on master-detail and required lookups; an object linked by an ordinary lookup is sampled on its own.
false_statement: Partial Copy sampling keeps children with their parents on every lookup and master-detail relationship, so no copied row points at a missing parent.
explanation: Only master-detail and required lookup links are enforced during sampling. Objects joined by plain lookups are sampled as top-level objects, so their rows can reference parents that weren't copied.
