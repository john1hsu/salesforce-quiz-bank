id: sf-000535
product_area: devops-and-alm
true_statement: A 1GP packaging org can own only one managed package, so global Apex is the only way to share code across a partner's 1GP packages.
false_statement: A 1GP packaging org can own several managed packages, so they can share one namespace and call each other's public Apex.
explanation: In 1GP each packaging org owns one package and each namespace maps to one package, so cross-package code sharing has to go through global Apex. Sharing a namespace across packages is a 2GP capability.
