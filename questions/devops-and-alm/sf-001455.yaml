id: sf-001455
product_area: devops-and-alm
true_statement: A post install script can't make synchronous callouts; any asynchronous callouts it starts run only after the script and installation commit.
false_statement: A post install script can make synchronous callouts, which run before the installation commits so their results can shape the install.
explanation: Install scripts are limited to asynchronous callouts, and those execute after the script and the install have committed. Synchronous callouts during the install are not allowed.
