id: sf-001872
product_area: devops-and-alm
true_statement: The legacy Partner Order Submit API (ServiceOrderProcessor) works only in Channel Order App version 1.39 and earlier.
false_statement: The legacy Partner Order Submit API (ServiceOrderProcessor) works only in Channel Order App version 2 and later.
explanation: ServiceOrderProcessor belongs to COA 1.39 and earlier; v2 replaced it with the Channel Order Apex API, which adds edit, recall and clone. The false statement ties the legacy API to the newer version.
