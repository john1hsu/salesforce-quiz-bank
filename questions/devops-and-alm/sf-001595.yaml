id: sf-001595
product_area: devops-and-alm
true_statement: In an unmanaged package, a custom field on a standard object must be added explicitly, while a field on a packaged custom object is included automatically.
false_statement: In an unmanaged package, a custom field on a packaged custom object must be added explicitly, while a field on a standard object is included automatically.
explanation: Components that depend on a packaged custom object ride along implicitly when the object is added. Standard objects aren't packaged, so their custom fields, triggers and layouts must be added one by one.
