id: sf-000060
product_area: devops-and-alm
true_statement: A Metadata API deploy or retrieve .zip can be at most 39 MB compressed and 600 MB uncompressed.
false_statement: A Metadata API deploy or retrieve .zip can be at most 50 MB compressed and 600 MB uncompressed.
explanation: The compressed cap is 39 MB, set below the 50 MB SOAP message limit because base-64 encoding inflates the payload. 50 MB is the SOAP message limit, not the .zip cap.
