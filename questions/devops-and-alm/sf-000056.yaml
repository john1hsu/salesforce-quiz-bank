id: sf-000056
product_area: devops-and-alm
true_statement: Deploying a change set that contains Apex to production runs all local tests by default, but deploying it to a sandbox runs no tests automatically.
false_statement: Deploying a change set that contains Apex runs all local tests by default, whether the target is production or a sandbox.
explanation: Local tests run by default only when the target is production; sandbox deployments skip automatic test runs. The false statement wrongly extends the production behaviour to sandboxes.
