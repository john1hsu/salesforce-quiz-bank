product_area: devops-and-alm
true_statement: An overload of Test.testSandboxPostCopyScript() takes a Boolean that runs the test as the Automated Process user.
false_statement: An overload of Test.testSandboxPostCopyScript() takes a Boolean that runs the test as a system administrator to bypass permission checks.
explanation: The extra Boolean simulates real execution by running as the Automated Process user, catching failures that a test run as an administrator would miss.
