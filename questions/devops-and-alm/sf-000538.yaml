id: sf-000538
product_area: devops-and-alm
true_statement: The sf package version displaydependencies command outputs a package version's dependency graph as GraphViz DOT code.
false_statement: The sf package version displaydependencies command outputs a package version's dependency graph as a Mermaid diagram.
explanation: With calculateTransitiveDependencies enabled, displaydependencies emits GraphViz DOT, optionally ordered root-last and labelled with 04t IDs. It does not produce Mermaid syntax.
