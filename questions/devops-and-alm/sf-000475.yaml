id: sf-000475
product_area: devops-and-alm
true_statement: Tooling API queries on EntityDefinition or FieldDefinition silently ignore LIMIT and OFFSET, so a tool can get wrong results without any error.
false_statement: Tooling API queries on EntityDefinition or FieldDefinition reject LIMIT and OFFSET with an error, so a tool learns at once that they aren't supported.
explanation: Metadata Catalog entities don't support several SOQL clauses; most raise errors, but LIMIT and OFFSET are dropped quietly. That silent behaviour is the trap.
