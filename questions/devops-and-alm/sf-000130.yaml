id: sf-000130
product_area: devops-and-alm
true_statement: Dev Hub can be enabled in Developer, Enterprise, Performance and Unlimited editions, but it can't be enabled in a sandbox.
false_statement: Dev Hub can be enabled in a full sandbox as well as in Developer, Enterprise, Performance and Unlimited editions.
explanation: Dev Hub must live in a production or Developer Edition org of a supported edition; sandboxes are excluded. It also can't be turned off once enabled.
