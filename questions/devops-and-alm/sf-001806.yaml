id: sf-001806
product_area: devops-and-alm
true_statement: When a package is registered from the Partner Console, the default license applied at install is active and site-wide.
false_statement: When a package is registered from the Partner Console, the default license applied at install is a free trial with a set number of seats.
explanation: Registration defaults to an active, site-wide license. A trial with a length in days or a per-seat license is something the partner has to choose instead.
