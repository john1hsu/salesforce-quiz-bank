id: sf-001241
product_area: devops-and-alm
true_statement: When enabling Org Shape for Scratch Orgs, a source org can list up to 50 Dev Hub org IDs, each in the 15-character form.
false_statement: When enabling Org Shape for Scratch Orgs, a source org can list up to 5 Dev Hub org IDs, each in the 18-character form.
explanation: The source org's setting accepts up to 50 Dev Hub org IDs, and org shape uses 15-character IDs. Both the cap of 5 and the 18-character format are wrong.
