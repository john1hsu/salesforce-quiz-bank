id: sf-000055
product_area: devops-and-alm
true_statement: An inbound or outbound change set can hold up to 10,000 files of metadata, the same cap as a Metadata API deploy.
false_statement: An inbound or outbound change set can hold up to 5,000 files of metadata, half the cap of a Metadata API deploy.
explanation: Change sets share the Metadata API's per-operation limit of 10,000 files. The 5,000-file figure is wrong, and the two tools do not have different caps.
