id: sf-000757
product_area: devops-and-alm
true_statement: A validation's job ID can be quick-deployed for 10 days, but the --use-most-recent flag finds only validations from the past 3 days.
false_statement: A validation's job ID can be quick-deployed for 30 days, but the --use-most-recent flag finds only validations from the past 10 days.
explanation: Quick deploy eligibility lasts 10 days from the start of validation, and --use-most-recent looks back just 3 days, so older validations need --job-id. The false version inflates both windows.
