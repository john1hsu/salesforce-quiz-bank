id: sf-000537
product_area: devops-and-alm
true_statement: A package dependency version such as 1.3.0.LATEST fixes the major, minor and patch numbers and picks up only the newest build.
false_statement: A package dependency version such as 1.3.0.LATEST fixes only the major number and picks up the newest minor, patch and build.
explanation: LATEST applies only to the build segment, so moving to a new base release means editing the specifier. It does not float the minor or patch numbers.
