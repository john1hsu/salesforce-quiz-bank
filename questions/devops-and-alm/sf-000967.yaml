id: sf-000967
product_area: devops-and-alm
true_statement: If an org enforces high-assurance (stepped-up) authentication, the identity verification prompt blocks headless JWT logins from a CI job.
false_statement: If an org enforces high-assurance (stepped-up) authentication, JWT logins from a CI job bypass the identity verification prompt automatically.
explanation: A headless JWT login can't answer an identity verification challenge, so stepped-up authentication on the org stops the CI login.
