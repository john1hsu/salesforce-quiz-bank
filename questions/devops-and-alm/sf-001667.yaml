id: sf-001667
product_area: devops-and-alm
true_statement: When Trialforce creates a template, PII in User fields such as addresses is scrubbed, but PII in custom objects and fields is copied unchanged.
false_statement: When Trialforce creates a template, PII is scrubbed from every object, including custom objects and fields, before trial orgs are created.
explanation: Only User object PII is cleaned automatically, so partners must keep personal data out of custom objects in the source org themselves. The false version promises scrubbing everywhere.
