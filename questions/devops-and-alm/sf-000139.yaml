id: sf-000139
product_area: devops-and-alm
true_statement: Among sandboxes, source tracking is supported only in Developer and Developer Pro sandboxes, not in Partial Copy or Full sandboxes.
false_statement: Among sandboxes, source tracking is supported in every sandbox type, including Partial Copy and Full sandboxes.
explanation: Tracking can be enabled only in the two developer sandbox types. For Partial Copy, Full or other untracked orgs, metadata has to be moved explicitly with manifests or packages.
