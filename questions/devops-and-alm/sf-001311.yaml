id: sf-001311
product_area: devops-and-alm
true_statement: SOQL on MetadataComponentDependency doesn't support ORDER BY, count(), queryMore() or OFFSET, so large orgs are partitioned with filters instead.
false_statement: SOQL on MetadataComponentDependency supports ORDER BY and OFFSET but not count(), so large orgs are paged with OFFSET instead.
explanation: 'The Dependency API''s SOQL is restricted: none of those clauses or calls work, so paging isn''t possible. Teams split big queries with filters such as component type.'
