true_statement: Test and demo orgs created from an Environment Hub expire after one year by default, and the expiry can be extended through a case.
false_statement: Test and demo orgs created from an Environment Hub expire after 30 days by default, and the expiry can be extended through a case.
explanation: Hub-created test and demo orgs last a year by default. The 30-day ceiling belongs to scratch orgs, which the hub cannot even connect.
