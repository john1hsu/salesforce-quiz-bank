id: sf-001170
product_area: devops-and-alm
true_statement: 1GP push upgrades can be run from the UI or the API, but 2GP and unlocked package pushes have no UI and use Salesforce CLI or the API.
false_statement: 2GP and unlocked package push upgrades can be run from the UI or the API, but 1GP pushes have no UI and use Salesforce CLI or the API.
explanation: Only first-generation packages offer a push-upgrade UI; 2GP and unlocked pushes are scheduled with sf package push-upgrade commands or the SOAP API objects. The false version reverses which generation has the UI.
