id: sf-000133
product_area: devops-and-alm
true_statement: A scratch org's lifespan can be set from 1 to 30 days with --duration-days, and it defaults to 7 days.
false_statement: A scratch org's lifespan can be set from 1 to 90 days with --duration-days, and it defaults to 30 days.
explanation: The CLI accepts a duration between 1 and 30 days and uses 7 when none is given. After expiry the org is gone for good.
