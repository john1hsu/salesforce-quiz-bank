id: sf-001664
product_area: devops-and-alm
true_statement: In a Metadata API retrieve, a * wildcard on CustomObject returns permissions for custom objects only, so standard objects must be listed explicitly.
false_statement: In a Metadata API retrieve, a * wildcard on CustomObject returns permissions for both standard and custom objects, so nothing needs listing explicitly.
explanation: The wildcard does not expand to standard objects, so a profile or permission set retrieve misses their permissions unless each one is named. The false version assumes the wildcard covers everything.
