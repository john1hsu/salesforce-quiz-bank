id: sf-001453
product_area: devops-and-alm
true_statement: If a managed package's post install script throws an exception, the install or upgrade is aborted and the error is emailed to the Notify on Apex Error user.
false_statement: If a managed package's post install script throws an exception, the install or upgrade still completes and the error is emailed to the Notify on Apex Error user.
explanation: An unhandled exception in onInstall stops the whole installation or upgrade, which is why scripts should catch and log errors. The package is not installed with a failed script.
