id: sf-001663
product_area: devops-and-alm
true_statement: A profile retrieved through Metadata API includes security settings only for the other components named in the same retrieve request.
false_statement: A profile retrieved through Metadata API always includes security settings for every object and field in the org, whatever else is in the request.
explanation: Object, field and similar access in a retrieved profile is scoped to the components listed alongside it; only user permissions, IP ranges and login hours always come back. That makes profile files hard to manage in source.
