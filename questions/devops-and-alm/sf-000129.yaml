id: sf-000129
product_area: devops-and-alm
true_statement: Dev Hub can't be enabled in a sandbox, and once enabled in an org it can't be turned off.
false_statement: Dev Hub can be enabled in a full sandbox, and once enabled in an org it can be turned off again.
explanation: Dev Hub is enabled in a production, Developer Edition or trial org, never a sandbox, and the switch is one-way; the false twin allows a sandbox and claims it is reversible.
