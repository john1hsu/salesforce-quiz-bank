id: sf-000264
product_area: devops-and-alm
true_statement: Code Analyzer's --severity-threshold flag sets the lowest severity that makes the command exit non-zero, which lets a CI pipeline fail the build.
false_statement: Code Analyzer's --severity-threshold flag sets the lowest severity that is written to the output file, which filters what reviewers see.
explanation: 'The threshold controls the exit code: any finding at or above it produces a non-zero exit so the pipeline fails. It is not an output filter; output files are controlled by --output-file.'
