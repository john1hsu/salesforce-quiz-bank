true_statement: Since Spring '22, License Management Org users must log in to the LMO with multi-factor authentication to use the Subscriber Support Console.
false_statement: Since Spring '25, License Management Org users must log in to the LMO with multi-factor authentication to use the Subscriber Support Console.
explanation: The MFA requirement for console users in the LMO dates from Spring '22. Spring '25 is the wrong release.
