true_statement: For a Partial Copy sandbox, the copy engine takes a random sample of up to 10,000 records for each object selected in the template.
false_statement: For a Partial Copy sandbox, the copy engine takes a random sample of up to 1,000 records for each object selected in the template.
explanation: Partial Copy sampling allows as many as 10,000 rows per selected object, inside the 5 GB storage cap. One thousand is a tenth of the real figure.
