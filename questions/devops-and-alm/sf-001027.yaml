true_statement: In Trailhead's org development model, a release is combined in a shared Developer Pro sandbox and user-acceptance tested in a Partial Copy sandbox.
false_statement: In Trailhead's org development model, a release is combined in a Partial Copy sandbox and user-acceptance tested in a shared Developer Pro sandbox.
explanation: Individual work in Developer sandboxes is merged in a shared Developer Pro sandbox to build the release, then UAT runs in a Partial Copy sandbox. The false statement swaps the two stages.
