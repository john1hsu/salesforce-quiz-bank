id: sf-001662
product_area: devops-and-alm
true_statement: From API version 40.0, deploying a PermissionSet disables any permission the file doesn't specify, so the deploy should include the set's full content.
false_statement: From API version 40.0, deploying a PermissionSet leaves any permission the file doesn't specify unchanged, so partial files are safe to deploy.
explanation: Permission set deploys are treated as the complete definition, so omitted permissions are switched off. Profiles behave differently, which is why partial permission set files are risky.
