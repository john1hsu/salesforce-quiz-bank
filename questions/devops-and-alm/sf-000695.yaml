id: sf-000695
product_area: devops-and-alm
true_statement: A sandbox template copies big object definitions but never their records, even when the big object is selected.
false_statement: A sandbox template copies big object definitions, and copies their records too whenever the big object is selected.
explanation: Big object records are never carried into a sandbox, whatever the template contains; only the definition comes across. Selecting the object doesn't change that.
