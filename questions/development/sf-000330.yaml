id: sf-000330
product_area: development
true_statement: Within one Apex transaction, a callout may run before DML, but it cannot run after uncommitted DML is pending.
false_statement: Within one Apex transaction, a callout may run after DML, but it cannot run before any DML has been performed.
explanation: Pending work such as uncommitted DML blocks a later callout, so the usual design is callout first and DML afterwards, or moving the callout into asynchronous Apex.
