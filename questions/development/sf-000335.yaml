id: sf-000335
product_area: development
true_statement: A Transaction Finalizer can re-enqueue a failed Queueable job up to five consecutive times.
false_statement: A Transaction Finalizer can re-enqueue a failed Queueable job up to ten consecutive times.
explanation: Finalizers run after the job ends, including after an unhandled exception, and may re-enqueue the job after failures, but only five consecutive times, not ten.
