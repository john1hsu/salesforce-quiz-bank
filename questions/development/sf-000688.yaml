id: sf-000688
product_area: development
true_statement: A single Apex continuation can run at most 3 callouts in parallel, and up to 3 callouts can be chained one after another.
false_statement: A single Apex continuation can run at most 10 callouts in parallel, and up to 10 callouts can be chained one after another.
explanation: Continuations are capped at three parallel requests and three chained requests. Ten is far above the documented continuation limit.
