id: sf-000178
product_area: development
true_statement: In a SOQL query, the OFFSET clause can skip at most 2,000 rows.
false_statement: In a SOQL query, the OFFSET clause can skip at most 50,000 rows.
explanation: OFFSET is capped at 2,000 rows, so it isn't suited to paging through large result sets. The 50,000 figure is the per-transaction cap on records retrieved by SOQL in Apex.
