id: sf-001521
product_area: development
true_statement: When an Apex @TestSetup method calls a non-test method in another class, no code coverage is calculated for that called method.
false_statement: When an Apex @TestSetup method calls a non-test method in another class, that called method earns code coverage just as it would from a test method.
explanation: Code invoked from a setup method doesn't count toward coverage, so the code under test should be exercised from the test methods themselves. The false statement assumes setup calls produce coverage.
