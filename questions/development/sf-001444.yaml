id: sf-001444
product_area: development
true_statement: A test method marked SeeAllData=false inside a class marked SeeAllData=true is ignored, so the method keeps access to org data.
false_statement: A test method marked SeeAllData=false inside a class marked SeeAllData=true overrides the class, so the method is isolated from org data.
explanation: 'Precedence only works one way: a method set to true can open data in a class set to false, but a method set to false cannot close access that the class grants. Its false setting is simply ignored.'
