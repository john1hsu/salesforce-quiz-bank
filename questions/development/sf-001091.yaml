id: sf-001091
product_area: development
true_statement: Plain Database.query can bind a simple local variable such as :accountName, but not a field reference like :myRecord.Field__c.
false_statement: Plain Database.query can bind a field reference like :myRecord.Field__c, but not a simple local variable such as :accountName.
explanation: Database.query resolves simple in-scope variables, but a field on an object fails with Variable does not exist, so the value must be copied into a local variable first.
