id: sf-000022
product_area: development
true_statement: A synchronous transaction can enqueue up to 50 Queueable jobs, but an asynchronous transaction such as a batch can enqueue only one.
false_statement: A synchronous transaction can enqueue only one Queueable job, but an asynchronous transaction such as a batch can enqueue up to 50.
explanation: The 50-job allowance applies to an ordinary synchronous transaction, while async contexts like batch are held to a single enqueued job. The false statement reverses which context gets which limit.
