true_statement: Custom metadata type records deploy with packages and change sets, whereas custom settings deploy only their definitions.
false_statement: Custom settings records deploy with packages and change sets, whereas custom metadata types deploy only their definitions.
explanation: Because custom metadata records are themselves metadata, they travel with the app. Custom settings and custom objects move only their structure, and their records must be loaded separately.
