id: sf-001520
product_area: development
true_statement: Apex test setup methods are available only in test classes saved at API version 24.0 or later.
false_statement: Apex test setup methods are available only in test classes saved at API version 40.0 or later.
explanation: Test setup depends on test data isolation, which arrived in API version 24.0, so classes at 24.0 or later can use it. 40.0 is not the cutoff.
