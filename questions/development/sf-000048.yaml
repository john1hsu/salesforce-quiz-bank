id: sf-000048
product_area: development
true_statement: Since API version 24.0, Apex test methods see only the data they create, apart from setup objects such as User and Profile, unless SeeAllData=true is set.
false_statement: Since API version 24.0, Apex test methods see all existing org records by default, unless the class is annotated with SeeAllData=false.
explanation: Tests are isolated from org data by default; only a few setup-style objects stay visible, and SeeAllData=true is the opt-in to see the rest. The false statement reverses the default.
