id: sf-001304
product_area: development
true_statement: From Apex API version 41.0, a statement that can never be reached, such as code after an unconditional throw, is a compile-time error.
false_statement: From Apex API version 41.0, a statement that can never be reached, such as code after an unconditional throw, compiles but is skipped at run time.
explanation: Newer API versions refuse to compile unreachable statements. Dead code after a throw has to be removed rather than left to be silently skipped.
