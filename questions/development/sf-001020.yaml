id: sf-001020
product_area: development
true_statement: Apex triggers can't declare a sharing keyword and run without sharing, so logic is best moved into handler classes that declare one.
false_statement: Apex triggers can't declare a sharing keyword and run with sharing, so logic is best moved into handler classes that declare one.
explanation: Triggers have no sharing declaration and execute without sharing. Putting the logic in a handler class with an explicit keyword lets the developer control record access.
