id: sf-000179
product_area: development
true_statement: Apex allows 100 SOQL queries per synchronous transaction and 200 per asynchronous transaction.
false_statement: Apex allows 200 SOQL queries per synchronous transaction and 100 per asynchronous transaction.
explanation: Asynchronous Apex gets the larger allowance of 200 queries, synchronous code gets 100. Queries inside loops are the usual way to exceed it.
