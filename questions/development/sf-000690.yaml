id: sf-000690
product_area: development
true_statement: A Lightning web component imports a continuation-enabled Apex method from the @salesforce/apexContinuation module rather than @salesforce/apex.
false_statement: A Lightning web component imports a continuation-enabled Apex method from the @salesforce/apex module rather than @salesforce/apexContinuation.
explanation: Continuation methods have their own import module, @salesforce/apexContinuation; the regular @salesforce/apex module is for ordinary Apex calls. The false version swaps the two.
