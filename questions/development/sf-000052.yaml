id: sf-000052
product_area: development
true_statement: Field changes made to Trigger.new in a before trigger are saved without a separate DML statement.
false_statement: Field changes made to Trigger.new in an after trigger are saved without a separate DML statement.
explanation: Before triggers run before the save, so values set on Trigger.new persist automatically. In after triggers the triggering records are read-only, so that is the wrong context for such edits.
