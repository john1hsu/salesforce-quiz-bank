product_area: development
true_statement: NavigationMixin.Navigate takes an optional replace argument that defaults to false; true replaces the current browser history entry.
false_statement: NavigationMixin.Navigate takes an optional replace argument that defaults to true, so the current browser history entry is replaced unless set to false.
explanation: By default navigation adds a new history entry so Back works as expected. Passing true swaps out the current entry instead.
