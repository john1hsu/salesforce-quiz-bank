id: sf-000470
product_area: development
true_statement: Static variables are not reset between trigger invocations within one Bulk API request, even though governor limits are reset.
false_statement: Static variables are reset between trigger invocations within one Bulk API request, just as governor limits are reset.
explanation: Within a single Bulk API request, statics persist across trigger chunks while limits reset. Recursion guards built on static flags can therefore misbehave, which is why field-change checks are recommended.
