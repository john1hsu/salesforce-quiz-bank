id: sf-000960
product_area: development
true_statement: Lightning Web Security changes native JavaScript API behaviour through distortions, rather than by substituting secure wrapper objects as Lightning Locker does.
false_statement: Lightning Web Security changes native JavaScript API behaviour through secure wrapper objects, rather than through distortions as Lightning Locker does.
explanation: LWS sandboxes each namespace and applies targeted distortions such as content filtering and sanitization. Wrapping globals like SecureWindow is Locker's technique; the false statement swaps them.
