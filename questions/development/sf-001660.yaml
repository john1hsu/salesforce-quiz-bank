id: sf-001660
product_area: development
true_statement: LWC Jest watch mode uses Git to find changed files, so it fails if the project is not a Git repository.
false_statement: LWC Jest watch mode uses the Salesforce CLI's source tracking to find changed files, so it fails if no default org is set.
explanation: Watch mode relies on Git to detect changes and needs no org at all. The false version ties it to CLI source tracking and an org connection.
