id: sf-001374
product_area: development
true_statement: From API version 66.0, an Apex class used as an invocable action parameter needs a visible no-argument constructor.
false_statement: From API version 66.0, an Apex class used as an invocable action parameter needs a constructor that takes every field as an argument.
explanation: The InvocableVariable reference says classes used as invocable parameters need a public (or global, outside a managed package) no-argument constructor from API 66.0. A constructor taking all fields isn't the requirement.
