id: sf-000745
product_area: development
true_statement: When a System.LimitException is thrown, neither the catch block nor any finally block runs.
false_statement: When a System.LimitException is thrown, the catch block is skipped, but any finally block still runs.
explanation: LimitException is uncatchable and ends the transaction outright, so finally blocks don't get a chance either. That's why prevention, not handling, is the only defence.
