id: sf-001093
product_area: development
true_statement: A query passed to Database.getQueryLocator cannot use FOR UPDATE.
false_statement: A query passed to Database.getQueryLocator cannot use ORDER BY.
explanation: Record locking with FOR UPDATE is not allowed in a QueryLocator query. Sorting with ORDER BY is not the documented restriction.
