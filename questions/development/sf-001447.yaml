id: sf-001447
product_area: development
true_statement: Each Test.loadData call loads records of one sObject type from one static resource, so a multi-object fixture needs one call per object.
false_statement: A single Test.loadData call can load records of several sObject types from one static resource, so a multi-object fixture needs only one call.
explanation: Test.loadData takes a single sObject type and a resource name, so fixtures spanning objects need a separate CSV and call for each type. It cannot fill several object types at once.
