id: sf-000021
product_area: development
true_statement: Batch Apex hands records to the execute method in chunks of 200 by default, and up to 2,000 when start returns a QueryLocator.
false_statement: Batch Apex hands records to the execute method in chunks of 2,000 by default, and up to 10,000 when start returns a QueryLocator.
explanation: The default batch chunk is 200 records; a QueryLocator lets you raise it to at most 2,000. The false version inflates both numbers, and each chunk still runs as its own transaction with fresh limits.
