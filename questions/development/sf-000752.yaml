id: sf-000752
product_area: development
true_statement: Apex doesn't allow a single schedule's cron expression to fire the job more often than once an hour.
false_statement: Apex doesn't allow a single schedule's cron expression to fire the job more often than once every five minutes.
explanation: The finest granularity for one Apex schedule is hourly; more frequent runs need several schedules or another approach. A five-minute floor isn't the documented rule.
