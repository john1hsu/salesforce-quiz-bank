id: sf-000825
product_area: development
true_statement: By default an LMS subscriber hears messages only from the active area; subscribing with APPLICATION_SCOPE extends it to the whole app.
false_statement: By default an LMS subscriber hears messages from anywhere in the app; subscribing with APPLICATION_SCOPE limits it to the active area.
explanation: The default scope is the active tab, subtab or utility item. APPLICATION_SCOPE widens delivery so background console tabs also receive messages.
