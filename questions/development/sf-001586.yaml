id: sf-001586
product_area: development
true_statement: Component styling hooks prefixed --slds-c- are supported only in SLDS 1, so components that rely on them should stay on SLDS 1 for now.
false_statement: Component styling hooks prefixed --slds-c- are supported only in SLDS 2, so components that rely on them should move to SLDS 2 now.
explanation: As of Summer '25, SLDS 2 doesn't yet support component-level hooks; it relies on global and semantic hooks. Teams with heavy --slds-c- customizations are advised to remain on SLDS 1.
