id: sf-001305
product_area: development
true_statement: An unhandled custom exception thrown to a Lightning web component exposes its class name and a stack trace, while AuraHandledException returns only its message.
false_statement: An unhandled custom exception thrown to a Lightning web component returns only its message, while AuraHandledException exposes its class name and a stack trace.
explanation: Unhandled user-defined exceptions send the exception type, an isUserDefinedException flag and line-level stack details to the client. AuraHandledException is the way to send only a controlled message.
