id: sf-001164
product_area: development
true_statement: Synchronous governor limits apply inside a Transaction Finalizer, except heap size, enqueueJob jobs and @future calls, which follow asynchronous limits.
false_statement: Asynchronous governor limits apply inside a Transaction Finalizer, except heap size, enqueueJob jobs and @future calls, which follow synchronous limits.
explanation: A finalizer runs under the synchronous limit set, with three exceptions (total heap, System.enqueueJob jobs and @future calls per invocation) that use the asynchronous allocations. The false version reverses which set is the default.
