id: sf-000756
product_area: development
true_statement: WITH SECURITY_ENFORCED checks only the SELECT and FROM clauses, not WHERE, so it isn't a defense against SOQL injection.
false_statement: WITH SECURITY_ENFORCED checks the SELECT, FROM and WHERE clauses, so it works as a defense against SOQL injection.
explanation: Injected conditions live in the WHERE clause, which WITH SECURITY_ENFORCED doesn't cover. Binds, typecasting and allowlists remain the real defenses.
