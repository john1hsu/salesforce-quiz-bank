id: sf-000334
product_area: development
true_statement: A Queueable duplicate signature blocks a new enqueue only while a matching job is still waiting, so a copy can be enqueued once the first starts running.
false_statement: A Queueable duplicate signature blocks a new enqueue until the matching job finishes, so no copy can be enqueued while the first is running.
explanation: The signature is dropped when the job is dequeued, so the feature guarantees at least one run per signature rather than mutual exclusion. A second copy can be queued while the first executes.
