id: sf-000615
product_area: development
true_statement: For hierarchy custom settings, getInstance merges fields across the hierarchy, while getValues returns only what is stored at that exact level.
false_statement: For hierarchy custom settings, getValues merges fields across the hierarchy, while getInstance returns only what is stored at that exact level.
explanation: getInstance takes each field from the lowest level where it is defined, giving the effective values. getValues leaves fields not defined at that level null; the false statement swaps the methods.
