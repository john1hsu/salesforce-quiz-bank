id: sf-000751
product_area: development
true_statement: No more than 100 scheduled Apex jobs can exist in an org at the same time.
false_statement: No more than 500 scheduled Apex jobs can exist in an org at the same time.
explanation: The scheduler caps an org at 100 scheduled jobs, which is why scheduling from a bulk trigger is risky. Five hundred overstates the cap.
