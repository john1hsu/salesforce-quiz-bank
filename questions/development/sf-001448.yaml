id: sf-001448
product_area: development
true_statement: Test.loadData inserts the CSV rows itself and returns the inserted records, so the test should not insert the returned list again.
false_statement: Test.loadData returns the CSV rows as unsaved sObjects, so the test must insert the returned list before querying the records.
explanation: The method performs the insert and hands back the saved records. Older examples that insert the list a second time reflect a misunderstanding, not a required step.
