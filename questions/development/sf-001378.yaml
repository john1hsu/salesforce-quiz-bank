id: sf-001378
product_area: development
true_statement: A CLASS_TRACING trace flag on an Apex class overrides log levels for that code but never creates a debug log on its own.
false_statement: A CLASS_TRACING trace flag on an Apex class creates a debug log every time that class runs, for any user.
explanation: Class and trigger trace flags only adjust the levels used for that code inside a log that some other flag, such as USER_DEBUG, is already producing. By themselves they generate no log.
