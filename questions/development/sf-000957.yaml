id: sf-000957
product_area: development
true_statement: Aura components at API version 40.0 or later run under Lightning Locker, while a component pinned to 39.0 or earlier runs without it.
false_statement: Aura components at API version 45.0 or later run under Lightning Locker, while a component pinned to 44.0 or earlier runs without it.
explanation: Locker enforcement for Aura is set per component by its API version, starting at 40.0 (Summer '17). This only matters while Locker, not Lightning Web Security, is active.
