id: sf-000746
product_area: development
true_statement: Apex unhandled-exception emails are deduplicated and throttled to 10 per hour per application server.
false_statement: Apex unhandled-exception emails are deduplicated and throttled to 100 per hour per application server.
explanation: The throttle is ten emails an hour per app server, which makes email unreliable for tracking failures. Salesforce points to Event Monitoring's Apex Unexpected Exception logs instead.
