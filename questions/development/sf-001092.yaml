id: sf-001092
product_area: development
true_statement: Database.queryWithBinds matches bind map keys case-insensitively, so two keys that differ only in case throw a QueryException.
false_statement: Database.queryWithBinds matches bind map keys case-sensitively, so two keys that differ only in case are bound as separate variables.
explanation: Key lookup in the bind map ignores case, which makes keys like Name and name collide and raise a QueryException rather than act as two binds.
