id: sf-001800
product_area: development
true_statement: When openTab receives more than one target, pageReference takes priority over recordId, which takes priority over url.
false_statement: When openTab receives more than one target, url takes priority over recordId, which takes priority over pageReference.
explanation: openTab uses pageReference first, then recordId, then url, ignoring the lower-priority values. The false statement reverses that order.
