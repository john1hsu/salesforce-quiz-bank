id: sf-001449
product_area: development
true_statement: To link files loaded with Test.loadData, the parent CSV gets an Id column and the child CSV's lookup column, such as AccountId, holds those Id values.
false_statement: To link files loaded with Test.loadData, the child CSV's lookup column, such as AccountId, holds the parent rows' Name values instead of an Id column.
explanation: The pattern is to give parent rows placeholder Id values and reference those same values in the child file's lookup column, loading the parent first. Matching on names is not how the relationship is resolved.
