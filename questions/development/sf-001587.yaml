true_statement: Design tokens are supported in SLDS 1 themes but not in SLDS 2 themes, where global styling hooks replace them.
false_statement: Design tokens are supported in SLDS 2 themes but not in SLDS 1 themes, where global styling hooks replace them.
explanation: SLDS 2 drops design tokens in favor of styling hooks, and SLDS Linter or SLDS Validator finds tokens and swaps in global hooks before an org moves to Cosmos.
