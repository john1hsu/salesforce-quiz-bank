id: sf-000403
product_area: development
true_statement: After imperative Apex changes records, calling notifyRecordUpdateAvailable(recordIds) makes Lightning Data Service refetch them.
false_statement: After imperative Apex changes records, calling refreshApex() makes Lightning Data Service refetch them.
explanation: LDS doesn't manage Apex results, so it must be told which records changed. refreshApex() refreshes wired Apex, and using it for non-Apex adapters is deprecated.
