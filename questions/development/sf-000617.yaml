id: sf-000617
product_area: development
true_statement: Reading a custom setting with its Apex methods uses the application cache, while querying it with SOQL bypasses the cache.
false_statement: Querying a custom setting with SOQL uses the application cache, while reading it with its Apex methods bypasses the cache.
explanation: The caching benefit comes from the custom settings methods such as getInstance. A SOQL query on a setting skips the cache and counts like any other query.
