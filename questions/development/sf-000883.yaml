id: sf-000883
product_area: development
true_statement: A Visualforce standard controller enforces the user's object access and runs in user mode, while a custom controller runs in system mode.
false_statement: A Visualforce custom controller enforces the user's object access and runs in user mode, while a standard controller runs in system mode.
explanation: Standard controllers reuse the standard page logic and respect the user's permissions. Custom controllers are Apex classes that run in system mode, so the developer must enforce access; the false statement swaps the two.
