id: sf-000755
product_area: development
true_statement: String.escapeSingleQuotes() doesn't protect a numeric value that is concatenated into a SOQL string without quotes around it.
false_statement: String.escapeSingleQuotes() protects every value concatenated into a SOQL string, including numeric values without quotes around them.
explanation: Escaping only helps when the input sits inside a quoted string literal. An unquoted number can still carry extra clauses, so typecasting or bind variables are needed.
