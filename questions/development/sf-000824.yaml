id: sf-000824
product_area: development
true_statement: A Lightning message channel's isExposed field defaults to false and, once set to true on a packaged or referenced channel, can't be set back.
false_statement: A Lightning message channel's isExposed field defaults to true and can be switched back to false at any time.
explanation: isExposed starts as false; turning it on is irreversible once the channel is packaged or referenced. That matters because security review expects channels to stay unexposed.
