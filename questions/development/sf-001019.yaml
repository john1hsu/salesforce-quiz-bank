id: sf-001019
product_area: development
true_statement: An Apex subclass declared with no sharing keyword runs in its parent class's sharing mode.
false_statement: An Apex subclass declared with no sharing keyword runs in the sharing mode of whichever class calls it.
explanation: A subclass without its own keyword picks up its parent's declared mode. Taking the caller's mode at runtime is what inherited sharing does, and inner classes get nothing from their outer class.
