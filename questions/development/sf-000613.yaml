id: sf-000613
product_area: development
true_statement: In Apex Enterprise Patterns, a service runs with sharing by default and elevates access only inside a private without sharing inner class.
false_statement: In Apex Enterprise Patterns, a service runs without sharing by default and enforces access only inside a private with sharing inner class.
explanation: Service classes default to enforcing sharing and confine any elevated access to a private without sharing inner class. The false statement inverts that default.
