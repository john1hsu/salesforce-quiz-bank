product_area: development
true_statement: The Platform Developer II exam guide targets developers with two to four years of experience, including at least one year on the Lightning Platform.
false_statement: The Platform Developer II exam guide targets developers with five to seven years of experience, including at least three years on the Lightning Platform.
explanation: Salesforce aims PDII at developers with about two to four years of overall development experience, at least one of them designing and deploying on the Lightning Platform. Five to seven years with three on the platform overstates the target candidate.
