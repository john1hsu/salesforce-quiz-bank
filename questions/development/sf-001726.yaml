id: sf-001726
product_area: development
true_statement: In Apex, String map keys are case-sensitive, so keys that differ only in case are stored as separate entries.
false_statement: In Apex, String map keys are case-insensitive, so keys that differ only in case overwrite the same entry.
explanation: Even though Apex code itself ignores case, map lookups on String keys compare exact case. 'Acme' and 'ACME' are two different keys for put, get, containsKey and remove.
