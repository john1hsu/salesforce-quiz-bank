id: sf-000961
product_area: development
true_statement: With Lightning Web Security on, a component can import components and modules from other namespaces, which fails with a cross-namespace error when it's off.
false_statement: With Lightning Web Security on, a component is blocked from importing components and modules from other namespaces, which works only when it's off.
explanation: Because LWS isolates namespaces in sandboxes instead of walling them off, cross-namespace imports become possible; without it, those imports throw a cross-namespace error.
