id: sf-001377
product_area: development
true_statement: A Salesforce debug log is capped at 20 MB, and when it reaches that size about 200 KB, usually the oldest lines, is dropped.
false_statement: A Salesforce debug log is capped at 5 MB, and when it reaches that size about 200 KB, usually the oldest lines, is dropped.
explanation: Each debug log can grow to 20 MB before Salesforce trims roughly 200 KB, typically from the start, so early events can disappear. Five megabytes is not the documented cap.
