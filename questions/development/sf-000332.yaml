id: sf-000332
product_area: development
true_statement: Apex can create, read and update custom metadata records, but it cannot delete them.
false_statement: Apex can create, read and delete custom metadata records, but it cannot update them.
explanation: Apex modifies custom metadata through the Metadata namespace, which supports create and update but not delete. That missing delete is one reason custom settings still suit full CRUD needs.
