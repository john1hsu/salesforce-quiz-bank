id: sf-000260
product_area: development
true_statement: Lightning Web Security is the default for orgs created in Winter '23 or later; older orgs default to Lightning Locker unless LWS is enabled.
false_statement: Lightning Web Security is the default for orgs created in Winter '20 or later; older orgs default to Lightning Locker unless LWS is enabled.
explanation: LWS became the default for orgs created from Winter '23 and has been GA for LWC and Aura in all orgs since Summer '23. Winter '20 predates that change, so the false statement gets the release wrong.
