id: sf-000747
product_area: development
true_statement: Across all namespaces in one transaction, a governor limit is capped at 11 times its per-namespace value, such as 1,100 SOQL queries.
false_statement: Across all namespaces in one transaction, a governor limit is capped at 3 times its per-namespace value, such as 300 SOQL queries.
explanation: Certified packages get their own allocations, but the cross-namespace total stops at eleven times the single-namespace limit. Three times is far too low.
