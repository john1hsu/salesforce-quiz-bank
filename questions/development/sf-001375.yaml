id: sf-001375
product_area: development
true_statement: A property in an Apex-defined type is visible to Flow and to flow screen components only if it is annotated with @AuraEnabled.
false_statement: A property in an Apex-defined type is visible to Flow and to flow screen components only if it is annotated with @InvocableVariable.
explanation: Apex-defined types expose their fields to Flow through @AuraEnabled; an unannotated property is invisible. @InvocableVariable marks the inputs and outputs of an invocable action, not the members of an Apex-defined type.
