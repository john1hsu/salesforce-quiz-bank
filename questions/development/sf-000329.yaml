id: sf-000329
product_area: development
true_statement: An Apex callout times out after 10 seconds by default unless the code sets a custom timeout.
false_statement: An Apex callout times out after 60 seconds by default unless the code sets a custom timeout.
explanation: The default callout timeout is 10 seconds. Code can raise it as high as 120,000 milliseconds, but 60 seconds is not the default.
