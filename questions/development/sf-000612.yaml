id: sf-000612
product_area: development
true_statement: In Apex Enterprise Patterns, triggers are not listed as service layer callers because trigger logic belongs in the Domain layer.
false_statement: In Apex Enterprise Patterns, triggers are not listed as service layer callers because trigger logic belongs in the Selector layer.
explanation: Object-specific behaviour such as validation and defaulting on insert or update lives in Domain classes, which is where trigger logic goes. Selectors only centralise SOQL queries.
