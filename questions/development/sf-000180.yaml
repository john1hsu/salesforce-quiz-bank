id: sf-000180
product_area: development
true_statement: Per the Winter '27 Apex guide, Apex at API version 67.0 or later runs in user context by default, enforcing the user's sharing and permissions.
false_statement: Per the Winter '27 Apex guide, Apex at API version 67.0 or later runs in system mode by default, ignoring the user's sharing and permissions.
explanation: From API 67.0, Apex defaults to user context, applying sharing, field-level security and object permissions. Versions 66.0 and earlier default to system mode.
