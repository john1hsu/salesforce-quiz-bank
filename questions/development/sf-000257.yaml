id: sf-000257
product_area: development
true_statement: An org can have 5 batch jobs queued or active at once, and up to 100 more can wait in Holding status in the Apex flex queue.
false_statement: An org can have 25 batch jobs queued or active at once, and up to 1,000 more can wait in Holding status in the Apex flex queue.
explanation: Batch Apex allows five queued or active jobs per org plus 100 held in the flex queue; once that queue is full, executeBatch throws a LimitException. The 25 and 1,000 figures are invented.
