id: sf-000886
product_area: development
true_statement: To be wired to a Lightning web component, an Apex method must be static and annotated @AuraEnabled(cacheable=true).
false_statement: To be wired to a Lightning web component, an Apex method must be an instance method annotated @AuraEnabled(cacheable=false).
explanation: Wired Apex has to be static, public or global, and marked cacheable=true, which also means it may only read data. Non-cacheable or mutating methods must be called imperatively.
