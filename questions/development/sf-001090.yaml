id: sf-001090
product_area: development
true_statement: Test.getFlexQueueOrder() returns only test-context held jobs, even when the test class uses SeeAllData=true.
false_statement: Test.getFlexQueueOrder() returns the org's real held jobs whenever the test class uses SeeAllData=true.
explanation: Tests use a separate test-context flex queue, and getFlexQueueOrder reads only that queue regardless of SeeAllData. Real org jobs are never visible to it.
