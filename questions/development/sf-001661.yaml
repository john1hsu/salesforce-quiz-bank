id: sf-001661
product_area: development
true_statement: In an LWC Jest test, after changing a property on an attached component, the test must wait on a resolved promise before checking the DOM.
false_statement: In an LWC Jest test, after changing a property on an attached component, the DOM updates synchronously and can be checked on the next line.
explanation: Rendering in LWC is asynchronous, so the test has to await a resolved promise for the re-render to finish. Asserting immediately would see the old DOM.
