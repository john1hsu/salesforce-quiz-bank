id: sf-001731
product_area: development
true_statement: From API version 63.0, serializing custom exceptions and most built-in exceptions to JSON in Apex is unsupported.
false_statement: From API version 63.0, Apex supports serializing custom exceptions and built-in exceptions to JSON with JSON.serialize.
explanation: API 63.0 removed support for serializing most exceptions, including custom ones. Code that logged exceptions by serializing them needs to copy the message and details into its own class instead.
