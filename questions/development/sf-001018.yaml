id: sf-001018
product_area: development
true_statement: A method defined in a with sharing class still enforces sharing when a without sharing class calls it, because the mode comes from where it is defined.
false_statement: A method defined in a with sharing class drops sharing when a without sharing class calls it, because the mode comes from the calling class.
explanation: Apex takes the sharing mode from the class that defines the method, not from its caller. Only inherited sharing classes adopt the caller's mode.
