id: sf-000401
product_area: development
true_statement: Lightning Data Service calls don't count against the org's API request usage, though general limits such as records returned still apply.
false_statement: Lightning Data Service calls count against the org's API request usage in the same way as external REST API calls.
explanation: LDS runs on User Interface API but its calls aren't counted as API usage, so it doesn't draw down API request limits. Other platform limits still apply.
