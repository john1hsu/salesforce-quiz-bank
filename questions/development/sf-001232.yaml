id: sf-001232
product_area: development
true_statement: Group records can be inserted or updated in the same transaction as non-setup records without causing a mixed DML error.
false_statement: GroupMember records can be inserted or updated in the same transaction as non-setup records without causing a mixed DML error.
explanation: Group gets a specific exception for insert and update alongside other sObjects. GroupMember stays on the list of setup objects that can't be mixed in current API versions.
