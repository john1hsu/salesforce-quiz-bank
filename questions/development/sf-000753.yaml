id: sf-000753
product_area: development
true_statement: Refreshing a sandbox doesn't copy its source org's scheduled Apex jobs, so they have to be scheduled again in the sandbox.
false_statement: Refreshing a sandbox copies its source org's scheduled Apex jobs in a paused state, so they have to be resumed in the sandbox.
explanation: Scheduled jobs simply don't come across in a refresh, so they must be recreated. The false version invents a paused copy that only needs resuming.
