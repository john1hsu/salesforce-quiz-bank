id: sf-001591
product_area: development
true_statement: In static SOQL, bind variables can supply WHERE values, IN lists, LIMIT and OFFSET, but not the units argument of the DISTANCE function.
false_statement: In static SOQL, bind variables can supply WHERE values, IN lists and the units argument of the DISTANCE function, but not LIMIT or OFFSET.
explanation: Apex binds are accepted in filters, IN and NOT IN lists, LIMIT, OFFSET and WITH DIVISION. DISTANCE units are the documented exception.
