id: sf-001868
product_area: development
true_statement: Since Mobile SDK 11.0, the default login for Mobile SDK apps is the OAuth web server flow rather than the user-agent flow.
false_statement: Since Mobile SDK 11.0, the default login for Mobile SDK apps is the OAuth user-agent flow rather than the web server flow.
explanation: Version 11.0 switched the default to the web server flow, in the same release that added biometric login. The false statement reverses the change.
