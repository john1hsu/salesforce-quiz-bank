id: sf-001519
product_area: development
true_statement: A static variable set inside an Apex @TestSetup method is reset before each test method runs, because the static context is reinitialized per transaction.
false_statement: A static variable set inside an Apex @TestSetup method keeps its value in every test method, because setup and tests share one static context.
explanation: Setup and each test method run as separate transactions with the static context rebuilt each time, so shared state must live in records. The false statement assumes static values carry over.
