id: sf-000049
product_area: development
true_statement: Asynchronous jobs enqueued after Test.startTest() are executed synchronously when Test.stopTest() is called, so a test can assert on their results.
false_statement: Asynchronous jobs enqueued after Test.startTest() run in the background after the test method ends, so a test can only check that they were queued.
explanation: Test.stopTest() collects the future, Queueable and batch work enqueued since startTest and runs it synchronously, which is how tests verify async Apex. They do not run later in the background.
