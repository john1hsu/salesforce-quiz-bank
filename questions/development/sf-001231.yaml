id: sf-001231
product_area: development
true_statement: In Apex saved at API 15.0 or later, a User can be inserted alongside non-setup records without a mixed DML error if its UserRoleId is null.
false_statement: In Apex saved at API 15.0 or later, a User can be inserted alongside non-setup records without a mixed DML error if its ManagerId is null.
explanation: The role is what affects record access, so the exception for inserting a User depends on UserRoleId being null. ManagerId isn't the field that decides whether the insert can be mixed.
