id: sf-000262
product_area: development
true_statement: An Apex method that queries Task or Event must be called imperatively from a Lightning web component, because UI API doesn't support those objects.
false_statement: An Apex method that queries Task or Event must be wired with @wire in a Lightning web component, because UI API doesn't support those objects.
explanation: Only non-mutating @AuraEnabled(cacheable=true) methods can be wired; methods touching objects UI API lacks, such as Task and Event, must be called imperatively and return a promise.
