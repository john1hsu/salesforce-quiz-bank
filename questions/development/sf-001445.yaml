id: sf-001445
product_area: development
true_statement: Since API 28.0, a validation rule's VLOOKUP looks up org data during an Apex test only when the test uses SeeAllData=true.
false_statement: Since API 28.0, a validation rule's VLOOKUP looks up org data during an Apex test whether or not the test uses SeeAllData=true.
explanation: From API 28.0 onward VLOOKUP honours test data isolation, so it reaches org records only when the test opts in with SeeAllData=true. It does not bypass isolation.
