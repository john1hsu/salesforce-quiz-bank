true_statement: An Aura server action marked abortable is dropped from the queue if its component has been unrendered before it is sent.
false_statement: An Aura server action marked storable is dropped from the queue if its component has been unrendered before it is sent.
explanation: 'Abortable actions are discarded when their component is gone. Storable actions are about caching: cached data renders first while fresh data is fetched.'
