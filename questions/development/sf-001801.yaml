true_statement: In the Lightning Console JavaScript API, the navigation item API works only in Aura, while the utility bar and workspace APIs also support LWC.
false_statement: In the Lightning Console JavaScript API, the utility bar API works only in Aura, while the navigation item and workspace APIs also support LWC.
explanation: Of the three console libraries, only the navigation item API is Aura-only; the utility bar and workspace APIs can be used from Lightning web components. The false statement swaps the Aura-only library.
