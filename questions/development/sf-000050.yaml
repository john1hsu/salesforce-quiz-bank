id: sf-000050
product_area: development
true_statement: Changes a test method makes to records created in @TestSetup are rolled back when that method ends, so each method sees the original data.
false_statement: Changes a test method makes to records created in @TestSetup carry over to later test methods, so each method sees the previous method's edits.
explanation: Each test method runs in its own transaction and its changes to the shared setup records are rolled back afterwards. Later methods therefore start from the data exactly as @TestSetup created it.
