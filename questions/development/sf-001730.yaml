id: sf-001730
product_area: development
true_statement: When an Apex variable is typed as a parent class, JSON.serialize outputs only the parent's fields, losing any subtype data.
false_statement: When an Apex variable is typed as a parent class, JSON.serialize outputs the runtime subtype's fields, including any it adds.
explanation: Serialization follows the declared type, so fields defined only on a subclass are dropped. Code that needs them should declare the variable as the subtype.
