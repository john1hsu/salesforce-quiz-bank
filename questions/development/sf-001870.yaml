id: sf-001870
product_area: development
true_statement: A Mobile SDK app's boot configuration holds its external client app's callback URL and consumer key, and the app never uses a consumer secret.
false_statement: A Mobile SDK app's boot configuration holds its external client app's callback URL, consumer key and consumer secret.
explanation: Mobile apps can't keep a secret safe, so Mobile SDK apps are configured with only the callback URL and consumer key. No consumer secret goes into the app.
