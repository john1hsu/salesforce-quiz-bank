id: sf-000333
product_area: development
true_statement: Custom metadata usage is counted by each field's maximum size, so a nearly empty text area still uses 255 characters per record.
false_statement: Custom metadata usage is counted by the characters actually stored, so a nearly empty text area uses only the characters it holds.
explanation: The 10-million-character allotment is consumed by field size, not content. Picklists and checkboxes count as 10 characters regardless of value.
