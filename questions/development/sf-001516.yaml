id: sf-001516
product_area: development
true_statement: A single Salesforce static resource can be up to 5 MB, and an org can hold up to 250 MB of static resources in total.
false_statement: A single Salesforce static resource can be up to 25 MB, and an org can hold up to 1 GB of static resources in total.
explanation: Static resources are capped at 5 MB each and 250 MB per org. The larger figures in the false statement overstate both limits.
