id: sf-001446
product_area: development
true_statement: In an isolated Apex test, querying Owner.IsActive on Account returns null because references through the Owner relationship aren't supported.
false_statement: In an isolated Apex test, querying Owner.IsActive on Account returns the owner's value because User data stays visible through the Owner relationship.
explanation: Data silo tests do not support cross-object references via Owner, so such a field comes back null. Although User records are visible to isolated tests, that does not extend to Owner traversal.
