id: sf-001590
product_area: development
true_statement: Because aggregate SOQL queries don't support queryMore, one returning more than 2,000 rows in a SOQL for loop throws a run-time exception.
false_statement: Because SOQL for loops page through results with queryMore, an aggregate query returning more than 2,000 rows runs safely in a SOQL for loop.
explanation: SOQL for loops normally fetch rows in chunks via queryMore, but aggregate queries can't use it. Past 2,000 aggregate rows, the loop fails at run time.
