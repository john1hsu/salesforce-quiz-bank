id: sf-000614
product_area: development
true_statement: When one service calls another in Apex Enterprise Patterns, the outer Unit of Work is passed in rather than the inner service creating its own.
false_statement: When one service calls another in Apex Enterprise Patterns, the inner service creates and commits its own Unit of Work rather than receiving the outer one.
explanation: commitWork should run once per scope, so a nested service reuses the caller's Unit of Work. A second Unit of Work would split the DML into separate commits.
