id: sf-000023
product_area: development
true_statement: Future method parameters are limited to primitives and collections of primitives, so records are passed as IDs and queried inside the method.
false_statement: Future method parameters can include sObjects and custom types, so records are passed directly instead of being queried inside the method.
explanation: Future methods only take primitive values, arrays or collections of them; sObjects are blocked because the record may change before the method runs. Passing sObjects and custom types is a Queueable Apex capability, not a future method one.
