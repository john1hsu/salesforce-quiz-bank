id: sf-000126
product_area: development
true_statement: A single Apex request can carry anywhere from 1 to 50,000 records, so code must be bulkified rather than written one record at a time.
false_statement: A single Apex request can carry anywhere from 1 to 200 records, so code must be bulkified rather than written one record at a time.
explanation: Salesforce says a request may contain 1 to 50,000 records, which is why record-by-record code hits governor limits; 200 understates the range.
