id: sf-000336
product_area: development
true_statement: Queueable chains stop at a depth of five in Developer Edition and Trial orgs, while production orgs have no chain-depth cap.
false_statement: Queueable chains stop at a depth of five in production orgs, while Developer Edition and Trial orgs have no chain-depth cap.
explanation: Chain depth is uncapped in production; the five-job limit, counting the parent, applies to Developer Edition and Trial orgs unless stack depth is configured.
