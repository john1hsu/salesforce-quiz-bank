id: sf-000532
product_area: development
true_statement: An Apex transaction can run at most 20 SOSL queries, whether it is synchronous or asynchronous.
false_statement: An Apex transaction can run at most 100 SOSL queries, whether it is synchronous or asynchronous.
explanation: Apex governor limits allow 20 SOSL queries per transaction in both contexts. 100 is the SOQL figure for synchronous code, not the SOSL limit.
