id: sf-000962
product_area: development
true_statement: For large collections under Lightning Web Security, Salesforce recommends plain JavaScript objects over Set and Map, because those globals are host-owned and proxied.
false_statement: For large collections under Lightning Web Security, Salesforce recommends Set and Map over plain JavaScript objects, because those globals are sandbox-owned and not proxied.
explanation: Set, Map and typed arrays come from the host and every access crosses a proxy, which gets noticeably slow at tens of thousands of entries. Plain objects avoid that overhead.
