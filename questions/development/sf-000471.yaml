id: sf-000471
product_area: development
true_statement: A metadata-driven trigger framework stores action execution order in custom metadata, so admins can reorder actions without a deployment.
false_statement: A metadata-driven trigger framework stores action execution order in custom settings data, so admins can reorder actions only through a code deployment.
explanation: The metadata-driven flavour keeps the sequence of small action classes in custom metadata records that a central handler reads. Changing the order needs no code change.
