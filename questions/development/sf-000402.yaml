id: sf-000402
product_area: development
true_statement: Each Lightning Data Service adapter or function call is its own transaction, so multi-record operations through LDS aren't atomic.
false_statement: Lightning Data Service groups the adapter and function calls on a page into one transaction, so multi-record operations are atomic.
explanation: Because each LDS call commits separately, an all-or-nothing multi-record change needs Apex, which can roll everything back on failure.
