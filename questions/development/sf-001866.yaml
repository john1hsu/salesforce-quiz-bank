id: sf-001866
product_area: development
true_statement: A Slack app must return HTTP 200 within 3 seconds of receiving an interaction payload, or the user sees an error.
false_statement: A Slack app must return HTTP 200 within 30 seconds of receiving an interaction payload, or the user sees an error.
explanation: Slack expects an acknowledgement within three seconds, so slow work should happen after the app responds. Thirty seconds is far too generous.
