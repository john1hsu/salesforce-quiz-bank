id: sf-001022
product_area: development
true_statement: An Apex test class can have only one @TestSetup method, and it isn't supported when the class uses @IsTest(SeeAllData=true).
false_statement: An Apex test class can have up to five @TestSetup methods, and they also run when the class uses @IsTest(SeeAllData=true).
explanation: Test setup is limited to a single method per class and is incompatible with SeeAllData=true. Multiple setup methods are not allowed.
