id: sf-001161
product_area: development
true_statement: In Apex, OrgLimit.getValue() returns usage consumed so far, so headroom is calculated as getLimit() minus getValue().
false_statement: In Apex, OrgLimit.getValue() returns the remaining allocation, so headroom can be read directly from getValue().
explanation: getValue reports how much of the limit has been used; unlike the REST limits resource's Remaining figure, headroom must be computed by subtracting it from getLimit.
