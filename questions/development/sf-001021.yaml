id: sf-001021
product_area: development
true_statement: Annotating a test utility class with @IsTest excludes it from the org's Apex code size limit, an advantage a plain helper class lacks.
false_statement: Annotating a test utility class with @IsTest excludes it from code coverage calculations, but it still counts toward the Apex code size limit.
explanation: The @IsTest annotation keeps the factory out of the org's Apex code size limit and restricts it to test context. The false version moves the benefit to coverage and keeps the size cost.
