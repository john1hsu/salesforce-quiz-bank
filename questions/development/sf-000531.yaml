id: sf-000531
product_area: development
true_statement: A single-object SOSL search returns up to 250 records unless a WHERE or ORDER BY clause is added, which raises the cap to 2,000.
false_statement: A single-object SOSL search returns up to 2,000 records unless a WHERE or ORDER BY clause is added, which lowers the cap to 250.
explanation: The default per-object cap for a single-object search is 250, and adding WHERE or ORDER BY lifts it to 2,000. The false statement inverts the default and the effect of the clauses.
