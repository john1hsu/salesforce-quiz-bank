id: sf-000530
product_area: development
true_statement: A future method can't call another future method, so code checks System.isFuture() and skips the call when already in a future context.
false_statement: A future method can call one more future method, so code checks System.isFuture() and skips the call once a second level is reached.
explanation: Future and batch contexts can make no future calls at all, so any chaining attempt fails. System.isFuture() detects the future context so code can avoid the call entirely.
