id: sf-000053
product_area: development
true_statement: If a bulk API call fires a trigger, valid records can save while failing ones are rejected; if Apex DML fires it, one error rolls back the whole operation.
false_statement: If Apex DML fires a trigger, valid records can save while failing ones are rejected; if a bulk API call fires it, one error rolls back the whole operation.
explanation: Partial success is the behaviour for bulk API calls, whereas Apex DML is all-or-nothing when a trigger throws an error. The false statement swaps the two callers.
