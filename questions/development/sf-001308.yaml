true_statement: The Omnistudio Developer exam has a 15% Troubleshooting and Debugging section, which the Omnistudio Consultant exam has no equivalent of.
false_statement: The Omnistudio Developer exam folds troubleshooting into its Fundamentals section, while the Omnistudio Consultant exam has a separate 15% troubleshooting section.
explanation: Debugging display, mapping, caching and deployment problems gets its own section in the developer guide. The consultant exam scopes troubleshooting out entirely.
