id: sf-000533
product_area: development
true_statement: A SOSL search string longer than 4,000 characters silently drops its logical operators, so AND can behave like OR.
false_statement: A SOSL search string longer than 4,000 characters silently drops its wildcards, so * and ? are matched as literal characters.
explanation: Past 4,000 characters SOSL ignores logical operators, which can broaden a search unexpectedly. The documented loss is of AND/OR logic, not of wildcard handling.
