id: sf-001729
product_area: development
true_statement: JSON.deserializeStrict throws on extra JSON attributes for Apex classes in every API version, but not for sObjects.
false_statement: JSON.deserializeStrict throws on extra JSON attributes for sObjects in every API version, but not for Apex classes.
explanation: Strict mode enforces that every attribute exists on an Apex class target. sObject targets are not held to that check by deserializeStrict, so the false statement reverses the two.
