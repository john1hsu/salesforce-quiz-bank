id: sf-001303
product_area: development
true_statement: An Apex exception's initCause method works only if no cause has been set yet, for example through a constructor that took a cause.
false_statement: An Apex exception's initCause method can be called at any time to replace a cause that was already set through a constructor.
explanation: initCause is for setting a cause once on an exception that has none. If the cause was already supplied, initCause can't overwrite it.
