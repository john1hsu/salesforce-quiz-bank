id: sf-000959
product_area: development
true_statement: Lightning Locker can be disabled only for Aura components, by API version; it can't be turned off for individual Lightning web components.
false_statement: Lightning Locker can be disabled for individual Lightning web components by lowering their API version to 39.0 or earlier.
explanation: The API-version escape hatch applies to Aura components only. Lightning web components always run under whichever security architecture the org uses.
