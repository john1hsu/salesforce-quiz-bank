id: sf-001089
product_area: development
true_statement: A batch job scheduled with System.scheduleBatch is appended to the end of the Apex flex queue when its scheduled time arrives.
false_statement: A batch job scheduled with System.scheduleBatch is placed at the front of the Apex flex queue when its scheduled time arrives.
explanation: Scheduled batches join the flex queue at its tail like any other submission; moving one to the front takes an explicit reorder such as moveJobToFront.
