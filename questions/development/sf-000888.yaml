id: sf-000888
product_area: development
true_statement: A wire adapter only provisions data once every dynamic parameter in its config has a value; an undefined parameter means nothing is fetched.
false_statement: A wire adapter provisions data as soon as the component connects, treating any undefined dynamic parameter in its config as null.
explanation: The wire service waits until all reactive config values are defined before running the adapter. Passing null to wired Apex still invokes it, but undefined does not.
