true_statement: A Block Kit interaction's response_url can be used up to 5 times within 30 minutes; after that, apps post through the normal messaging APIs.
false_statement: A Block Kit interaction's response_url can be used up to 5 times within 24 hours; after that, apps post through the normal messaging APIs.
explanation: 'The response_url is short-lived: five uses inside half an hour. A 24-hour window greatly overstates how long it lasts.'
