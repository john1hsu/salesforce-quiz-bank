id: sf-001518
product_area: development
true_statement: If an Aura component loads a script with ltng:require and a Lightning web component loads the same script with loadScript, the duplicate load isn't detected.
false_statement: If an Aura component loads a script with ltng:require and a Lightning web component loads the same script with loadScript, the platform detects the duplicate and loads it once.
explanation: The two loaders don't share tracking, so a script loaded by both can run twice and must guard itself. The false statement assumes deduplication that doesn't happen across Aura and LWC.
