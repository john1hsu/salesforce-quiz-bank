id: sf-000261
product_area: development
true_statement: In Lightning Web Components, records are read with @wire adapters such as getRecord, while createRecord and updateRecord are called as promise-based functions.
false_statement: In Lightning Web Components, records are read with @wire adapters such as getRecord, and createRecord and updateRecord are also wired with @wire.
explanation: LDS reads use wire adapters from the lightning/ui*Api modules, but writes use imperative, promise-returning functions. Wiring is only for reads, so createRecord and updateRecord cannot be wired.
