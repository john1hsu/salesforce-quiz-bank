id: sf-001799
product_area: development
true_statement: The lightning/platformWorkspaceApi module for Lightning web components requires API version 59.0 or later.
false_statement: The lightning/platformWorkspaceApi module for Lightning web components requires API version 55.0 or later.
explanation: The LWC workspace module became generally available in Spring '24 and needs API 59.0 or later. Version 55.0 predates it, when LWC developers still had to wrap the Aura component.
