id: sf-001517
product_area: development
true_statement: A static resource with Public cache control can be fetched by unauthenticated internet traffic through a shared cache, while Private limits it to authenticated users.
false_statement: A static resource with Private cache control can be fetched by unauthenticated internet traffic through a shared cache, while Public limits it to authenticated users.
explanation: Public cache control serves the file to anyone, including unauthenticated users, from a faster shared cache, whereas Private restricts it to authenticated users with per-user caching. The false statement swaps the two settings.
