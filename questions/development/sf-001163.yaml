id: sf-001163
product_area: development
true_statement: From its execute method, a Transaction Finalizer can enqueue one asynchronous job, whether a Queueable, a future method or a Batch job.
false_statement: From its execute method, a Transaction Finalizer can enqueue up to 50 asynchronous jobs, whether Queueables, future methods or Batch jobs.
explanation: A finalizer is limited to enqueuing a single async job, which is how retry and chain-continuation patterns work. Fifty is the Queueable allowance of an ordinary synchronous transaction, not of a finalizer.
