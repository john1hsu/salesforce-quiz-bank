true_statement: Mixed DML validation is skipped during deployment, so a test can pass while deploying yet fail when run from the UI.
false_statement: Mixed DML validation is skipped when tests run from the UI, so a test can pass there yet fail while deploying.
explanation: Deployment skips the mixed DML check, which is why a test may succeed in a deploy but throw the error in a UI test run. The false statement swaps which context skips the check.
