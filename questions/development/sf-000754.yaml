id: sf-000754
product_area: development
true_statement: Database.queryWithBinds, available from API version 57.0, resolves the bind variables in a dynamic SOQL string from a Map<String, Object>.
false_statement: Database.queryWithBinds, available from API version 57.0, resolves the bind variables in a dynamic SOQL string from a List<Object> matched by position.
explanation: Binds are supplied as a map keyed by name, matched case-insensitively. There's no positional list form.
