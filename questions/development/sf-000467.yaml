id: sf-000467
product_area: development
true_statement: In Aura, a component event is handled by the firing component or one above it in the containment hierarchy, while an application event reaches every registered handler.
false_statement: In Aura, an application event is handled by the firing component or one above it in the containment hierarchy, while a component event reaches every registered handler.
explanation: Component events travel up the containment hierarchy; application events use publish-subscribe and notify all registered handlers. The false statement swaps the two.
