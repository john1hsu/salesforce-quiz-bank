id: sf-000259
product_area: development
true_statement: A batch class that implements Database.RaisesPlatformEvents publishes a BatchApexErrorEvent when start, execute or finish hits an unhandled exception.
false_statement: A batch class that implements Database.AllowsCallouts publishes a BatchApexErrorEvent when start, execute or finish hits an unhandled exception.
explanation: Database.RaisesPlatformEvents is the opt-in for BatchApexErrorEvent, which carries the job ID, failed scope record IDs and exception details. Database.AllowsCallouts only permits HTTP callouts from the batch.
