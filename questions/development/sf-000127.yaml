true_statement: Unlike Java, Apex is case-insensitive and adds a global access modifier that exposes code across namespaces.
false_statement: Like Java, Apex is case-sensitive and adds a global access modifier that exposes code across namespaces.
explanation: Apex differs from Java by ignoring case in identifiers and keywords; the global modifier for cross-namespace exposure is an Apex addition, but case sensitivity is not shared with Java.
