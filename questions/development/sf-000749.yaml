id: sf-000749
product_area: development
true_statement: The Apex Limits class reports only per-transaction governors; org-wide allowances such as daily API requests come from System.OrgLimits.
false_statement: The Apex Limits class reports both per-transaction governors and org-wide allowances such as daily API requests, so OrgLimits isn't needed.
explanation: Limits covers the running transaction, while OrgLimits.getAll() or getMap() returns org allowances that update in near real time. The two classes answer different questions.
