id: sf-001728
product_area: development
true_statement: Calling List.sort() on a list of custom class objects throws a System.ListException unless the class implements Comparable.
false_statement: Calling List.sort() on a list of custom class objects sorts them by their toString() value unless the class implements Comparable.
explanation: Only primitives have a natural sort order, and sObjects have a built-in one. A custom element type needs a Comparable implementation, otherwise sort() raises a ListException instead of falling back to any default.
