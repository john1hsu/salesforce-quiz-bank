id: sf-000884
product_area: development
true_statement: A Visualforce page's view state, stored in an encrypted hidden form field, is capped at 170 KB.
false_statement: A Visualforce page's view state, stored in an encrypted hidden form field, is capped at 1 MB.
explanation: Component state, field values and the controller are serialized into view state with a 170 KB ceiling, which is why developers use transient variables and narrower queries to keep it small.
