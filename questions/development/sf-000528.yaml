id: sf-000528
product_area: development
true_statement: If the transaction that queued a future method rolls back, the future job is never processed.
false_statement: If the transaction that queued a future method rolls back, the future job still runs because it was already queued.
explanation: Future work queued by a transaction is discarded if that transaction rolls back, so the job never executes. It does not run independently of the transaction that queued it.
