id: sf-001023
product_area: development
true_statement: If a @TestSetup method hits a fatal error such as a DML exception, the whole test class fails and none of its tests run.
false_statement: If a @TestSetup method hits a fatal error such as a DML exception, only the first test method fails and the remaining tests still run.
explanation: A setup failure takes down the entire test class, because every method depends on the shared data. No individual test continues after it.
