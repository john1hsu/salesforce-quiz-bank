id: sf-000328
product_area: development
true_statement: A single Apex transaction can make at most 100 callouts, counting both HTTP requests and API calls.
false_statement: A single Apex transaction can make at most 10 callouts, counting both HTTP requests and API calls.
explanation: The per-transaction callout limit is 100. Ten is far below the documented cap, though the 120-second cumulative timeout can still constrain many slow calls.
