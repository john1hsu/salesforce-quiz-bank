id: sf-000887
product_area: development
true_statement: Wired Apex data in a Lightning web component is refreshed by passing the previously emitted wire value to refreshApex().
false_statement: Wired Apex data in a Lightning web component is refreshed automatically by Lightning Data Service whenever the underlying records change.
explanation: Lightning Data Service doesn't manage results from Apex, so stale wired Apex values must be refreshed explicitly with refreshApex(), which returns a promise.
