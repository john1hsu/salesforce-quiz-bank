id: sf-000469
product_area: development
true_statement: Salesforce doesn't guarantee the execution order of several Apex triggers on the same object for the same event, which is why one trigger per object is advised.
false_statement: Salesforce runs several Apex triggers on the same object for the same event in alphabetical order by name, which is why one trigger per object is optional.
explanation: Multiple triggers on one object and event run in no guaranteed order, causing nondeterministic bugs. A single trigger delegating to a handler makes the order explicit in code.
