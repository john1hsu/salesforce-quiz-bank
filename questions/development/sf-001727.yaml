id: sf-001727
product_area: development
true_statement: Apex lists, sets and maps can nest other collections up to seven levels deep, for eight levels in total.
false_statement: Apex lists, sets and maps can nest other collections up to three levels deep, for four levels in total.
explanation: The Apex guide allows collections within collections to seven nested levels, eight counting the outer one. Three levels understates the limit.
