id: sf-000689
product_area: development
true_statement: An Apex continuation can wait at most 120 seconds, and timeouts set on its individual HttpRequest objects are ignored.
false_statement: An Apex continuation can wait at most 60 seconds, and timeouts set on its individual HttpRequest objects are ignored.
explanation: The continuation's own timeout governs and tops out at 120 seconds; per-request timeouts don't apply. Sixty seconds understates the ceiling.
