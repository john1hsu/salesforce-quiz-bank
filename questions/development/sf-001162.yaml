id: sf-001162
product_area: development
true_statement: A Transaction Finalizer's state is captured when the Queueable finishes executing, so changes the job makes after calling attachFinalizer still reach it.
false_statement: A Transaction Finalizer's state is captured when attachFinalizer is called, so changes the job makes after calling attachFinalizer never reach it.
explanation: The finalizer instance is serialized at the end of the Queueable's run, which lets the job keep updating it after attaching it. Only fields marked transient are left out.
