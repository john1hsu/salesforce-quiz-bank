id: sf-000051
product_area: development
true_statement: When DML affects more than 200 records, an Apex trigger runs once per batch of 200, and Trigger.size reports only the current batch.
false_statement: When DML affects more than 2,000 records, an Apex trigger runs once per batch of 2,000, and Trigger.size reports only the current batch.
explanation: Trigger invocations are chunked at 200 records, so a large DML operation fires the trigger several times and Trigger.size counts only the batch at hand. 2,000 is not the trigger batch size.
