id: sf-001589
product_area: development
true_statement: Assigning an inline SOQL query that matches no rows to a single sObject variable throws a QueryException, while assigning it to a list just gives an empty list.
false_statement: Assigning an inline SOQL query that matches no rows to a list variable throws a QueryException, while assigning it to a single sObject just gives null.
explanation: Single-sObject assignment expects exactly one row and fails with "List has no rows for assignment to SObject" otherwise. List assignment never throws for zero rows, so code should check its size.
