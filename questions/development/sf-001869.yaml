id: sf-001869
product_area: development
true_statement: Among Mobile SDK app styles, only hybrid apps can host Lightning web components.
false_statement: Among Mobile SDK app styles, only React Native apps can host Lightning web components.
explanation: The Mobile SDK guide says hybrid apps, built on a Cordova container, are the ones that can host LWCs. React Native renders native views and isn't the LWC host.
