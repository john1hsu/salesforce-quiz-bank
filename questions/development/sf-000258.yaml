id: sf-000258
product_area: development
true_statement: In a batch class that implements Database.Stateful, instance variables keep their values across chunks, while static variables still reset.
false_statement: In a batch class that implements Database.Stateful, static variables keep their values across chunks, while instance variables still reset.
explanation: Database.Stateful preserves instance member variables between execute calls, which is how running totals are kept. Static variables are reset for each chunk either way, so the false statement swaps the two.
