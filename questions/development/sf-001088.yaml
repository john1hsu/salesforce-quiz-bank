id: sf-001088
product_area: development
true_statement: Only one Batch Apex job's start method can run at a time in an org, even when several of the active batch slots are free.
false_statement: Up to five Batch Apex jobs' start methods can run at the same time in an org, one in each active batch slot.
explanation: The Preparing phase, when start runs, is serialized org-wide to one job at a time. The five-slot limit covers queued or active jobs, not concurrent start methods.
