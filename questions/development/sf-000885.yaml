id: sf-000885
product_area: development
true_statement: Adding lightningStylesheets to a Visualforce page gives it the Lightning look, but it isn't supported in Experience Cloud sites or PDF rendering.
false_statement: Adding lightningStylesheets to a Visualforce page gives it the Lightning look everywhere, including Experience Cloud sites and PDF rendering.
explanation: The lightningStylesheets attribute styles pages in Lightning Experience and the mobile app only. Experience Cloud sites and renderAs PDF output don't get that styling.
