id: sf-001376
product_area: development
true_statement: Flow Builder's resource picker shows only the first-level fields of an Apex-defined variable, so deeper nested fields need dot notation typed by hand.
false_statement: Flow Builder's resource picker shows every nested level of an Apex-defined variable, so deeper fields can always be selected without typing.
explanation: The picker exposes just the top-level members of an Apex-defined value. Fields further down a nested structure have to be referenced manually with dot notation.
