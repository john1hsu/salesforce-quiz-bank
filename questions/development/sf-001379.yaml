id: sf-001379
product_area: development
true_statement: System debug logs are kept for 24 hours and monitoring debug logs for seven days, so debug logs can't serve as an audit trail.
false_statement: System debug logs are kept for seven days and monitoring debug logs for 30 days, so debug logs can't serve as an audit trail.
explanation: Salesforce retains system debug logs for a day and monitoring logs for a week. That short retention is why long-lived logging needs a custom framework or Event Monitoring instead.
