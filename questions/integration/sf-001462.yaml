id: sf-001462
product_area: integration
true_statement: Marketing Cloud Connect recognizes a subscriber as a CRM record only when the subscriber key is the CRM contact or lead ID.
false_statement: Marketing Cloud Connect recognizes a subscriber as a CRM record only when the subscriber key is the CRM contact or lead email address.
explanation: The connector matches subscribers to CRM records through the contact or lead ID used as subscriber key, which is why older accounts may need a subscriber key migration. Email address is not the matching key.
