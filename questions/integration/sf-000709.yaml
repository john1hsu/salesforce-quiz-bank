id: sf-000709
product_area: integration
true_statement: An Apex callout whose endpoint is defined by a named credential needs no separate entry in Remote Site Settings.
false_statement: An Apex callout whose endpoint is defined by a named credential also needs a matching entry in Remote Site Settings.
explanation: A named credential carries its own URL and authentication, so the platform doesn't require a remote site entry for it. Remote site entries are needed for endpoints Apex calls directly.
