id: sf-000354
product_area: integration
true_statement: Saving changes to external objects and regular objects in the same transaction throws an error in Salesforce Connect.
false_statement: Changes to external objects and regular objects saved in the same transaction are committed or rolled back together in Salesforce Connect.
explanation: External object writes are executed by the remote system, so Salesforce can't make them part of one transaction with regular records; mixing them raises an error.
