id: sf-001677
product_area: integration
true_statement: MuleSoft illustrates point-to-point growth with five systems needing ten connections and ten or more systems needing at least 45.
false_statement: MuleSoft illustrates point-to-point growth with five systems needing five connections and ten or more systems needing at least 10.
explanation: A fully connected mesh needs n(n-1)/2 links, so five systems need ten and ten systems need 45. The false version assumes connections grow only linearly with systems.
