id: sf-001323
product_area: integration
true_statement: In Mule 4, an operation that declares no processing type is treated as CPU-Light by default, alongside the Blocking I/O and CPU Intensive types.
false_statement: In Mule 4, an operation that declares no processing type is treated as Blocking I/O by default, alongside the CPU-Light and CPU Intensive types.
explanation: Mule's reactive engine uses each operation's declared type to schedule work, and CPU-Light is the fallback. Blocking I/O covers work like database selects and must be declared.
