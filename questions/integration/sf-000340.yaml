id: sf-000340
product_area: integration
true_statement: In Salesforce's integration pattern catalogue, Remote Call-In can be either synchronous or asynchronous.
false_statement: In Salesforce's integration pattern catalogue, Remote Call-In is always asynchronous.
explanation: Request and Reply and Data Virtualization are synchronous, and Fire and Forget, Batch Data Synchronization and UI updates are asynchronous; Remote Call-In is the one pattern that can be either.
