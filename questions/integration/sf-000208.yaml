id: sf-000208
product_area: integration
true_statement: A Pub/Sub API subscribe call can request at most 100 events in total across its fetch requests.
false_statement: A Pub/Sub API subscribe call can request at most 2,000 events in total across its fetch requests.
explanation: Requests above 100 events are treated as 100. The client asks for more once it has processed what it received.
