id: sf-000272
product_area: integration
true_statement: If an outbound message's endpoint is unreachable, Salesforce retries with gaps capped at two hours and drops messages older than 24 hours.
false_statement: If an outbound message's endpoint is unreachable, Salesforce retries with gaps capped at two hours and drops messages older than 72 hours.
explanation: Outbound messaging retries with exponential backoff (at most two hours apart) but gives up once a message is 24 hours old. The 72-hour figure is the replay window of platform events and CDC, not outbound messaging.
