true_statement: SOAP API and the original Bulk API remain supported but are no longer enhanced, so new work should favour REST and Bulk API 2.0.
false_statement: SOAP API and the original Bulk API are still actively enhanced, so new work can favour them equally with REST and Bulk API 2.0.
explanation: Salesforce keeps the older APIs running but invests in REST and Bulk API 2.0. New integrations should therefore start on the actively developed APIs.
