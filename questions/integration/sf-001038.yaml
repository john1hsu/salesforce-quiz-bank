product_area: integration
true_statement: A Bulk API 1.0 job's contentType defaults to XML, whereas Bulk API 2.0 ingest jobs accept only CSV.
false_statement: A Bulk API 1.0 job's contentType defaults to CSV, whereas Bulk API 2.0 ingest jobs accept only JSON.
explanation: Bulk API 1.0 defaults to XML and also supports CSV, JSON and ZIP variants for attachments. Bulk API 2.0 is limited to CSV, not JSON.
