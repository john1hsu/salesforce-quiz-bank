id: sf-001109
product_area: integration
true_statement: Heroku AppLink's authorized-user mode is the only mode for Heroku-initiated work such as worker dynos and nightly jobs.
false_statement: Heroku AppLink's user-plus mode is the only mode for Heroku-initiated work such as worker dynos and nightly jobs.
explanation: Work that starts on Heroku has no invoking Salesforce user, so it must run as a designated authorized user. user-plus extends an invoking user's access and so needs a call from Salesforce.
