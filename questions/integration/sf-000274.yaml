id: sf-000274
product_area: integration
true_statement: With Send Session ID enabled, an outbound message carries a session for the definition's User to send as, not for the user who changed the record.
false_statement: With Send Session ID enabled, an outbound message carries a session for the user who changed the record, not for the definition's User to send as.
explanation: The session included for callbacks belongs to the User to send as configured on the outbound message, whose permissions also govern what data is sent. The user whose edit fired the message is not the session owner.
