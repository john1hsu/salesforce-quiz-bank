id: sf-000341
product_area: integration
true_statement: Salesforce's integration guidance notes that platform events are published without Salesforce-side retry and can't be rolled back with the transaction.
false_statement: Salesforce's integration guidance notes that platform events are retried by Salesforce on failure and are rolled back with the transaction.
explanation: Publishing a platform event is not tied to the transaction's rollback and Salesforce doesn't retry it, which is why designs must handle delivery and idempotency themselves.
