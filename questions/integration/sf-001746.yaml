true_statement: For Salesforce Voice with Amazon Connect, limits on concurrent active calls and reachable outbound countries come from AWS service quotas.
false_statement: For Salesforce Voice with Amazon Connect, limits on concurrent active calls and reachable outbound countries come from Salesforce org limits.
explanation: These caps are set on the AWS side, so increases are requested from AWS before go-live. Salesforce doesn't control them.
