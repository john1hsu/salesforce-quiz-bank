id: sf-000547
product_area: integration
true_statement: API Access Control, which blocks API access except through admin-approved connected apps, is turned on by request to Salesforce Customer Support.
false_statement: API Access Control, which blocks API access except through admin-approved connected apps, is turned on by an admin from Setup.
explanation: API Access Control is not self-service; an org has to ask Customer Support to enable it. Because it can cut off unlisted integrations, clients should be inventoried first.
