id: sf-001747
product_area: integration
true_statement: A Telephony Integration API caller signs its own RS256 JWT, with an exp no more than 24 hours out, and sends it as a bearer token.
false_statement: A Telephony Integration API caller exchanges a signed JWT at the Salesforce OAuth token endpoint for an access token valid for up to 24 hours.
explanation: 'The API has no OAuth token endpoint: the self-signed JWT itself is the bearer credential. That is the key difference from the OAuth JWT bearer flow.'
