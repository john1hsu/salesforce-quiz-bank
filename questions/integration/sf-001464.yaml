id: sf-001464
product_area: integration
true_statement: In Marketing Cloud Connect, CRM-only users can see email results on records but cannot send, while integrated users can send to Salesforce reports and campaigns.
false_statement: In Marketing Cloud Connect, CRM-only users can send to Salesforce reports and campaigns, while integrated users can only see email results on records.
explanation: Sending to reports and campaigns needs an integrated user linked on both sides; a CRM-only user just sees the tracking results. The false statement swaps the two roles.
