id: sf-000839
product_area: integration
true_statement: When a Connect REST API request exceeds the REST rate limit, Salesforce returns 503 Service Unavailable.
false_statement: When a Connect REST API request exceeds the REST rate limit, Salesforce returns 429 Too Many Requests.
explanation: Connect REST API signals an exceeded limit with HTTP 503. Clients that only watch for 429 will miss it.
