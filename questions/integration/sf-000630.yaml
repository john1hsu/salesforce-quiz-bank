id: sf-000630
product_area: integration
true_statement: Each subquery in a Salesforce GraphQL API query counts as a separate request against API rate limits.
false_statement: A Salesforce GraphQL API query counts as a single request against API rate limits, however many subqueries it contains.
explanation: The GraphQL limits count every subquery as one request, so one call with several subqueries consumes several API calls. Treating the whole query as one call undercounts usage.
