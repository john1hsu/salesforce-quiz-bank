id: sf-001675
product_area: integration
true_statement: MuleSoft Composer connections can be reused across flows but belong only to the user who created them.
false_statement: MuleSoft Composer connections can be reused across flows and are shared with every Composer user in the org by default.
explanation: Connections are private to their creator, so team-owned flows need planned shared service users. The false version makes connections org-wide.
