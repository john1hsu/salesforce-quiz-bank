id: sf-001467
product_area: integration
true_statement: A Streaming API CometD socket times out after 110 seconds during a connection, and the client must reconnect within 40 seconds after a successful connect.
false_statement: A Streaming API CometD socket times out after 40 seconds during a connection, and the client must reconnect within 110 seconds after a successful connect.
explanation: The fixed ceilings are a 110-second socket timeout and a 40-second window to reconnect. The false statement swaps the two numbers.
