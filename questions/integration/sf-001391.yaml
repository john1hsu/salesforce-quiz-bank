id: sf-001391
product_area: integration
true_statement: A legacy named credential's URL may include a path but not a query string; query strings are added in the callout reference instead.
false_statement: A legacy named credential's URL may include a query string but not a path; extra path segments are added in the callout reference instead.
explanation: The URL must start with http:// or https:// and can carry a path, while query strings and further path segments belong in the callout that references the credential. The false version reverses what the URL may hold.
