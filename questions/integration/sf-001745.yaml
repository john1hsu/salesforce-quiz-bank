id: sf-001745
product_area: integration
true_statement: After each Amazon Connect call, contact record sync uses a Lambda function to copy contact record data into the Salesforce VoiceCall object.
false_statement: After each Amazon Connect call, contact record sync uses a Salesforce platform event to copy contact record data into the VoiceCall object.
explanation: Contact record sync is on by default and runs through a Lambda function. Because sync can occasionally fail, Salesforce suggests backing records up to S3 and resyncing gaps.
