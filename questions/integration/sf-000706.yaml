id: sf-000706
product_area: integration
true_statement: In a single composite API request, no more than 5 of the subrequests can be query or sObject Collections operations.
false_statement: In a single composite API request, no more than 15 of the subrequests can be query or sObject Collections operations.
explanation: Composite allows up to 25 subrequests, but only five of them may be queries or sObject Collections calls. Fifteen overstates that sub-limit.
