true_statement: Creating, editing or deleting named credentials requires the Manage Named Credentials or Customize Applications permission.
false_statement: Creating, editing or deleting named credentials requires the Modify All Data or Author Apex permission.
explanation: Credential administration is gated by Manage Named Credentials or Customize Applications, while just viewing them needs View Setup and Configuration.
