id: sf-001536
product_area: integration
true_statement: Every REST API response carries an Sforce-Limit-Info header showing daily API usage as used over limit, so a client can track it without polling the Limits resource.
false_statement: Every REST API response carries an Sforce-Limit-Info header showing hourly platform event usage as used over limit, so a client can track it without polling the Limits resource.
explanation: The header reports api-usage, the daily API request counter, on each response. It does not report platform event publishing; that allocation is read from the Limits resource itself.
