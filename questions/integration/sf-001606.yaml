id: sf-001606
product_area: integration
true_statement: An Apex REST request or response can be at most 6 MB for synchronous Apex and 12 MB for asynchronous Apex.
false_statement: An Apex REST request or response can be at most 3 MB for synchronous Apex and 6 MB for asynchronous Apex.
explanation: Apex REST payloads are capped at 6 MB synchronously and 12 MB asynchronously, on top of the normal governor and API request limits.
