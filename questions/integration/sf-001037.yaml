id: sf-001037
product_area: integration
true_statement: Bulk API 1.0 PK chunking splits a query into ID ranges of 100,000 records by default, with a maximum chunk size of 250,000.
false_statement: Bulk API 1.0 PK chunking splits a query into ID ranges of 250,000 records by default, with a maximum chunk size of 1,000,000.
explanation: The Sforce-Enable-PKChunking header defaults to 100,000-record chunks and allows up to 250,000. The higher numbers overstate both the default and the ceiling.
