id: sf-001749
product_area: integration
true_statement: After a call transfer, transcripts sent to the Telephony Integration API must use the vendorCallKey of the first VoiceCall.
false_statement: After a call transfer, transcripts sent to the Telephony Integration API must use the Salesforce record ID of the new VoiceCall.
explanation: Transcript messages are posted by vendorCallKey, and after a transfer that key must be the original call's. Using a Salesforce record ID, or the transferred call's key, is wrong.
