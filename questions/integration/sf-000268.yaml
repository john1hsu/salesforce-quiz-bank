id: sf-000268
product_area: integration
true_statement: In sObject Collections, allOrNone defaults to false, so each record succeeds or fails independently unless rollback is requested.
false_statement: In sObject Collections, allOrNone defaults to true, so a single failed record rolls back the whole request unless partial success is requested.
explanation: sObject Collections processes records independently by default and still returns HTTP 200 when some fail, so clients must check each result's success flag. Rollback only happens if allOrNone is set to true.
