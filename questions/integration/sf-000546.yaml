id: sf-000546
product_area: integration
true_statement: Users on the Salesforce Integration user license are API-only, and that API-only setting cannot be turned off.
false_statement: Users on the Salesforce Integration user license are API-only by default, but an admin can turn that setting off to allow UI access.
explanation: The license provisions the Minimum Access - API Only Integrations profile, and its API-only restriction is fixed. Object and field access is then granted with permission sets.
