id: sf-001327
product_area: integration
true_statement: For Remote Call-In process integration, the remote caller or middleware is responsible for handling duplicate requests after errors or timeouts.
false_statement: For Remote Call-In process integration, Salesforce automatically detects and discards duplicate inbound requests sent after errors or timeouts.
explanation: Salesforce's guidance makes idempotent design the caller's job for inbound calls. The platform doesn't deduplicate retried requests on its own.
