id: sf-000210
product_area: integration
true_statement: 'Pub/Sub API subscriptions are pull-based: the client sends a FetchRequest saying how many events it can handle.'
false_statement: 'Pub/Sub API subscriptions are push-based: the server streams each new event as soon as it is published, without client flow control.'
explanation: Clients request a number of events and the server delivers up to that count before waiting for the next request. This flow control protects slow consumers during spikes.
