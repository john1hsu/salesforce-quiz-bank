true_statement: Calling the REST API Limits resource requires the View Setup and Configuration permission.
false_statement: Calling the REST API Limits resource requires the Modify All Data permission.
explanation: The Limits resource, which returns each org allocation with its maximum and remaining value, needs View Setup and Configuration. Modify All Data is not the required permission.
