id: sf-000412
product_area: integration
true_statement: Bulk API 2.0 processes batches in parallel with no serial mode, so record ordering across batches isn't guaranteed.
false_statement: Bulk API 2.0 offers a serial processing mode that guarantees record ordering across batches.
explanation: Bulk API 2.0 always runs batches in parallel and commits each independently. Ordering isn't guaranteed and parallelism can raise lock contention.
