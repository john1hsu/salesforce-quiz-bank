true_statement: MuleSoft's guidance treats three or fewer systems as the range where point-to-point integration stays manageable.
false_statement: MuleSoft's guidance treats ten or fewer systems as the range where point-to-point integration stays manageable.
explanation: Point-to-point is acceptable only for a handful of systems, about three, with no growth expected. At ten systems the mesh already needs dozens of links.
