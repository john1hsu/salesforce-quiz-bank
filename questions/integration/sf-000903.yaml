id: sf-000903
product_area: integration
true_statement: SOAP API login() calls count toward a login rate limit of 3,600 calls per user per hour.
false_statement: SOAP API login() calls count toward a login rate limit of 3,600 calls per org per day.
explanation: The login rate limit is applied per user and per hour, at 3,600 calls. It is separate from the org's rolling 24-hour API request allocation.
