id: sf-001605
product_area: integration
true_statement: In Apex REST, methods annotated @HttpGet or @HttpDelete must take no parameters.
false_statement: In Apex REST, methods annotated @HttpPost or @HttpPatch must take no parameters.
explanation: GET and DELETE carry no deserialized body, so their methods are parameterless and read inputs from RestContext. POST and PATCH methods may declare parameters filled from the request body.
