id: sf-001177
product_area: integration
true_statement: Heroku Connect's standard polling interval for reading from Salesforce can be set anywhere from 2 to 60 minutes, in 1-minute steps.
false_statement: Heroku Connect's standard polling interval for reading from Salesforce can be set anywhere from 5 to 120 minutes, in 5-minute steps.
explanation: Standard polling is adjustable from 2 to 60 minutes in single-minute increments (with a 10-minute default). The 5-to-120 range and 5-minute steps are invented.
