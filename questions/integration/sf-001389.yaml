id: sf-001389
product_area: integration
true_statement: Winter '23 introduced the extensible named credential model, which splits the endpoint from the authentication held in an external credential.
false_statement: Spring '21 introduced the extensible named credential model, which splits the endpoint from the authentication held in an external credential.
explanation: The separation of named credentials (endpoint) from external credentials (authentication) arrived in Winter '23, leaving the single-record form as the legacy model. Spring '21 is the wrong release.
