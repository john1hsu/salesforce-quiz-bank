id: sf-000975
product_area: integration
true_statement: Experience APIs in API-led connectivity adapt Process API output for a specific channel and do not depend directly on the source systems.
false_statement: Experience APIs in API-led connectivity adapt System API output for a specific channel and call the source systems directly to cut hops.
explanation: Experience APIs reshape what Process APIs produce for a particular UI, device or channel, and they are deliberately decoupled from the systems of record. Calling source systems directly would recreate the point-to-point coupling the model avoids.
