id: sf-000413
product_area: integration
true_statement: In batch synchronization, an ETL job's control tables should live where the ETL tool can still reach them when Salesforce is unavailable.
false_statement: In batch synchronization, an ETL job's control tables should live in Salesforce custom objects so every run reads them from the org.
explanation: The guidance makes the ETL infrastructure the hub and Salesforce a spoke, so the job's last-run and restart data must survive a Salesforce outage.
