id: sf-000705
product_area: integration
true_statement: Callouts started from Apex triggers must run asynchronously, so Salesforce's guidance treats them as Fire and Forget rather than Request and Reply.
false_statement: Callouts started from Apex triggers can run synchronously, so Salesforce's guidance treats them as Request and Reply rather than Fire and Forget.
explanation: A trigger can't wait on a synchronous callout, so trigger-based calls have to be asynchronous and belong to Fire and Forget. That's why the guidance rates triggers as suboptimal for Request and Reply.
