id: sf-000710
product_area: integration
true_statement: Turning on disableProtocolSecurity for a remote site lets code pass data between HTTP and HTTPS sessions, whatever protocol the user is on.
false_statement: Turning on disableProtocolSecurity for a remote site lets code skip TLS certificate checks on HTTPS callouts to that host.
explanation: The flag allows mixing HTTP and HTTPS in either direction regardless of the user's connection, and Salesforce warns to use it only with care. It isn't a switch for certificate validation.
