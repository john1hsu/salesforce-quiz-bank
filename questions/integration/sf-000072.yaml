id: sf-000072
product_area: integration
true_statement: Without the Change Data Capture add-on, an org can select at most 5 entities for change events across all channels.
false_statement: Without the Change Data Capture add-on, an org can select at most 50 entities for change events across all channels.
explanation: The base allocation caps selected entities at 5 across all channels; the add-on removes that cap. 50 is not the base limit.
