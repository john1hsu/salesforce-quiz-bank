id: sf-001534
product_area: integration
true_statement: API Experience Hub portals are set up starting in Anypoint Platform, which handles deployment, catalog and user management, while the portal itself runs on Experience Cloud.
false_statement: API Experience Hub portals are set up starting in Salesforce Setup, which handles deployment, catalog and user management, while the portal itself runs on Experience Cloud.
explanation: An admin begins in Anypoint Platform, links it to a Salesforce org and curates services from Anypoint Exchange there. Salesforce Setup is not the starting point, though Experience Cloud hosts the resulting portal.
