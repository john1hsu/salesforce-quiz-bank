id: sf-000548
product_area: integration
true_statement: Salesforce Well-Architected calls for a separate API-only user per integration, and lists one shared integration user for several systems as an anti-pattern.
false_statement: Salesforce Well-Architected calls for one shared API-only user across integrations, and lists a separate integration user per system as an anti-pattern.
explanation: A dedicated user per integration keeps each one's permissions narrow and its activity traceable. A single shared API user, especially with Modify All Data, is the named anti-pattern.
