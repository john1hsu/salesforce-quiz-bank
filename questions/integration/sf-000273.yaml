id: sf-000273
product_area: integration
true_statement: One outbound messaging SOAP call can carry up to 100 notifications, and the listener replies with a single Ack that covers all of them.
false_statement: One outbound messaging SOAP call can carry up to 100 notifications, and the listener must reply with a separate Ack for each notification.
explanation: The WSDL's notifications() call batches up to 100 notifications, and the listener returns one boolean Ack for the whole message. There is no per-notification acknowledgement.
