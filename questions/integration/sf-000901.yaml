id: sf-000901
product_area: integration
true_statement: The SOAP API partner WSDL is loosely typed and works against any org, while the enterprise WSDL is strongly typed to one org's schema.
false_statement: The SOAP API enterprise WSDL is loosely typed and works against any org, while the partner WSDL is strongly typed to one org's schema.
explanation: ISVs use the partner WSDL because it isn't tied to a specific object model. The enterprise WSDL mirrors one org's objects and fields and must be regenerated when they change; the false statement swaps them.
