true_statement: Mule domains, which share global configuration across apps, can be deployed only when Mule runs on premises, not on CloudHub.
false_statement: Mule domains, which share global configuration across apps, can be deployed only on CloudHub 2.0, not when Mule runs on premises.
explanation: Domain deployment is limited to on-premises runtimes. Designs that share connector configuration through a domain don't carry over to CloudHub.
