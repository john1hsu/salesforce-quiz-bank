id: sf-001180
product_area: integration
true_statement: Legacy PushTopic and generic events can be consumed only through CometD, while platform events and CDC events can also be received by Pub/Sub API and Apex triggers.
false_statement: Platform events and CDC events can be consumed only through CometD, while legacy PushTopic and generic events can also be received by Pub/Sub API and Apex triggers.
explanation: Salesforce's streaming feature comparison limits the two legacy event types to CometD subscribers. Platform and change data capture events are the ones with extra subscription routes such as Pub/Sub API and Apex triggers, so the false statement reverses them.
