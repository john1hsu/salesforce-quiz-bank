id: sf-000205
product_area: integration
true_statement: A Bulk API 2.0 ingest job accepts up to 150 MB of base64-encoded CSV, so Salesforce suggests raw uploads under 100 MB.
false_statement: A Bulk API 2.0 ingest job accepts up to 1 GB of base64-encoded CSV, so Salesforce suggests raw uploads under 750 MB.
explanation: The cap is 150 MB after base64 encoding, which inflates data by about half. Keeping the raw file under 100 MB leaves room for that growth.
