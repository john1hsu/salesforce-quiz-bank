true_statement: An Apex change event trigger receives batches of up to 2,000 change event messages by default.
false_statement: An Apex change event trigger receives batches of up to 200 change event messages by default.
explanation: Change event triggers run asynchronously after commit and take up to 2,000 messages per batch by default, ten times the 200 stated in the false version.
