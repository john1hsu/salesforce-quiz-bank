id: sf-001393
product_area: integration
true_statement: Setting a managed event subscription's state to STOP disconnects the client and deletes the committed replay ID, so the next run starts from defaultReplay.
false_statement: Setting a managed event subscription's state to STOP disconnects the client but keeps the committed replay ID, so the next run resumes where it left off.
explanation: STOP wipes the stored position, which is why runbooks should treat it as a reset rather than a pause. On restart, delivery begins wherever defaultReplay points.
