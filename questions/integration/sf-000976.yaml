id: sf-000976
product_area: integration
true_statement: An External Services registration accepts an OpenAPI 2.0.x or 3.0.x schema written in either JSON or YAML.
false_statement: An External Services registration accepts only an OpenAPI 3.0.x schema, and only when it is written in JSON.
explanation: The ExternalServiceRegistration schema field takes OpenAPI 2.0.x or 3.0.x content in JSON or YAML. Restricting it to 3.0.x JSON understates the supported formats.
