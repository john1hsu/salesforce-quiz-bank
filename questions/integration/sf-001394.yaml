id: sf-001394
product_area: integration
true_statement: A managed event subscription belongs to exactly one client, so several consumers reading one topic independently should use the classic Subscribe RPC.
false_statement: A managed event subscription can be shared by several clients, each keeping its own committed replay ID on the server for the same topic.
explanation: Managed subscriptions can't be shared between clients. When multiple consumers need independent positions on a topic, the regular Subscribe RPC with client-stored replay IDs is the fit.
