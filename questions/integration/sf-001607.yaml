true_statement: In MuleSoft's terms, an application network is the outcome an integration program aims for, while API-led connectivity is the method used to build it.
false_statement: In MuleSoft's terms, API-led connectivity is the outcome an integration program aims for, while an application network is the method used to build it.
explanation: The application network is the target state of reusable, governed APIs linking apps, data and devices. API-led connectivity, with its System, Process and Experience layers, is how you get there.
