id: sf-000907
product_area: integration
true_statement: When sending integers of 2^31 or larger to User Interface API, clients must pass them as quoted strings.
false_statement: When sending integers of 2^31 or larger to User Interface API, clients must pass them in scientific notation.
explanation: Large integers at or above 2^31 have to be sent as quoted strings so they aren't mangled as JSON numbers; scientific notation isn't the documented format. Dates, separately, use ISO 8601.
