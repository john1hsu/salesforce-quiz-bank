id: sf-000840
product_area: integration
true_statement: In Apex, every ConnectApi write operation counts as one DML statement against governor limits.
false_statement: In Apex, ConnectApi write operations count only against API request limits, not against the DML statement limit.
explanation: Each ConnectApi write costs a DML statement, and most ConnectApi calls also count toward the org's API allocation. They consume both budgets.
