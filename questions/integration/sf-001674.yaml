id: sf-001674
product_area: integration
true_statement: Since May 2026, MuleSoft Composer automatically deactivates a flow that has 100 or more consecutive errors over 10 or more days.
false_statement: Since May 2026, MuleSoft Composer automatically deactivates a flow that has 10 or more consecutive errors over 1 or more days.
explanation: The auto-deactivation threshold is 100 consecutive errors spanning at least 10 days. The false version makes the rule far more aggressive.
