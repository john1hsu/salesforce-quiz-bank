id: sf-000142
product_area: integration
true_statement: On an external credential, a named principal uses one identity for the whole org, while a per-user principal authenticates each user individually.
false_statement: On an external credential, a per-user principal uses one identity for the whole org, while a named principal authenticates each user individually.
explanation: Named principals share a single org-wide identity; per-user principals hold each user's own authentication. Either way, the running user needs a mapped permission set or profile to call out.
