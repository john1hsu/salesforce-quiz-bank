id: sf-001252
product_area: integration
true_statement: PlatformEventChannelMember components can't be created or deleted with createMetadata() or deleteMetadata(); a member is removed by deploying destructiveChanges.xml.
false_statement: PlatformEventChannelMember components can be created or deleted with createMetadata() or deleteMetadata(); a member is removed by calling deleteMetadata() directly.
explanation: The CRUD-style Metadata API calls aren't supported for this type, so removal goes through a destructive changes deploy. Calling deleteMetadata() on a member won't work.
