id: sf-001676
product_area: integration
true_statement: MuleSoft Composer flow control is limited to If/Else, For Each over records, and an Error Handler block.
false_statement: MuleSoft Composer flow control includes If/Else, For Each, parallel branches and inline DataWeave transformation blocks.
explanation: Composer deliberately keeps logic simple with just three control blocks and no DataWeave code. Parallel branching and DataWeave belong to full Mule applications on Anypoint Platform.
