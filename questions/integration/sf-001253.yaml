id: sf-001253
product_area: integration
true_statement: A custom streaming channel holds either platform events or change events, never both, and its channel type can't be changed after creation.
false_statement: A custom streaming channel can mix platform events and change events, and its channel type can be changed after creation.
explanation: Each channel is dedicated to one event product, and its ChannelType and EventType are fixed once it exists. Mixing the two in one channel isn't allowed.
