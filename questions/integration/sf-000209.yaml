id: sf-000209
product_area: integration
true_statement: gRPC caps a Pub/Sub API publish request at 4 MB, and Salesforce recommends keeping batches at or below 3 MB.
false_statement: gRPC caps a Pub/Sub API publish request at 1 MB, and Salesforce recommends keeping batches at or below 500 KB.
explanation: A request over 4 MB fails and closes the stream, so batches of about 3 MB and 200 events are advised. The 1 MB figure is the size limit for a single event.
