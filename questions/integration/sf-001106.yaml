id: sf-001106
product_area: integration
true_statement: A Bulk API 2.0 ingest batch that can't finish within 5 minutes is retried up to 20 times, after which the whole job fails.
false_statement: A Bulk API 2.0 ingest batch that can't finish within 5 minutes is retried up to 3 times, after which only that batch fails.
explanation: Bulk API 2.0 makes up to 20 attempts on a slow batch, and exhausting them fails the entire job with remaining data unprocessed. The false statement understates the retries and the impact.
