product_area: integration
true_statement: Bulk API 2.0 ingest jobs draw on the 15,000 daily batches shared with Bulk API 1.0, but query jobs don't consume batches.
false_statement: Bulk API 2.0 query jobs draw on the 15,000 daily batches shared with Bulk API 1.0, but ingest jobs don't consume batches.
explanation: Only ingest work counts against the shared batch allocation. Query jobs have their own limits of 10,000 jobs and 1 TB of results per rolling 24 hours.
