id: sf-001181
product_area: integration
true_statement: A PushTopic's SOQL query can be at most 1,300 characters long, and the PushTopic name at most 25 characters.
false_statement: A PushTopic's SOQL query can be at most 25,000 characters long, and the PushTopic name at most 80 characters.
explanation: The PushTopic streaming allocations cap the defining query at 1,300 characters and the topic name at 25. The larger figures in the false statement overstate both limits, so long queries must be trimmed to fit.
