id: sf-001390
product_area: integration
true_statement: In Metadata API, a NamedCredential with NamedCredentialType Legacy is the only kind that can use the endpoint, protocol and principalType fields deprecated in API 56.0.
false_statement: In Metadata API, a NamedCredential with NamedCredentialType SecuredEndpoint is the only kind that can use the endpoint, protocol and principalType fields deprecated in API 56.0.
explanation: The fields that embed authentication in the named credential are valid only on the Legacy type and were deprecated in API 56.0. SecuredEndpoint is one of the external-credential-based types that don't use them.
