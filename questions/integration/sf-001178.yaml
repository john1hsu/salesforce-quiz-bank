id: sf-001178
product_area: integration
true_statement: With Heroku Connect's default Ordered Writes, a failed insert blocks later changes for that mapping, whereas Merged Writes retries the failed insert on the next update.
false_statement: With Heroku Connect's default Merged Writes, a failed insert blocks later changes for that mapping, whereas Ordered Writes retries the failed insert on the next update.
explanation: Ordered Writes is the default and replays the trigger log strictly in order, so one failed insert holds up the mapping until fixed. Merged Writes condenses changes and retries failed inserts, which the false version attributes to the wrong algorithm.
