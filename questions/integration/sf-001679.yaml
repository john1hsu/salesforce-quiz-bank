id: sf-001679
product_area: integration
true_statement: Salesforce's event-driven decision guide recommends adding a new subscriber to the event bus instead of building another custom point-to-point link.
false_statement: Salesforce's event-driven decision guide recommends building another custom point-to-point link instead of adding a new subscriber to the event bus.
explanation: Publishing once to a bus lets any number of consumers subscribe without new custom connections, which avoids fan-out technical debt. The false version reverses the recommendation.
