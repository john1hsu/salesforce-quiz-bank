id: sf-000352
product_area: integration
true_statement: External Change Data Capture in Salesforce Connect polls the source every 30 minutes by default, or as often as every 5 minutes.
false_statement: External Change Data Capture in Salesforce Connect polls the source every 5 minutes by default, or as often as every minute.
explanation: External CDC, available only with the OData 4.0 and 4.01 adapters, defaults to a 30-minute polling interval that can be shortened to 5 minutes.
