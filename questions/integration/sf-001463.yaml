id: sf-001463
product_area: integration
true_statement: Synchronized data extensions from Marketing Cloud Connect sit at the top level of an Enterprise account, so business units need a query or filter into a shared data extension.
false_statement: Synchronized data extensions from Marketing Cloud Connect are copied into every business unit of an Enterprise account, so business units can segment them directly.
explanation: Synced objects land as _Salesforce data extensions at the Enterprise account's top level. To use them across business units you move the data with a query or filter activity into a shared data extension; they are not copied into each unit.
