id: sf-001535
product_area: integration
true_statement: Salesforce says the values returned by the REST API Limits resource are accurate within five minutes of the allocation being consumed.
false_statement: Salesforce says the values returned by the REST API Limits resource are accurate within one hour of the allocation being consumed.
explanation: The Limits resource is near real time, with tabulated values lagging consumption by up to five minutes. An hour overstates the lag, though rapid repeated calls can still give inconsistent results.
