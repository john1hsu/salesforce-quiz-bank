id: sf-001250
product_area: integration
true_statement: CDC event delivery usage is counted per subscribed client, so 20,000 change events delivered to two clients consume 40,000 of the allocation.
false_statement: CDC event delivery usage is counted per published event, so 20,000 change events delivered to two clients consume 20,000 of the allocation.
explanation: Delivery is metered per subscriber, so each extra API client multiplies usage. Counting each event once regardless of how many clients receive it understates consumption.
