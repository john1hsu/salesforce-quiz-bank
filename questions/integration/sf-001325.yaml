id: sf-001325
product_area: integration
true_statement: Salesforce can't join a distributed transaction or one started outside Salesforce, so multi-system rollback or compensation logic belongs in middleware.
false_statement: Salesforce can join a distributed transaction started outside Salesforce, so multi-system rollback logic can be kept in Apex with savepoints.
explanation: Salesforce is transactional only within itself. Coordinating commit or compensation across systems has to happen in a middleware layer.
