true_statement: Salesforce's decision guide notes that platform events and Change Data Capture both have a 3-day replay period and a 1 MB message limit.
false_statement: Salesforce's decision guide notes that platform events and Change Data Capture both have a 7-day replay period and a 10 MB message limit.
explanation: The event-driven decision guide gives both mechanisms a three-day replay window and a 1 MB cap per message. Seven days and 10 MB overstate both limits.
