id: sf-001604
product_area: integration
true_statement: For an Apex REST URL mapping, an exact match wins, and otherwise the longest matching wildcard pattern handles the request.
false_statement: For an Apex REST URL mapping, the first wildcard pattern deployed wins, even when another class has an exact match for the request.
explanation: Salesforce resolves Apex REST routes by preferring an exact urlMapping match, then the longest matching wildcard. A request matching nothing gets HTTP 404.
