id: sf-000414
product_area: integration
true_statement: In the Data Virtualization pattern, the integration is always started by an event on the Salesforce side, such as a user action or search.
false_statement: In the Data Virtualization pattern, the integration is always started by an event in the external system, such as a source record change.
explanation: 'Virtual integration is synchronous and initiated from Salesforce: a user action, a search or a record update triggers the live query to the source.'
