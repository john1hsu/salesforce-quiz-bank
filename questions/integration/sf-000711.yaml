id: sf-000711
product_area: integration
true_statement: In RemoteSiteSetting metadata, url, isActive and disableProtocolSecurity are required fields, while description is optional.
false_statement: In RemoteSiteSetting metadata, url and description are required fields, while isActive and disableProtocolSecurity are optional.
explanation: The metadata type requires the URL, the active flag and the protocol-security flag; the description can be left out. The false version swaps which fields are required.
