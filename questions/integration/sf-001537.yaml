id: sf-001537
product_area: integration
true_statement: The /limits/recordCount resource returns approximate, cached per-object counts that exclude recycle-bin records, so an exact figure needs a SOQL count() query.
false_statement: The /limits/recordCount resource returns exact, real-time per-object counts that include recycle-bin records, so no SOQL count() query is needed.
explanation: recordCount serves a snapshot refreshed on no fixed schedule and leaves out recycled and archived rows. When precision matters, Salesforce points to a count() query instead.
