id: sf-000417
product_area: integration
true_statement: When the hourly publishing allocation is exceeded, the publish call fails with LIMIT_EXCEEDED and the event is neither published nor queued.
false_statement: When the hourly publishing allocation is exceeded, the publish call returns LIMIT_EXCEEDED and the event is queued for publishing once usage drops.
explanation: Over the publishing allocation the event is simply rejected; nothing holds it for later, so the publisher must retry. No automatic queueing happens.
