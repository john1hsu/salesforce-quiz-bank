id: sf-000704
product_area: integration
true_statement: Each Apex callout's timeout can be set up to 120 seconds, and the total time of all callouts in one transaction is also capped at 120 seconds.
false_statement: Each Apex callout's timeout can be set up to 120 seconds, and the total time of all callouts in one transaction is capped at 600 seconds.
explanation: The 120-second ceiling applies both per callout and to the sum across the transaction. There's no larger 600-second budget for the whole transaction.
