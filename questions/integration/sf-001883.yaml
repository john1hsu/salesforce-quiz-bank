true_statement: The Agent2Agent protocol carries JSON-RPC 2.0 payloads over HTTP(S) and uses Server-Sent Events for streaming.
false_statement: The Agent2Agent protocol carries JSON-RPC 2.0 payloads over HTTP(S) and uses WebSockets for streaming.
explanation: 'A2A reuses existing web standards: HTTP(S) transport, JSON-RPC 2.0 messages and SSE for streamed responses. WebSockets are not its streaming mechanism.'
