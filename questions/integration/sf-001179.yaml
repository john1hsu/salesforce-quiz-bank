id: sf-001179
product_area: integration
true_statement: Each Heroku Connect mapping is read-only by default and becomes read-write only when its option to write database updates to Salesforce is ticked.
false_statement: Each Heroku Connect mapping is read-write by default and becomes read-only only when its option to write database updates to Salesforce is cleared.
explanation: Mappings start as one-way syncs from Salesforce into Postgres, and write-back must be switched on per mapping. The false version gets the default direction wrong.
