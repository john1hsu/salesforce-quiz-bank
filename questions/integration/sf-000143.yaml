id: sf-000143
product_area: integration
true_statement: Access tokens and other named credential secrets can't be packaged, so they must be populated after install through Setup or the Connect API.
false_statement: Access tokens and other named credential secrets are packaged with the credential, so they arrive populated after install.
explanation: Packages carry the credential definitions but not the secrets. Release plans need a step to fill in tokens in each target org.
