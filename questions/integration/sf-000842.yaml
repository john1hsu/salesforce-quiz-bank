id: sf-000842
product_area: integration
true_statement: Salesforce product guidance points record integrations to Bulk API 2.0 once a job generally exceeds 2,000 records.
false_statement: Salesforce product guidance points record integrations to Bulk API 2.0 once a job generally exceeds 50,000 records.
explanation: Below about 2,000 records, REST sObject and Composite resources fit better; above it, Bulk API 2.0's job model pays off. Waiting until 50,000 records sets the threshold far too high.
