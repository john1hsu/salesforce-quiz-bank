product_area: integration
true_statement: In Salesforce Voice with Amazon Connect, Amazon Transcribe covers only the first 15 minutes of a call, so Contact Lens suits longer calls.
false_statement: In Salesforce Voice with Amazon Connect, Contact Lens covers only the first 15 minutes of a call, so Amazon Transcribe suits longer calls.
explanation: A Lambda limitation stops Amazon Transcribe-based transcription after 15 minutes. Contact Lens has no such cutoff, which is why it is the option for long calls.
