id: sf-001108
product_area: integration
true_statement: Bulk API processing has a dedicated limit of 60,000 milliseconds of server CPU time, separate from the per-transaction Apex CPU limit.
false_statement: Bulk API processing shares the per-transaction Apex CPU limit of 10,000 milliseconds rather than having a dedicated CPU limit.
explanation: Bulk work is measured against its own 60-second server CPU ceiling. It is not held to the general Apex CPU limit for a transaction.
