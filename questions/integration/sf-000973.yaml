id: sf-000973
product_area: integration
true_statement: In API-led connectivity, System APIs connect directly to systems of record such as ERPs and CRMs and shield consumers from changes in them.
false_statement: In API-led connectivity, Experience APIs connect directly to systems of record such as ERPs and CRMs and shield consumers from changes in them.
explanation: System APIs form the foundation layer that unlocks data in core systems and insulates callers from their complexity. Experience APIs sit at the top and shape data for a channel instead of touching source systems.
