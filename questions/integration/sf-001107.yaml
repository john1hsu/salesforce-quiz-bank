id: sf-001107
product_area: integration
true_statement: An org can run 10,000 Bulk API 2.0 query jobs per rolling 24 hours, a meter separate from the shared batch pool.
false_statement: An org can run 1,000 Bulk API 2.0 query jobs per rolling 24 hours, a meter separate from the shared batch pool.
explanation: Bulk API 2.0 queries have their own daily allowance of 10,000 jobs rather than drawing on ingest batches. One thousand is not the documented figure.
