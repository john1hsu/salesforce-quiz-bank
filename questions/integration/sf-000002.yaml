id: sf-000002
product_area: integration
true_statement: High-volume platform event messages are retained on the event bus for 72 hours.
false_statement: High-volume platform event messages are retained on the event bus for 24 hours.
explanation: High-volume platform event messages stay on the event bus for 72 hours. The 24-hour window applies only to legacy standard-volume events defined before Spring '19, and new standard-volume events can no longer be defined.
