id: sf-000978
product_area: integration
true_statement: An External Service's read-only systemVersion can't be upgraded in place; you recreate the service from the same spec and repoint references.
false_statement: An External Service's systemVersion can be upgraded in place from Setup, and existing flow references update automatically.
explanation: systemVersion is read-only, so moving to a newer version means registering the spec again and pointing flows and code at the new service. There is no in-place upgrade that rewires references for you.
