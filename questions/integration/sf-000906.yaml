id: sf-000906
product_area: integration
true_statement: 'UI API supports HTTP caching: a client sends an ETag back in If-None-Match and gets 304 Not Modified if its copy is still current.'
false_statement: 'UI API supports HTTP caching: a client sends an ETag back in If-None-Match and gets 204 No Content if its copy is still current.'
explanation: UI API responses include ETags, and a conditional request whose ETag still matches is answered with 304 Not Modified, returning headers only.
