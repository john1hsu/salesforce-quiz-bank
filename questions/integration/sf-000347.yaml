true_statement: Anypoint Runtime Fabric is a container service that the customer runs in its own data center or in AWS or Azure.
false_statement: Anypoint Runtime Fabric is a container service that MuleSoft operates for the customer across its global cloud regions.
explanation: Runtime Fabric is customer-operated infrastructure on premises or in AWS or Azure. The MuleSoft-operated managed option is CloudHub, not Runtime Fabric.
