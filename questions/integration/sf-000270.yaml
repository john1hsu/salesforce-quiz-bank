id: sf-000270
product_area: integration
true_statement: An event relay that sends event bus messages to Amazon EventBridge is created in a stopped state and is started after the partner event source is activated.
false_statement: An event relay that sends event bus messages to Amazon EventBridge is created in a running state and starts before the partner event source is activated.
explanation: A new event relay begins stopped; you activate the partner event source in EventBridge first and then start the relay. It does not begin running on creation.
