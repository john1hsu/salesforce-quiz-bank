id: sf-000266
product_area: integration
true_statement: 'Composite Batch is not transactional: each successful subrequest commits at once and isn''t rolled back if a later subrequest fails.'
false_statement: 'Composite Batch is fully transactional: all subrequests commit together and are rolled back if a later subrequest fails.'
explanation: Composite Batch runs up to 25 independent subrequests serially with no shared transaction, so earlier successes stay committed. Use sObject Tree or Composite with allOrNone when you need rollback.
