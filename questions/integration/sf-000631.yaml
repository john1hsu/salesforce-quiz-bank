id: sf-000631
product_area: integration
true_statement: A Salesforce GraphQL API subquery returns 10 records by default, so pagination is needed to read more.
false_statement: A Salesforce GraphQL API subquery returns 200 records by default, so pagination is needed to read more.
explanation: Without a page size, only 10 records come back per subquery; the ceiling is 2,000. A 200-record default is wrong.
