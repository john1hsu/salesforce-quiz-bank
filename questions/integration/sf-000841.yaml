id: sf-000841
product_area: integration
true_statement: ConnectApi methods run as the context user and don't support System.runAs, and most need @IsTest(SeeAllData=true) in tests.
false_statement: ConnectApi methods support System.runAs in tests, and most work with test-created data without SeeAllData=true.
explanation: ConnectApi ignores runAs and usually needs org data, so tests typically set SeeAllData=true. Some methods instead need canned output registered with a setTest method.
