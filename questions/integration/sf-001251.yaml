id: sf-001251
product_area: integration
true_statement: Enterprise Edition allows 1,000 concurrent CometD clients across streaming event types, while Developer Edition allows 20.
false_statement: Enterprise Edition allows 2,000 concurrent CometD clients across streaming event types, while Developer Edition allows 200.
explanation: The shared concurrent CometD client cap is 2,000 for Performance and Unlimited, 1,000 for Enterprise and 20 for Developer Edition. The false figures give Enterprise the top-tier limit and inflate Developer tenfold.
