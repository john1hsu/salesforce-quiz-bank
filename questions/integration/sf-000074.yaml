id: sf-000074
product_area: integration
true_statement: Change Data Capture applies field-level security to what a subscriber receives, but it does not apply sharing settings.
false_statement: Change Data Capture applies sharing settings to what a subscriber receives, but it does not apply field-level security.
explanation: Field-level security restricts which fields a subscriber sees, while record sharing is not enforced on change events. The false version swaps the two.
