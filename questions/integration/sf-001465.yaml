id: sf-001465
product_area: integration
true_statement: Free orgs, which include Developer Edition orgs and trial orgs of any edition, get 10,000 delivered PushTopic notifications per 24 hours.
false_statement: Free orgs, which include Developer Edition orgs and trial orgs of any edition, get 50,000 delivered PushTopic notifications per 24 hours.
explanation: Salesforce treats Developer Edition and trial orgs as free orgs with a 10,000 daily delivery allocation. The 50,000 figure belongs to paid editions other than Enterprise, Performance and Unlimited.
