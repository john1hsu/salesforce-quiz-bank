id: sf-000410
product_area: integration
true_statement: Production orgs allow up to 25 concurrent long-running API requests, meaning inbound calls lasting 20 seconds or more.
false_statement: Production orgs allow up to 100 concurrent long-running API requests, meaning inbound calls lasting 20 seconds or more.
explanation: The concurrency cap on calls of 20 seconds or longer is 25 in production and sandboxes, and 5 in Developer Edition and trial orgs. Shorter calls have no concurrency cap.
