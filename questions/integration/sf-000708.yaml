id: sf-000708
product_area: integration
true_statement: Salesforce API query results come back in batches of 500 rows by default, and the batch size can be raised to at most 2,000.
false_statement: Salesforce API query results come back in batches of 2,000 rows by default, and the batch size can be raised to at most 10,000.
explanation: The default query batch is 500 rows with a ceiling of 2,000. The false version shifts both numbers up, using the real maximum as the default.
