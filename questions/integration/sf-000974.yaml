id: sf-000974
product_area: integration
true_statement: MuleSoft architects advise adding an Experience API only when consumers need a different contract or the Process API definition is expected to change.
false_statement: MuleSoft architects advise adding an Experience API only when the system of record behind the System API is expected to be replaced.
explanation: The layers are not mandatory, and an Experience layer earns its cost only when consumers need their own contract or the Process API is likely to change. Swapping a backend system is what the System layer insulates against, not the reason for an Experience API.
