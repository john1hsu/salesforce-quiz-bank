id: sf-001748
product_area: integration
true_statement: The Telephony Integration API's voice call update is asynchronous, returns a pending status, and should be sent only once per call.
false_statement: The Telephony Integration API's voice call update is synchronous, returns the saved record, and can be resent safely to correct durations.
explanation: The PATCH returns a pending status whose result can't be polled. Sending it again overwrites the hold and interaction durations instead of correcting them.
