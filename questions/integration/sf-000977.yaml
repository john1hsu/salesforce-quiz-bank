id: sf-000977
product_area: integration
true_statement: Operations from a registered External Service become strongly typed Apex classes and methods in the ExternalService namespace.
false_statement: Operations from a registered External Service become loosely typed Apex maps that must be parsed with the JSON class in the Http namespace.
explanation: Registration generates classes and methods under the ExternalService namespace with schema types mapped to Apex types, so developers skip manual JSON parsing. Hand-parsing with Http and JSON is the alternative that External Services removes.
