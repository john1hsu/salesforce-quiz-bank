true_statement: Anypoint Platform Private Cloud Edition runs Runtime Manager on premises and can deploy to any target except CloudHub.
false_statement: Anypoint Platform Private Cloud Edition runs Runtime Manager on premises and can deploy to any target except Runtime Fabric.
explanation: The on-premises edition of the platform cannot target MuleSoft-hosted CloudHub, so it needs an on-premises runtime plane. Runtime Fabric is not the excluded target.
