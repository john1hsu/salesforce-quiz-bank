id: sf-000350
product_area: integration
true_statement: If a REST API request's Accept header is missing or malformed, Salesforce returns the response as JSON.
false_statement: If a REST API request's Accept header is missing or malformed, Salesforce returns the response as XML.
explanation: The REST API supports JSON and XML, chosen with the Accept header, and falls back to JSON when that header is absent or malformed.
