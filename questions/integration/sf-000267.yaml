id: sf-000267
product_area: integration
true_statement: An sObject Tree request can create up to 200 records in total, across no more than five object types and trees at most five levels deep.
false_statement: An sObject Tree request can create up to 2,000 records in total, across no more than ten object types and trees at most ten levels deep.
explanation: sObject Tree is capped at 200 records, five object types and five levels per request, and it is all-or-nothing. The 2,000 and ten figures are inflated.
