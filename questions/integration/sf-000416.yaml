id: sf-000416
product_area: integration
true_statement: An Apex trigger subscribed to a platform event does not use the daily event delivery allocation, but a Pub/Sub API client does.
false_statement: A Pub/Sub API client subscribed to a platform event does not use the daily event delivery allocation, but an Apex trigger does.
explanation: The delivery allocation counts only API-based subscribers such as Pub/Sub API, CometD, empApi and event relays. Triggers, flows and processes consume no delivery allocation, so the false statement reverses the two.
