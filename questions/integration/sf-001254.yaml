id: sf-001254
product_area: integration
true_statement: Custom channels and filter expressions serve Pub/Sub API clients, CometD clients and event relays, while Apex triggers subscribe to events without using channels.
false_statement: Custom channels and filter expressions serve Pub/Sub API clients, CometD clients and Apex triggers, which must subscribe through a channel to get filtered events.
explanation: Channel filtering applies to external-style subscribers such as Pub/Sub API, CometD and event relays. Apex triggers subscribe directly to the event, so channels add nothing for them.
