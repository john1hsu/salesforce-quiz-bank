id: sf-001609
product_area: integration
true_statement: In API Visualizer, consumers are grouped by client application only when a ClientId enforcement policy is in place; otherwise their traffic falls under an External Traffic node.
false_statement: In API Visualizer, consumers are always grouped by client application, whether or not a ClientId enforcement policy is in place.
explanation: Without ClientId enforcement, Visualizer can't tell callers apart, so it lumps their traffic into a single External Traffic node at the top of the canvas.
