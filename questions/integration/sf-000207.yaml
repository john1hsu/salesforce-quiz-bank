id: sf-000207
product_area: integration
true_statement: A Bulk API 2.0 ingest job can stay open for at most 24 hours, and its results can be retrieved for 7 days after completion.
false_statement: A Bulk API 2.0 ingest job can stay open for at most 7 days, and its results can be retrieved for 24 hours after completion.
explanation: Open jobs must be closed within a day. Once a job finishes, its success and failure results stay available for seven days before the job is deleted.
