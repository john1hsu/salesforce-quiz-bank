id: sf-001466
product_area: integration
true_statement: For generic streaming events, every paid edition can define up to 1,000 streaming channels, while free orgs can define 200.
false_statement: For generic streaming events, every paid edition can define up to 100 streaming channels, while free orgs can define 20.
explanation: Generic events have their own channel cap of 1,000 per paid org and 200 in free orgs. The 100 and 20 figures are far below that and resemble PushTopic or client counts instead.
