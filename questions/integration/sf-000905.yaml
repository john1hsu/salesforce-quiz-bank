id: sf-000905
product_area: integration
true_statement: UI API batch object-info requests accept up to 2,000 objects, while batch create, update and delete accept up to 200 records per request.
false_statement: UI API batch object-info requests accept up to 200 objects, while batch create, update and delete accept up to 2,000 records per request.
explanation: Metadata-only batch reads of object info can cover up to 2,000 objects, but record writes in a batch are capped at 200. The false statement reverses the two numbers.
