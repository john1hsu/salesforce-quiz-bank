id: sf-000353
product_area: integration
true_statement: Apex writes to external objects go through an asynchronous background queue, while writes from the UI and flows run synchronously.
false_statement: UI and flow writes to external objects go through an asynchronous background queue, while writes from Apex run synchronously.
explanation: Salesforce Connect queues Apex writes in the background and runs UI and flow writes immediately. Either way the remote system executes the write and resolves conflicts.
