id: sf-000902
product_area: integration
true_statement: The SOAP API create() and update() calls accept at most 200 records per call, and a larger request fails entirely.
false_statement: The SOAP API create() and update() calls accept at most 2,000 records per call, and a larger request fails entirely.
explanation: Synchronous SOAP writes are capped at 200 records per call, which is why very large loads are usually sent through Bulk API 2.0 instead.
