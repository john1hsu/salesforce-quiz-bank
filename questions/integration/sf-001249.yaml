id: sf-001249
product_area: integration
true_statement: Without an add-on, Enterprise Edition gets 25,000 Change Data Capture event deliveries per rolling 24 hours, half the Performance and Unlimited figure.
false_statement: Without an add-on, Enterprise Edition gets 50,000 Change Data Capture event deliveries per rolling 24 hours, the same as Performance and Unlimited.
explanation: The default CDC delivery allocation is 50,000 for Performance and Unlimited, 25,000 for Enterprise and 10,000 for Developer Edition. Enterprise does not match the higher editions.
