id: sf-000707
product_area: integration
true_statement: A user can hold up to 10 open query cursors at once; opening another releases the oldest one.
false_statement: A user can hold up to 50 open query cursors at once; opening another releases the oldest one.
explanation: The cursor cap per user is ten, and exceeding it frees the oldest cursor. That's why a shared integration user should run queries serially or be split per application.
