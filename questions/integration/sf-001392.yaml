id: sf-001392
product_area: integration
true_statement: A Salesforce org can create at most 200 unique managed event subscriptions for Pub/Sub API.
false_statement: A Salesforce org can create at most 2,000 unique managed event subscriptions for Pub/Sub API.
explanation: The documented cap is 200 managed subscriptions per org. Ten times that figure isn't the limit, and the subscriptions also draw on the normal event delivery allocations.
