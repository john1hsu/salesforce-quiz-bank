id: sf-000271
product_area: integration
true_statement: In the fanout event pattern, all subscribers read the same message from a single queue, which makes it harder to confirm a given subscriber received it.
false_statement: In the fanout event pattern, each subscriber receives its own unique copy of the message, which makes it easy to confirm a given subscriber received it.
explanation: Fanout shares one queued message among all subscribers, which is efficient for mass notifications but weak on per-subscriber confirmation. A unique copy per subscriber describes the publish/subscribe pattern instead.
