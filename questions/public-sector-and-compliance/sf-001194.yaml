true_statement: OMB memorandum M-22-09 tells federal agencies to enforce MFA at the application layer rather than at the network layer.
false_statement: OMB memorandum M-22-09 tells federal agencies to enforce MFA at the network layer rather than at the application layer.
explanation: M-22-09 moves MFA enforcement to the application layer, in line with zero trust's rejection of trust based on network location. Enforcing at the network layer is the perimeter model the memo moves away from.
