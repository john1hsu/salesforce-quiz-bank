id: sf-001824
product_area: public-sector-and-compliance
true_statement: ITAR's encrypted-storage carve-out requires FIPS 140-2 or successor modules, or other means at least comparable to AES-128.
false_statement: ITAR's encrypted-storage carve-out requires FIPS 140-2 or successor modules, or other means at least comparable to AES-256.
explanation: The carve-out sets its floor at AES-128-equivalent strength alongside validated FIPS modules and NIST-guided key management. AES-256 is stronger than what the rule demands.
