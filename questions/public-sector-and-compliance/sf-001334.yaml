true_statement: ISO/IEC 38500:2024 grows from six to eleven guiding principles, which it adopts from ISO 37000 on organizational governance.
false_statement: ISO/IEC 38500:2024 cuts its guiding principles from eleven to six, dropping the ones it had adopted from ISO 37000.
explanation: The 2024 edition expands the principle set to eleven and aligns with ISO 37000. The earlier 2015 edition was the one with six principles.
