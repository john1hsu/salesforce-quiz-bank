id: sf-000783
product_area: public-sector-and-compliance
true_statement: The 2014 FISMA amendments codified the Department of Homeland Security's authority to administer security policy for non-national-security federal systems.
false_statement: The 2014 FISMA amendments codified the Department of Defense's authority to administer security policy for non-national-security federal systems.
explanation: The modernization act gave DHS that role, including binding operational directives and the federal incident center. DoD is not the administrator for civilian systems under the act.
