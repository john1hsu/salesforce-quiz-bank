id: sf-000719
product_area: public-sector-and-compliance
true_statement: The SP 800-53B privacy baseline applies regardless of a system's impact level, instead of coming in low, moderate and high versions.
false_statement: The SP 800-53B privacy baseline comes in low, moderate and high versions, chosen by the system's FIPS 199 impact level.
explanation: Only the security baselines are split by impact level. The single privacy baseline is driven by the processing of personal information and tailored from a privacy risk assessment.
