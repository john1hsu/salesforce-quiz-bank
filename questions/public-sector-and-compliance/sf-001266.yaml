id: sf-001266
product_area: public-sector-and-compliance
true_statement: Because Salesforce's SOC 1 reports cover six-month windows, a customer's audit year usually needs two reports plus a bridge letter for any gap.
false_statement: Because Salesforce's SOC 1 reports cover twelve-month windows, a customer's audit year usually needs one report plus a bridge letter for any gap.
explanation: Salesforce lists its SOC 1 versions in six-month periods, so a full year of coverage takes two of them. A bridge letter covers any days the reports leave out.
