product_area: public-sector-and-compliance
true_statement: Setting a field's Field Usage to Hidden or DeprecateCandidate in Salesforce does not hide or expose the field to any user.
false_statement: Setting a field's Field Usage to Hidden in Salesforce removes the field from page layouts and blocks API access for all users.
explanation: 'Data classification attributes are informational only: Field Usage records a decision about the field but changes no access. Field-level security and layouts still control visibility.'
