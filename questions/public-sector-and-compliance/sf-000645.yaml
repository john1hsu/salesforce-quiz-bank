id: sf-000645
product_area: public-sector-and-compliance
true_statement: HHS treats a cloud provider that stores ePHI for a customer as a business associate even if it holds only encrypted data and no decryption key.
false_statement: HHS treats a cloud provider that stores ePHI for a customer as a mere conduit if it holds only encrypted data and no decryption key.
explanation: 'Lacking the key doesn''t change the provider''s status: maintaining ePHI makes it a business associate. The conduit exception covers only transmission services with transient storage.'
