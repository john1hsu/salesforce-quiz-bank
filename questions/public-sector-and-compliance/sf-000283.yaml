id: sf-000283
product_area: public-sector-and-compliance
true_statement: On a Lightning page, a right-sidebar template gives keyboard users a shorter path to the main content than a left-sidebar template.
false_statement: On a Lightning page, a left-sidebar template gives keyboard users a shorter path to the main content than a right-sidebar template.
explanation: With a left sidebar, tab order runs through the sidebar before reaching the main content, which lengthens keyboard navigation. A right sidebar puts the main content earlier in the tab order.
