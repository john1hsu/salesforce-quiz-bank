product_area: public-sector-and-compliance
true_statement: The Revised 508 Standards incorporate WCAG 2.0 by reference, requiring its Level A and Level AA success criteria.
false_statement: The Revised 508 Standards incorporate WCAG 2.0 by reference, requiring its Level A, Level AA and Level AAA success criteria.
explanation: Section 508's technical rules point to WCAG 2.0 and require conformance at Levels A and AA. Level AAA is not part of the requirement.
