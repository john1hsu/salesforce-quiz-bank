id: sf-000917
product_area: public-sector-and-compliance
true_statement: Under the EU Cloud Sovereignty Framework, a service's overall SEAL rating is the lowest level it reaches on any of the eight sovereignty objectives.
false_statement: Under the EU Cloud Sovereignty Framework, a service's overall SEAL rating is the average of the levels it reaches across the eight sovereignty objectives.
explanation: The framework takes the weakest objective as the overall score, so one low rating caps the whole service. It doesn't average the objectives.
