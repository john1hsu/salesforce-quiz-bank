id: sf-000787
product_area: public-sector-and-compliance
true_statement: Salesforce Health Check can compare an org's security settings against a custom baseline imported as an XML file.
false_statement: Salesforce Health Check can compare an org's security settings only against Salesforce's recommended baseline, with no custom import.
explanation: Besides Salesforce's own baseline, Health Check accepts a custom baseline imported as XML, which Trailhead suggests agreeing with IT or compliance. So it is not limited to the default baseline.
