id: sf-001193
product_area: public-sector-and-compliance
true_statement: NIST notes that the enhanced identity governance approach to zero trust suits SaaS offerings where customers can't run their own zero trust components.
false_statement: NIST notes that the micro-segmentation approach to zero trust suits SaaS offerings where customers can't run their own zero trust components.
explanation: SP 800-207 says the identity-driven approach fits SaaS, which is why a customer's zero trust design for Salesforce leans on identity, MFA and least privilege. Micro-segmentation relies on gateway enforcement points around resources, which SaaS customers typically can't deploy.
