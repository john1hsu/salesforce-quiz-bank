id: sf-000919
product_area: public-sector-and-compliance
true_statement: Salesforce re-fetches Shield Cache-Only Keys after cache flushes, which happen at least every 72 hours, so the customer's key service becomes an org dependency.
false_statement: Salesforce fetches Shield Cache-Only Keys once at setup and caches them permanently, so the customer's key service isn't an org dependency.
explanation: Cached keys are flushed at least every 72 hours and must be fetched again, so if the customer's key service is down, encrypted data can become unavailable.
