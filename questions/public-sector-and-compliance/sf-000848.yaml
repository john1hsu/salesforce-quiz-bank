id: sf-000848
product_area: public-sector-and-compliance
true_statement: In a FedRAMP Rev5 monthly POA&M, every unique vulnerability is tracked as its own item rather than grouped.
false_statement: In a FedRAMP Rev5 monthly POA&M, vulnerabilities are grouped into one item per affected security control.
explanation: The legacy continuous monitoring playbook requires a separate POA&M entry for each unique vulnerability. Grouping them under a control would hide individual findings.
