id: sf-000780
product_area: public-sector-and-compliance
true_statement: After an agency emails its signed ATO letter to the FedRAMP PMO, the PMO grants that agency's users permanent access to the package.
false_statement: After an agency emails its signed ATO letter to the FedRAMP PMO, the PMO grants that agency's users access to the package for one more year.
explanation: Sending the signed ATO letter to the PMO converts the agency's temporary review access into permanent package access. There is no one-year renewal tied to the letter.
