id: sf-001478
product_area: public-sector-and-compliance
true_statement: ISO/IEC 27017 gives cloud security guidance to both the cloud service provider and the cloud service customer.
false_statement: ISO/IEC 27017 gives cloud security guidance only to the cloud service provider, leaving customer duties to ISO/IEC 27018.
explanation: The standard is written for both sides of the cloud relationship, so a certified provider does not relieve the customer of its own controls. ISO/IEC 27018 is about personal data in public clouds, not customer duties in general.
