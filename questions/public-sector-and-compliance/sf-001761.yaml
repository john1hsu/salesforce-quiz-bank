true_statement: AWS reported that the FedRAMP 20x Phase Two pilot required automated validation for at least 70% of Key Security Indicators.
false_statement: AWS reported that the FedRAMP 20x Phase Two pilot required automated validation for at least 50% of Key Security Indicators.
explanation: AWS's analysis cites a 70% minimum share of KSIs validated automatically, plus Moderate machine-based checks at least every three days. Fifty percent is too low.
