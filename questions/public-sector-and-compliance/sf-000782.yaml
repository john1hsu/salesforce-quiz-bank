true_statement: The original FISMA was passed in December 2002 as part of the E-Government Act, Public Law 107-347.
false_statement: The original FISMA was passed in December 2014 as part of the E-Government Act, Public Law 107-347.
explanation: FISMA dates from the 2002 E-Government Act. 2014 is the year of the Federal Information Security Modernization Act, which amended it and kept the acronym.
