true_statement: The Data Classification Upload tool accepts a CSV of at most 10,000 rows, each naming an object, a field and a sensitivity level.
false_statement: The Data Classification Upload tool accepts a CSV of at most 2,000 rows, each naming an object, a field and a sensitivity level.
explanation: Bulk classification uploads allow up to 10,000 rows. The 2,000 figure applies to the download, which keeps the first 2,000 records per sensitivity value.
