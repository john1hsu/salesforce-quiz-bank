id: sf-001616
product_area: public-sector-and-compliance
true_statement: ISO/IEC 27018 is written for public cloud providers acting as PII processors, handling personal data on behalf of their customers.
false_statement: ISO/IEC 27018 is written for public cloud providers acting as PII controllers, deciding the purposes for which personal data is processed.
explanation: The code of practice targets cloud providers that process PII under contract for customers. It may be relevant to controllers, but its guidance is framed from the processor's side.
