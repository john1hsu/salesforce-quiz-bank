true_statement: ISO 26000 on social responsibility lists organizational governance as one of its seven core subjects, and it is guidance rather than a certifiable standard.
false_statement: ISO 26000 on social responsibility lists organizational governance as one of its seven core subjects, and organizations can be certified against it.
explanation: ISO 26000 puts governance beside subjects such as human rights and the environment. Like ISO 37000, it offers guidance and can't be certified against.
