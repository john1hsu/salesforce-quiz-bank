id: sf-000498
product_area: public-sector-and-compliance
true_statement: ISO/IEC 27001 is delivered as a certificate against a management-system standard, whereas SOC 2 is delivered as an audit report.
false_statement: ISO/IEC 27001 is delivered as an audit report on controls, whereas SOC 2 is delivered as a certificate against a management-system standard.
explanation: An accredited body certifies an ISMS to ISO/IEC 27001, while SOC 1 and SOC 2 take the form of attestation reports. The false statement swaps the two forms.
