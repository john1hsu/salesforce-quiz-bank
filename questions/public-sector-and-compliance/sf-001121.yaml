product_area: public-sector-and-compliance
true_statement: A HITRUST r2 assessment is valid for two years with an interim review, while the e1 and i1 assessments are each valid for one year.
false_statement: A HITRUST r2 assessment is valid for three years with annual surveillance, while the e1 and i1 assessments are each valid for one year.
explanation: The risk-based r2 assessment lasts two years and needs an interim review partway through. e1 and i1 are one-year assessments.
