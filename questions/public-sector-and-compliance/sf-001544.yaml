id: sf-001544
product_area: public-sector-and-compliance
true_statement: SOX Section 404(a) management assessment applies to all public companies, but the Dodd-Frank Act permanently exempted issuers under $75 million in public float from 404(b) auditor attestation.
false_statement: SOX Section 404(b) auditor attestation applies to all public companies, but the Dodd-Frank Act permanently exempted issuers under $75 million in public float from 404(a) management assessment.
explanation: Every public company must include management's ICFR assessment under 404(a). The exemption for small issuers applies to the auditor attestation in 404(b), not the other way around.
