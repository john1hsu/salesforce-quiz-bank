id: sf-001049
product_area: public-sector-and-compliance
true_statement: Under SP 800-60, a single information type such as public data may be rated not applicable for confidentiality, but a whole system may not.
false_statement: Under SP 800-60, a whole system may be rated not applicable for confidentiality when every information type it handles is public data.
explanation: Not applicable is allowed for an individual information type, but the guide never lets a system's confidentiality rating fall to not applicable, even if all its data is public.
