true_statement: The 2023 G20/OECD Principles of Corporate Governance added guidance on sustainability and resilience, including climate-related risks, for the first time.
false_statement: The 2023 G20/OECD Principles of Corporate Governance removed earlier guidance on sustainability and resilience, leaving climate-related risks to national regulators.
explanation: The September 2023 revision introduced a new chapter on sustainability and resilience that covers climate risk. It added that topic rather than dropping it.
