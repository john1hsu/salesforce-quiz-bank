id: sf-000086
product_area: public-sector-and-compliance
true_statement: Government Cloud Plus's FedRAMP High authorization covers the service boundary, so each agency still issues its own ATO against the package.
false_statement: Government Cloud Plus's FedRAMP High authorization acts as a blanket ATO, so agencies no longer issue their own ATO against the package.
explanation: The FedRAMP authorization applies to Salesforce's boundary, not to an agency's org; the dozens of ATO letters on the Marketplace are separate agency decisions. It is not a blanket ATO for every customer.
