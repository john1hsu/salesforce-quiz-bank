product_area: public-sector-and-compliance
true_statement: A TX-RAMP Provisional certification lets a Texas agency contract for a cloud service for up to 18 months while the provider pursues full certification.
false_statement: A TX-RAMP Provisional certification lets a Texas agency contract for a cloud service for up to 6 months while the provider pursues full certification.
explanation: Provisional status is a bridge of at most 18 months toward a full Level 1 or Level 2 certification. Six months is too short.
