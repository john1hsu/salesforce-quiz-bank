product_area: public-sector-and-compliance
true_statement: Although SOC 3 is a general-use report, Salesforce's compliance site requires a login before its SOC 3 documents can be downloaded.
false_statement: Because SOC 3 is a general-use report, Salesforce's compliance site offers its SOC 3 documents as public links that need no login to download.
explanation: General-use status means the report may be freely shared, but Salesforce's document pages still put downloads behind a compliance-site login, so buyers should plan for an account.
