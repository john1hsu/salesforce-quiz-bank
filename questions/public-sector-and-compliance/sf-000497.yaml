true_statement: The deadline for moving an ISO/IEC 27001:2013 certification to the 2022 edition was 31 October 2025.
false_statement: The deadline for moving an ISO/IEC 27001:2013 certification to the 2022 edition is 31 October 2027.
explanation: Organizations had a 36-month transition ending 31 October 2025, after which 2013-based certificates expire or are withdrawn.
