id: sf-001690
product_area: public-sector-and-compliance
true_statement: ISO does not certify organizations itself; certification to a management system standard is optional and done by external certification bodies.
false_statement: ISO certifies organizations itself, and certification to a management system standard is mandatory for any organization that adopts one.
explanation: ISO writes the standards but leaves certification to independent bodies, and organizations may adopt a standard without certifying. The false version makes ISO the certifier and certification compulsory.
