id: sf-000282
product_area: public-sector-and-compliance
true_statement: Salesforce's posted Accessibility Conformance Reports are contractual only when the contract explicitly includes them or an equivalent.
false_statement: Salesforce's posted Accessibility Conformance Reports are contractual for every customer once they are published for a product release.
explanation: Publishing an ACR does not make it a commitment; an agency that wants one must negotiate it into the contract. Treating posted reports as automatically binding is a common procurement mistake.
