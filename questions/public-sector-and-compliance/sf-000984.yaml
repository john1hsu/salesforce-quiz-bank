id: sf-000984
product_area: public-sector-and-compliance
true_statement: During an org migration to Government Cloud, Email-to-Case messages are held for at most 24 hours.
false_statement: During an org migration to Government Cloud, Email-to-Case messages are held for at most 72 hours.
explanation: Salesforce's migration guidance caps the hold on inbound Email-to-Case messages at 24 hours during the move. 72 hours overstates the buffer and could lead a team to plan an over-long cutover window.
