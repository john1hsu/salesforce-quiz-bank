id: sf-001687
product_area: public-sector-and-compliance
true_statement: IRS guidance requires a FedRAMP authorization for any cloud holding Federal Tax Information, but FedRAMP alone does not satisfy Publication 1075.
false_statement: IRS guidance treats a FedRAMP Moderate authorization as fully satisfying Publication 1075 for any cloud holding Federal Tax Information.
explanation: FedRAMP at moderate impact or higher is a precondition, yet Publication 1075 adds its own conditions such as onshore support, tenant isolation and notification. A FedRAMP or 3PAO attestation is not enough by itself.
