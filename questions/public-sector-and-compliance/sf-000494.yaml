id: sf-000494
product_area: public-sector-and-compliance
true_statement: CJIS Security Policy v6.0 requires a device session lock after at most 30 minutes of inactivity.
false_statement: CJIS Security Policy v6.0 requires a device session lock after at most 120 minutes of inactivity.
explanation: Control AC-11 caps inactivity before session lock at 30 minutes. Two hours is far longer than the policy allows.
