id: sf-001402
product_area: public-sector-and-compliance
true_statement: In COBIT 2019, BAI06 is the management objective for managed IT changes, sitting in the Build, Acquire and Implement domain.
false_statement: In COBIT 2019, DSS06 is the management objective for managed IT changes, sitting in the Deliver, Service and Support domain.
explanation: Change control lives under BAI06 in the Build, Acquire and Implement domain, which is why a Salesforce CoE can map release and change processes to it. The DSS code in the false version is the wrong domain.
