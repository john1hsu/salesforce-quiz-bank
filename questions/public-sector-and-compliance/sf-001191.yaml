id: sf-001191
product_area: public-sector-and-compliance
true_statement: Organizations are certified against ISO/IEC 27001, while ISO/IEC 27002 is guidance on how the chosen controls can be implemented.
false_statement: Organizations are certified against ISO/IEC 27002, while ISO/IEC 27001 is guidance on how the chosen controls can be implemented.
explanation: ISO/IEC 27001 is the certifiable ISMS requirements standard; 27002 is a code of practice explaining how controls can be implemented. There is no 27002 certificate, so a vendor's evidence is its 27001 certificate and scope.
