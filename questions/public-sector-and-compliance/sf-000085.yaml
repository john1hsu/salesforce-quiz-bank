id: sf-000085
product_area: public-sector-and-compliance
true_statement: MuleSoft Government Cloud Plus permits only connectors that are tagged as FIPS 140-3 verified.
false_statement: MuleSoft Government Cloud Plus permits any Anypoint connector, as long as the Private Space has outbound internet access turned on.
explanation: MuleSoft's government control plane restricts connectors to those tagged FIPS 140-3 verified. Enabling outbound access does not lift that restriction, so arbitrary connectors are not allowed.
