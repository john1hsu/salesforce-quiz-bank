id: sf-000556
product_area: public-sector-and-compliance
true_statement: A SOC 3 report is a general-use summary without detailed control tests and can be shared freely, unlike a SOC 2 report.
false_statement: A SOC 2 report is a general-use summary without detailed control tests and can be shared freely, unlike a SOC 3 report.
explanation: SOC 2 reports are meant for knowledgeable readers and include control descriptions, tests and results. SOC 3 leaves those out so it can be distributed freely.
