id: sf-001261
product_area: public-sector-and-compliance
true_statement: Under SEC rules adopted in July 2023, a public company generally must report a material cybersecurity incident on Form 8-K within four business days of determining materiality.
false_statement: Under SEC rules adopted in July 2023, a public company generally must report a material cybersecurity incident on Form 8-K within thirty business days of determining materiality.
explanation: The SEC's Form 8-K Item 1.05 clock is four business days, counted from the materiality determination. Thirty business days is far longer than the rule allows.
