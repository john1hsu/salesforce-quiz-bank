true_statement: In compliance work, a change advisory board is an operational control, while allowlisting is a technical control.
false_statement: In compliance work, a change advisory board is a technical control, while allowlisting is an operational control.
explanation: Controls are grouped as management (policies, regulations), operational (processes such as a change advisory board) and technical (tooling such as allowlisting). The false version swaps the two categories.
