true_statement: In NIST SP 800-60, Volume I describes the categorization method, while Volume II catalogs information types with provisional impact levels.
false_statement: In NIST SP 800-60, Volume II describes the categorization method, while Volume I catalogs information types with provisional impact levels.
explanation: Volume I is the methodology and Volume II holds the appendices of information types, provisional Low/Moderate/High ratings and their rationale. The false statement swaps the two volumes.
