id: sf-001689
product_area: public-sector-and-compliance
true_statement: ISO's Harmonized Structure, historically published as Annex SL, gives its management system standards identical clause numbers, order and titles.
false_statement: ISO's Harmonized Structure, historically published as Annex SL, shares only core terms across its management system standards, while each sets its own clause numbering.
explanation: The common skeleton covers clause numbers, order, titles, shared terms and core requirements, which is what makes integrated management systems practical. The false version limits it to terminology.
