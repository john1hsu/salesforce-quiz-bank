id: sf-001479
product_area: public-sector-and-compliance
true_statement: Salesforce's compliance site lists an ISO/IEC 27017 certificate against the 2015 edition, even though the 2026 edition is now current.
false_statement: Salesforce's compliance site lists an ISO/IEC 27017 certificate against the 2026 edition, matching the edition that is now current.
explanation: The listed Salesforce certificate cites ISO/IEC 27017:2015, while the second edition appeared in July 2026. That gap is why architects should check which edition a vendor's certificate names.
