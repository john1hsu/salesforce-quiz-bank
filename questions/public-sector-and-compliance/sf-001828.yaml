id: sf-001828
product_area: public-sector-and-compliance
true_statement: A TX-RAMP certified provider must disclose any breach to the Texas Department of Information Resources within 48 hours of discovery.
false_statement: A TX-RAMP certified provider must disclose any breach to the Texas Department of Information Resources within 30 days of discovery.
explanation: Breach disclosure to DIR is due within 48 hours, alongside annual or quarterly vulnerability reporting depending on level. A 30-day window is far longer than the rule allows.
