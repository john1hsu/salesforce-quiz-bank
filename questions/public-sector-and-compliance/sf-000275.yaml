id: sf-000275
product_area: public-sector-and-compliance
true_statement: Under the DoD Cloud Computing SRG, a FedRAMP Moderate or High authorization is treated as essentially sufficient for Impact Level 2.
false_statement: Under the DoD Cloud Computing SRG, a FedRAMP Moderate or High authorization is treated as essentially sufficient for Impact Level 4.
explanation: At IL2 DoD reuses the FedRAMP Moderate or High authorization with no extra NIST control assessments. Higher levels such as IL4 add FedRAMP+ controls and parameter values on top.
