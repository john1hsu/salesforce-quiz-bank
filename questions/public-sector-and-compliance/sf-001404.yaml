id: sf-001404
product_area: public-sector-and-compliance
true_statement: In the Trust Services Criteria, confidentiality covers any information an entity designates as confidential, while privacy covers only personal information.
false_statement: In the Trust Services Criteria, privacy covers any information an entity designates as confidential, while confidentiality covers only personal information.
explanation: Confidentiality protects sensitive information of any kind that the entity commits to protect, personal or not. Privacy is narrower and applies to how personal information is collected, used, kept and disposed of.
