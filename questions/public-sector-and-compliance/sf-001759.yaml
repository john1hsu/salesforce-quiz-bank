true_statement: The FedRAMP indicator KSI-CMT-RMV prefers redeploying version-controlled resources over modifying them in place.
false_statement: The FedRAMP indicator KSI-CMT-RMV prefers modifying running resources in place over redeploying them from version control.
explanation: This change-management indicator favours immutable, version-controlled redeployment so changes are traceable. In-place modification is what it steers providers away from.
