id: sf-001050
product_area: public-sector-and-compliance
true_statement: FedRAMP has cloud providers record their SP 800-60 based categorization in the FIPS 199 Categorization Template, Appendix K of the System Security Plan.
false_statement: FedRAMP has cloud providers record their SP 800-60 based categorization in the FIPS 199 Categorization Template, Appendix A of the System Security Plan.
explanation: FedRAMP points providers to FIPS 199 plus SP 800-60 Volume II Rev. 1 and asks for the result in the Appendix K template of the SSP, not another appendix.
