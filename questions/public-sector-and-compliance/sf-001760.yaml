id: sf-001760
product_area: public-sector-and-compliance
true_statement: For each Key Security Indicator, the provider records its own minimum information and artifacts in a Security Decision Record, rather than following FedRAMP-set thresholds.
false_statement: For each Key Security Indicator, FedRAMP sets the specific tools and numeric thresholds the provider must use, recorded in a Security Decision Record.
explanation: FedRAMP mostly avoids prescribing tools or numbers for KSIs. The provider decides what evidence demonstrates each indicator and documents that choice itself.
