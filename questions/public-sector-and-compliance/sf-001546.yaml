product_area: public-sector-and-compliance
true_statement: The SOX-created Public Company Accounting Oversight Board has five members, of whom at most two may be CPAs.
false_statement: The SOX-created Public Company Accounting Oversight Board has five members, of whom at least three must be CPAs.
explanation: Section 101 caps CPA membership on the five-member PCAOB at two, keeping the majority of the board outside the accounting profession.
