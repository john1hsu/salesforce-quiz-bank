id: sf-000717
product_area: public-sector-and-compliance
true_statement: Under NIST SP 800-63C-4, proof that the subscriber holds an authenticator, via a holder-of-key assertion or bound authenticator, is first required at FAL3.
false_statement: Under NIST SP 800-63C-4, proof that the subscriber holds an authenticator, via a holder-of-key assertion or bound authenticator, is first required at FAL2.
explanation: FAL2 adds injection protection, a single audience and a trust agreement, but holder-of-key proof is the extra step that defines FAL3.
