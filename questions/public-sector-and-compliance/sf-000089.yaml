id: sf-000089
product_area: public-sector-and-compliance
true_statement: Under Public Sector Solutions usage-based pricing, application record types left unmapped default to License and Permit Management, which can inflate usage counts.
false_statement: Under Public Sector Solutions usage-based pricing, application record types left unmapped default to Grants Management, which can inflate usage counts.
explanation: The admin guide warns that unmapped application record types fall back to License and Permit Management. Grants Management is not the default bucket.
