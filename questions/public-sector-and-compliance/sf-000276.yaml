id: sf-000276
product_area: public-sector-and-compliance
true_statement: A DoD Provisional Authorization under the Cloud Computing SRG attaches to a specific cloud service offering rather than to the provider as a whole.
false_statement: A DoD Provisional Authorization under the Cloud Computing SRG attaches to the cloud provider as a whole rather than to a specific service offering.
explanation: The DISA authorizing official grants each PA for one cloud service offering, so a provider's other offerings are not covered. That is why Salesforce's PAs apply only to the Government Cloud Plus environments.
