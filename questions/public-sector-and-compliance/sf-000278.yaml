id: sf-000278
product_area: public-sector-and-compliance
true_statement: If any single FIPS 199 security objective, such as integrity, is rated High, FedRAMP requires the entire cloud offering to meet the High baseline.
false_statement: If any single FIPS 199 security objective, such as integrity, is rated High, FedRAMP requires only that objective's controls to meet the High baseline.
explanation: FedRAMP does not allow tailoring by security objective, so one High objective lifts the whole offering to High. Applying High controls to just that objective is exactly the tailoring FedRAMP disallows.
