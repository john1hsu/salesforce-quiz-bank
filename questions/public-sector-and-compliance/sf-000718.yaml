product_area: public-sector-and-compliance
true_statement: NIST's 5.2.0 release of SP 800-53B in August 2025 left the control baselines unchanged and only bumped the version number to match SP 800-53.
false_statement: NIST's 5.2.0 release of SP 800-53B in August 2025 added new controls to the moderate and high baselines to match SP 800-53.
explanation: Release 5.2.0 changed no baselines; the version was raised only for consistency with SP 800-53 and 800-53A. Baselines built on the 2020 text remain valid.
