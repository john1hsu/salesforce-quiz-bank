product_area: public-sector-and-compliance
true_statement: SOX Section 103 requires registered audit firms to keep audit workpapers for at least seven years.
false_statement: SOX Section 103 requires registered audit firms to keep audit workpapers for at least three years.
explanation: Section 103 sets a seven-year minimum for retaining audit workpapers and also requires a second-partner review of each audit. Three years is too short.
