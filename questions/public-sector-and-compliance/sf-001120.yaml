product_area: public-sector-and-compliance
true_statement: Querying Person Account __pc fields returns no compliance categorization, because the classification metadata lives on the Contact object.
false_statement: Querying Person Account __pc fields returns no compliance categorization, because the classification metadata lives on the User object.
explanation: Person account fields ending in __pc are backed by Contact, so their classification must be read from Contact. The User object is not where it is stored.
