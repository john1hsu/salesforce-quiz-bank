true_statement: Federal agencies request Salesforce's FedRAMP High package through the FedRAMP PMO, while state and local bodies go through their Salesforce account executive.
false_statement: Federal agencies request Salesforce's FedRAMP High package through their Salesforce account executive, while state and local bodies go through the FedRAMP PMO.
explanation: The FedRAMP PMO handles requests from .gov or .mil addresses, so federal agencies use that route. State, local and partner organizations instead ask their Salesforce account executive.
