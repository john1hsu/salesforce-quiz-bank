id: sf-001336
product_area: public-sector-and-compliance
true_statement: NIST moved governance out of the Identify function into a new Govern function in CSF 2.0 so it would visibly support the whole cybersecurity program.
false_statement: NIST moved governance out of a separate Govern function into the Identify function in CSF 2.0 so it would sit with asset management.
explanation: CSF 2.0 created Govern as its own function covering risk tolerance, roles and policy. Governance previously sat under Identify, not the other way round.
