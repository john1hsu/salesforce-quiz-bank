id: sf-000555
product_area: public-sector-and-compliance
true_statement: A SOC 2 Type 2 report tests whether controls operated effectively over a period, while a Type 1 assesses their design as of a single date.
false_statement: A SOC 2 Type 1 report tests whether controls operated effectively over a period, while a Type 2 assesses their design as of a single date.
explanation: Type 1 is a point-in-time look at control design; Type 2 covers a period, often six to twelve months, and adds operating-effectiveness testing. The false statement swaps the types.
