id: sf-001756
product_area: public-sector-and-compliance
true_statement: FedRAMP 20x Class A accepts an existing credential from the past 12 months, such as a SOC 2 Type II report or a GovRAMP certification.
false_statement: FedRAMP 20x Class A requires a fresh independent assessment by a FedRAMP Recognized assessor completed within the previous three months.
explanation: Class A is for mature services new to the federal market and can reuse a recent Rev5, SOC 2 Type II or GovRAMP credential. The three-month independent assessment applies to Classes B, C and D.
