id: sf-000646
product_area: public-sector-and-compliance
true_statement: Under Salesforce's HIPAA BAA, the customer rather than Salesforce must encrypt PHI it transmits through covered services.
false_statement: Under Salesforce's HIPAA BAA, Salesforce rather than the customer must encrypt PHI the customer transmits through covered services.
explanation: The BAA places encryption of transmitted PHI, and stored PHI where the customer controls it, on the customer. That duty is why Shield Platform Encryption features in HIPAA designs.
