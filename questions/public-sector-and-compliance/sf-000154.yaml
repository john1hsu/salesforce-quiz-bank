true_statement: DoD Impact Level 5 is built on the FedRAMP High baseline, while Impact Level 4 starts from FedRAMP Moderate.
false_statement: DoD Impact Level 5 is built on the FedRAMP Moderate baseline, while Impact Level 4 starts from FedRAMP Low.
explanation: IL4 adds DoD controls on top of FedRAMP Moderate. IL5, which covers higher-sensitivity CUI and unclassified NSS data, uses FedRAMP High as its base.
