id: sf-001617
product_area: public-sector-and-compliance
true_statement: A quality assurance surveillance plan is not a formal part of the contract, so if it conflicts with the contract, the contract governs.
false_statement: A quality assurance surveillance plan is a formal part of the contract, so if it conflicts with the contract, the QASP governs.
explanation: GSA's template treats the QASP as a living monitoring document outside the contract itself; where the two disagree the contract wins. The false version makes the QASP binding and controlling.
