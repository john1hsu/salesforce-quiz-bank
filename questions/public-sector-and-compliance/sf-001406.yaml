id: sf-001406
product_area: public-sector-and-compliance
true_statement: 'The Trust Services Criteria''s points of focus are not a checklist: an entity need not address every one and may tailor them to its situation.'
false_statement: 'The Trust Services Criteria''s points of focus are a mandatory checklist: an entity must address every one for an auditor to issue an opinion.'
explanation: Points of focus describe important characteristics of each criterion to guide control design and evaluation. The AICPA states they are optional and can be tailored, unlike the criteria themselves.
