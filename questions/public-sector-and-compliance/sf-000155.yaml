id: sf-000155
product_area: public-sector-and-compliance
true_statement: At IL5, cloud providers must physically separate federal tenants from non-federal tenants such as state and local governments.
false_statement: At IL5, cloud providers may host federal tenants alongside state and local governments using only logical separation.
explanation: IL5 accepts logical separation between DoD and other federal tenants, but non-federal tenants must be physically separated. Shared hardware with virtual separation is allowed only at IL4.
