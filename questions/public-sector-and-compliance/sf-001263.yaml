product_area: public-sector-and-compliance
true_statement: Salesforce, Inc.'s Corporate Governance Guidelines require that its board always have at least a majority of independent directors, judged against NYSE criteria.
false_statement: Salesforce, Inc.'s Corporate Governance Guidelines require that its board always have at least two-thirds independent directors, judged against Nasdaq criteria.
explanation: The guidelines set a simple majority of independent directors as the floor and use NYSE independence standards. Two-thirds and Nasdaq are not what they specify.
