true_statement: Salesforce Government Cloud Plus holds a FedRAMP authorization at the High security impact level, granted through the Joint Authorization Board.
false_statement: Salesforce Government Cloud Plus holds a FedRAMP authorization at the Moderate security impact level, granted through the Joint Authorization Board.
explanation: Government Cloud Plus launched with a FedRAMP High provisional ATO from the JAB and is listed at the High impact level on the FedRAMP Marketplace. Moderate is the wrong impact level.
