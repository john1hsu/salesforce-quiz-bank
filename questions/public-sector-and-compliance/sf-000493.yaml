id: sf-000493
product_area: public-sector-and-compliance
true_statement: CJIS compliance is audited at the agency level by the state's CJIS Systems Agency, unlike FedRAMP, which authorizes a cloud offering centrally.
false_statement: CJIS compliance is granted centrally to a cloud offering by the FBI, just as FedRAMP authorizes a cloud offering centrally.
explanation: There is no central CJIS authorization for a product. Each state CSA audits its agencies, and vendors supply independent assessments that customers build on.
