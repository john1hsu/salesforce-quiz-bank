product_area: public-sector-and-compliance
true_statement: The AICPA's illustrative SOC 3 report is not prescriptive, and each organization chooses which trust services categories are in scope.
false_statement: The AICPA's illustrative SOC 3 report is prescriptive, and every SOC 3 must cover all five trust services categories.
explanation: The AICPA treats its example SOC 3 and the categories shown in it as illustrative. As with SOC 2, the organization selects the categories it reports on.
