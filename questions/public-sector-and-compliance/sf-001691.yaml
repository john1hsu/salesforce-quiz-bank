product_area: public-sector-and-compliance
true_statement: ISO/IEC 38500, the first international standard for governance of IT, was published in 2008 and derived from Australia's AS 8015.
false_statement: ISO/IEC 38500, the first international standard for governance of IT, was published in 2008 and derived from the UK's BS 7799.
explanation: The standard grew out of the Australian standard AS 8015. BS 7799 is the British information security standard behind the ISO/IEC 27000 family, not IT governance.
