id: sf-001823
product_area: public-sector-and-compliance
true_statement: ITAR is administered by the State Department's Directorate of Defense Trade Controls, while the EAR is administered by Commerce's Bureau of Industry and Security.
false_statement: ITAR is administered by Commerce's Bureau of Industry and Security, while the EAR is administered by the State Department's Directorate of Defense Trade Controls.
explanation: DDTC at State runs ITAR for defense articles on the US Munitions List; BIS at Commerce runs the EAR for commercial and dual-use items. The false statement swaps the agencies.
