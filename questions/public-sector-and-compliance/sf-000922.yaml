id: sf-000922
product_area: public-sector-and-compliance
true_statement: GDPR Article 49 derogations, such as explicit consent, are meant for occasional transfers and not for routine, systematic data flows.
false_statement: GDPR Article 49 derogations, such as explicit consent, are the preferred basis for routine, systematic data flows such as CRM replication.
explanation: Derogations are the last resort after adequacy and appropriate safeguards, and regulators treat them as exceptional. Systematic replication needs adequacy, SCCs or BCRs.
