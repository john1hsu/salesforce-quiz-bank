product_area: public-sector-and-compliance
true_statement: A CSF Target Profile holds the outcomes an organization has selected and prioritized, while a Current Profile records outcomes it already achieves.
false_statement: A CSF Current Profile holds the outcomes an organization has selected and prioritized, while a Target Profile records outcomes it already achieves.
explanation: The Current Profile describes what is being achieved today and how well; the Target Profile describes the prioritized outcomes the organization is aiming for. The false statement swaps them.
