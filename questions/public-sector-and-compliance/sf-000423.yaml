true_statement: 'A cloud provider''s FIPS 199 categorization does not replace the agency''s own: each agency must categorize the data it puts in that environment.'
false_statement: A cloud provider's FIPS 199 categorization replaces the agency's own, so agencies need not categorize the data they put in that environment.
explanation: The provider categorizes its offering, but every agency still performs its own analysis of its data, and that analysis decides which authorized environment it needs.
