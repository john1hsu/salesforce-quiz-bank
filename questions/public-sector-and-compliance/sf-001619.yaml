product_area: public-sector-and-compliance
true_statement: The FAR prescribes no mandatory format for a performance work statement or a statement of objectives.
false_statement: The FAR prescribes a mandatory section-by-section format for a performance work statement and a statement of objectives.
explanation: The regulation sets content expectations, such as results-based requirements and measurable standards, but leaves the document layout open. DoD guidance suggests a requirements roadmap instead of a fixed template.
