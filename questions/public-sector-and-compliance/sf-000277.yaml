product_area: public-sector-and-compliance
true_statement: The first DoD Cloud Computing SRG collapsed the Cloud Security Model's six levels into four, keeping the numbers 2, 4, 5 and 6.
false_statement: The first DoD Cloud Computing SRG collapsed the Cloud Security Model's six levels into four, keeping the numbers 1, 3, 5 and 6.
explanation: Old levels 1 and 3 were folded into the next level up, so the surviving impact levels are numbered 2, 4, 5 and 6. Levels 1 and 3 no longer exist.
