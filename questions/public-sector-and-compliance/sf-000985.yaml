id: sf-000985
product_area: public-sector-and-compliance
true_statement: GovRAMP's Ready status requires an independent third-party assessor to assess 80 NIST controls.
false_statement: GovRAMP's Ready status requires an independent third-party assessor to assess more than 300 NIST controls.
explanation: Ready covers 80 controls with a 3PAO assessment, monthly monitoring and an annual assessment. More than 300 controls is the bar for Provisionally Authorized and Authorized.
