true_statement: The EAR's encrypted-storage carve-out bars intentional storage in Country Group D:5, while ITAR's bars countries proscribed under 22 CFR 126.1.
false_statement: ITAR's encrypted-storage carve-out bars intentional storage in Country Group D:5, while the EAR's bars countries proscribed under 22 CFR 126.1.
explanation: 'The two regimes word their location condition differently: 15 CFR 734.18 refers to Country Group D:5, and ITAR refers to its own proscribed-country list in 126.1. The false statement swaps them.'
