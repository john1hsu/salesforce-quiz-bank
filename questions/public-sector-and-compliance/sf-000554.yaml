id: sf-000554
product_area: public-sector-and-compliance
true_statement: NIST says organizations should move to a higher CSF Tier only when risk, mandates or cost-benefit justify it, not treat Tiers as maturity levels to chase.
false_statement: NIST says organizations should move to the Adaptive CSF Tier in every case, treating Tiers as maturity levels to chase.
explanation: The Tiers (Partial, Risk Informed, Repeatable, Adaptive) describe rigor, and NIST advises progressing only when justified. Reaching Adaptive is not a universal goal.
