true_statement: ISO/IEC 27002:2022 consolidated the 114 controls of the 2013 edition into 93 controls.
false_statement: ISO/IEC 27002:2022 expanded the 93 controls of the 2013 edition into 114 controls.
explanation: The 2022 revision reduced and regrouped the catalog, going from 114 controls to 93 in new Clauses 5 to 8. The false statement reverses the direction.
