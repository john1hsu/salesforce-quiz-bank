true_statement: The HITRUST CSF's core structure of control categories and objectives derives from ISO/IEC 27001 and 27002.
false_statement: The HITRUST CSF's core structure of control categories and objectives derives from NIST SP 800-53.
explanation: HITRUST says its framework is structured on ISO/IEC 27001 and 27002. NIST SP 800-53 is one of the many authoritative sources it maps to, not its structural base.
