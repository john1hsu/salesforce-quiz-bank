product_area: public-sector-and-compliance
true_statement: The Hyperforce EU Operating Zone treats all 27 member states as one zone, so customers can't choose a specific EU country.
false_statement: The Hyperforce EU Operating Zone lets customers choose a specific EU member state in which to keep their data.
explanation: The EU Operating Zone is a single region spanning the whole bloc. Its value is in-region support and contractual transfer limits, not country-level placement.
