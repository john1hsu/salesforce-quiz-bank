true_statement: Salesforce's FedRAMP authorization covers Government Cloud Plus and MuleSoft Government Cloud, not the commercial multi-tenant platform.
false_statement: Salesforce's FedRAMP authorization covers the commercial multi-tenant platform as well as Government Cloud Plus and MuleSoft Government Cloud.
explanation: The Trust guide limits FedRAMP scope to the government environments. Commercial orgs are outside it, so architects must check scope per service before promising FedRAMP.
