id: sf-000421
product_area: public-sector-and-compliance
true_statement: Under FIPS 199, a system's rating for each security objective is the highest rating among the information types it handles.
false_statement: Under FIPS 199, a system's rating for each security objective is the average rating across the information types it handles.
explanation: 'Categorization uses a high-water mark per objective: the most sensitive information type sets the level. Averaging would let one critical data type be under-protected.'
