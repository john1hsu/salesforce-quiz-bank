true_statement: In FedRAMP 20x, Class D is the High-impact equivalent and is still being developed, so High workloads rely on the Rev5 path for now.
false_statement: In FedRAMP 20x, Class C is the High-impact equivalent and is available now, so High workloads can already use the 20x path.
explanation: Class C covers common enterprise services, not High. Class D is the High equivalent and isn't open yet, so High-impact environments still go through Rev5.
