id: sf-000425
product_area: public-sector-and-compliance
true_statement: An organization claiming ISO/IEC 27001:2022 conformity may not exclude any of the requirements in Clauses 4 to 10.
false_statement: An organization claiming ISO/IEC 27001:2022 conformity may exclude requirements in Clauses 4 to 10 that it judges irrelevant to its scope.
explanation: The management-system requirements in Clauses 4 to 10 are mandatory in full for a conformity claim. Picking and choosing among them is not allowed.
