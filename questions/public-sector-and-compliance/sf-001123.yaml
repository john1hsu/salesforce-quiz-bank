id: sf-001123
product_area: public-sector-and-compliance
true_statement: To inherit Salesforce's HITRUST controls, a customer creates inheritance requests in MyCSF, and Salesforce approves or rejects each against its Shared Responsibility Matrix.
false_statement: To inherit Salesforce's HITRUST controls, a customer submits Salesforce's SOC 2 Type 2 report to its assessor, who must accept it in place of the controls.
explanation: Inheritance runs through HITRUST's MyCSF tool with Salesforce approving each request. Assessors may decline to rely on SOC 2 controls they haven't tested, which is why the inheritance program exists.
