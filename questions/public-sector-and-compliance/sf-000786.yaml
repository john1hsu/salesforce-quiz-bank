id: sf-000786
product_area: public-sector-and-compliance
true_statement: Per NIST SP 800-210, in SaaS the provider covers access control at every layer except the consumer's application data.
false_statement: Per NIST SP 800-210, in SaaS the consumer controls access in the operating system, middleware, application and data layers.
explanation: In SaaS almost the whole stack is the provider's job, leaving the consumer its application data. Consumer control from the OS up describes IaaS, not SaaS.
