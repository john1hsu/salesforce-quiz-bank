id: sf-001190
product_area: public-sector-and-compliance
true_statement: In ISO/IEC 27002:2022, Annex A explains how to use the control attributes, while Annex B maps the controls back to the 2013 edition.
false_statement: In ISO/IEC 27002:2022, Annex B explains how to use the control attributes, while Annex A maps the controls back to the 2013 edition.
explanation: Annex A covers the optional attributes used to filter the catalog, and Annex B is the mapping to 2013 controls that helps update older control matrices. The false statement swaps the two annexes.
