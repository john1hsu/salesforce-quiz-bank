true_statement: Under a PWS-based services contract, the contractor's own quality-control program is the primary control, while the government monitors through the QASP.
false_statement: Under a PWS-based services contract, the government's QASP is the primary quality control, while the contractor's own quality-control program is only advisory.
explanation: Quality control stays the contractor's job; the government's surveillance plan checks results against the PWS standards. The false version reverses those roles.
