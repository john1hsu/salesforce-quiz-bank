id: sf-000720
product_area: public-sector-and-compliance
true_statement: Some SP 800-53 controls are assigned to no SP 800-53B baseline at all and enter a system only through tailoring.
false_statement: Every SP 800-53 control is assigned to at least the high baseline in SP 800-53B, so tailoring can only remove controls.
explanation: The allocation tables leave some controls out of every baseline; organizations add them by supplementing during tailoring. Tailoring can add as well as remove or specialize controls.
