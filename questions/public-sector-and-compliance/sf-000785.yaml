id: sf-000785
product_area: public-sector-and-compliance
true_statement: FedRAMP requires the Control Implementation Summary / Customer Responsibility Matrix workbook as Appendix J to the provider's System Security Plan.
false_statement: FedRAMP requires the Control Implementation Summary / Customer Responsibility Matrix workbook as Appendix A to the provider's System Security Plan.
explanation: The CIS/CRM workbook is Appendix J of the SSP and marks each control as provider, customer, shared or inherited. Appendix A is not where FedRAMP places it.
