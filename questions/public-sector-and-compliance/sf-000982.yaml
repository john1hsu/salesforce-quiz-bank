id: sf-000982
product_area: public-sector-and-compliance
true_statement: When an existing production org is migrated into Government Cloud, its org ID and record IDs stay the same.
false_statement: When an existing production org is migrated into Government Cloud, it receives a new org ID and new record IDs.
explanation: Moving into Government Cloud is an instance migration that keeps the org ID and every record ID. What changes are hosts, IP ranges and WSDLs, which is why hard-coded instance references must be removed.
