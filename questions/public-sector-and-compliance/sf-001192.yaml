id: sf-001192
product_area: public-sector-and-compliance
true_statement: In NIST SP 800-207, the policy engine decides whether to grant, deny or revoke access, while the policy administrator opens the path and issues session credentials.
false_statement: In NIST SP 800-207, the policy administrator decides whether to grant, deny or revoke access, while the policy engine opens the path and issues session credentials.
explanation: The policy engine runs the trust algorithm and makes the access decision; the policy administrator acts on it by opening or closing the path and issuing credentials. Together they form the policy decision point, and the false statement swaps their roles.
