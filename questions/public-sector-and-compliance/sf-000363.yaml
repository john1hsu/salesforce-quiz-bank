id: sf-000363
product_area: public-sector-and-compliance
true_statement: Under FedRAMP, NIST Program Management (PM) controls remain the agency's responsibility rather than the cloud provider's.
false_statement: Under FedRAMP, NIST Program Management (PM) controls are discharged by the cloud provider's authorization rather than by the agency.
explanation: A provider's FedRAMP authorization covers the baseline controls it was assessed on. PM controls, and privacy controls outside the baselines, stay with the agency.
