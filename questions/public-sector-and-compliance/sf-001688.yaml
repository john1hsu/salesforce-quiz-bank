id: sf-001688
product_area: public-sector-and-compliance
true_statement: The outside assessment of Government Cloud Plus against IRS 1075 used NIST SP 800-53 revision 4, not the revision 5 baseline of the current publication.
false_statement: The outside assessment of Government Cloud Plus against IRS 1075 used NIST SP 800-53 revision 5, matching the baseline of the current publication.
explanation: The 2021 Publication 1075 is built on 800-53 Rev. 5, but Salesforce's attestation was reviewed against Rev. 4, so agencies may need their own gap analysis. The false version claims the revisions match.
