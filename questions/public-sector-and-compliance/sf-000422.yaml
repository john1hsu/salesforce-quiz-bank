id: sf-000422
product_area: public-sector-and-compliance
true_statement: In FIPS 199, a Moderate impact level means a security loss would have a serious adverse effect, and High means a severe or catastrophic one.
false_statement: In FIPS 199, a Moderate impact level means a security loss would have a limited adverse effect, and High means a serious one.
explanation: FIPS 199 maps Low to limited, Moderate to serious and High to severe or catastrophic effects. The false statement shifts each level down by one.
