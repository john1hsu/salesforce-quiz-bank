id: sf-000495
product_area: public-sector-and-compliance
true_statement: CJIS Security Policy v6.0 requires audit records to be kept for at least one year.
false_statement: CJIS Security Policy v6.0 requires audit records to be kept for at least ninety days.
explanation: Control AU-11 sets audit record retention at a minimum of one year. Ninety days is the account-inactivity threshold, not the retention period.
