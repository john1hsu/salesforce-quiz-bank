id: sf-000715
product_area: public-sector-and-compliance
true_statement: Under NIST SP 800-63B-4, an AAL3 session must end within 12 hours and after no more than 15 minutes of inactivity.
false_statement: Under NIST SP 800-63B-4, an AAL3 session must end within 24 hours and after no more than 1 hour of inactivity.
explanation: AAL3 tightens reauthentication to 12 hours overall and 15 minutes idle. The 24-hour and one-hour figures are the looser AAL2 bounds.
