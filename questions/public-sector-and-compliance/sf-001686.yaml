id: sf-001686
product_area: public-sector-and-compliance
true_statement: Under IRS Publication 1075, an agency must notify the Office of Safeguards at least 45 days before moving Federal Tax Information into a cloud.
false_statement: Under IRS Publication 1075, an agency must notify the Office of Safeguards within 15 days after moving Federal Tax Information into a cloud.
explanation: The cloud notification is due in advance, at least 45 days before the move, and documents controls, FedRAMP status, data center locations and encryption. An after-the-fact notice does not meet the rule.
