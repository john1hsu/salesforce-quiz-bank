id: sf-001264
product_area: public-sector-and-compliance
true_statement: Under the carve-out method, a SOC 1 report excludes a subservice organization's controls from testing, so the opinion covers only the provider's own controls.
false_statement: Under the inclusive method, a SOC 1 report excludes a subservice organization's controls from testing, so the opinion covers only the provider's own controls.
explanation: Carve-out leaves the subservice party's controls out, which is the more common approach. The inclusive method is the one that brings those controls into the tested scope.
