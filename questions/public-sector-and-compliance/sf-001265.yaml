product_area: public-sector-and-compliance
true_statement: A SOC 1 examination is performed by a CPA service auditor under the AICPA attestation standard AT-C section 320.
false_statement: A SOC 1 examination is performed by a CPA service auditor under the AICPA attestation standard AT-C section 205 and the Trust Services Criteria.
explanation: SOC 1 engagements follow AT-C 320 and focus on controls relevant to financial reporting. The Trust Services Criteria belong to SOC 2, not SOC 1.
