id: sf-000643
product_area: public-sector-and-compliance
true_statement: Under FIPS 200, a system gets the low impact level only when its confidentiality, integrity and availability ratings are all low.
false_statement: Under FIPS 200, a system gets the low impact level when at least two of its confidentiality, integrity and availability ratings are low.
explanation: 'FIPS 200 uses the high-water mark: the overall level is the highest of the three FIPS 199 ratings, so low applies only if all three are low. A majority of low ratings isn''t enough.'
