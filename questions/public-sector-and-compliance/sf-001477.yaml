true_statement: The table of contents of ISO/IEC 27017:2026 lists four cloud-specific CLD controls, including shared roles and segregation in virtual computing environments.
false_statement: The table of contents of ISO/IEC 27017:2026 lists nine cloud-specific CLD controls, including shared roles and segregation in virtual computing environments.
explanation: 'The 2026 edition slots four CLD controls into the 27002:2022 numbering: 5.38, 5.39, 8.35 and 8.36. Several 2015-era cloud topics no longer appear as separate controls, so nine overstates the count.'
