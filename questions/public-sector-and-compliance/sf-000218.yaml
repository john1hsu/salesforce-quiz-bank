id: sf-000218
product_area: public-sector-and-compliance
true_statement: If any one of confidentiality, integrity or availability is rated High under FedRAMP, the whole system must meet the High baseline.
false_statement: If one of confidentiality, integrity or availability is rated High under FedRAMP, only that objective needs High controls.
explanation: FedRAMP baselines can't be tailored per security objective. The highest of the three FIPS 199 ratings sets the baseline for the entire system.
