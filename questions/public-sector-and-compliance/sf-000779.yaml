id: sf-000779
product_area: public-sector-and-compliance
true_statement: Access to a FedRAMP package granted through the Package Access Request Form lasts 60 days and can be extended in 30-day increments.
false_statement: Access to a FedRAMP package granted through the Package Access Request Form lasts 12 months and can be extended in 6-month increments.
explanation: FedRAMP's quick guide gives agencies a 60-day window to review a package, extendable 30 days at a time. Long-lived access comes only after the signed ATO letter reaches the PMO.
