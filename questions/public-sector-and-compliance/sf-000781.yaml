id: sf-000781
product_area: public-sector-and-compliance
true_statement: In FedRAMP's agency playbook, the agency's authorizing official is the person who issues the ATO for a cloud service offering.
false_statement: In FedRAMP's agency playbook, the third-party assessment organization is the party that issues the ATO for a cloud service offering.
explanation: The ATO is a risk-acceptance decision made by the agency's authorizing official after reviewing the package. Assessors produce evidence such as the Security Assessment Report but do not grant the ATO.
