product_area: public-sector-and-compliance
true_statement: For FISMA Inspector General evaluations, OMB treats a rating of Level 4 or higher on the five-level maturity scale as effective.
false_statement: For FISMA Inspector General evaluations, OMB treats a rating of Level 3 or higher on the five-level maturity scale as effective.
explanation: OMB's threshold for an effective program is Level 4, Managed and Measurable, though IGs can judge differently given the agency's risk. Level 3 falls below that bar.
