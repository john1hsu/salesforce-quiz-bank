id: sf-001757
product_area: public-sector-and-compliance
true_statement: A cloud provider must not pursue both FedRAMP Rev5 and FedRAMP 20x certification for the same cloud offering.
false_statement: A cloud provider may pursue FedRAMP Rev5 and FedRAMP 20x certification in parallel for the same cloud offering.
explanation: FedRAMP's rules require choosing one path per offering. Rev5 and 20x are alternative routes to certification, not complementary ones.
