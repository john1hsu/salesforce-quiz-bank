id: sf-000987
product_area: public-sector-and-compliance
true_statement: Under GovRAMP's FedRAMP Fast Track, the program office reviews a provider's existing FedRAMP artifacts, so a FedRAMP authorization feeds verification rather than replacing it.
false_statement: Under GovRAMP's FedRAMP Fast Track, a provider's FedRAMP authorization is accepted automatically, so it grants the matching GovRAMP status without further review.
explanation: Fast Track cuts duplicate work by letting the PMO review federal readiness, assessment and monitoring documents against GovRAMP's requirements. GovRAMP does not describe it as automatic reciprocity, so a review still happens.
