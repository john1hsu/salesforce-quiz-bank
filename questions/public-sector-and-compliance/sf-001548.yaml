id: sf-001548
product_area: public-sector-and-compliance
true_statement: Salesforce publishes its SOC 3 reports per service and tags each by infrastructure, such as first party, Hyperforce, AWS or GCP.
false_statement: Salesforce publishes a single SOC 3 report that covers every service on every infrastructure it runs on.
explanation: The SOC 3 category lists dozens of separate documents by service and infrastructure, so an architect must confirm that each cloud in a design, on its actual infrastructure, has a listed report.
