id: sf-000156
product_area: public-sector-and-compliance
true_statement: A DISA provisional authorization is a pre-approval; each mission owner's authorizing official still issues its own Authority to Operate.
false_statement: A DISA provisional authorization serves as the Authority to Operate for every DoD mission owner using that cloud offering.
explanation: DISA grants a provisional authorization to a specific cloud offering. Each mission owner still assesses its own risk and grants an ATO, so an org inherits controls but isn't authorized on its own.
