product_area: public-sector-and-compliance
true_statement: The Low, Moderate and High control baselines are defined in the companion publication SP 800-53B, not in SP 800-53 itself.
false_statement: The Low, Moderate and High control baselines are defined in the companion publication SP 800-53A, not in SP 800-53 itself.
explanation: SP 800-53 is the control catalog and SP 800-53B selects baselines from it. SP 800-53A holds assessment procedures, not baselines.
