id: sf-000921
product_area: public-sector-and-compliance
true_statement: Per Salesforce's FAQ, EU exporters relying on SCCs or BCRs for US transfers must run a transfer impact assessment, while DPF-based transfers need none.
false_statement: Per Salesforce's FAQ, EU exporters relying on the DPF for US transfers must run a transfer impact assessment, while SCC- or BCR-based transfers need none.
explanation: The DPF is an adequacy decision, so transfers to certified US recipients don't need a TIA. Transfers under SCCs or BCRs still carry the Schrems II duty to assess the destination's laws.
