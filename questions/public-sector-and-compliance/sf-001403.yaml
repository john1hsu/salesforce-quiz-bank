id: sf-001403
product_area: public-sector-and-compliance
true_statement: COBIT 2019 replaced COBIT 5's enablers with governance components and based its performance management model on CMMI.
false_statement: COBIT 2019 kept COBIT 5's enablers unchanged and based its performance management model on ISO/IEC 15504.
explanation: The 2019 edition swapped enablers for governance components, added design factors and focus areas, and moved its performance management model onto a CMMI basis. The false version wrongly says nothing changed.
