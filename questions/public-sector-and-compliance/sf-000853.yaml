id: sf-000853
product_area: public-sector-and-compliance
true_statement: Under the NIST RMF, a common control authorization approves controls that many systems inherit.
false_statement: Under the NIST RMF, an authorization to use approves controls that many systems inherit.
explanation: The RMF names the common control authorization as the decision for inheritable controls. An authorization to operate or to use applies to a single system.
