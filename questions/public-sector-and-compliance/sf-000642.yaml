true_statement: FIPS 200 states its minimum security requirements as 17 security-related areas, such as access control and incident response.
false_statement: FIPS 200 states its minimum security requirements as 20 security-related areas, such as access control and incident response.
explanation: FIPS 200 lists 17 areas spanning management, operational and technical concerns. They map to SP 800-53 control families, but the standard itself names 17, not 20.
