id: sf-000647
product_area: public-sector-and-compliance
true_statement: Salesforce's BAA restrictions bar adding patients to Slack, whether as users or as guests.
false_statement: Salesforce's BAA restrictions allow adding patients to Slack as guests, but not as full users.
explanation: Slack's HIPAA conditions forbid patients as either users or guests, and keep PHI out of profiles, statuses and workspace names. Guest access is not an exception.
