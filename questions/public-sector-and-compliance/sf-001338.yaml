true_statement: In the IIA Three Lines Model, internal audit is the third line and is accountable to the governing body, independent of management.
false_statement: In the IIA Three Lines Model, internal audit is the second line and reports to management alongside the compliance and security teams.
explanation: The second line is management's risk expertise and challenge, such as compliance and security. Internal audit gives independent assurance as the third line, answering to the governing body.
