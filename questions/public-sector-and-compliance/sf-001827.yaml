id: sf-001827
product_area: public-sector-and-compliance
true_statement: A full TX-RAMP certification is valid for three years if compliance is maintained, with renewal reminders 12 and 6 months before expiry.
false_statement: A full TX-RAMP certification is valid for one year if compliance is maintained, with renewal reminders 3 and 1 months before expiry.
explanation: DIR grants full certifications for three years and reminds providers a year and six months ahead. A one-year term is not how the program works.
