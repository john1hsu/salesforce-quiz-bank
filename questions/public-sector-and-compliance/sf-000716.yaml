id: sf-000716
product_area: public-sector-and-compliance
true_statement: NIST SP 800-63-4 accepts syncable passkeys at AAL2 with user verification, but not at AAL3, which forbids exportable private keys.
false_statement: NIST SP 800-63-4 accepts syncable passkeys at both AAL2 and AAL3, as long as user verification is performed.
explanation: Synced passkeys can leave the device, so they cap out at AAL2. AAL3 needs a cryptographic authenticator whose private key can't be exported, which user verification alone doesn't provide.
