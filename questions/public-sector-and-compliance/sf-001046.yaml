id: sf-001046
product_area: public-sector-and-compliance
true_statement: Covering a risk with cyber insurance or outsourcing the activity transfers the risk rather than mitigating it with controls.
false_statement: Covering a risk with cyber insurance or outsourcing the activity mitigates the risk with controls rather than transferring it.
explanation: Risk treatment options are mitigate with controls, accept within tolerance, or transfer. Insurance and outsourcing shift the impact to another party, which is transfer, not mitigation.
