id: sf-000733
product_area: data-cloud-and-ai
true_statement: A Data 360 data space's name and description can be edited later, but its prefix can't be changed after the data space is created.
false_statement: A Data 360 data space's prefix and description can be edited later, but its name can't be changed after the data space is created.
explanation: The prefix is fixed at creation, so it needs choosing carefully; the name and description stay editable. The false version swaps the name and the prefix.
