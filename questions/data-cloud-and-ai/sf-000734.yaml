id: sf-000734
product_area: data-cloud-and-ai
true_statement: A data space filter on a data lake object only limits what that data space can see; the stream still ingests and counts every record.
false_statement: A data space filter on a data lake object stops non-matching records from being ingested, so the stream counts only matching records.
explanation: Filters are applied after ingestion, so the DLO and the stream's Total Records include everything brought in. Salesforce CRM records can't currently be pre-filtered before ingestion either.
