id: sf-001576
product_area: data-cloud-and-ai
true_statement: In Data 360 Clean Rooms, only segments can be shared, and individual records may be shared only in hashed form with the party that owns them.
false_statement: In Data 360 Clean Rooms, individual records can be shared in plain text with the other party, as long as both are Data 360 customers.
explanation: Clean rooms exchange audiences, not customer lists. Record-level data appears only hashed and only to its owner, which keeps each side's raw data private.
