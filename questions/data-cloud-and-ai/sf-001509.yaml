id: sf-001509
product_area: data-cloud-and-ai
true_statement: Turning an existing Data 360 org into a Data Cloud One companion requires deprovisioning it, which deletes that org's Data 360 data and metadata.
false_statement: Turning an existing Data 360 org into a Data Cloud One companion keeps that org's Data 360 data and metadata and merges them into the home org.
explanation: Converting an org into a companion means deprovisioning its Data 360 instance, which deletes its data and metadata, so they should be moved first, for example with data kits. Nothing is merged into the home org automatically.
