product_area: data-cloud-and-ai
true_statement: Einstein Trust Layer data masking can be enabled for embedded features such as Work Summaries, but it is disabled for agents.
false_statement: Einstein Trust Layer data masking can be enabled for agents, but it is disabled for embedded features such as Work Summaries.
explanation: Admins can turn masking on for embedded features like Service Replies and Work Summaries, while agents run with masking disabled, so agent designs must lean on permissions and grounding scope.
