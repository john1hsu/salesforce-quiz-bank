product_area: data-cloud-and-ai
true_statement: 'An Ingestion API connector''s schema is append-only: you can add objects and fields, but can''t delete them or change a field''s type.'
false_statement: 'An Ingestion API connector''s schema is fully editable: you can add or delete objects and fields and change a field''s type at any time.'
explanation: Once a schema is uploaded, objects and fields can only be added, and an updated object must still list its existing fields. Deleting fields or changing types isn't allowed, which is a common surprise.
