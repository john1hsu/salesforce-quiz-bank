id: sf-000600
product_area: data-cloud-and-ai
true_statement: In a Data 360 segment, criteria in one container must match on the same related record, while separate containers are evaluated independently.
false_statement: In a Data 360 segment, criteria in one container are evaluated independently, while criteria in separate containers must match on the same related record.
explanation: A single container ties its criteria to one related record, so 'scarf AND yellow' there finds yellow-scarf buyers. Splitting them across containers lets each criterion match a different purchase; the false statement reverses this.
