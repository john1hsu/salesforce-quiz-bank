id: sf-001506
product_area: data-cloud-and-ai
true_statement: Setting queryRowLimit to zero in a Data 360 Query API V3 request returns only the result schema, with no rows.
false_statement: Setting queryRowLimit to zero in a Data 360 Query API V3 request removes the row limit and returns every matching row.
explanation: queryRowLimit works like an implicit LIMIT, so zero yields no rows and just the schema. It does not mean unlimited.
