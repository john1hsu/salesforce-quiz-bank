id: sf-001854
product_area: data-cloud-and-ai
true_statement: When an Agent API session starts with bypassUser set to true, the agent runs as the user assigned to the agent rather than the access token's user.
false_statement: When an Agent API session starts with bypassUser set to true, the agent runs as the access token's user rather than the user assigned to the agent.
explanation: bypassUser true skips the token's identity in favour of the agent's assigned user; false makes record access follow the user behind the token. The false statement reverses the flag.
