id: sf-001078
product_area: data-cloud-and-ai
true_statement: Data kits can move between connected orgs in a change set, where they appear as the Data Package Kit Definition component type.
false_statement: Data kits can move between connected orgs in a change set, where they appear as the Data Stream Definition component type.
explanation: For simple moves between connected orgs, a data kit is selected in a change set under the Data Package Kit Definition type. Data streams are bundled inside the kit rather than being the kit's component type.
