id: sf-001081
product_area: data-cloud-and-ai
true_statement: A Data 360 batch transform built on data model objects belongs to one data space, while one built on data lake objects can't be associated with a data space.
false_statement: A Data 360 batch transform built on data lake objects belongs to one data space, while one built on data model objects can't be associated with a data space.
explanation: Choosing DMOs as the source ties the transform and its output to a single data space. DLO-based transforms have no data space association, so the false statement reverses them.
