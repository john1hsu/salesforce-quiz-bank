id: sf-000605
product_area: data-cloud-and-ai
true_statement: A Data 360 data lake object API name can be up to 40 characters long and can't contain two consecutive underscores.
false_statement: A Data 360 data lake object API name can be up to 80 characters long and can't contain two consecutive underscores.
explanation: DLO API names are limited to 40 characters of letters, digits and underscores, must start with a letter and can't use double underscores. The 80-character figure doubles the real limit.
