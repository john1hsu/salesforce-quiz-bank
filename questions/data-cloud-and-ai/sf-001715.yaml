id: sf-001715
product_area: data-cloud-and-ai
true_statement: The Setup agent only performs tasks the admin already has permission to do and asks for approval before making a change.
false_statement: The Setup agent can perform tasks beyond the admin's own permissions, provided the admin approves the change first.
explanation: The agent acts within the requesting admin's permissions, so it never widens what they can change. Approval is an extra safeguard, not a way to exceed those permissions.
