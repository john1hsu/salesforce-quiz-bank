true_statement: Slack actions such as Create a Slack Canvas fail in the Salesforce agent preview, so they must be tested inside Slack.
false_statement: Slack actions such as Create a Slack Canvas run in the Salesforce agent preview, so they can be fully tested before installing in Slack.
explanation: These standard actions need the Slack environment to execute. The builder's preview can't run them, so canvas and DM flows have to be tested in Slack itself.
