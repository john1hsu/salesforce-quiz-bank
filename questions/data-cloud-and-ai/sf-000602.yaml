true_statement: Data 360 rapid publish segments refresh every 1 or 4 hours and look only at the past 7 days of engagement data.
false_statement: Data 360 rapid publish segments refresh every 12 or 24 hours and look only at the past 7 days of engagement data.
explanation: Rapid publish trades a short 7-day lookback for frequent refreshes every 1 or 4 hours. Schedules such as every 12 or 24 hours belong to standard segments.
