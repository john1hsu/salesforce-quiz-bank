id: sf-000598
product_area: data-cloud-and-ai
true_statement: In streaming mode, the Data 360 Ingestion API accepts request bodies of up to 200 KB.
false_statement: In streaming mode, the Data 360 Ingestion API accepts request bodies of up to 2 MB.
explanation: Streaming ingestion is meant for small, frequent payloads, so each request body is limited to 200 KB. Larger loads belong in bulk mode, which takes CSV files of up to 150 MB.
