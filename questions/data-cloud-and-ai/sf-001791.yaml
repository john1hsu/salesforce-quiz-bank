id: sf-001791
product_area: data-cloud-and-ai
true_statement: The Models API's Apex methods are generated with External Services, so they are subject to Apex callout limits.
false_statement: The Models API's Apex methods run natively inside the org, so they aren't subject to Apex callout limits.
explanation: Salesforce builds the aiplatform.ModelsAPI classes from the REST spec using External Services, which makes each call a callout. Bulk designs must respect callout limits instead of calling the model per record in a trigger.
