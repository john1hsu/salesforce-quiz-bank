id: sf-001154
product_area: data-cloud-and-ai
true_statement: Activating a Data 360 segment to a Data 360 target writes its members into an audience data model object readable through the Query API.
false_statement: Activating a Data 360 segment to a Data 360 target writes its members into a CSV file in cloud storage for download.
explanation: A Data 360 target keeps results inside the platform in an audience DMO, viewable in Data Explorer or via the Query API. Cloud-storage file export is a different kind of target.
