id: sf-001219
product_area: data-cloud-and-ai
true_statement: A Tableau Semantics semantic model can draw its data from at most one Data 360 data space.
false_statement: A Tableau Semantics semantic model can draw its data from up to five Data 360 data spaces.
explanation: The semantic model builder accepts only one data space per model, which is why the feature depends on data spaces. Combining several data spaces in one model isn't supported.
