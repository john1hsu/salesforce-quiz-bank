id: sf-001786
product_area: data-cloud-and-ai
true_statement: Only Agentforce Employee Agent type agents can be built for Slack.
false_statement: Both Agentforce Employee Agents and Agentforce Service Agents can be built for Slack using its starter templates.
explanation: Slack deployment is limited to the Employee Agent type, and Slack's templates (Customer Insights, Employee Help and Onboarding) are all employee agents. Service agents there stay locked until an admin assigns access.
