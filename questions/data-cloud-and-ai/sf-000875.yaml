id: sf-000875
product_area: data-cloud-and-ai
true_statement: When an MCP server's tool descriptions change significantly, Agentforce Registry blocks the affected action and alerts the admin.
false_statement: When an MCP server's tool descriptions change significantly, Agentforce Registry silently adopts the new descriptions and keeps the action running.
explanation: To guard against tool drift, the registry blocks an action whose server-side tool description changed significantly and notifies the admin, rather than quietly accepting the change.
