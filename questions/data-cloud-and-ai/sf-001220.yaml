id: sf-001220
product_area: data-cloud-and-ai
true_statement: In Tableau Semantics, a relationship's join type is decided at query time, when a query actually uses fields from the related objects.
false_statement: In Tableau Semantics, a relationship's join type is fixed when the relationship is created, before any query uses the related objects.
explanation: Relationships in a semantic model don't lock in a join type up front; the semantic layer picks it when a query touches fields from related objects. That is why Trailhead prefers relationships over manual joins.
