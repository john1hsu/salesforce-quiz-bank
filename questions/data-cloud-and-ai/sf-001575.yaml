true_statement: In a Data 360 clean room collaboration, the consumer creates the collaboration and the provider must accept the invitation before it becomes active.
false_statement: In a Data 360 clean room collaboration, the provider creates the collaboration and the consumer must accept the invitation before it becomes active.
explanation: The consumer, typically the advertiser, starts the collaboration and sends the invitation. The provider, who owns the data and the use case template, accepts it to make it Active.
