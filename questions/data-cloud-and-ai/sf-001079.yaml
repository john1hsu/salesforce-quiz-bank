id: sf-001079
product_area: data-cloud-and-ai
true_statement: In a Data 360 batch data transform, the Upsert write mode reloads all input on every run, while Replace attempts an incremental run of changes only.
false_statement: In a Data 360 batch data transform, the Replace write mode reloads all input on every run, while Upsert attempts an incremental run of changes only.
explanation: Upsert reprocesses the full input each time and merges it into the output; Replace is the mode that tries to load only what changed since the last run. The false statement swaps the two.
