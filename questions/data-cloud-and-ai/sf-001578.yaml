product_area: data-cloud-and-ai
true_statement: Each Data 360 copy field enrichment consumes one data action and one data target from the org's Data 360 license.
false_statement: Each Data 360 copy field enrichment consumes one calculated insight and one data space from the org's Data 360 license.
explanation: Copy fields are built on the data action machinery, so each enrichment uses a data action and a data target allocation. Calculated insights and data spaces are not what it draws down.
