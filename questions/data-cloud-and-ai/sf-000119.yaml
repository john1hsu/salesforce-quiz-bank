id: sf-000119
product_area: data-cloud-and-ai
true_statement: An incremental cache refresh in Data 360 only upserts, so deleted source records stay in the cache until a full refresh runs.
false_statement: An incremental cache refresh in Data 360 upserts and deletes, so deleted source records are removed from the cache on the next refresh.
explanation: Incremental refresh only inserts and updates; deletions are picked up only by a full refresh, so stale deleted rows can linger in the cache.
