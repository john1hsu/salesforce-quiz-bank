id: sf-001856
product_area: data-cloud-and-ai
true_statement: Agentforce linked variables are read-only and can't be objects or lists, unlike custom variables.
false_statement: Agentforce custom variables are read-only and can't be objects or lists, unlike linked variables.
explanation: Linked variables read from a source such as the messaging session, so the agent can't set them and they hold only simple values. Custom variables can be mutable and support object and list types.
