id: sf-001363
product_area: data-cloud-and-ai
true_statement: Activating a Data Cloud-triggered flow doesn't process Data 360 records that already exist; only later qualifying new or changed records start it.
false_statement: Activating a Data Cloud-triggered flow processes every existing Data 360 record that meets its conditions, then handles later changes.
explanation: The trigger is a qualifying record change after activation, so records already sitting in Data 360 are not swept up. A refresh that changes nothing also starts nothing.
