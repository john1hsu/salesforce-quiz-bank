id: sf-000041
product_area: data-cloud-and-ai
true_statement: In the classic Agentforce builder, the reasoning engine picks a subagent using only subagent names and classification descriptions.
false_statement: In the classic Agentforce builder, the reasoning engine picks a subagent using subagent names, instructions and the full list of actions.
explanation: Atlas classifies a request first, looking only at names and classification descriptions; instructions and actions are loaded after a subagent is chosen. That is why short, non-overlapping names matter.
