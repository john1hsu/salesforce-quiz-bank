id: sf-000016
product_area: data-cloud-and-ai
true_statement: Agent tests should run in sandboxes with realistic data, never in production, because test runs can modify CRM records.
false_statement: Agent tests can run safely in production because test runs are read-only and never modify CRM records.
explanation: The lifecycle keeps agent testing out of production since a test run can change real CRM records. Sandboxes with realistic data are the intended place for it, so the read-only claim is wrong.
