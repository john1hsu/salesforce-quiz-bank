id: sf-000249
product_area: data-cloud-and-ai
true_statement: A custom data model object created from a data lake object is not linked to the rest of the data model automatically, so you define its relationships.
false_statement: A custom data model object created from a data lake object inherits the relationships of the standard model automatically, so none need defining.
explanation: Custom DMOs take the DLO's label and API name but no relationships; you must add them yourself between DMOs.
