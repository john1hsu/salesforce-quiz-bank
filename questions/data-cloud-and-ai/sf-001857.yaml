id: sf-001857
product_area: data-cloud-and-ai
true_statement: In Agent Script, a variable's visibility defaults to Internal, so the Agent API can set it only once it is marked External.
false_statement: In Agent Script, a variable's visibility defaults to External, so the Agent API can set it unless it is marked Internal.
explanation: Internal is the default and lets only actions set the value; External corresponds to Allow value to be set by API in the builder. The false statement flips the default.
