id: sf-000117
product_area: data-cloud-and-ai
true_statement: In Data 360, ingested or federated data first lands in data lake objects in its source shape, before mapping to data model objects.
false_statement: In Data 360, ingested or federated data first lands in data model objects in its source shape, before mapping to data lake objects.
explanation: Data lake objects are the raw landing containers; their fields are then mapped onto the Customer 360 Data Model to form data model objects, so the false statement reverses the order.
