id: sf-001858
product_area: data-cloud-and-ai
true_statement: An Agentforce variable name must start with a letter, contain no double underscore and be at most 80 characters long.
false_statement: An Agentforce variable name must start with a letter, contain no double underscore and be at most 255 characters long.
explanation: Variable names are limited to 80 characters of letters, digits and underscores, with no trailing or double underscore. 255 is far beyond the allowed length.
