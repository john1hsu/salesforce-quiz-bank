product_area: data-cloud-and-ai
true_statement: Salesforce advises rotating a Data 360 webhook data action secret key at least every 12 months, and a new key can take up to 15 minutes to take effect.
false_statement: Salesforce advises rotating a Data 360 webhook data action secret key at least every 90 days, and a new key takes effect immediately.
explanation: The guidance is a rotation at least yearly, with up to a 15-minute delay before a regenerated key applies, so the receiver must be updated promptly.
