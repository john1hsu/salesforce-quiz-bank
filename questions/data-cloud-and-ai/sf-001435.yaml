id: sf-001435
product_area: data-cloud-and-ai
true_statement: In Data 360 consent management, consent is anchored to the contact point, so a customer's new email address needs its own new consent record.
false_statement: In Data 360 consent management, consent is anchored to the person, so a customer's existing consent carries over to a new email address.
explanation: Consent hangs off the specific email address or phone number rather than the individual, so when the address changes the old consent does not transfer and a fresh record is required. The false statement wrongly attaches consent to the person.
