id: sf-001294
product_area: data-cloud-and-ai
true_statement: A Data 360 data share must be active before it can be linked to a data share target, which holds the connection and credentials for one external account.
false_statement: A Data 360 data share target must be linked first, and the data share becomes active only once it is linked to that target.
explanation: Saving a data share makes it active, and only then can it be linked to a target. The target is the separate object that carries the external account's connection details.
