true_statement: In Agentforce Builder's Preview panel, Simulate mode uses mock data without running actions, while Live Test runs real actions and changes org data.
false_statement: In Agentforce Builder's Preview panel, Live Test uses mock data without running actions, while Simulate mode runs real actions and changes org data.
