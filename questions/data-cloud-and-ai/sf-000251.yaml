id: sf-000251
product_area: data-cloud-and-ai
true_statement: A source record joins a unified profile if it meets any one match rule in the ruleset, but it must satisfy every criterion within that rule.
false_statement: A source record joins a unified profile only if it meets every match rule in the ruleset, but it needs to satisfy just one criterion within each rule.
explanation: Match rules are ORed while the criteria inside a rule are ANDed. That is why adding rules raises the consolidation rate and adding criteria to a rule lowers it; the false statement reverses both.
