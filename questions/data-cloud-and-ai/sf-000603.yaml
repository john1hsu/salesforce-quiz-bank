id: sf-000603
product_area: data-cloud-and-ai
true_statement: A Data 360 data lake object in the Engagement category requires an event time field recording when the engagement happened, which must not change.
false_statement: A Data 360 data lake object in the Profile category requires an event time field recording when the engagement happened, which must not change.
explanation: The event time field is mandatory for Engagement data, which is time-stamped behaviour such as web visits. Profile DLOs hold demographic and contact data keyed by a unique ID and use a record modified field instead.
