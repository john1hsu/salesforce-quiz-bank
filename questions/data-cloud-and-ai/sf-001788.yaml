id: sf-001788
product_area: data-cloud-and-ai
true_statement: A Slack member without a Salesforce account needs a provisional Salesforce license before being mapped to use an Agentforce agent.
false_statement: A Slack member without a Salesforce account can use an Agentforce agent in Slack without any Salesforce license or user mapping.
explanation: Agents in Slack act on Salesforce permissions, so every member must map to a Salesforce user. Members who have no account get a provisional license first.
