id: sf-001149
product_area: data-cloud-and-ai
true_statement: A Data 360 data action can enrich its event with one related object and up to 10 related attributes before sending it.
false_statement: A Data 360 data action can enrich its event with up to 10 related objects and 100 related attributes before sending it.
explanation: Enrichment is limited to a single related object with at most 10 of its attributes. The false statement inflates both numbers.
