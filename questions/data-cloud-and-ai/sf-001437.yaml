id: sf-001437
product_area: data-cloud-and-ai
true_statement: For a double opt-in, a flow should use the Consent Request action, which grants the opt-in only after the recipient clicks the verification link.
false_statement: For a double opt-in, a flow should write the opt-in straight to the consent DMO, which grants it as soon as the confirmation email is sent.
explanation: The Consent Request action holds the opt-in until the verification link is clicked. Writing directly to the consent DMO does not update marketing consent as expected because of a cache layer, and granting on send would defeat the double opt-in.
