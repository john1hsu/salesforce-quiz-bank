id: sf-001221
product_area: data-cloud-and-ai
true_statement: Semantic model filters in Tableau Semantics aren't a security boundary; row-level security belongs in Data 360 policies.
false_statement: Semantic model filters in Tableau Semantics are the security boundary; row-level security belongs in the model's default filters.
explanation: Tableau's guidance treats model filters as a convenience, not access control, and puts row-level security in Data 360 policies. Relying on model filters to hide rows would leave data exposed.
