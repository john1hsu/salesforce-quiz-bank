id: sf-000948
product_area: data-cloud-and-ai
true_statement: When the same SKU appears on several contracts, Digital Wallet pools the entitlements on one card and draws usage first from the contract expiring soonest.
false_statement: When the same SKU appears on several contracts, Digital Wallet pools the entitlements on one card and draws usage first from the most recently signed contract.
explanation: Pooled entitlements are consumed earliest-expiry first, so credits that would lapse soonest are used before newer ones.
