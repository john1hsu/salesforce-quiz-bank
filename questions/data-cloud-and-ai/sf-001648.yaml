id: sf-001648
product_area: data-cloud-and-ai
true_statement: The Agentforce SDR agent needs a dedicated company-domain mailbox whose address matches the email on the agent's user record.
false_statement: The Agentforce SDR agent sends from the lead owner's own mailbox, so no separate address is needed on the agent's user record.
explanation: The agent runs as its own user and sends from a dedicated mailbox, and the connected email account must be the same address as on that user. It does not borrow the seller's inbox.
