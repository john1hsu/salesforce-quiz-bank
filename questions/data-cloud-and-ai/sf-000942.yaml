true_statement: An Agentforce Data Library's source is chosen when the library is created and can't be changed afterward.
false_statement: An Agentforce Data Library's source is chosen when the library is created and can be switched later from the library's settings.
explanation: Each library has a single source, such as Knowledge articles or uploaded files, and Trailhead warns that the choice is permanent; a different source means a new library.
