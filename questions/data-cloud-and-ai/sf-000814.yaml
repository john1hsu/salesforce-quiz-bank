id: sf-000814
product_area: data-cloud-and-ai
true_statement: An Agentforce subagent removed from the Agent Router's references can still be reached through a transition from another subagent.
false_statement: An Agentforce subagent removed from the Agent Router's references becomes unreachable, even through transitions from other subagents.
explanation: Dropping a subagent from the router means it can't be classified directly, but another subagent can still transition to it. That makes it a deliberately gated step.
