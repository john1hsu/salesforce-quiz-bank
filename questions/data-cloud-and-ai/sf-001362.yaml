id: sf-001362
product_area: data-cloud-and-ai
true_statement: A Data Cloud-triggered flow can start from a Bring Your Own Lake object only if that external object is accelerated.
false_statement: A Data Cloud-triggered flow can start from any Bring Your Own Lake object, whether or not that external object is accelerated.
explanation: Accelerated external objects, including BYOL objects, can trigger these flows, but a non-accelerated BYOL object has no trigger path. The false version drops the acceleration requirement.
