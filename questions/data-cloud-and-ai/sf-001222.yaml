id: sf-001222
product_area: data-cloud-and-ai
true_statement: In Data 360, each unstructured data lake object maps to at most one unstructured data model object, but several UDLOs can map to the same UDMO.
false_statement: In Data 360, each unstructured data model object maps from at most one unstructured data lake object, but one UDLO can map to several UDMOs.
explanation: 'The cardinality runs many-to-one: a UDLO feeds a single UDMO, while one UDMO can collect several UDLOs, such as recordings from multiple storage buckets. The false statement reverses that direction.'
