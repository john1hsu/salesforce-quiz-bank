id: sf-001366
product_area: data-cloud-and-ai
true_statement: The Data 360 Ingestion API allows 20 bulk jobs per hour with at most 5 running concurrently.
false_statement: The Data 360 Ingestion API allows 100 bulk jobs per hour with at most 25 running concurrently.
explanation: The Ingestion API reference caps bulk at 20 jobs an hour and 5 concurrent jobs, and an HTTP 429 means back off. The larger figures in the false version aren't the documented limits.
