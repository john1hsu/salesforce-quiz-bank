id: sf-001223
product_area: data-cloud-and-ai
true_statement: For blob-store sources such as Amazon S3, Data 360 leaves the files in place and the unstructured data model object references them.
false_statement: For blob-store sources such as Amazon S3, Data 360 copies the files into its own storage and the unstructured data model object holds them.
explanation: Data 360 doesn't import blob-store files; the UDMO points at them where they live, and a search index is built over that reference. Copying the files into Data 360 is not how this ingestion works.
