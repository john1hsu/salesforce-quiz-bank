true_statement: Salesforce says core Agentforce observability, including tracing ingestion and out-of-the-box dashboard queries, is free and unmetered, while building new dashboards still consumes credits.
false_statement: Salesforce says core Agentforce observability, including tracing ingestion and out-of-the-box dashboard queries, consumes credits, while building new dashboards is free and unmetered.
explanation: Tracing ingestion, metric aggregation and the shipped dashboards cost nothing, but new dashboards, external ingestion and new semantic objects still draw credits. The false version reverses which side is metered.
