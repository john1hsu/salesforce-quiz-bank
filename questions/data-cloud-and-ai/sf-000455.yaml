product_area: data-cloud-and-ai
true_statement: In Agentforce Builder only one version of an agent can be live, so activating a committed version deactivates the previous one.
false_statement: In Agentforce Builder several committed versions of an agent can be live at once, so activating one leaves the previous one active.
explanation: Committed versions are locked snapshots, and only one of them is active at a time. Activating a new version automatically turns off the earlier one.
