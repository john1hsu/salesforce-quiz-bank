id: sf-001150
product_area: data-cloud-and-ai
true_statement: Data 360 signs webhook data action payloads with HMAC-SHA256, and if no signing key exists the target receives no payload.
false_statement: Data 360 signs webhook data action payloads with HMAC-SHA256, and if no signing key exists the payload is sent unsigned.
explanation: Without a generated secret key, the call is logged as Signing Key Not Found and nothing is delivered. Data 360 does not fall back to sending unsigned payloads.
