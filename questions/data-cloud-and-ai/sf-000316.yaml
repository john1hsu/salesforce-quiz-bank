id: sf-000316
product_area: data-cloud-and-ai
true_statement: Zero copy file federation reads external files with Data 360's own compute, so it avoids the warehouse's compute fees.
false_statement: Zero copy query federation reads external files with Data 360's own compute, so it avoids the warehouse's compute fees.
explanation: File federation bypasses the external warehouse's compute layer and reads storage directly. Query federation sends queries to the external engine over JDBC, so it can incur that platform's compute charges.
