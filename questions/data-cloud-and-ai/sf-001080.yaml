product_area: data-cloud-and-ai
true_statement: A Data 360 org can have 25 streaming data transforms by default, a limit that can be adjusted through the Account Executive.
false_statement: A Data 360 org can have 1,000 streaming data transforms by default, a limit that can be adjusted through the Account Executive.
explanation: Streaming transforms are capped at 25 per org unless raised. The 1,000 figure is the cap for batch data transforms, not streaming ones.
