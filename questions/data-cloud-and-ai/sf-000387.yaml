id: sf-000387
product_area: data-cloud-and-ai
true_statement: For an Apex-based agent action, whether an input is required comes from the Apex code, so changing it means editing the class.
false_statement: For an Apex-based agent action, whether an input is required is set only in Agentforce Builder, so changing it needs no code edit.
explanation: The invocable method's variable definitions control which inputs are required. The builder pre-fills instructions from them, but the required setting is changed in code.
