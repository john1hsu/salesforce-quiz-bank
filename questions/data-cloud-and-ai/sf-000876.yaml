product_area: data-cloud-and-ai
true_statement: ISVs can package MCP server registration metadata in managed 2GP packages, but MCP tool actions and Gateway policies must be created by subscribers after install.
false_statement: ISVs can package MCP server registration metadata, MCP tool actions and Gateway policies together in managed 2GP packages.
explanation: The four registration metadata types can ship in 2GP packages at API version 66.0 or later, but tool actions and Agentforce Gateway policies can't be packaged yet, so subscribers set them up after installing.
