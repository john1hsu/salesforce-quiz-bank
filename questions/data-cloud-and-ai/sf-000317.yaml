id: sf-000317
product_area: data-cloud-and-ai
true_statement: Under zero copy query federation, change-triggered features such as data actions work only when caching is enabled.
false_statement: Under zero copy file federation, change-triggered features such as data actions work only when caching is enabled.
explanation: Query federation can't see changes in the external system unless caching is on. File federation can detect external changes without caching, so it doesn't carry that restriction.
