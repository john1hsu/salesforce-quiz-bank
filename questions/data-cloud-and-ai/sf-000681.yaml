id: sf-000681
product_area: data-cloud-and-ai
true_statement: In a Data 360 data stream, Incremental refresh blanks out fields that didn't change, while Partial writes only the changed fields and keeps the rest.
false_statement: In a Data 360 data stream, Partial refresh blanks out fields that didn't change, while Incremental writes only the changed fields and keeps the rest.
explanation: Incremental mode writes new values and blanks unchanged fields, so a delta-only source can lose data. Partial is the mode that preserves untouched fields; the false statement swaps them.
