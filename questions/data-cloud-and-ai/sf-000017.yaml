true_statement: In the pro-code Agent Script workflow, activation, not publishing, is what makes a new agent version reachable by users.
false_statement: In the pro-code Agent Script workflow, publishing, not activation, is what makes a new agent version reachable by users.
explanation: Publishing an Agent Script bundle only produces an inactive runnable version. Users reach it once it is activated as a separate step, so publishing alone does not put it live.
