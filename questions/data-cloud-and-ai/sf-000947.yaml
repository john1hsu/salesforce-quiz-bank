true_statement: When Salesforce renamed AI Specialist to Agentforce Specialist in 2025, existing AI Specialist holders were converted to the new credential without a new exam.
false_statement: When Salesforce renamed AI Specialist to Agentforce Specialist in 2025, existing AI Specialist holders had to pass the new exam to keep the credential.
explanation: Registration under the new name opened March 3, 2025, and current AI Specialist holders simply received the Agentforce Specialist credential.
