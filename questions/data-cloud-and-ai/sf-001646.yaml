product_area: data-cloud-and-ai
true_statement: A live Agentforce employee agent must be deactivated before it can be changed.
false_statement: A live Agentforce employee agent can be edited while it is active, and the changes reach users immediately.
explanation: Changes to an active agent require deactivating it first; once reactivated it is available wherever it has been shared. Editing in place while live is not supported.
