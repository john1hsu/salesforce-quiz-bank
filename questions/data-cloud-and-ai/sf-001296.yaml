id: sf-001296
product_area: data-cloud-and-ai
true_statement: Reading a Data 360 share from Databricks needs a Unity Catalog workspace and doesn't work on single-user clusters.
false_statement: Reading a Data 360 share from Databricks works on any cluster type, including single-user clusters, without needing a Unity Catalog workspace.
explanation: Databricks exposes the share as a Unity Catalog foreign catalog, so Unity Catalog is required. Single-user clusters are not supported for these reads.
