id: sf-000519
product_area: data-cloud-and-ai
true_statement: In Data 360, an ensemble retriever combines several individual retrievers, merges their results and reranks them by relevance.
false_statement: In Data 360, a custom SQL retriever combines several individual retrievers, merges their results and reranks them by relevance.
explanation: Merging and reranking results from multiple individual retrievers is the job of an ensemble retriever. A custom SQL retriever instead runs a parameterized SQL query against Data 360 objects.
