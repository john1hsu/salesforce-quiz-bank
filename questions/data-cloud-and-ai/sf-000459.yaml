id: sf-000459
product_area: data-cloud-and-ai
true_statement: Agentforce agent tests are stored as the AiEvaluationDefinition Metadata API type, which needs API version 63.0 or later.
false_statement: Agentforce agent tests are stored as the BotTestDefinition Metadata API type, which needs API version 60.0 or later.
explanation: AiEvaluationDefinition, available from API 63.0, holds agent tests so they can be deployed between orgs and run in CI. BotTestDefinition is not the type used.
