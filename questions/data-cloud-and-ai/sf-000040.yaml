id: sf-000040
product_area: data-cloud-and-ai
true_statement: Rules that must always hold, such as refund eligibility, belong in Agentforce action code, filters or Agent Script rather than in agent instructions.
false_statement: Rules that must always hold, such as refund eligibility, belong in Agentforce agent instructions rather than in action code, filters or Agent Script.
explanation: Instructions are natural language that the model interprets, so they are not deterministic and cannot enforce hard rules. Action code, filters and Agent Script run deterministically, which is why fixed rules go there.
