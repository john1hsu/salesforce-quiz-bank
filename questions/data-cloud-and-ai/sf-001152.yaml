id: sf-001152
product_area: data-cloud-and-ai
true_statement: In a Data 360 activation, direct attributes hold one value per member, while related attributes can carry several values for the same member.
false_statement: In a Data 360 activation, related attributes hold one value per member, while direct attributes can carry several values for the same member.
explanation: Direct attributes such as first name or postal code are single-valued; related attributes come from related objects and can be multi-valued. The false statement reverses them.
