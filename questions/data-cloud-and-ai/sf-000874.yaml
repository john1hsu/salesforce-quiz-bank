id: sf-000874
product_area: data-cloud-and-ai
true_statement: In MCP for Agentforce, external and third-party MCP servers are registered in Agentforce Registry, while MuleSoft servers go through API Catalog.
false_statement: In MCP for Agentforce, MuleSoft MCP servers are registered in Agentforce Registry, while external and third-party servers go through API Catalog.
explanation: Agentforce Registry is the home for external and third-party servers; MuleSoft and Salesforce standard or custom servers are registered through API Catalog. The false statement swaps the two registration paths.
