id: sf-001076
product_area: data-cloud-and-ai
true_statement: Since Winter '25, Data 360 metadata can't share a package with other platform metadata, and unlocked packages can't hold Data 360 metadata at all.
false_statement: Since Winter '25, Data 360 metadata can't share a package with other platform metadata, and managed packages can't hold Data 360 metadata at all.
explanation: Data 360 metadata must sit in its own package, and the package types that can carry it are managed and unmanaged ones. It is unlocked packages, not managed ones, that are excluded.
