id: sf-001507
product_area: data-cloud-and-ai
true_statement: In Data Cloud One, queries, segment runs, flows and AI activity performed in a companion org consume the home org's Data 360 credits.
false_statement: In Data Cloud One, queries, segment runs, flows and AI activity performed in a companion org consume that companion org's own Data 360 credits.
explanation: Data Cloud One bills all companion-org usage to the home org's credits, with per-org usage visible in Digital Wallet. Companion orgs don't draw on a separate credit pool of their own.
