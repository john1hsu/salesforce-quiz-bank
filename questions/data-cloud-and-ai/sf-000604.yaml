id: sf-000604
product_area: data-cloud-and-ai
true_statement: On Profile and Other data lake objects, the record modified field tells Data 360 which version of a record is newest when data arrives out of order.
false_statement: On Profile and Other data lake objects, the primary key field tells Data 360 which version of a record is newest when data arrives out of order.
explanation: The record modified field carries the timestamp used to keep the latest version when records arrive out of sequence. The primary key only identifies which record it is, not which version is newer.
