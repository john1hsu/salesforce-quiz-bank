id: sf-001009
product_area: data-cloud-and-ai
true_statement: A Data 360 data graph stores the joined fields of its primary DMO and related DMOs as one read-only JSON record per entity.
false_statement: A Data 360 data graph stores the joined fields of its primary DMO and related DMOs as one editable JSON record per entity that apps can write back to.
explanation: Data graphs precompute and materialize the joins into a read-only JSON blob, so they serve as a fast lookup source rather than a place to write data.
