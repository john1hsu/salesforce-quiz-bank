id: sf-001504
product_area: data-cloud-and-ai
true_statement: On the Data 360 Query API V3 endpoint, ADAPTIVE is the default transferMode and returns rows inline when the query finishes in time.
false_statement: On the Data 360 Query API V3 endpoint, ASYNC is the default transferMode and returns rows inline when the query finishes in time.
explanation: ADAPTIVE is the default and falls back to an asynchronous response only when the query runs past its timeout. ASYNC never returns rows inline; it sends metadata and the client polls.
