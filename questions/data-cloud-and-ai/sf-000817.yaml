product_area: data-cloud-and-ai
true_statement: Data 360 data action events are kept for four days, so consuming systems should be built to be durable.
false_statement: Data 360 data action events are kept for thirty days, so consuming systems can safely replay a month of history.
explanation: The developer blog notes a four-day retention window for action events. A thirty-day replay window is far longer than what is kept.
