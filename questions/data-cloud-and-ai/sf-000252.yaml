id: sf-000252
product_area: data-cloud-and-ai
true_statement: An identity resolution ruleset ID can be at most four characters long and cannot be changed after it is set.
false_statement: An identity resolution ruleset ID can be up to forty characters long and can be renamed at any time after it is set.
explanation: The Trailhead module describes the optional ruleset ID as limited to four characters and fixed once saved. Both the forty-character length and the ability to rename it are wrong.
