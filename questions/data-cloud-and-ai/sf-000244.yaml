id: sf-000244
product_area: data-cloud-and-ai
true_statement: A segment-ready calculated insight must include the primary key of the object you segment on, such as Unified Individual, as a dimension.
false_statement: A segment-ready calculated insight must include only a business key, such as an order number, as a dimension.
explanation: To be usable in segmentation, an insight has to join the segment-on object and group by its primary key; grouping by just a business key is the common mistake.
