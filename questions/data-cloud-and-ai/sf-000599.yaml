id: sf-000599
product_area: data-cloud-and-ai
true_statement: Rows returned by a Data 360 Query API query can be re-read for 24 hours without incurring further consumption charges.
false_statement: Rows returned by a Data 360 Query API query can be re-read for 1 hour without incurring further consumption charges.
explanation: The Query API guide keeps results available for 24 hours, so paging through stored rows is cheaper than running the query again. One hour understates that window.
