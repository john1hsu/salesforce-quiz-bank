id: sf-001714
product_area: data-cloud-and-ai
true_statement: Admins get access to Setup with Agentforce through the Setup with Agentforce User permission set group.
false_statement: Admins get access to Setup with Agentforce automatically through the System Administrator profile, with no extra assignment.
explanation: After the feature is turned on, each admin who will use it must be assigned the Setup with Agentforce User permission set group. Having the admin profile alone does not grant it.
