true_statement: An Agent API call that runs past the API's 120-second timeout fails with HTTP 500, so long-running agent actions need design care.
false_statement: An Agent API call that runs past the API's 30-second timeout fails with HTTP 500, so long-running agent actions need design care.
explanation: The Agent API allows 120 seconds before a request errors out with a 500. Thirty seconds understates the timeout.
