product_area: data-cloud-and-ai
true_statement: Only standard data bundles, such as the Salesforce CRM or Marketing Cloud Engagement bundles, can be deployed to a non-default data space.
false_statement: Standard data bundles, such as the Salesforce CRM or Marketing Cloud Engagement bundles, can be deployed only to the default data space.
explanation: Standard bundles are exactly what can go into a non-default data space. The false version restricts them to the default data space instead.
