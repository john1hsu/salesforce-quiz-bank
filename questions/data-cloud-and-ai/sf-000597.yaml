id: sf-000597
product_area: data-cloud-and-ai
true_statement: Under the Customer Data Platform license, one Data 360 unified profile can merge up to 50,000 source profiles.
false_statement: Under the Customer Data Platform license, one Data 360 unified profile can merge up to 5,000 source profiles.
explanation: The identity resolution limits table caps a single unified profile at 50,000 merged source profiles. The 5,000 figure is ten times too low; 5,000 is the ceiling for data streams, not merged profiles.
