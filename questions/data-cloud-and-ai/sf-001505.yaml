id: sf-001505
product_area: data-cloud-and-ai
true_statement: In ADAPTIVE mode, the Data 360 Query API resultRange.byteLimit for inline results is 20 MB by default and at most.
false_statement: In ADAPTIVE mode, the Data 360 Query API resultRange.byteLimit for inline results is 100 MB by default and at most.
explanation: The inline result cap is 20 MB, which is both the default and the maximum. Larger results should be read through the chunk resource.
