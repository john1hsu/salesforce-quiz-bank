id: sf-001292
product_area: data-cloud-and-ai
true_statement: Switching off Einstein Generative AI Data Collection pauses the stream, so the paused period is simply missing from later audit reports.
false_statement: Switching off Einstein Generative AI Data Collection buffers the stream, so the paused period is backfilled into audit reports when collection resumes.
explanation: Turning collection off stops capture rather than queuing it. Nothing from that window is recovered later, which leaves a gap in reporting.
