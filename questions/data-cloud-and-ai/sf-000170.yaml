product_area: data-cloud-and-ai
true_statement: Apex grounding for a prompt template is an @InvocableMethod whose capabilityType matches the template type.
false_statement: Apex grounding for a prompt template is an @AuraEnabled method whose capabilityType matches the template type.
explanation: Grounding Apex uses an invocable method that takes a list of requests and returns a list of responses, with capabilityType tying it to the template type. It must be deployed before it shows up as a resource.
