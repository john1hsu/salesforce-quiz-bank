true_statement: Salesforce advises keeping an Agentforce agent to about 10-15 subagents, with no more than 15 actions per subagent.
false_statement: Salesforce advises keeping an Agentforce agent to about 10-15 subagents, with no more than 50 actions per subagent.
explanation: The guidance caps actions at 15 per subagent because overlapping, cluttered options make classification less consistent. 50 actions per subagent is well beyond that recommendation.
