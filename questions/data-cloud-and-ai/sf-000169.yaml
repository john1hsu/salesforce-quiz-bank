id: sf-000169
product_area: data-cloud-and-ai
true_statement: A Field Generation prompt template reaches users only after Dynamic Forms is enabled, the template is selected on the field and the page assigned.
false_statement: A Field Generation prompt template reaches users as soon as it is activated, with no change to the record page needed.
explanation: Field Generation templates surface through the record page, so the page must use Dynamic Forms with the template set on the field. Users then click the Einstein icon to get a suggestion.
