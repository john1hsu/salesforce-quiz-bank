id: sf-001077
product_area: data-cloud-and-ai
true_statement: A data kit's publishing sequence is generated from component creation time, so upstream items like a calculated insight must deploy before the segments that use them.
false_statement: A data kit's publishing sequence is generated alphabetically by component name, so upstream items like a calculated insight must deploy before the segments that use them.
explanation: Data kits order components by when they were created, and dependencies must come first or the deployment fails. Alphabetical ordering is not how the sequence is built.
