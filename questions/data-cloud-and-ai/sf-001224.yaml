id: sf-001224
product_area: data-cloud-and-ai
true_statement: The Data 360 SharePoint Unstructured (Documents) connector ingests only a site's default Documents library, with no subsites or other libraries.
false_statement: The Data 360 SharePoint Unstructured (Documents) connector ingests every document library on a site, including those in its subsites.
explanation: The connector's scope is limited to the default Documents library of the site you name; subsites, other libraries and folder-level filtering aren't supported. Content elsewhere on the site is not picked up.
