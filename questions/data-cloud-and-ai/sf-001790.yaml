id: sf-001790
product_area: data-cloud-and-ai
true_statement: Models API calls made from Apex in a sandbox are limited to 500 requests per hour, while sandbox REST calls use the production limits.
false_statement: Models API calls made over REST in a sandbox are limited to 500 requests per hour, while sandbox Apex calls use the production limits.
explanation: The reduced sandbox quota applies to the Apex classes, not to REST. REST calls from a sandbox get the same limits as production.
