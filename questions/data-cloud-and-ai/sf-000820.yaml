true_statement: Choosing Code Extension as a Data 360 search index chunking strategy requires the Data Cloud Architect permission set.
false_statement: Choosing Code Extension as a Data 360 search index chunking strategy requires only the Data Cloud User permission set.
explanation: Custom Python chunking functions are selected per field after deployment, and that requires the Data Cloud Architect permission set. A basic user permission set is not enough.
