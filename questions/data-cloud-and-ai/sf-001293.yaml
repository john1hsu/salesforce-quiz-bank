id: sf-001293
product_area: data-cloud-and-ai
true_statement: In the generative AI audit data model, one gateway request can produce many generations, and each generation can have zero or many feedback records.
false_statement: In the generative AI audit data model, each gateway request produces exactly one generation, and each generation has exactly one feedback record.
explanation: The model is one-to-many at both levels, which is why joins repeat request IDs and counts need deduplicating. A strict one-to-one chain doesn't match the schema.
