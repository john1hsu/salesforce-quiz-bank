id: sf-001508
product_area: data-cloud-and-ai
true_statement: In Data Cloud One, companion orgs can't ingest or unify data; ingestion, identity resolution and unification all run in the home org.
false_statement: In Data Cloud One, each companion org ingests and unifies its own data, and the home org only hosts the shared data spaces.
explanation: The home org does all ingestion, identity resolution and unification, and companions only consume the shared metadata and data through the Data Cloud One app. The false version gives companions ingestion duties they don't have.
