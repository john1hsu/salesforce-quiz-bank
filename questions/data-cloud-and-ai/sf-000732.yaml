id: sf-000732
product_area: data-cloud-and-ai
true_statement: A BYOM model hosted on Amazon SageMaker, Google Vertex AI or Databricks stays on that platform and is called from Data 360 through an API.
false_statement: A BYOM model hosted on Amazon SageMaker, Google Vertex AI or Databricks is imported into Data 360 and then runs there instead of on that platform.
explanation: Bring-your-own-model keeps the model where it was trained; Data 360 sends predictor values to its endpoint and stores the results. Nothing is copied into Salesforce.
