product_area: data-cloud-and-ai
true_statement: Data 360 related list enrichments query Data 360 when the user opens them, while copy field enrichments write values into CRM fields through a batch job.
false_statement: Data 360 related list enrichments copy records into CRM through a batch job, while copy field enrichments query Data 360 live when the user opens the record.
explanation: Related lists show near-real-time Data 360 records without copying them. Copy fields physically store values on the CRM record via batch sync, which is why they can be used in reports and flows.
