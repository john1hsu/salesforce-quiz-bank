id: sf-001295
product_area: data-cloud-and-ai
true_statement: Moving Data 360 shares from the legacy Snowflake target to the Snowflake V2 target isn't automatic, and the V2 target should be linked before the legacy one is unlinked.
false_statement: Moving Data 360 shares from the legacy Snowflake target to the Snowflake V2 target happens automatically, and the legacy target should be unlinked before V2 is linked.
explanation: Admins migrate each share themselves and link V2 first so consumers keep access. Snowflake also supplies a function to swap database names for downstream references.
