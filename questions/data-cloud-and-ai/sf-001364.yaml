id: sf-001364
product_area: data-cloud-and-ai
true_statement: A Data 360 record whose data change event exceeds about 128k characters is skipped with no flow error, so you monitor the Data Actions Activity tab.
false_statement: A Data 360 record whose data change event exceeds about 128k characters fails the flow with an error email, so you monitor flow error emails.
explanation: Each qualifying record reaches the org as a data change event with a 128k-character record limit, and oversized records are silently skipped. The Data Actions Activity tab, not a flow error, is where they show up.
