id: sf-001644
product_area: data-cloud-and-ai
true_statement: An Agentforce employee agent runs in the context of the logged-in user, so its actions are limited by that person's licenses and permissions.
false_statement: An Agentforce employee agent runs as a shared agent user, so every employee who asks it gets the same data access regardless of their own permissions.
explanation: Employee agents act as the person using them, so a manager and a direct report see different results according to their own access. They do not run under a common agent user identity.
