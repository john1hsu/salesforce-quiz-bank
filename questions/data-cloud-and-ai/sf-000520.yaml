id: sf-000520
product_area: data-cloud-and-ai
true_statement: Data 360 retrievers follow data governance policies, so records the running user or agent can't access are left out of the results.
false_statement: Data 360 retrievers return every indexed record, and record access is enforced afterwards only by the Einstein Trust Layer.
explanation: Retrievers are permission-aware and drop records the user or agent can't see. The Einstein Trust Layer adds prompt-level safeguards but is not what filters retrieval results by record access.
