id: sf-001367
product_area: data-cloud-and-ai
true_statement: Appending /actions/test to an Ingestion API streaming endpoint validates records against the schema without loading them into Data 360.
false_statement: Appending /actions/test to an Ingestion API streaming endpoint loads records into a sandbox copy of Data 360 for testing before production.
explanation: The test action checks payloads against the connector's schema and loads nothing, so developers can catch field-name or type errors safely. It does not route data to a separate sandbox copy.
