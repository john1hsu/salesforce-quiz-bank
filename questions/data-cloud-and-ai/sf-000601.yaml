id: sf-000601
product_area: data-cloud-and-ai
true_statement: A Data 360 waterfall segment places each person in the first of its ordered segments that they match, making the buckets mutually exclusive.
false_statement: A Data 360 waterfall segment places each person in the last of its ordered segments that they match, making the buckets mutually exclusive.
explanation: Waterfalls evaluate their segments in order and stop at the first match, which is how each customer gets only the best offer they qualify for. It is the first match that wins, not the last.
