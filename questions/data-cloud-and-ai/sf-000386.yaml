id: sf-000386
product_area: data-cloud-and-ai
true_statement: Agent actions don't bulkify by default, and each action runs in its own transaction.
false_statement: Agent actions bulkify by default, and all actions in one conversation turn share a single transaction.
explanation: Because actions aren't bulkified and each gets its own transaction, Apex behind them must be bulk-safe and the agent should be told to pass all records in one call.
