id: sf-001436
product_area: data-cloud-and-ai
true_statement: To retire a Communication Subscription in Marketing Cloud Next, hide it from preference pages, because deleting it cascades and erases its consent history.
false_statement: To retire a Communication Subscription in Marketing Cloud Next, delete it, because deletion moves its consent history into a read-only audit archive.
explanation: Deleting a subscription cascades to its consent records and wipes the history permanently, so the recommended path is to hide it from preference pages. There is no archive that preserves the history after deletion.
