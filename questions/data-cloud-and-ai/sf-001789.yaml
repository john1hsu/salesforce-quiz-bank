true_statement: In production orgs, the Models API allows 10,000 generation requests per minute per org per endpoint, but only 1,000 per minute for embeddings.
false_statement: In production orgs, the Models API allows 1,000 generation requests per minute per org per endpoint, but 10,000 per minute for embeddings.
explanation: Generation endpoints get the higher 10,000-per-minute ceiling, while embeddings and feedback are each capped at 1,000 per minute. The false statement swaps the two.
