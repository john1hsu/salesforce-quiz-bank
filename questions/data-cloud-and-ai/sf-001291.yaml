product_area: data-cloud-and-ai
true_statement: After an admin turns on Einstein Generative AI Data Collection, the first audit and feedback data can take up to 24 hours to appear in Data 360.
false_statement: After an admin turns on Einstein Generative AI Data Collection, the first audit and feedback data appears in Data 360 within 15 minutes.
explanation: Initial records can take as long as a day to flow through data lake objects into the standard DMOs. A 15-minute window understates that delay.
