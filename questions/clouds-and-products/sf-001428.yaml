product_area: clouds-and-products
true_statement: Trailhead advises creating no more than three populations per Marketing Cloud Engagement account in Contact Builder, for performance reasons.
false_statement: Trailhead advises creating no more than ten populations per Marketing Cloud Engagement account in Contact Builder, for performance reasons.
explanation: Populations are large master subsets of contacts, and Trailhead caps its recommendation at three per account to protect performance. Ten is far above that guidance.
