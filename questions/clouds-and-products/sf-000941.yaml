id: sf-000941
product_area: clouds-and-products
true_statement: Heroku AppLink currently runs only in the virginia region, which adds latency for apps hosted far from it.
false_statement: Heroku AppLink currently runs in every Heroku region, so it adds no latency for apps hosted outside the US.
explanation: AppLink, which publishes Heroku APIs to Salesforce as External Services, is available only in the virginia region today, so distant apps pay a latency cost.
