product_area: clouds-and-products
true_statement: In Lightning Knowledge, kinds of articles are modeled as record types on Knowledge__kav instead of separate article type objects.
false_statement: In Lightning Knowledge, each kind of article gets its own object pair, such as FAQ__kav, instead of a record type.
explanation: Lightning Knowledge keeps all articles in Knowledge__ka and Knowledge__kav and uses record types to vary layouts. Separate per-type object pairs were the Classic article-type model.
