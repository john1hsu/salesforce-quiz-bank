id: sf-001642
product_area: clouds-and-products
true_statement: If an org exceeds its Salesforce Voice concurrent-call or calls-per-second limit, VoiceCall records can't be created.
false_statement: If an org exceeds its Salesforce Voice concurrent-call or calls-per-second limit, VoiceCall records are still created but transcription stops.
explanation: Hitting the call-rate limits blocks VoiceCall creation, which shows up in the InvokeTelephonyIntegrationApi Lambda output. Stopped transcription is the separate symptom of exceeding the transcription limit.
