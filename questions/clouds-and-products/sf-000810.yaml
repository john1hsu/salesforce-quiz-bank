product_area: clouds-and-products
true_statement: In Omnistudio's standard data model, Data Mappers are stored in the OmniDataTransform object.
false_statement: In Omnistudio's standard data model, Data Mappers are stored in the OmniUiCard object.
explanation: The standard model stores Omniscripts in OmniProcess, Data Mappers in OmniDataTransform and FlexCards in OmniUiCard. OmniUiCard holds FlexCards, not Data Mappers.
