id: sf-001781
product_area: clouds-and-products
true_statement: In the Scheduling Console, resource utilization is scheduled work plus travel time, divided by working hours minus absence hours.
false_statement: In the Scheduling Console, resource utilization is scheduled work alone, divided by working hours including absence hours.
explanation: Utilization counts travel as well as work, and the denominator removes absence hours from working hours. Leaving out travel and keeping absences would understate how busy a resource is.
