product_area: clouds-and-products
true_statement: Salesforce Scheduler is an extra-cost add-on, available in Enterprise, Unlimited, Performance and Developer editions.
false_statement: Salesforce Scheduler is included at no extra cost in Enterprise, Unlimited, Performance and Developer editions.
explanation: Scheduler is sold separately, so a plain Sales or Service Cloud org does not have it. The editions listed only determine where the add-on can be bought.
