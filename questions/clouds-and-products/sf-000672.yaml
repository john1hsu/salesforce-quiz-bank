product_area: clouds-and-products
true_statement: In the Salesforce CPQ price waterfall, Regular Price reflects automatic volume discounts and Customer Price reflects the rep's manual discounts.
false_statement: In the Salesforce CPQ price waterfall, Customer Price reflects automatic volume discounts and Regular Price reflects the rep's manual discounts.
explanation: The waterfall applies volume discounts to reach Regular Price, then the rep's manual discounts to reach Customer Price. The false statement swaps the two fields.
