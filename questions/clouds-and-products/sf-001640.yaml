id: sf-001640
product_area: clouds-and-products
true_statement: Event-triggered Field Service scheduling runs as the Automated Process user by default, which lacks the Field Service permission sets the scheduling API needs.
false_statement: Event-triggered Field Service scheduling runs as the user who fired the event by default, so that user's Field Service permission sets always apply.
explanation: FSL.ScheduleService needs a user with a Field Service Admin, Dispatcher, Call Center or Self-Service permission set, and the default Automated Process user has none of them. Scheduling from event triggers therefore needs a deliberately chosen running user.
