id: sf-001573
product_area: clouds-and-products
true_statement: Under Salesforce Scheduler, a service appointment's ParentRecordId can't be changed after the record is created.
false_statement: Under Salesforce Scheduler, a service appointment's ParentRecordId can be changed at any time to move it to another account, case, lead or opportunity.
explanation: Scheduler allows an account, case, lead or opportunity as the parent, but the parent is fixed at creation and can't be edited later.
