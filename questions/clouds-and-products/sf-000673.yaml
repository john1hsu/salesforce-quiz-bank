id: sf-000673
product_area: clouds-and-products
true_statement: Salesforce CPQ filter rules narrow which products can go into a bundle, while selection rules add, remove or hide bundle options.
false_statement: Salesforce CPQ selection rules narrow which products can go into a bundle, while filter rules add, remove or hide bundle options.
explanation: Filter rules restrict the products available to a bundle; selection rules act on options by adding, removing, hiding, enabling or disabling them. The false statement reverses the two.
