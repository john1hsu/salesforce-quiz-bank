id: sf-001570
product_area: clouds-and-products
true_statement: A Dispatcher Console custom action can open a Visualforce page, but not one that belongs to a managed package.
false_statement: A Dispatcher Console custom action can open any Visualforce page, including one that belongs to a managed package.
explanation: Custom actions can call Apex or open Visualforce pages that receive ids and dates as GET parameters, but pages shipped in a managed package can't be the target.
