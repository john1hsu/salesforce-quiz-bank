id: sf-001142
product_area: clouds-and-products
true_statement: In Salesforce Loyalty Management, qualifying currency has no cash value and drives tier status, while non-qualifying currency is the points members redeem.
false_statement: In Salesforce Loyalty Management, non-qualifying currency has no cash value and drives tier status, while qualifying currency is the points members redeem.
explanation: Qualifying points count toward tiers and can't be spent; non-qualifying points are the redeemable balance. The false statement reverses the two currency types.
