id: sf-001568
product_area: clouds-and-products
true_statement: In the Field Service Dispatcher Console, the Customer First scheduling policy is selected by default, and a dispatcher can switch policies, for example during an emergency.
false_statement: In the Field Service Dispatcher Console, the Emergency scheduling policy is selected by default, and a dispatcher can switch policies, for example for routine work.
explanation: The appointment list's Policy control defaults to Customer First. Dispatchers change it when a situation such as an emergency calls for a different policy.
