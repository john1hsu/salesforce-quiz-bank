true_statement: In Marketing Cloud Engagement, an Automation Studio SQL query activity is deactivated automatically after 24 consecutive failures.
false_statement: In Marketing Cloud Engagement, an Automation Studio SQL query activity is deactivated automatically after 10 consecutive failures.
