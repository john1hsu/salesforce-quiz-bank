id: sf-001502
product_area: clouds-and-products
true_statement: In Salesforce Scheduler, an admin can map only one work type from a given work type group to any one service territory.
false_statement: In Salesforce Scheduler, an admin can map up to five work types from a given work type group to any one service territory.
explanation: Scheduler allows a single work type per work type group per territory. Allowing several would make the template for a topic at one location ambiguous.
