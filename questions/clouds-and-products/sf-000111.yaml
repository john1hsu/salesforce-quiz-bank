id: sf-000111
product_area: clouds-and-products
true_statement: Changes to an LWR Experience Cloud site appear to visitors only after the site is republished, because its components are fixed at publish time.
false_statement: Changes to an Aura Experience Cloud site appear to visitors only after the site is republished, because its components are fixed at publish time.
explanation: LWR sites freeze their components when published and serve them as static content, so edits need a republish; that publish-time behaviour is the LWR difference, not an Aura one.
