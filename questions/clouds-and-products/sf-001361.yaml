true_statement: Salesforce says existing Marketing Cloud Engagement and Account Engagement customers can use Marketing Cloud Next's AI capabilities without switching platforms.
false_statement: Salesforce says existing Marketing Cloud Engagement and Account Engagement customers must migrate to Marketing Cloud Next before using its AI capabilities.
explanation: Salesforce's marketing site states that Next's AI features are available to Engagement and Account Engagement customers without a platform switch. Requiring a migration first contradicts that positioning.
