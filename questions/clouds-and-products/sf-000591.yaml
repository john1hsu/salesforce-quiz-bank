id: sf-000591
product_area: clouds-and-products
true_statement: A Lightning web component appears in Experience Builder's drag-and-drop Components panel when its js-meta.xml declares the lightningCommunity__Page target.
false_statement: A Lightning web component appears in Experience Builder's drag-and-drop Components panel when its js-meta.xml declares the lightningCommunity__Theme_Layout target.
explanation: The lightningCommunity__Page target puts an exposed component in the Components panel. Theme_Layout instead makes it a theme layout for LWR sites, not a draggable component.
