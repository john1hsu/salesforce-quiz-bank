product_area: clouds-and-products
true_statement: Tableau Next semantic models are private by default, so users need data space access, Semantic Models permissions and explicit sharing to use one.
false_statement: Tableau Next semantic models are shared with every user in the data space by default, so only Semantic Models permissions are needed to use one.
explanation: 'Access to a semantic model is layered: data space access, user-level Semantic Models permissions and sharing of the model itself. New models start private rather than open to the data space.'
