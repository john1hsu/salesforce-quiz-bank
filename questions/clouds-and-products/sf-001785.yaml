id: sf-001785
product_area: clouds-and-products
true_statement: A work order's FSL__VisitingHours__c limits when its appointments can be scheduled only if the scheduling policy includes the Visiting Hours work rule.
false_statement: A work order's FSL__VisitingHours__c always limits when its appointments can be scheduled, whatever work rules the scheduling policy includes.
explanation: The visiting-hours lookup is only enforced through the Visiting Hours work rule. Without that rule in the policy, the scheduler ignores the field.
