id: sf-001144
product_area: clouds-and-products
true_statement: In Salesforce Loyalty Management, a qualifying currency belongs to exactly one tier group, although a tier group can use several qualifying currencies.
false_statement: In Salesforce Loyalty Management, a tier group uses exactly one qualifying currency, although a qualifying currency can be shared by several tier groups.
explanation: 'The cardinality runs one way: each qualifying currency maps to a single tier group, while one tier group may draw on multiple qualifying currencies. The false statement flips it.'
