id: sf-001287
product_area: clouds-and-products
true_statement: A Marketing Cloud Next email needs a Data 360 data graph only when the message uses more than one record type.
false_statement: A Marketing Cloud Next email needs a Data 360 data graph for every message, even when it uses only one record type.
explanation: Data graphs shape related records for personalization, so they matter only when several record types feed the message. Salesforce also suggests keeping them to the fields the flow uses.
