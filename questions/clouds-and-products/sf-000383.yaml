id: sf-000383
product_area: clouds-and-products
true_statement: A milestone with the No Recurrence type fires only once per record.
false_statement: A milestone with the Independent recurrence type fires only once per record.
explanation: No Recurrence fires once per record. Independent milestones fire whenever their criteria are met, and Sequential ones repeat in order each time criteria are met.
