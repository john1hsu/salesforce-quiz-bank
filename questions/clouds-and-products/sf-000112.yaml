id: sf-000112
product_area: clouds-and-products
true_statement: The Customer Community license has no roles or sharing rules, so sites built on it rely on sharing sets to give users record access.
false_statement: The Partner Community license has no roles or sharing rules, so sites built on it rely on sharing sets to give users record access.
explanation: Customer Community is the high-volume tier without roles or sharing rules, which is why it depends on sharing sets; Partner Community includes roles, sharing rules and reports.
