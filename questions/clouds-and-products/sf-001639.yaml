product_area: clouds-and-products
true_statement: With Enhanced Scheduling and Optimization, candidates collect penalty points and the lowest penalty wins, while the legacy engine awards points and picks the highest.
false_statement: With Enhanced Scheduling and Optimization, candidates collect reward points and the highest score wins, while the legacy engine assigns penalties and picks the lowest.
explanation: The enhanced engine scores options by penalties, so the smallest total is best; the legacy engine works the other way, adding up rewards. The false version swaps the two engines' scoring.
