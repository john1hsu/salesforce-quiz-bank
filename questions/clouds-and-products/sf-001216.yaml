id: sf-001216
product_area: clouds-and-products
true_statement: A report run through the Reports and Dashboards REST API returns at most 2,000 rows and 100 columns.
false_statement: A report run through the Reports and Dashboards REST API returns at most 50,000 rows and 100 columns.
explanation: The REST API caps each report run at 2,000 rows and 100 columns, which is a key reason larger analyses move to CRM Analytics or Tableau. A 50,000-row ceiling overstates the API's limit many times over.
