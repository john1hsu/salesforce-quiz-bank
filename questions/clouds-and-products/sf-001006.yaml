true_statement: In April 2026, Salesforce merged AppExchange, the Slack Marketplace and the Agentforce-focused AgentExchange into one storefront called AgentExchange.
false_statement: In April 2026, Salesforce merged AppExchange and the Agentforce-focused AgentExchange into one storefront, while the Slack Marketplace stayed separate.
explanation: The unified AgentExchange absorbed all three marketplaces, including the Slack Marketplace, so Slack apps are listed in the same storefront.
