id: sf-000313
product_area: clouds-and-products
true_statement: On Tableau Cloud, multi-factor authentication is required for all users.
false_statement: On Tableau Cloud, multi-factor authentication is required only for site administrators.
explanation: Tableau Cloud enforces MFA for every user, not just admins. Because Cloud also lacks direct Active Directory, LDAP and Kerberos sign-in, identity is integrated through SAML or OIDC.
