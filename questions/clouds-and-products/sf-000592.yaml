id: sf-000592
product_area: clouds-and-products
true_statement: Once a Lightning web component is placed on an Experience Cloud site, you can't add a new required property to it.
false_statement: Once a Lightning web component is placed on an Experience Cloud site, you can add new required properties but can't add optional ones.
explanation: After a component is in use on a site or in a managed package, adding a required property, removing one or tightening min and max is blocked. The false version flips which change is restricted.
