id: sf-001070
product_area: clouds-and-products
true_statement: In Salesforce Backup & Recover, a synthetic full backup runs daily, captures only changes since the last run and merges them into the previous backup.
false_statement: In Salesforce Backup & Recover, a synthetic full backup runs weekly, captures only changes since the last run and merges them into the previous backup.
explanation: Synthetic full backups are the daily incremental type that folds changes into the prior backup. The weekly cadence belongs to the true full backup, not the synthetic one.
