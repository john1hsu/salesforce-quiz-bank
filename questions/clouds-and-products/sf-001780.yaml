id: sf-001780
product_area: clouds-and-products
true_statement: The Field Service Scheduling Console's Gantt runs in the service territory's time zone; individual user time zones aren't supported.
false_statement: The Field Service Scheduling Console's Gantt runs in each dispatcher's own user time zone rather than the territory's.
explanation: The Gantt always shows times in the service territory's time zone. Dispatchers in other zones can't switch it to their personal time zone.
