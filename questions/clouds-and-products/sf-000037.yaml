id: sf-000037
product_area: clouds-and-products
true_statement: If no business hours are set, entitlement milestone timers use the org default of 24/7, so deadlines can expire overnight.
false_statement: If no business hours are set, entitlement milestone timers pause outside weekday working hours, so deadlines can expire only during the day.
explanation: Without business hours, milestones fall back to the org default of 24/7 and keep counting through nights and weekends. They do not pause outside working hours unless business hours are configured.
