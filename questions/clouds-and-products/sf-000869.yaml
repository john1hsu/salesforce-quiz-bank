id: sf-000869
product_area: clouds-and-products
true_statement: In Agentforce Nonprofit, a household is a business account that a Party Relationship Group record marks as a household.
false_statement: In Agentforce Nonprofit, a household is a dedicated Household custom object that contacts are linked to by lookup.
explanation: The built-in model uses a business account plus a Party Relationship Group, which also holds household-level details. A separate Household custom object is not how it is modeled.
