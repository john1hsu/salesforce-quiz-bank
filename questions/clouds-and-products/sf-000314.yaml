id: sf-000314
product_area: clouds-and-products
true_statement: Tableau Next is licensed separately, as Creator or Consumer, rather than through the Viewer, Explorer and Creator licenses of Tableau by Tableau.
false_statement: Tableau Next is licensed through the same Viewer, Explorer and Creator licenses used by Tableau Cloud and Tableau Server.
explanation: Tableau Next and the original Tableau portfolio are separate products with separate licenses. Tableau Next uses Creator and Consumer licenses; Viewer, Explorer and Creator belong to Tableau by Tableau.
