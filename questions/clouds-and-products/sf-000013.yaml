id: sf-000013
product_area: clouds-and-products
true_statement: When a custom Omni-Channel presence configuration is assigned to both a user and that user's profile, the user-level assignment takes precedence.
false_statement: When a custom Omni-Channel presence configuration is assigned to both a user and that user's profile, the profile-level assignment takes precedence.
explanation: Presence configurations can be assigned to profiles or to individual users, and the individual assignment wins over the profile one. A user can only hold one presence configuration at a time, so adding them to another removes them from the first.
