id: sf-000596
product_area: clouds-and-products
true_statement: When a lead is converted into an existing contact, only the contact's empty fields are filled from the lead; existing values are kept.
false_statement: When a lead is converted into an existing contact, all of the contact's fields are overwritten with the lead's values.
explanation: Merging into existing records fills blanks and preserves current values, IDs included. The only overwrite offered is the option to replace the contact's Lead Source.
