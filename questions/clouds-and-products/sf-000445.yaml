id: sf-000445
product_area: clouds-and-products
true_statement: Revenue splits on an opportunity are capped at 100%, while overlay splits can total more than 100%.
false_statement: Overlay splits on an opportunity are capped at 100%, while revenue splits can total more than 100%.
explanation: Revenue splits divide credit among the people directly responsible, so they can't exceed 100%. Overlay splits credit supporting effort on top of that and may go over 100%.
