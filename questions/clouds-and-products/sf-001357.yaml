id: sf-001357
product_area: clouds-and-products
true_statement: Journey Builder custom activities must be hosted on an SSL web server on port 443 and registered as an endpoint in an installed package.
false_statement: Journey Builder custom activities must be hosted on an SSL web server on port 8443 and registered as an endpoint in an installed package.
explanation: Salesforce requires custom activities and entry events to be served over SSL on port 443 and registered through an installed package. Port 8443 is not the documented requirement.
