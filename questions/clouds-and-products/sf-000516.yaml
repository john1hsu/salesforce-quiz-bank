id: sf-000516
product_area: clouds-and-products
true_statement: By default, anyone who can open a CRM Analytics dataset sees all of its rows, so row-level security must be added per dataset.
false_statement: By default, CRM Analytics datasets enforce each user's Salesforce record access, so row-level security needs no per-dataset setup.
explanation: Datasets are copies that don't inherit org record access on their own. Admins must add security predicates or sharing inheritance to each dataset to restrict rows.
