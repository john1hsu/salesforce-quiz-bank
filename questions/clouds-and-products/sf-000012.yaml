product_area: clouds-and-products
true_statement: In an Omni-Channel routing configuration, the queue with the lowest Routing Priority number is served first.
false_statement: In an Omni-Channel routing configuration, the queue with the highest Routing Priority number is served first.
explanation: 'Routing Priority works in ascending order: a smaller number means the queue''s work is distributed sooner. Omni-Channel also factors in how long items have waited and which queue members are available, but a higher number never jumps the line.'
