id: sf-001711
product_area: clouds-and-products
true_statement: In a Lightning console app, opening a record from the split view list panel creates a new workspace tab.
false_statement: In a Lightning console app, opening a record from the split view list panel creates a subtab under the current workspace tab.
explanation: Split view lets a rep step through a list, and each record picked from it opens in its own workspace tab. Subtabs are for related records opened from within a workspace tab.
