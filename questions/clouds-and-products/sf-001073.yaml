id: sf-001073
product_area: clouds-and-products
true_statement: In Agentforce Net Zero, each Energy Attribute Certificate represents 1 MWh of renewable electricity and can be allocated to reduce scope 2 emissions.
false_statement: In Agentforce Net Zero, each Energy Attribute Certificate represents 1 MWh of renewable electricity and can be allocated to reduce scope 1 emissions.
explanation: Energy Attribute Certificates offset purchased electricity, which is scope 2. Scope 1 covers direct emissions such as fuel burned on site, which these certificates do not reduce.
