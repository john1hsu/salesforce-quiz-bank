id: sf-001430
product_area: clouds-and-products
true_statement: When Contact Builder deletes a contact, it is first suppressed for a configurable default of 2 days, then hard-deleted with no way to undo it.
false_statement: When Contact Builder deletes a contact, it is first suppressed for a configurable default of 30 days, during which the deletion can be undone.
explanation: Contact Delete starts with a suppression period that defaults to two days, and the final deletion from the account and sendable data extensions is permanent. Thirty days and an undo option aren't how it works.
