id: sf-001072
product_area: clouds-and-products
true_statement: Backup & Recover Next stores backups natively inside the Salesforce trust boundary and is not subject to API governor limits, unlike API-based Backup & Recover.
false_statement: Backup & Recover stores backups natively inside the Salesforce trust boundary and is not subject to API governor limits, unlike API-based Backup & Recover Next.
explanation: The Next product is the native one that bypasses API limits. The original Backup & Recover reads through the API as an integration user, so API limits bound its throughput.
