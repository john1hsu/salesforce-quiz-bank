id: sf-000014
product_area: clouds-and-products
true_statement: With Omni-Channel skills-based routing, a record's required skills are evaluated when it enters a queue, so later edits to its skills have no effect until it is requeued.
false_statement: With Omni-Channel skills-based routing, a record's required skills are re-evaluated whenever it is edited, so later edits to its skills take effect immediately.
explanation: Skills are checked at the moment a record lands in an Omni-Channel queue. Changing the skills afterward does nothing until the record is assigned to a queue again; if nobody qualifies, the item sits on the Skills Backlog tab.
