id: sf-001143
product_area: clouds-and-products
true_statement: When escrow is turned on in a Salesforce loyalty program, member balances can't go negative, so escrow can't be combined with negative points.
false_statement: When escrow is turned on in a Salesforce loyalty program, member balances can go negative, so escrow requires negative points to be enabled.
explanation: Escrow holds points for a set period to absorb returns, and with it enabled balances are kept at zero or above, making it incompatible with negative points.
