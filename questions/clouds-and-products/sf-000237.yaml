id: sf-000237
product_area: clouds-and-products
true_statement: Once started, a Marketing Cloud Connect synchronized data source cannot be deleted, only paused.
false_statement: Once started, a Marketing Cloud Connect synchronized data source can be deleted, but not paused.
explanation: Synchronized data sources can only be paused after they start; deletion is not available, which is the reverse of the false claim.
