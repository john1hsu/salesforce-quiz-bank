id: sf-001783
product_area: clouds-and-products
true_statement: Changing a work order's status doesn't change the status of its line items or its service appointments.
false_statement: Changing a work order's status automatically cascades the same status to its line items and service appointments.
explanation: Each level keeps its own status, so closing a work order leaves its line items and appointments as they were. Close-out automation has to update every level itself.
