true_statement: In Salesforce's four-layer Agentforce 360 architecture, the Customer 360 Apps layer supplies the business logic that agents reuse.
false_statement: In Salesforce's four-layer Agentforce 360 architecture, the Data 360 layer supplies the business logic that agents reuse.
explanation: Customer 360 Apps hold approval chains, definitions and workflow steps that agents reuse. Data 360 is the unified data layer that gives agents context, not the business logic.
