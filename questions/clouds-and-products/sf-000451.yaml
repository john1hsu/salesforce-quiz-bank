true_statement: Salesforce, Inc.'s fiscal year ends on January 31, so its fiscal 2026 closed on January 31, 2026.
false_statement: Salesforce, Inc.'s fiscal year ends on December 31, so its fiscal 2026 closes on December 31, 2026.
explanation: Salesforce runs a fiscal year that ends January 31, so fiscal 2026 ended early in calendar 2026. A calendar-year fiscal year is incorrect.
