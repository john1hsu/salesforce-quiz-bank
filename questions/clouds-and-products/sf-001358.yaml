product_area: clouds-and-products
true_statement: Journey Builder's Sales and Service Cloud activities, such as creating a Case or converting a Lead, work only when Marketing Cloud Connect is installed.
false_statement: Journey Builder's Sales and Service Cloud activities, such as creating a Case or converting a Lead, work only when Automation Studio is installed.
explanation: The CRM-writing activities depend on Marketing Cloud Connect, the connector between Marketing Cloud Engagement and Salesforce orgs. Automation Studio handles batch data preparation and doesn't unlock these activities.
