id: sf-001849
product_area: clouds-and-products
true_statement: Trailhead advises against primary keys on triggered-send data extensions, because a retried send could then deliver the same data twice.
false_statement: Trailhead requires primary keys on triggered-send data extensions, because a retried send could otherwise deliver the same data twice.
explanation: Primary keys suit tables that are updated or appended to, but triggered-send tables should go without them to avoid duplicate deliveries on retry. The false statement reverses the advice.
