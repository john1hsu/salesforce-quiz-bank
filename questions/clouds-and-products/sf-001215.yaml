true_statement: Each Account Engagement business unit needs its own Account Engagement admin, who doesn't need Salesforce admin rights.
false_statement: Each Account Engagement business unit needs its own Account Engagement admin, who must also hold Salesforce System Administrator rights.
explanation: A Salesforce admin enables business units and assigns their Account Engagement admins. Those business-unit admins don't need Salesforce admin rights themselves.
