true_statement: In Salesforce Voice, reps accept calls in the Omni-Channel widget rather than in the older Salesforce Call Center softphone.
false_statement: In Salesforce Voice, reps accept calls in the older Salesforce Call Center softphone rather than in the Omni-Channel widget.
