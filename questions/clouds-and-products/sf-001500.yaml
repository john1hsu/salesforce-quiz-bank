true_statement: The Customer 360 Data Model is the Data 360 data model that Sales and Service objects map into, not the Sales or Service object schema itself.
false_statement: The Customer 360 Data Model is the Sales and Service object schema itself, which Data 360 data model objects map into.
explanation: The name refers to Data 360's harmonized model of data model objects such as Contact Point Email. CRM objects map into it; it is not the CRM schema.
