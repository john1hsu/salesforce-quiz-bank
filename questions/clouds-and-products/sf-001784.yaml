id: sf-001784
product_area: clouds-and-products
true_statement: A work order's Duration is independent of its line items' durations and isn't calculated as their sum.
false_statement: A work order's Duration is a read-only roll-up calculated as the sum of its line items' durations.
explanation: Duration on the work order stands on its own; when blank it can fall back to the work type's duration, but it never totals the line items.
