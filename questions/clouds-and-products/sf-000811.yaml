id: sf-000811
product_area: clouds-and-products
true_statement: Standard-runtime Omnistudio component names can't contain special characters such as underscores, so stripping them can create duplicate Data Mapper names.
false_statement: Standard-runtime Omnistudio component names can contain underscores, so migrated Data Mapper names never need changing.
explanation: The standard runtime disallows special characters like underscores, and removing them during migration can collide names, which the Migration Assistant's assess mode flags.
