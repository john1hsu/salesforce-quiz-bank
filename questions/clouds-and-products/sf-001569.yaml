id: sf-001569
product_area: clouds-and-products
true_statement: A service territory's Number of Services to Drip Feed field overrides the org-wide drip-feed dispatching value for that territory.
false_statement: The org-wide drip-feed dispatching value in Field Service Settings overrides any Number of Services to Drip Feed value set on a service territory.
explanation: Drip-feed dispatching releases a set number of appointments at a time, configured org-wide under Dispatch settings. A value on an individual territory takes precedence there.
