true_statement: Enhanced Scheduling and Optimization authenticates as a Platform Integration User, not the optimization user created by the legacy activation step.
false_statement: Enhanced Scheduling and Optimization authenticates as the optimization user created by the legacy activation step, not a Platform Integration User.
explanation: The legacy Activate Field Service Schedule Optimization step creates an optimization user and profile; the enhanced engine uses a Platform Integration User instead. The false statement reverses them.
