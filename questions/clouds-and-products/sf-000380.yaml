true_statement: With cumulative forecast rollups, the Commit Forecast amount covers Commit plus Closed opportunities.
false_statement: With cumulative forecast rollups, the Commit Forecast amount covers Commit plus Best Case opportunities.
explanation: Cumulative rollups add the later categories in, so Commit includes Closed. Best Case sits earlier in the funnel and isn't added to Commit.
