true_statement: Marketing Cloud Engagement stores audience data in data extensions, while Marketing Cloud Account Engagement works with prospects and lists.
false_statement: Marketing Cloud Account Engagement stores audience data in data extensions, while Marketing Cloud Engagement works with prospects and lists.
explanation: Engagement, the B2C stack, is built on subscribers and data extensions; Account Engagement, the B2B stack formerly called Pardot, is built on prospects and lists. The false version reverses the data structures.
