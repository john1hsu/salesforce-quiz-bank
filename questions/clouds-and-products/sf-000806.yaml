id: sf-000806
product_area: clouds-and-products
true_statement: The Health Cloud Platform permission set license grants Health Cloud standard objects for features built into core Salesforce, outside the managed package.
false_statement: The Health Cloud Platform permission set license grants the custom objects behind features in the Health Cloud managed package.
explanation: 'Health Cloud needs two licenses: Health Cloud covers the managed-package objects, while Health Cloud Platform covers the core standard objects. The false statement describes the other license.'
