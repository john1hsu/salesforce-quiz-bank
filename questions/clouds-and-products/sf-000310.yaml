id: sf-000310
product_area: clouds-and-products
true_statement: The Slack Events API delivers at most 30,000 events per workspace per app per 60 minutes, then sends an app_rate_limited event.
false_statement: The Slack Events API delivers at most 3,000 events per workspace per app per 60 minutes, then sends an app_rate_limited event.
explanation: The Events API ceiling is 30,000 events per workspace per app each hour; past that Slack signals app_rate_limited. The false figure is ten times too low.
