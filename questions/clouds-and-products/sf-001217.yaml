id: sf-001217
product_area: clouds-and-products
true_statement: A dashboard chart or metric widget needs a source report that has at least one grouping.
false_statement: A dashboard chart or metric widget needs a source report that has at least one bucket column.
explanation: Charts and metrics on a dashboard summarise grouped data, so their source report must include at least one grouping; without one the chart is silently blocked. Bucket columns are an optional report feature, not the requirement.
