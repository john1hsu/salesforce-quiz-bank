id: sf-000667
product_area: clouds-and-products
true_statement: Extending a standard context definition keeps its inherited parts read-only and picks up Industry Cloud updates, while cloning gives a fully editable copy.
false_statement: Cloning a standard context definition keeps its inherited parts read-only and picks up Industry Cloud updates, while extending gives a fully editable copy.
explanation: An extension inherits standard nodes, attributes and mappings as read-only and receives automatic updates. A clone is independent and fully editable; the false statement swaps the two options.
