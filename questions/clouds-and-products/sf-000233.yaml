true_statement: In a Field Service scheduling policy, work rules filter out ineligible candidates while service objectives rank the remaining candidates.
false_statement: In a Field Service scheduling policy, service objectives filter out ineligible candidates while work rules rank the remaining candidates.
explanation: Work rules are pass/fail filters such as skills, availability and territory; service objectives such as minimizing travel grade the survivors. The false version swaps their roles.
