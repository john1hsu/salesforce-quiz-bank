id: sf-000036
product_area: clouds-and-products
true_statement: New cases need automation, such as an Apex trigger, to fill their Entitlement field; entitlements are not added to cases automatically.
false_statement: New cases get their Entitlement field filled automatically from the related account, so no extra automation is needed to apply entitlements.
explanation: Salesforce does not attach entitlements to new cases on its own, which is why the Trailhead example uses an Apex trigger that looks up the contact and then the account. The false statement assumes an automatic default that does not exist.
