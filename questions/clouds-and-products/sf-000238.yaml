id: sf-000238
product_area: clouds-and-products
true_statement: Every CRM contact or lead synchronized through Marketing Cloud Connect counts as a contact in Contact Builder, even if it is never messaged.
false_statement: Only CRM contacts or leads that are actually messaged after syncing through Marketing Cloud Connect count as contacts in Contact Builder.
explanation: Synchronizing a record is enough for it to count as a Contact Builder contact, whether or not you ever send to it, which affects contact counts.
