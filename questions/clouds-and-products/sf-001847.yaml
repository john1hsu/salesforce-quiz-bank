id: sf-001847
product_area: clouds-and-products
true_statement: Trailhead advises keeping a Marketing Cloud data extension's total byte size, the sum of its column lengths, under 8,000.
false_statement: Trailhead advises keeping a Marketing Cloud data extension's total byte size, the sum of its column lengths, under 80,000.
explanation: The guidance is to stay under 8,000 bytes, so twenty 100-character columns fit but eight 1,000-character ones don't. 80,000 is ten times the recommended ceiling.
