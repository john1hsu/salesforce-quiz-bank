id: sf-001503
product_area: clouds-and-products
true_statement: In Salesforce Scheduler, Service Territory Work Type links a work type to a location, while Work Type Group Member links it to a topic.
false_statement: In Salesforce Scheduler, Work Type Group Member links a work type to a location, while Service Territory Work Type links it to a topic.
explanation: Service Territory Work Type is the junction to territories (locations), and Work Type Group Member is the junction to work type groups (topics). The false statement swaps them.
