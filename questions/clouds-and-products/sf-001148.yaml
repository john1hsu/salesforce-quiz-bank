id: sf-001148
product_area: clouds-and-products
true_statement: Tableau Next always reads its data from Data 360 objects such as DMOs, DLOs or calculated insights, keeping only the connection information itself.
false_statement: Tableau Next imports source data into its own extracts, keeping a separate copy outside Data 360 for each workspace.
explanation: Data for Tableau Next is always a Data 360 object, even an uploaded CSV, which is stored as a DLO. Tableau Next itself stores connection details, not data copies.
