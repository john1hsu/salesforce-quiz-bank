id: sf-000593
product_area: clouds-and-products
true_statement: New Experience Cloud sites default to strict Content Security Policy, so components calling third-party hosts need those hosts allowlisted.
false_statement: New Experience Cloud sites default to relaxed Content Security Policy, so components can call any third-party host without allowlisting.
explanation: Strict CSP is the default for new sites. To reach outside hosts, admins adjust the security level and add the hosts to the allowlist; nothing is open by default.
