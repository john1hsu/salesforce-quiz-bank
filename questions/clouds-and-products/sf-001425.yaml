id: sf-001425
product_area: clouds-and-products
true_statement: In Automation Studio, activities in the same step run together, so an activity that reads a data extension must sit in a later step than the query that fills it.
false_statement: In Automation Studio, activities in the same step run in order from top to bottom, so a query and the activity that reads its results can share one step.
explanation: Steps run sequentially but activities inside one step run together. Putting a query and its consumer in the same step means the consumer finds no results yet.
