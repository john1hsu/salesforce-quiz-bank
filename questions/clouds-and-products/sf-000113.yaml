id: sf-000113
product_area: clouds-and-products
true_statement: With secure guest user record access enabled, guest users' org-wide defaults are fixed at Private and only sharing rules can grant them record access.
false_statement: With secure guest user record access enabled, guest users' org-wide defaults are fixed at Public Read Only and sharing sets can grant them record access.
explanation: Secure guest access locks guest defaults to Private and allows only sharing rules to open records to them; neither Public Read Only defaults nor sharing sets apply.
