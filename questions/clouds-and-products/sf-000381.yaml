id: sf-000381
product_area: clouds-and-products
true_statement: A user takes part in Collaborative Forecasts only when Allow Forecasting is enabled on their user record.
false_statement: A user takes part in Collaborative Forecasts only when they hold the Override Forecasts permission.
explanation: Allow Forecasting on the user record puts someone in the forecast hierarchy. Override Forecasts is a separate permission that lets owners or managers adjust totals.
