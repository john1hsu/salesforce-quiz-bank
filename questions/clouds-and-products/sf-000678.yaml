id: sf-000678
product_area: clouds-and-products
true_statement: In a Salesforce Pricing procedure, a Stop Pricing element ends processing early, while a List Group runs its elements only when a condition holds.
false_statement: In a Salesforce Pricing procedure, a List Group ends processing early, while a Stop Pricing element runs its elements only when a condition holds.
explanation: List Group wraps conditional elements and Stop Pricing halts the procedure; contract pricing combines them so contracted lines skip standard discounts. The false statement swaps their roles.
