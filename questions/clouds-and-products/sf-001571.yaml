id: sf-001571
product_area: clouds-and-products
true_statement: Service appointments and work orders have separate status lists in Field Service, so completing an appointment doesn't close its work order.
false_statement: Service appointments and work orders share one status list in Field Service, so completing an appointment automatically closes its work order.
explanation: Appointments move from None through Completed, Cannot Complete or Canceled, while work orders have their own values such as On Hold and Closed. Each record's status has to be updated in its own right.
