id: sf-000594
product_area: clouds-and-products
true_statement: A single SOAP API convertLead() call accepts at most 100 LeadConvert objects.
false_statement: A single SOAP API convertLead() call accepts at most 200 LeadConvert objects.
explanation: The SOAP API caps each convertLead() call at 100 LeadConvert objects, so larger volumes must be split into more calls. 200 is double the documented limit.
