id: sf-000670
product_area: clouds-and-products
true_statement: An admin can assign a Product Configurator flow to a product classification so that many products share the same configuration UI.
false_statement: An admin can assign a Product Configurator flow to a price book so that many products share the same configuration UI.
explanation: Configurator flows are assigned to a product or to a product classification. Price books play no part in choosing the configuration UI.
