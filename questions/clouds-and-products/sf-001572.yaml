id: sf-001572
product_area: clouds-and-products
true_statement: Setting FSL__Pinned__c on a service appointment stops automatic scheduling and optimization from moving it.
false_statement: Setting FSL__Emergency__c on a service appointment stops automatic scheduling and optimization from moving it.
explanation: The Pinned field locks an appointment in place on the Gantt. The Emergency field is set by the Emergency Wizard to mark urgent work, not to freeze it.
