true_statement: Trailhead lists Service Resource Availability, Earliest Start Permitted and Due Date Match Time as the work rules a Field Service scheduling policy needs to function.
false_statement: Trailhead lists Match Skills, Match Territory and Required Resource as the work rules a Field Service scheduling policy needs to function.
explanation: The three mandatory rules cover worker availability and the appointment's allowed time window. Skill, territory and required-resource rules are optional filters added as the business needs them.
