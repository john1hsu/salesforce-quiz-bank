id: sf-000595
product_area: clouds-and-products
true_statement: During lead conversion, standard lead fields map to account, contact and opportunity fields automatically, but custom lead fields need an admin-defined mapping.
false_statement: During lead conversion, both standard and custom lead fields map to account, contact and opportunity fields automatically, with no admin mapping needed.
explanation: Only standard fields carry over by default. Without a mapping set up by an administrator, custom lead field values stay behind on the converted lead.
