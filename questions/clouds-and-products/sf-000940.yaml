id: sf-000940
product_area: clouds-and-products
true_statement: Heroku Eco dynos go to sleep after 30 minutes of inactivity, so the next request waits a few seconds while they wake.
false_statement: Heroku Eco dynos go to sleep after 24 hours of inactivity, so the next request waits a few seconds while they wake.
explanation: Eco dynos sleep after half an hour without traffic, adding a short delay to the first request afterward. That makes them a poor fit for latency-sensitive production apps.
