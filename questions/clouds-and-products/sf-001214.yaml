id: sf-001214
product_area: clouds-and-products
true_statement: The Account Engagement Salesforce connector is created paused, and an Account Engagement admin must configure and unpause it before anything syncs.
false_statement: The Account Engagement Salesforce connector is created active, and starts syncing leads and contacts as soon as it has been created.
explanation: The connector starts paused so the admin can pick the connector user or set up Marketing Data Sharing first. Nothing syncs until it is unpaused.
