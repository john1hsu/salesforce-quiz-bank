id: sf-001146
product_area: clouds-and-products
true_statement: A Tableau Next asset belongs to exactly one workspace; adding it to another workspace creates a reference, not a copy.
false_statement: A Tableau Next asset can belong to several workspaces; adding it to another workspace creates an independent copy.
explanation: Each asset has a single home workspace, and other workspaces only point to it, so edits show up everywhere it is referenced. No duplicate is made.
