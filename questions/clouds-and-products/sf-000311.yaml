id: sf-000311
product_area: clouds-and-products
true_statement: The Apex SDK for Slack, which lets Apex define Slack apps and handle their events, is still labelled Beta in Salesforce documentation.
false_statement: The Apex SDK for Slack, which lets Apex define Slack apps and handle their events, is labelled generally available in Salesforce documentation.
explanation: Salesforce marks the Apex SDK for Slack as Beta, so it can be discontinued without notice and production designs carry that risk. Describing it as GA is wrong.
