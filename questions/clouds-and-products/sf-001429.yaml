id: sf-001429
product_area: clouds-and-products
true_statement: In Marketing Cloud Engagement, every subscriber is a contact, but a contact becomes a subscriber only after opting in to a particular channel.
false_statement: In Marketing Cloud Engagement, every contact is a subscriber, but a subscriber becomes a contact only after opting in to a particular channel.
explanation: A contact is anyone the account messages; a subscriber is a contact who has opted in to a channel. Contacts from Sales or Service Cloud can appear in All Contacts without ever being subscribers.
