id: sf-000166
product_area: clouds-and-products
true_statement: Once Lightning Knowledge is enabled in an org, it can't be turned off, so it's wise to try it in a sandbox first.
false_statement: Once Lightning Knowledge is enabled in an org, it can be switched back to Classic Knowledge from Knowledge Settings at any time.
explanation: Enabling Lightning Knowledge is a one-way switch. Because it can't be undone, Salesforce suggests testing it in a sandbox before production.
