id: sf-001713
product_area: clouds-and-products
true_statement: Workspace API tab methods such as openTab, openSubtab and focusTab work only inside Lightning console apps.
false_statement: Workspace API tab methods such as openTab, openSubtab and focusTab work in any Lightning app, including standard navigation apps.
explanation: The tab-control methods depend on console navigation's workspace tabs and subtabs, so they only function in console apps. Standard navigation apps have no such tabs to control.
