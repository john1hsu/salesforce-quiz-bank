id: sf-001427
product_area: clouds-and-products
true_statement: Click and open data in Marketing Cloud Engagement's system data views is stored in Central Standard Time, with no daylight saving adjustment.
false_statement: Click and open data in Marketing Cloud Engagement's system data views is stored in UTC, adjusted to each account's local time zone at query time.
explanation: Data views such as _Open and _Click record times in CST year-round, ignoring daylight saving. Queries that compare times must account for that rather than assume UTC.
