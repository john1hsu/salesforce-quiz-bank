id: sf-000384
product_area: clouds-and-products
true_statement: A Case-type entitlement process won't run on work orders, so Field Service work orders need their own Work Order-type process.
false_statement: A Case-type entitlement process also runs on work orders, so Field Service work orders can share the same process as cases.
explanation: Each entitlement process has a single type, Case or Work Order. Work orders need a Work Order-type process, which Trailhead advises leaving inactive until its milestones are added.
