id: sf-001356
product_area: clouds-and-products
true_statement: In Journey Builder, entry data is a snapshot taken when a contact enters the journey, while contact data reflects current values in Contact Builder.
false_statement: In Journey Builder, contact data is a snapshot taken when a contact enters the journey, while entry data reflects current values in Contact Builder.
explanation: Entry data is frozen at entry; contact data is live from Contact Builder. Comparing the two is how a split can detect an attribute that changed mid-journey, and the false version swaps their roles.
