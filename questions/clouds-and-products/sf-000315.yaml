id: sf-000315
product_area: clouds-and-products
true_statement: The Tableau+ bundle, which adds Data 360 credits and Tableau Next to user licenses, is offered only for Tableau Cloud.
false_statement: The Tableau+ bundle, which adds Data 360 credits and Tableau Next to user licenses, is offered for both Tableau Cloud and Tableau Server.
explanation: Tableau+ is a Cloud-only bundle. Self-managed Tableau Server customers can't buy it, so the bundle presumes the hosted deployment.
