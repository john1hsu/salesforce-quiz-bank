true_statement: Anyone can browse and test-drive AgentExchange listings, but installing one requires an admin or the Download AgentExchange Packages permission.
false_statement: Anyone can browse and test-drive AgentExchange listings, but installing one requires an admin or the Create AgentExchange Packages permission.
