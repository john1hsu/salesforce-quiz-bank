true_statement: Every property of the standard Service Console app can be changed except its Developer Name.
false_statement: Every property of the standard Service Console app can be changed except its assigned profiles.
explanation: Admins can rename, rebrand and reassign the standard console app; only the Developer Name is locked. It is assigned to all standard and custom profiles by default, and that assignment is editable.
