id: sf-000674
product_area: clouds-and-products
true_statement: The Salesforce CPQ JavaScript Quote Calculator Plugin must run in both the browser and Node, so browser globals such as window may not exist.
false_statement: The Salesforce CPQ JavaScript Quote Calculator Plugin runs only in the browser, so browser globals such as window are always available.
explanation: The QCP is an ES6 module that has to work in both environments, so it can't rely on browser-only globals. Assuming window is always present breaks server-side calculation.
