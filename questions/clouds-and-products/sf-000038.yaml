id: sf-000038
product_area: clouds-and-products
true_statement: In the Lightning Service Console, records open as primary tabs and their related records open as subtabs.
false_statement: In the Lightning Service Console, related records open as primary tabs and the records they belong to open as subtabs.
explanation: The console's tab model puts the main record in a primary tab and opens records related to it as subtabs underneath. The false statement inverts that hierarchy.
