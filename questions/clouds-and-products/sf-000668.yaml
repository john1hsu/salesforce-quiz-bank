id: sf-000668
product_area: clouds-and-products
true_statement: Transposable child nodes, which store data as key-value pairs, are available only in custom context definitions or on custom nodes.
false_statement: Transposable child nodes, which store data as key-value pairs, are available only in standard context definitions shipped by industry clouds.
explanation: Key-value transposable nodes, such as Color = Blue, can be used only in custom definitions or on custom nodes. Standard definitions can't be modified, so they aren't where you add them.
