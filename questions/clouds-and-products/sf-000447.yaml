true_statement: A custom opportunity split type can split a roll-up summary or custom currency field, but not a formula currency field.
false_statement: A custom opportunity split type can split a formula currency or custom currency field, but not a roll-up summary field.
explanation: Standard currency, roll-up summary and custom currency fields are allowed as the basis of a custom split type; formula currency fields are the excluded kind.
