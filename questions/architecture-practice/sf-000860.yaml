id: sf-000860
product_area: architecture-practice
true_statement: In Trailhead's risk register method, probability and impact are each rated 1 to 3 and multiplied, and scores of 7 to 9 mean high exposure.
false_statement: In Trailhead's risk register method, probability and impact are each rated 1 to 3 and added, and scores of 5 to 6 mean high exposure.
explanation: The score is the product of the two ratings, giving 1 to 9, with 1-3 low, 4-6 moderate and 7-9 high. Adding the ratings is not the method Trailhead uses.
