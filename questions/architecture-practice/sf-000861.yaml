true_statement: UK government delivery guidance says significant assumptions should be logged as risks, stating the impact if they prove false.
false_statement: UK government delivery guidance says significant assumptions should be kept off the risk register and tracked only in a separate assumption log.
explanation: The Teal Book folds assumptions into the risk register, recording what happens if each proves false. Keeping them apart is not what it recommends.
