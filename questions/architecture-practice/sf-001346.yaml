id: sf-001346
product_area: architecture-practice
true_statement: Channel Account licenses are counted per partner account rather than per person, allowing up to 40 partner users per licensed account.
false_statement: Channel Account licenses are counted per partner user rather than per account, with each licensed user allowed up to 40 partner accounts.
explanation: Unlike seat-based external licenses, Channel Account is licensed at the partner account level and covers up to 40 users on that account. It isn't a per-person license.
