true_statement: Among System Architect's prerequisites, Identity and Access Management Architect is the one focused on single sign-on requirements.
false_statement: Among System Architect's prerequisites, Development Lifecycle and Deployment Architect is the one focused on single sign-on requirements.
explanation: The IAM Architect credential certifies design of solutions that meet single sign-on requirements. Development Lifecycle and Deployment Architect covers release management, environments and deployment governance instead.
