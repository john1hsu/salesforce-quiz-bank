id: sf-000097
product_area: architecture-practice
true_statement: Custom big objects used as an archive enforce object and field permissions, but they do not support sharing rules, triggers or flows.
false_statement: Custom big objects used as an archive enforce object and field permissions and support sharing rules and flows, but not triggers.
explanation: Big objects scale to billions of records but only honour object and field permissions; sharing rules, triggers and flows are all unsupported. Claiming sharing rules and flows work is wrong.
