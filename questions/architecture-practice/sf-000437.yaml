id: sf-000437
product_area: architecture-practice
true_statement: A holder of a retired Salesforce certification keeps a valid credential, shown as retired on their profile, but loses the downloadable certificate.
false_statement: A holder of a retired Salesforce certification loses the credential at retirement unless they pass the named successor exam.
explanation: Retirement removes maintenance and ends downloadable certificates, yet the credential stays valid and is marked retired. No successor exam is needed to keep it.
