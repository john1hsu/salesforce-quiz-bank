true_statement: The C4 model describes a system landscape as essentially a system context diagram without a single system at its centre.
false_statement: The C4 model describes a system landscape as essentially a container diagram centred on a single software system.
explanation: C4 frames the landscape as a map of all systems in a chosen scope, like a context diagram with no focal system. A container diagram zooms into one system instead.
