id: sf-001061
product_area: architecture-practice
true_statement: To lower TCO, Well-Architected guidance prefers prebuilt platform services first, then AppExchange apps, then low-code customization before code.
false_statement: To lower TCO, Well-Architected guidance prefers custom code first, then low-code customization, then AppExchange apps before prebuilt platform services.
explanation: Standard features pick up platform innovation with each release, while custom replicas must be maintained by the team, so the order starts with prebuilt services and ends with code.
