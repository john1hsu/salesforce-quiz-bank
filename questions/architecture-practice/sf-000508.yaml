true_statement: The Orchestration Density framework, which scores execution path, goal complexity and modality mix, comes from the Agentic and Traditional Workflow Automation guide.
false_statement: The Orchestration Density framework, which scores execution path, goal complexity and modality mix, comes from the Asynchronous Processing decision guide.
explanation: Orchestration Density is how the agentic versus traditional automation guide maps low, medium and high density to tools from Flow and Apex up to Agentforce and MuleSoft. The Asynchronous Processing guide instead compares Queueable, Scheduled Apex, platform event triggers, CDC and async flow paths.
