id: sf-000998
product_area: architecture-practice
true_statement: A user story's acceptance criteria should state the intended outcome rather than prescribe a specific solution such as a button.
false_statement: A user story's acceptance criteria should prescribe a specific solution such as a button rather than state the intended outcome.
explanation: Criteria are pass/fail statements of intent that testers verify. Naming a button is solutioning too early, which locks in a design before options have been weighed.
