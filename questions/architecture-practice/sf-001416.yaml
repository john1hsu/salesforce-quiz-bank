id: sf-001416
product_area: architecture-practice
true_statement: In a RACI matrix, several people can share the Responsible role for an item, but each item should have exactly one Accountable owner.
false_statement: In a RACI matrix, several people can share the Accountable role for an item, but each item should have exactly one Responsible owner.
explanation: Responsible is the doer and can be shared; Accountable is the single owner who signs off. Two names in the A column invite disputes, which is why every source insists on one A per row.
