true_statement: Since 2023, CTA review board diagrams must be produced digitally with designated tools, and hand-drawn diagrams are no longer accepted.
false_statement: Since 2023, CTA review board diagrams may be produced digitally with designated tools or drawn by hand on flip charts.
explanation: In 2023 Salesforce moved the board to digital artifacts built in designated tools and stopped accepting hand-drawn diagrams. Hand-drawn work is therefore no longer an option.
