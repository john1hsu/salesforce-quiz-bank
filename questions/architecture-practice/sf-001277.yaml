id: sf-001277
product_area: architecture-practice
true_statement: Salesforce's delivery guidance has the design specifications date- and version-stamped and signed off by the customer before build starts.
false_statement: Salesforce's delivery guidance has the design specifications date- and version-stamped and signed off by the customer after user acceptance testing ends.
explanation: Sign-off on a versioned spec happens before any build, so it becomes the baseline for developers and later for UAT. Waiting until after UAT would leave the build without an agreed baseline.
