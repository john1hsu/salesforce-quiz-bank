product_area: architecture-practice
true_statement: Salesforce says hypercare typically lasts one to four weeks after a major launch, shorter for small changes and longer for migrations.
false_statement: Salesforce says hypercare typically lasts three to six months after a major launch, shorter for small changes and longer for migrations.
explanation: Salesforce's guidance puts hypercare at roughly one to four weeks, adjusted for the size of the change, and suggests ending it on evidence such as stable case volumes. Months-long hypercare isn't the stated norm.
