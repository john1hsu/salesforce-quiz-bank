true_statement: Passing Platform App Builder, Platform Data Architect, Platform Developer and Sharing and Visibility Architect grants the Application Architect credential.
false_statement: Passing Platform App Builder, Platform Data Architect, Platform Developer and Sharing and Visibility Architect grants the System Architect credential.
explanation: Those four exams make up the Application Architect stack, focused on native features, data modelling and sharing. System Architect comes from a different set centred on integration, identity and deployment.
