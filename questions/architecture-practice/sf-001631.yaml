product_area: architecture-practice
true_statement: Salesforce's integration patterns classify integrations by type as process, data or virtual integration.
false_statement: Salesforce's integration patterns classify integrations by type as process, data or user-interface integration.
explanation: The three pattern types are process, data and virtual integration, and patterns are separately classed by timing as synchronous or asynchronous. User-interface integration is not one of the listed types.
