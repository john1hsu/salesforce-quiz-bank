id: sf-000006
product_area: architecture-practice
true_statement: The Well-Architected Reliability pillar recommends treating 70% of a governor limit as the operational ceiling for a solution.
false_statement: The Well-Architected Reliability pillar recommends treating 90% of a governor limit as the operational ceiling for a solution.
explanation: Reliability guidance tells architects to plan as if 70% of a limit is the practical maximum, leaving headroom for growth and spikes. Running up to 90% would leave far less margin than the framework advises.
