id: sf-001628
product_area: architecture-practice
true_statement: AWS cutover guidance advises naming a single person who decides, at predefined checkpoints, whether to fix forward or roll back.
false_statement: AWS cutover guidance advises that, at predefined checkpoints, the whole cutover team votes on whether to fix forward or roll back.
explanation: Having one named decision-maker avoids stalls when a checkpoint fails and predefined rollback conditions are met. A group vote is not what the guidance recommends.
