id: sf-000302
product_area: architecture-practice
true_statement: In ATAM, a tradeoff point is a design element that several quality attributes are sensitive to at once, so tuning it helps one quality and hurts another.
false_statement: In ATAM, a tradeoff point is a design element where a change noticeably moves a single quality attribute without affecting the others.
explanation: ATAM calls an element that moves one attribute a sensitivity point; a tradeoff point is one several attributes depend on simultaneously. The false statement describes a sensitivity point, not a tradeoff point.
