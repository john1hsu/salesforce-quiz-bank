id: sf-001349
product_area: architecture-practice
true_statement: Under FAR 37.602, a statement of objectives that bidders turn into a performance work statement does not itself become part of the contract.
false_statement: Under FAR 37.602, a statement of objectives that bidders turn into a performance work statement becomes part of the contract alongside it.
explanation: In federal performance-based acquisition, the agency may issue a statement of objectives that bidders convert into a PWS, and that statement of objectives stays outside the contract. Only the resulting PWS describes the contracted results.
