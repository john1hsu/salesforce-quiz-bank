id: sf-000032
product_area: architecture-practice
true_statement: A newly created sandbox that is not activated within 30 days is deleted.
false_statement: A newly created sandbox that is not activated within 90 days is deleted.
explanation: The activation window for a new sandbox is 30 days; after that, an unactivated sandbox is removed. 90 days is not the documented window.
