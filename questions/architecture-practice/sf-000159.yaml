true_statement: Salesforce's data-integration guidance warns against building an integration strategy on stewardship tools like Data Loader or the Data Import Wizard.
false_statement: Salesforce's data-integration guidance recommends building an integration strategy on stewardship tools like Data Loader or the Data Import Wizard.
