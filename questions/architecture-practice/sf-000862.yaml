id: sf-000862
product_area: architecture-practice
true_statement: When a logged risk materializes, it moves to the issue log and is closed on the risk register.
false_statement: When a logged risk materializes, it stays open on the risk register and its mitigation plan is reused as the resolution.
explanation: A risk that happens becomes an issue, which needs a prioritized resolution plan rather than mitigation. The risk entry is closed, though it stays visible for history.
