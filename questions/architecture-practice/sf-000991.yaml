id: sf-000991
product_area: architecture-practice
true_statement: In Salesforce's LEVERS of Change model, Rewards and Structure are the structural levers, while Values and Enablement are the individual levers.
false_statement: In Salesforce's LEVERS of Change model, Values and Enablement are the structural levers, while Rewards and Structure are the individual levers.
explanation: LEVERS groups its six levers as social (Leadership, Ecosystem), individual (Values, Enablement) and structural (Rewards, Structure). The false version swaps the individual and structural groups.
