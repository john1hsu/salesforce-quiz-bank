product_area: architecture-practice
true_statement: In a Salesforce Center of Excellence, the Design Authority is usually the first subteam formed and reviews designs for security, compliance and architectural fit.
false_statement: In a Salesforce Center of Excellence, Demand Intake is usually the first subteam formed and reviews designs for security, compliance and architectural fit.
explanation: The Design Authority comes first and is the most complex subteam, reviewing designs. Demand Intake handles incoming requests rather than design review.
