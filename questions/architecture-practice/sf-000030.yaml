id: sf-000030
product_area: architecture-practice
true_statement: A Partial Copy sandbox can be refreshed every 5 days, while a Full sandbox can be refreshed every 29 days.
false_statement: A Partial Copy sandbox can be refreshed every 29 days, while a Full sandbox can be refreshed every 5 days.
explanation: Partial Copy sandboxes hold a sampled subset of data and have the shorter 5-day refresh interval; Full sandboxes copy all data and wait 29 days between refreshes. The false statement swaps the two intervals.
