id: sf-001773
product_area: architecture-practice
true_statement: In the Launch Gate, a launch blocker fails the assessment automatically, but the customer still makes the final go-live decision.
false_statement: In the Launch Gate, a launch blocker fails the assessment automatically, and the reviewers then make the final go-live decision.
explanation: Blockers such as missing SSL certificates or a failed load test trigger an automatic fail and a recommendation to delay. The decision to launch anyway or wait stays with the customer.
