id: sf-001131
product_area: architecture-practice
true_statement: Salesforce's agentic decision guide calls it an anti-pattern to add an agent to a process whose every branch can be defined at design time, which suits Flow or Apex.
false_statement: Salesforce's agentic decision guide recommends adding an agent to a process whose every branch can be defined at design time, so Flow or Apex isn't needed.
explanation: Fully deterministic processes belong in Flow or Apex; agents earn their cost where intent is unstructured or goals are open-ended. Wrapping a deterministic path in an agent is the anti-pattern the guide names.
