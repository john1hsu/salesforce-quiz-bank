id: sf-000101
product_area: architecture-practice
true_statement: During a large initial load, set target objects' org-wide defaults to Public Read/Write so no sharing rows are computed, then tighten them afterward.
false_statement: During a large initial load, set target objects' org-wide defaults to Private so no sharing rows are computed, then open them up afterward.
explanation: Public Read/Write avoids sharing calculations while data streams in; defaults are tightened to Private or Public Read Only once the load is done. Private during the load is what generates the sharing work.
