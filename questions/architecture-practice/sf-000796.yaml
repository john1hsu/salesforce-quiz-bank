id: sf-000796
product_area: architecture-practice
true_statement: Salesforce Architects' security governance steps say deviations and known vulnerabilities should be recorded in the technical debt register.
false_statement: Salesforce Architects' security governance steps say deviations and known vulnerabilities should be recorded only in Shield Event Monitoring.
explanation: Security exceptions are tracked as technical debt so they get prioritized and paid down. Shield Event Monitoring is the audit and monitoring tool, not a register of accepted deviations.
