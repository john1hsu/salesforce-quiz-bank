product_area: architecture-practice
true_statement: Microsoft's implementation guidance describes a typical cutover window as often a weekend lasting under 48 hours.
false_statement: Microsoft's implementation guidance describes a typical cutover window as often a single business day lasting under 8 hours.
explanation: The guidance frames cutover as a short window, frequently a weekend of less than 48 hours, during which neither old nor new system is fully usable. The false version shrinks it to a single working day.
