id: sf-000008
product_area: architecture-practice
true_statement: Salesforce suggests starting a new solution with the Trust and Reliability pillars as foundations before addressing the other three Well-Architected pillars.
false_statement: Salesforce suggests starting a new solution with the Operational Excellence and Fairness pillars as foundations before addressing the other three Well-Architected pillars.
explanation: The framework treats Trust and Reliability as the base layer for new solutions, with the remaining pillars layered on after. Operational Excellence and Fairness are among the pillars addressed once that foundation is in place.
