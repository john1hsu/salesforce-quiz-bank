id: sf-001835
product_area: architecture-practice
true_statement: The Tooling API FieldDefinition object returns DataType as UI-style text such as Text(40), not as API type names.
false_statement: The Tooling API FieldDefinition object returns DataType as API type names such as string, not as UI-style text like Text(40).
explanation: FieldDefinition reports the type the way Setup displays it, so a dictionary built from it may need a mapping to API type names. The false statement reverses which form it returns.
