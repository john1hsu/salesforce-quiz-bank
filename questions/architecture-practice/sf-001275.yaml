id: sf-001275
product_area: architecture-practice
true_statement: When no Center of Excellence standard covers a situation, Trailhead suggests the Design Authority fall back on community-vetted best practice.
false_statement: When no Center of Excellence standard covers a situation, Trailhead suggests the Design Authority pause the work until a new written standard is approved.
explanation: Trailhead's fallback for gaps in the CoE's own standards is accepted community best practice. Halting work until a new standard exists would turn the DA into the bottleneck it should avoid.
