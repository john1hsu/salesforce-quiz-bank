id: sf-001491
product_area: architecture-practice
true_statement: In the B2C single-login solution kit, Experience Cloud is the system of record for profile data and credentials, while B2C Commerce keeps shopping data.
false_statement: In the B2C single-login solution kit, B2C Commerce is the system of record for profile data and credentials, while Experience Cloud keeps shopping data.
explanation: The identity kit makes Experience Cloud own profiles and credentials, with Salesforce Identity acting as OAuth provider, and leaves address books and wish lists in B2C Commerce. The false statement swaps the two roles.
