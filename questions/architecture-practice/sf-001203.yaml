id: sf-001203
product_area: architecture-practice
true_statement: In a B2C Commerce launch-readiness review, each gap gets an impact and priority score that decides whether it blocks go-live.
false_statement: In a B2C Commerce launch-readiness review, every gap from the functional specification blocks go-live until it has been built.
explanation: Gaps found before launch are scored for impact and priority, so a cosmetic difference may ship while a missing payment method stops launch. Not every gap is a blocker.
