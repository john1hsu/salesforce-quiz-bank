id: sf-001837
product_area: architecture-practice
true_statement: Tooling API queries on FieldDefinition must filter on the parent object, so a full-org data dictionary extract runs object by object.
false_statement: Tooling API queries on FieldDefinition can span every object at once, so a full-org data dictionary extract needs only a single query.
explanation: FieldDefinition queries need a filter on the parent, for example EntityDefinition.QualifiedApiName. Exporting every field therefore means looping through the objects.
