id: sf-001702
product_area: architecture-practice
true_statement: Per GAO, a rough order of magnitude estimate can be produced by one person or a small group in hours, days or weeks, usually from historical data.
false_statement: Per GAO, a rough order of magnitude estimate needs a large estimating team working for many months, usually from detailed design.
explanation: ROMs are quick and lean on past projects; the large-team, months-long effort describes GAO's full program office estimate. The false version gives the ROM the profile of that budget estimate.
