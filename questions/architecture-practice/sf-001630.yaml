id: sf-001630
product_area: architecture-practice
true_statement: Because Salesforce cannot guarantee a call is delivered only once, an interface specification should say how the receiving system de-duplicates repeated messages.
false_statement: Because Salesforce guarantees each outbound call is delivered exactly once, an interface specification can leave de-duplication of repeated messages undefined.
explanation: Retries mean the same message can arrive more than once, so the receiver must be idempotent and the spec should say how. Exactly-once delivery is not something Salesforce promises.
