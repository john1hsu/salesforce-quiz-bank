true_statement: In Trailhead's implementation sales process, the order is discovery, then a rough order of magnitude, then a proposal, and finally the statement of work.
false_statement: In Trailhead's implementation sales process, the order is discovery, then the statement of work, then a rough order of magnitude, and finally a proposal.
explanation: 'Trailhead puts the SOW last: discovery comes first, a rough order of magnitude gives a cost range, and a proposal tightens the estimate before the SOW commits to deliverables. The false version moves the SOW ahead of the estimates it depends on.'
