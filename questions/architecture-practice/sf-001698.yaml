id: sf-001698
product_area: architecture-practice
true_statement: Data Loader exports produce no success file unless Generate status files for exports is enabled in Advanced Settings.
false_statement: Data Loader exports always produce a success file, and the Generate status files for exports setting only adds an error file.
explanation: Status files are off by default for exports, so reconciliation evidence for an export must be switched on in Advanced Settings. Inserts, updates and other operations write success and error files regardless.
