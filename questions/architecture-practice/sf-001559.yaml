product_area: architecture-practice
true_statement: In TOGAF's Architecture Development Method, Phase E (Opportunities and Solutions) is the first phase concerned directly with implementation and produces the initial Architecture Roadmap.
false_statement: In TOGAF's Architecture Development Method, Phase A (Architecture Vision) is the first phase concerned directly with implementation and produces the initial Architecture Roadmap.
explanation: Phase A scopes the work and gets a Statement of Architecture Work approved. Implementation concerns first appear in Phase E, which creates the initial roadmap and any Transition Architectures.
