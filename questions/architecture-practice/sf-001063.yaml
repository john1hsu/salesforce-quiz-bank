id: sf-001063
product_area: architecture-practice
true_statement: Salesforce architects advise finishing LDV load tests at least three to four weeks before go-live, in a sandbox separate from UAT.
false_statement: Salesforce architects advise finishing LDV load tests at least one week before go-live, in the same sandbox used for UAT.
explanation: Load tests need a dedicated sandbox because a shared UAT sandbox is unusable for functional testing while they run, and three to four weeks leaves time to fix what they reveal.
