id: sf-000099
product_area: architecture-practice
true_statement: Salesforce's loading guidance recommends Bulk API 2.0 for operations above 2,000 records and bulkified synchronous calls below that.
false_statement: Salesforce's loading guidance recommends Bulk API 2.0 for operations above 50,000 records and bulkified synchronous calls below that.
explanation: The large-data-volume loading guide sets the Bulk API 2.0 threshold at 2,000 records, using REST Composite or SOAP below it. 50,000 is not the stated cutoff.
