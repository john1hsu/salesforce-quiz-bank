product_area: architecture-practice
true_statement: A feature roadmap zooms into one capability and lists its supporting features, for business planning, budgeting and change management.
false_statement: A component roadmap zooms into one business capability and lists its supporting features, for business planning, budgeting and change management.
explanation: Feature roadmaps are a business roadmap type that drills into a single capability. Component roadmaps are a technology type covering specific technology components and their timeframes.
