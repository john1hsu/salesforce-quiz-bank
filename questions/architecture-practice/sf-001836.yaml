id: sf-001836
product_area: architecture-practice
true_statement: Salesforce warns that FieldDefinition's DurableId may not stay stable between releases, so a data dictionary should be keyed on qualified API names.
false_statement: Salesforce warns that FieldDefinition's qualified API names may not stay stable between releases, so a data dictionary should be keyed on DurableId.
explanation: DurableId isn't guaranteed to persist across releases and shouldn't be cached. Qualified API names are the stable key for matching dictionary rows to fields.
