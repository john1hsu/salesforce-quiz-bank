id: sf-000304
product_area: architecture-practice
true_statement: The record-triggered automation decision guide advises one automation entry point per object, since mixing flows and triggers on it makes ordering unpredictable.
false_statement: The record-triggered automation decision guide advises mixing flows and triggers on each object, since splitting the logic makes ordering more predictable.
explanation: Combining flows and triggers on the same object fragments ownership and makes execution order hard to predict, so the guide recommends a single entry point. The false statement reverses that advice.
