id: sf-001135
product_area: architecture-practice
true_statement: A scratch org copies no data, metadata or users from production; its edition, features and settings come from a definition file, org shape or snapshot.
false_statement: A scratch org copies production metadata and users but no data; its edition, features and settings come from a definition file, org shape or snapshot.
explanation: Scratch orgs start empty of production content, and their shape is defined separately so they can mimic production without inheriting it. Copying production metadata is what sandboxes do.
