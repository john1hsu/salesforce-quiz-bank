id: sf-000726
product_area: architecture-practice
true_statement: In the SEI Quality Attribute Workshop, stakeholders vote on brainstormed scenarios and only the top ones are refined into the full six-part form.
false_statement: In the SEI Quality Attribute Workshop, every brainstormed scenario is refined into the full six-part form before stakeholders vote on them.
explanation: The workshop merges and prioritizes scenarios first, then refines just the highest-priority ones with source, artifact and response measure. Refining everything before voting reverses the process.
