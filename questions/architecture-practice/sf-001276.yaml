product_area: architecture-practice
true_statement: In Salesforce delivery guidance, the functional design specification describes what the system does for users, while the technical design specification describes how it does it.
false_statement: In Salesforce delivery guidance, the technical design specification describes what the system does for users, while the functional design specification describes how it does it.
explanation: The functional spec is written from the user's point of view, and the technical spec gives developers the precise build detail. Swapping their roles reverses the split.
