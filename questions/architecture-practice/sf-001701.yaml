id: sf-001701
product_area: architecture-practice
true_statement: GAO's cost guide says a rough order of magnitude estimate should never be considered a budget-quality cost estimate.
false_statement: GAO's cost guide says a rough order of magnitude estimate can serve as a budget-quality cost estimate once a sponsor approves it.
explanation: A ROM is built quickly from few details, so GAO rules it out as a budget basis under any circumstances. Approval does not change its precision.
