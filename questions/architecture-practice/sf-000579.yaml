id: sf-000579
product_area: architecture-practice
true_statement: Once an architecture decision record is accepted it is not edited; a changed decision gets a new ADR that supersedes and links to the old one.
false_statement: Once an architecture decision record is accepted it is edited in place when the decision changes, and its status is updated to show the revision.
explanation: 'ADRs form an append-only log: accepted records stay as written and a new record supersedes them, so the log shows how long each decision governed the work. Editing in place would erase that history.'
