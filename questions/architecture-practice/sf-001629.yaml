id: sf-001629
product_area: architecture-practice
true_statement: Trailhead advises using delta batch feeds wherever possible, because they are smaller, faster and more resilient to network interruptions than full feeds.
false_statement: Trailhead advises using full batch feeds wherever possible, because they are simpler and more resilient to network interruptions than delta feeds.
explanation: Delta feeds send only what changed, so they move less data and recover more easily if a transfer breaks. The false version recommends the heavier full feed.
