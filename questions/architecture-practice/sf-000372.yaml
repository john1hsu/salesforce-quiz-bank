true_statement: The System Architect credential page lists its four prerequisite certifications without prescribing the order in which to pass them.
false_statement: The System Architect credential page requires Integration Architect to be passed before the other three prerequisite certifications.
explanation: No sequence is mandated; candidates choose their own order. Platform Developer is a natural first step for CTA-bound candidates since it also counts toward Application Architect.
