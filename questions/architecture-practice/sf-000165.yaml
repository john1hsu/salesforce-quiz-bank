id: sf-000165
product_area: architecture-practice
true_statement: Well-Architected code guidance recommends thin triggers that delegate to handler classes, with SOQL centralised in selector classes.
false_statement: Well-Architected code guidance recommends keeping business logic in trigger bodies, with SOQL centralised in selector classes.
explanation: Logic written directly in trigger files grows hard to test and is listed as an anti-pattern. Triggers should hand off to handlers, with logic in service classes and queries in selectors.
