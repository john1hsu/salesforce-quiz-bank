id: sf-000098
product_area: architecture-practice
true_statement: In Salesforce Archive, master-detail children are archived with their parent automatically, while lookup children are included only through configuration.
false_statement: In Salesforce Archive, lookup children are archived with their parent automatically, while master-detail children are included only through configuration.
explanation: Salesforce Archive keeps relationships intact by moving master-detail children along with the parent by default; lookup children must be added in the policy. The false statement swaps the two relationship types.
