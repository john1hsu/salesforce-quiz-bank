id: sf-000651
product_area: architecture-practice
true_statement: A Centralized Salesforce Center of Excellence model suits single-org environments, while a Federated model suits multi-org or multi-region estates.
false_statement: A Federated Salesforce Center of Excellence model suits single-org environments, while a Centralized model suits multi-org or multi-region estates.
explanation: A Centralized CoE controls all Salesforce work, which fits one org. In a Federated model business units keep control and the CoE advises, which fits multi-org estates; the false statement swaps them.
