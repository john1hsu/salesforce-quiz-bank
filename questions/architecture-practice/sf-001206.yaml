id: sf-001206
product_area: architecture-practice
true_statement: Tableau Blueprint suggests self-migration to Tableau Cloud only for small sites of roughly 100 to 150 users or fewer, with one site and simple permissions.
false_statement: Tableau Blueprint suggests self-migration to Tableau Cloud for sites of up to roughly 1,000 to 1,500 users, with several sites and complex permissions.
explanation: Blueprint keeps self-migration for small, simple estates of about 100 to 150 users on one site. Larger or more complex estates are pointed to Professional Services or a partner.
