id: sf-000163
product_area: architecture-practice
true_statement: Salesforce Optimizer flags objects with more than 350 fields, although the per-object maximum can reach 800 depending on edition.
false_statement: Salesforce Optimizer flags objects with more than 100 fields, although the per-object maximum can reach 800 depending on edition.
explanation: Optimizer treats 350 fields on one object as a warning sign well below the hard ceiling of up to 800. It also flags piles of sharing rules, flows and multiple triggers on one object.
