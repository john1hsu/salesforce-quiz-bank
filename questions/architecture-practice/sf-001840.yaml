id: sf-001840
product_area: architecture-practice
true_statement: Persona guidance for prioritisation is to pick one primary persona, two at most, whom the interface must satisfy, plus secondary personas.
false_statement: Persona guidance for prioritisation is to pick up to five primary personas whom the interface must satisfy, plus secondary personas.
explanation: Limiting primary personas to one or two keeps scope focused; too many primaries makes scope too broad. Five primary personas defeats the purpose.
