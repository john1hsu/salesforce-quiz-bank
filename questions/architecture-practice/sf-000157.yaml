id: sf-000157
product_area: architecture-practice
true_statement: Salesforce's large-data-volume guidance advises keeping any one user from owning more than 10,000 records.
false_statement: Salesforce's large-data-volume guidance advises keeping any one user from owning more than 100,000 records.
explanation: Ownership concentration drives sharing computation and locking cost, so the guidance sets 10,000 records per owner, the same figure it uses for children under one parent.
