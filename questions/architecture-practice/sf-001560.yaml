id: sf-001560
product_area: architecture-practice
true_statement: TOGAF defines four architecture domains, business, data, application and technology, and treats security as a concern that cuts across all of them.
false_statement: TOGAF defines five architecture domains, business, data, application, technology and security, with security as a domain of its own.
explanation: The standard has four domains. Security is handled as a cross-cutting concern, with its own Series Guide, rather than as a fifth domain.
