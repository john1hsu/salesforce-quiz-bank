true_statement: Trailhead's functional consulting workflow places the gap analysis in the design phase, alongside the functional specification and data model.
false_statement: Trailhead's functional consulting workflow places the gap analysis in the build phase, alongside development and unit testing.
explanation: Trailhead puts gap analysis in design so missing pieces and customization needs surface before build starts. Doing it during build would be too late to steer the solution and estimates.
