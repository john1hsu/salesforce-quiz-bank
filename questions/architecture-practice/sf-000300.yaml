id: sf-000300
product_area: architecture-practice
true_statement: The Architecture Center's diagram templates are built for Lucidchart, and footer icons in template-based diagrams can become detached from their cards.
false_statement: The Architecture Center's diagram templates are built for Microsoft Visio, and footer icons in template-based diagrams can become detached from their cards.
explanation: Salesforce provides its diagram templates for Lucidchart and warns that footer icons may come loose from their cards. Visio is not the target tool for these templates.
