id: sf-001201
product_area: architecture-practice
true_statement: In a fit-gap worksheet, the business usually sets each item's priority, though the architect may raise foundational items so they are built first.
false_statement: In a fit-gap worksheet, the architect usually sets each item's priority, though the business may raise foundational items so they are built first.
explanation: Priority is normally owned by the business, and the architect's role is to lift foundational items so the architecture comes first. The false version swaps who owns priority and who raises the foundational items.
