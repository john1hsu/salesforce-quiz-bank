id: sf-001838
product_area: architecture-practice
true_statement: Salesforce's published user personas are task-based, describing the general work of a role rather than the CRM features it uses.
false_statement: Salesforce's published user personas are CRM-based, describing the CRM features a role uses rather than the general work it does.
explanation: Salesforce built its personas around tasks because orgs often do the same work with different features or outside systems. Tying them to CRM features would make them less portable.
