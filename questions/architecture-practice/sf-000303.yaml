id: sf-000303
product_area: architecture-practice
true_statement: The record-triggered automation decision guide points to an Apex trigger framework when an object has more than 30 automations or 5+ downstream DML.
false_statement: The record-triggered automation decision guide points to a hybrid of Flow plus invocable Apex when an object has more than 30 automations or 5+ downstream DML.
explanation: The hybrid Flow plus invocable Apex approach is the guide's middle band of 15 to 30 automations with 2 to 4 downstream DML. Beyond 30 automations or at 5+ downstream DML, the guide recommends an Apex trigger framework.
