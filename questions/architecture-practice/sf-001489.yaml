product_area: architecture-practice
true_statement: In a Salesforce solution kit, the Connecting technology section lists the connectors or APIs that move data or identity between the products.
false_statement: In a Salesforce solution kit, the Design considerations section lists the connectors or APIs that move data or identity between the products.
explanation: Each kit has a Connecting technology section for the connectors and APIs between clouds. Design considerations covers limits and performance guardrails instead, such as data set import limits.
