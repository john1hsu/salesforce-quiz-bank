id: sf-001130
product_area: architecture-practice
true_statement: In Salesforce's MOMA archetype, a supervisor agent delegates to agents in other orgs over the A2A protocol, while SOMA keeps all agents in one org.
false_statement: In Salesforce's SOMA archetype, a supervisor agent delegates to agents in other orgs over the A2A protocol, while MOMA keeps all agents in one org.
explanation: SOMA means single org, multiple agents under shared governance; MOMA means multi org, with cross-org delegation over Agent-to-Agent. The false statement swaps the two acronyms.
