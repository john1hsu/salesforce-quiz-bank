true_statement: For migration loads, insert is the fastest operation, followed by update, with upsert the slowest.
false_statement: For migration loads, upsert is the fastest operation, followed by update, with insert the slowest.
explanation: Insert is quickest and upsert slowest, so the guidance suggests splitting upserts into separate create and update passes where possible. The false ordering is reversed.
