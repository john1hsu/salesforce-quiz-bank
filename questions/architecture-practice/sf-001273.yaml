id: sf-001273
product_area: architecture-practice
true_statement: Trailhead's CoE guidance has the Design Authority review planned metadata for a data migration before construction starts.
false_statement: Trailhead's CoE guidance has the Design Authority review planned metadata for a data migration only after the migration loads have finished.
explanation: The review happens up front, with the CoE members who own data models, so problems are caught before anything is built. A review after loading would be too late to shape the design.
