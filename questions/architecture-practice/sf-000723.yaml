id: sf-000723
product_area: architecture-practice
true_statement: TOGAF suggests starting a capability map with a top-down pass of about 20 to 30 high-level capabilities, then adding bottom-up detail.
false_statement: TOGAF suggests starting a capability map with a top-down pass of about 100 to 150 high-level capabilities, then adding bottom-up detail.
explanation: A small top-down set of roughly 20 to 30 capabilities keeps the model manageable before detail is layered in. A first pass of 100 or more is far beyond that guidance.
