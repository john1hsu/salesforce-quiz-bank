product_area: architecture-practice
true_statement: Microsoft's implementation guidance recommends rehearsing the handover from hypercare to business-as-usual support during user acceptance testing.
false_statement: Microsoft's implementation guidance recommends rehearsing the handover from hypercare to business-as-usual support only after go-live.
explanation: Microsoft advises starting the support transition during implementation, practising it in UAT and involving future support staff early. Leaving the rehearsal until after go-live defeats the point.
