id: sf-000654
product_area: architecture-practice
true_statement: Scale Test needs a Full Copy sandbox hosted on Hyperforce, although the production org itself doesn't have to be on Hyperforce.
false_statement: Scale Test needs the production org to be hosted on Hyperforce, although the Full Copy sandbox itself doesn't have to be on Hyperforce.
explanation: Load tests run in the Full Copy sandbox, so that sandbox must be on Hyperforce; production can stay where it is. The false statement puts the requirement on the wrong org.
