product_area: architecture-practice
true_statement: In TOGAF's maturity heat-map example, purple marks a capability that is wanted but doesn't exist yet, and red one that is two or more levels short.
false_statement: In TOGAF's maturity heat-map example, red marks a capability that is wanted but doesn't exist yet, and purple one that is two or more levels short.
explanation: The example uses green for at target, yellow for one level short, red for two or more short and purple for a missing capability. The false version swaps red and purple.
