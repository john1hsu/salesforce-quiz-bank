id: sf-001205
product_area: architecture-practice
true_statement: Tableau Blueprint notes that Tableau Cloud runs a single site per tenant and doesn't support cubes or guest accounts.
false_statement: Tableau Blueprint notes that Tableau Server on premises runs a single site per tenant and doesn't support cubes or guest accounts.
explanation: These are restrictions of the hosted Tableau Cloud option. Self-managed Tableau Server, on premises or in public cloud, gives full control instead.
