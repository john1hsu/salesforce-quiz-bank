id: sf-000993
product_area: architecture-practice
true_statement: Showing in-app guidance prompts on an Experience Cloud site requires an Aura-template site, plus purchased Enablement and PRM.
false_statement: Showing in-app guidance prompts on an Experience Cloud site requires an LWR-template site, plus purchased Enablement and PRM.
explanation: In-app prompts on Experience Cloud carry extra prerequisites, and one of them is that the site uses an Aura template. An LWR-template site doesn't meet that requirement.
