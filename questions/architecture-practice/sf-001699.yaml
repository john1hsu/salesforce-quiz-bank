id: sf-001699
product_area: architecture-practice
true_statement: If an object has a column named success or error, Data Loader's output files can show incorrect information, so those columns should be renamed first.
false_statement: If an object has a column named success or error, Data Loader automatically renames its own status columns, so the output files stay correct.
explanation: Data Loader writes its own success and error columns, and a same-named source column can collide with them. The guidance is to rename such columns before loading.
