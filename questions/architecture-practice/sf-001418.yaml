id: sf-001418
product_area: architecture-practice
true_statement: PMI says automation and AI agents can be Responsible for bounded tasks in a RACI, but the Accountable role and escalation must stay with a named human.
false_statement: PMI says AI agents can be Accountable for bounded tasks in a RACI, as long as a named human is listed as Responsible for escalation.
explanation: An agent can do the work, so it can fill an R cell, but PMI keeps accountability and escalation with a person. Making the agent Accountable reverses that guidance.
