id: sf-001348
product_area: architecture-practice
true_statement: Trailhead says that when a customer wants a lower SOW price, cutting estimated hours while keeping the same scope is the lever to avoid.
false_statement: Trailhead says that when a customer wants a lower SOW price, offering an explicit discount while keeping the same scope is the lever to avoid.
explanation: Reducing scope, lowering the hourly rate or giving an explicit discount are all legitimate ways to lower the price. Trimming hours on unchanged scope just pushes the shortfall into delivery, which is why Trailhead warns against it.
