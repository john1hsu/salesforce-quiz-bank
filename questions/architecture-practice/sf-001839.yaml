id: sf-001839
product_area: architecture-practice
true_statement: Salesforce's research-based personas carry no name, photo or demographics, so they transfer between companies and avoid stereotypes.
false_statement: Salesforce's research-based personas each carry a name, photo and demographics, so they feel like real people and are easier to remember.
explanation: The personas are deliberately abstract to stay reusable across organisations and to limit unconscious bias. Names, photos and demographic details are left out on purpose.
