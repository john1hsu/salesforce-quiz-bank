id: sf-000096
product_area: architecture-practice
true_statement: Salesforce's large-data-volume guidance recommends archiving or discarding data at the rate it arrives, so the active record set stays roughly constant.
false_statement: Salesforce's large-data-volume guidance recommends archiving data in one annual clean-up once storage limits are reached, letting the active set grow in between.
explanation: The LDV best practices say to remove data at the rate it comes in so performance does not degrade as volume grows. Infrequent, limit-driven clean-ups are what a deliberate archiving strategy is meant to replace.
