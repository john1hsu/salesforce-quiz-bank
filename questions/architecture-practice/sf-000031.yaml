id: sf-000031
product_area: architecture-practice
true_statement: According to Salesforce Help, Full sandboxes are the only sandbox type that supports performance testing, load testing and staging.
false_statement: According to Salesforce Help, Partial Copy sandboxes are the only sandbox type that supports performance testing, load testing and staging.
explanation: Salesforce Help reserves performance testing, load testing and staging for Full sandboxes, which copy all production data. Partial Copy sandboxes hold only a template-defined sample of data, so they are not the designated load-test environment.
