true_statement: Salesforce's B2C Commerce Launch Gate holds its first review two to three weeks before the planned go-live date.
false_statement: Salesforce's B2C Commerce Launch Gate holds its first review two to three days before the planned go-live date.
explanation: The first Launch Gate review comes two to three weeks out, which leaves time to fix blockers. A review just days before launch is the timing risk Microsoft's guidance warns about.
