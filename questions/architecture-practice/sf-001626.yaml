id: sf-001626
product_area: architecture-practice
true_statement: A mock cutover rehearses go-live in a test environment using the same data volumes, tools, people, steps and timings as the real event.
false_statement: A mock cutover rehearses go-live in a test environment using a small data sample, so it validates the steps without reproducing the real timings.
explanation: The point of the dress rehearsal is to reproduce real timings, so it uses full data volumes and is repeated until it runs cleanly. A small sample would hide exactly the duration problems it is meant to expose.
