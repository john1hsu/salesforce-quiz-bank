id: sf-001132
product_area: architecture-practice
true_statement: Salesforce's agentic integration patterns call for every agent write to be idempotent, because retries and event redelivery can repeat an action.
false_statement: Salesforce's agentic integration patterns call for every agent write to be retried until it succeeds, because agent actions are never repeated by event redelivery.
explanation: Retries and redelivered events can run an action more than once, so writes must be safe to repeat. Assuming actions never repeat is exactly the risk the guidance addresses.
