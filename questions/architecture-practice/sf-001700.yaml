id: sf-001700
product_area: architecture-practice
true_statement: Salesforce's migration guidance recommends loading and verifying a single record before loading the full file.
false_statement: Salesforce's migration guidance recommends loading the full file first and then verifying a single sampled record.
explanation: Testing one record up front catches mapping mistakes before they multiply across thousands of rows. Verifying only after a full load lets errors spread.
