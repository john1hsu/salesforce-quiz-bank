id: sf-000725
product_area: architecture-practice
true_statement: The Well-Architected Reliability pillar's example pairs a 99.9% platform SLA with a 99.5% solution SLO, leaving an error budget.
false_statement: The Well-Architected Reliability pillar's example pairs a 99.5% platform SLA with a 99.9% solution SLO, leaving an error budget.
explanation: A solution's objective should sit below the platform's guarantee so there's room for its own failures. The false version sets the solution target above the platform SLA, which leaves no budget.
