id: sf-000992
product_area: architecture-practice
true_statement: In Salesforce's Discover, Rollout and Optimize change cycle, the change impact assessment is done in Discover, before rollout begins.
false_statement: In Salesforce's Discover, Rollout and Optimize change cycle, the change impact assessment is done in Optimize, after rollout ends.
explanation: Discover is where feedback is gathered, sponsors aligned, blockers named and the change impact assessment run. Optimize follows go-live and focuses on adoption metrics and adjustments.
