product_area: architecture-practice
true_statement: Salesforce Architects advise that a finalized architectural guiding principle is superseded by a new principle rather than reworded.
false_statement: Salesforce Architects advise that a finalized architectural guiding principle is reworded in place with a new version number rather than superseded.
explanation: Once a principle is Final, changing it means issuing a new principle that supersedes it, keeping the record clear. Editing the wording of the final principle is what the guidance avoids.
