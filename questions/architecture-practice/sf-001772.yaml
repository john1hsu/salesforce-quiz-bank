true_statement: The Launch Gate allows at most two reviews, and the second one re-checks only the items that failed the first.
false_statement: The Launch Gate allows at most three reviews, and each one re-checks every item from the full assessment.
explanation: Salesforce caps the Launch Gate at two reviews. The follow-up review is limited to the failed items rather than a full repeat.
