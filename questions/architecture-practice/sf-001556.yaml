id: sf-001556
product_area: architecture-practice
true_statement: Salesforce Diagrams treats the system landscape as its Level 1 "Big Picture" view, naming products and technologies while leaving most detail out.
false_statement: Salesforce Diagrams treats the system landscape as its Level 3 view, naming products and technologies while adding time-based sequencing.
explanation: The landscape is the widest, Level 1 zoom that detailed diagrams drill into. Sequenced, time-based interactions belong at Level 3, not on the landscape.
