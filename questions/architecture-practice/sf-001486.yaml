true_statement: A solution architecture diagram is more prescriptive than a reference architecture, naming the specific tools and resources a delivery team will use.
false_statement: A reference architecture is more prescriptive than a solution architecture diagram, naming the specific tools and resources a delivery team will use.
explanation: Trailhead treats a reference architecture as a broad blueprint of recommended patterns, while the solution architecture diagram gets specific about tools for the build. The false statement reverses which one is prescriptive.
