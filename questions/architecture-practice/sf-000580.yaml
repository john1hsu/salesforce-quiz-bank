true_statement: 'Michael Nygard''s 2011 ADR template has five parts: a title, the context, the decision, a status and the consequences.'
false_statement: 'Michael Nygard''s 2011 ADR template has five parts: a title, the context, the options considered, the decision and the consequences.'
explanation: Nygard's original template lists title, context, decision, status and consequences. Recording the serious alternatives with their pros and cons was added by later guidance, not part of his five sections.
