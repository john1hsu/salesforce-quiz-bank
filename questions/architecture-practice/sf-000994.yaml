id: sf-000994
product_area: architecture-practice
true_statement: Unlike System Architect, the Heroku Architect credential is earned on its own rather than granted automatically as a roll-up of other exams.
false_statement: Like System Architect, the Heroku Architect credential is granted automatically as a roll-up once its prerequisite exams are passed.
explanation: Application Architect and System Architect are roll-ups of other certifications, but Heroku Architect is a separate product credential that does not feed or come from a roll-up.
