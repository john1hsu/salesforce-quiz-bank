id: sf-000164
product_area: architecture-practice
true_statement: Well-Architected guidance warns that teams who never budget for debt repayment face a large refactoring project every 18 to 24 months.
false_statement: Well-Architected guidance warns that teams who never budget for debt repayment face a large refactoring project every 5 to 7 years.
explanation: When debt goes unrecorded and sprints leave no room to fix it, the backlog resurfaces as a big refactor roughly every 18 to 24 months. Tracking debt and paying it down continuously avoids that.
