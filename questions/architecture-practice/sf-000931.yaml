true_statement: In a 2020 survey of 157 practitioners, cost was the most frequently chosen criterion in build-vs-buy component decisions, picked by 77%.
false_statement: In a 2020 survey of 157 practitioners, component size was the most frequently chosen criterion in build-vs-buy component decisions, picked by 77%.
explanation: Cost led the criteria at 77%, ahead of support, longevity and fit. Component size was rarely weighted, which the authors saw as underestimating integration effort.
