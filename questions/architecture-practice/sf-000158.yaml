id: sf-000158
product_area: architecture-practice
true_statement: Salesforce's data-integration guidance defaults to minimising replication, accessing data in place through virtualization such as Salesforce Connect.
false_statement: Salesforce's data-integration guidance defaults to replicating external data into the org, using virtualization such as Salesforce Connect only as a last resort.
explanation: The guide asks each project to name a source of truth and avoid copying records that don't need to live in the org; virtualization is the preferred way to reach them.
