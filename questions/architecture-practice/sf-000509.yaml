id: sf-000509
product_area: architecture-practice
true_statement: The event-driven architecture decision guide says Salesforce will keep supporting PushTopic and generic events without further investment and recommends moving to Pub/Sub API.
false_statement: The event-driven architecture decision guide says Salesforce will keep supporting PushTopic and generic events without further investment and recommends moving to Outbound Messages.
explanation: The guide signals that PushTopic and generic events are supported but no longer invested in, and points teams to Pub/Sub API where feasible. Outbound Messages are just another option compared in the guide, not the recommended successor.
