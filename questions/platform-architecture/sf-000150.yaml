id: sf-000150
product_area: platform-architecture
true_statement: If more than 100 records in a Bulk API batch can't get locks, the rest of the batch is requeued, up to 10 times before it fails.
false_statement: If more than 100 records in a Bulk API batch can't get locks, the rest of the batch is requeued, up to 3 times before it fails.
explanation: Bulk API retries the remainder of a lock-starved batch as many as 10 times before marking it permanently failed. Individual failed records are not retried and must be resubmitted.
