id: sf-000357
product_area: platform-architecture
true_statement: Salesforce reruns customers' unit tests on each platform release to catch changes that would break their customizations.
false_statement: Salesforce reruns customers' unit tests only when the customer deploys new Apex to production, not on platform releases.
explanation: Because the kernel and tenant metadata evolve separately, Salesforce runs customers' tests on each release to detect breaking changes. That safeguard only works if the tests exist.
