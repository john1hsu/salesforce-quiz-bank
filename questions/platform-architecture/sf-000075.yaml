id: sf-000075
product_area: platform-architecture
true_statement: Creating a custom object in Salesforce stores its definition as metadata instead of creating a new physical database table.
false_statement: Creating a custom object in Salesforce runs DDL that creates a new physical database table for that object.
explanation: The platform keeps object definitions as metadata and materializes them at runtime, so schema changes need no locks or downtime. No per-object table is created.
