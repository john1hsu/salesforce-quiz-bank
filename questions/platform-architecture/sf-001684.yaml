id: sf-001684
product_area: platform-architecture
true_statement: For Salesforce Sites page views, the Authorization Required error page counts, while static resources, images and robots.txt do not.
false_statement: For Salesforce Sites page views, static resources, images and robots.txt count, while the Authorization Required error page does not.
explanation: Unauthenticated page requests, including the Authorization Required page and AJAX traffic, are counted; static assets and other error pages are not. The false version reverses which requests count.
