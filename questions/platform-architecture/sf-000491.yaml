id: sf-000491
product_area: platform-architecture
true_statement: A skinny table can't include fields from other objects, so a query that needs a parent object's fields can't be served from it alone.
false_statement: A skinny table can include fields from parent objects reached through lookups, so it can serve queries that span related objects.
explanation: Each skinny table holds fields from one object only; cross-object fields are not allowed. That is why it removes the standard/custom field join but not joins across objects.
