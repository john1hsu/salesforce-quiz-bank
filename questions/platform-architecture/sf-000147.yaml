true_statement: In Hyperforce, a cell is the unit formerly called an instance or pod, acting as both a scale unit and a blast-radius boundary.
false_statement: In Hyperforce, a grid is the unit formerly called an instance or pod, acting as both a scale unit and a blast-radius boundary.
explanation: A cell holds one or more orgs and limits the impact of failures. A grid is a larger grouping of Hyperforce instances that share a control plane.
