id: sf-001610
product_area: platform-architecture
true_statement: Salesforce's API end-of-life policy supports each API version for at least three years and gives users at least one year's notice before support ends.
false_statement: Salesforce's API end-of-life policy supports each API version for at least five years and gives users at least six months' notice before support ends.
explanation: The published policy promises a minimum of three years of support per version and a minimum one-year notice to customers still using a version before it is retired.
