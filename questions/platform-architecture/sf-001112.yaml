id: sf-001112
product_area: platform-architecture
true_statement: Lamport's happened-before relation is only a partial order, because events not linked by process order or messages are concurrent.
false_statement: Lamport's happened-before relation is a total order, because every pair of events is linked by process order or messages.
explanation: Happened-before relates events only through process order, messages and transitivity, leaving unrelated events concurrent. A total order requires an extra tie-breaking rule such as fixed process ordering.
