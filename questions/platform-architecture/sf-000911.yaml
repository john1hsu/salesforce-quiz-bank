id: sf-000911
product_area: platform-architecture
true_statement: Under NIST's IaaS model, the consumer controls the operating systems, storage and deployed applications, and may have limited control over host firewalls.
false_statement: Under NIST's IaaS model, the provider controls the guest operating systems and deployed applications, and the consumer controls only application settings.
explanation: 'IaaS hands the consumer the most control of the three service models: guest OS, storage and applications are theirs to run. Controlling only application settings describes SaaS, not IaaS.'
