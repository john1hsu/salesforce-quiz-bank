id: sf-000714
product_area: platform-architecture
true_statement: By default a Salesforce index leaves out rows where the field is empty, so a filter like Field__c = null forces a full scan.
false_statement: By default a Salesforce index keeps rows where the field is empty, so a filter like Field__c = null can be served from the index.
explanation: Empty values are omitted from indexes unless Support enables null rows on a custom index, so null filters scan the table. The false version describes the opt-in behaviour as the default.
