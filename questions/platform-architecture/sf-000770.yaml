id: sf-000770
product_area: platform-architecture
true_statement: Flow bulkifies records automatically, but it has no native Map or Set, so a Get Records element inside a Loop is a common performance problem.
false_statement: Flow has native Map and Set structures, so a Get Records element inside a Loop is bulkified automatically and causes no performance problem.
explanation: Flow merges redundant queries and DML across records, but without maps or sets a query placed inside a loop still runs per iteration. That pattern is a frequent cause of slow flows.
