id: sf-001538
product_area: platform-architecture
true_statement: A seasonal release's pre-release org is a Developer Edition org on the new version that contains none of your own customisations.
false_statement: A seasonal release's pre-release org is a copy of your production org on the new version that contains all of your own customisations.
explanation: Pre-release orgs are fresh Developer Edition orgs, usually available a few weeks before sandbox preview, for trying new features. Testing against your own metadata happens in a sandbox on a preview instance instead.
