product_area: platform-architecture
true_statement: Trailhead's cloud security module uses Gmail as its example of Software as a Service.
false_statement: Trailhead's cloud security module uses Gmail as its example of Infrastructure as a Service.
explanation: Gmail is a fully managed application that users simply consume, so Trailhead presents it as SaaS. IaaS would mean renting raw compute, storage and networks.
