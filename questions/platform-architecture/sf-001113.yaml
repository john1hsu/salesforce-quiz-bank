product_area: platform-architecture
true_statement: Gilbert and Lynch proved that availability and atomic consistency can't both be guaranteed under message loss, in asynchronous and partially synchronous networks alike.
false_statement: Gilbert and Lynch proved that availability and atomic consistency can't both be guaranteed under message loss in asynchronous networks, but can be once nodes have clocks.
explanation: Their CAP proof covers partially synchronous networks, where nodes have clocks, as well as fully asynchronous ones. Adding clocks does not escape the impossibility.
