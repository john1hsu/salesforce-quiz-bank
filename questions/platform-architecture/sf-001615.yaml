id: sf-001615
product_area: platform-architecture
true_statement: Out of Region Disaster Recovery is a separately sold Hyperforce offering that replicates an instance to a secondary geography for failover after a regional disruption.
false_statement: Out of Region Disaster Recovery is included for every Hyperforce customer and replicates an instance to a secondary geography for failover after a regional disruption.
explanation: Cross-AZ resilience inside one region is standard, but replicating to another region is an add-on Salesforce sells. It also differs from Backup & Recover, which restores org data.
