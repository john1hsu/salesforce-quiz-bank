id: sf-001187
product_area: platform-architecture
true_statement: In Salesforce Go, a preenablement step must be completed manually before Turn On, while an automated step runs without admin input.
false_statement: In Salesforce Go, an automated step must be completed manually before Turn On, while a preenablement step runs without admin input.
explanation: Preenablement steps are manual prerequisites, flagged by a greyed-out Turn On button and a warning icon. Automated steps run on their own, such as Cadences switching on Sales Engagement, so the false statement swaps the two step kinds.
