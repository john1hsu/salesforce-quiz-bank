product_area: platform-architecture
true_statement: Salesforce counts most records as about 2 KB of data storage, but each person account as 4 KB.
false_statement: Salesforce counts most records as about 2 KB of data storage, but each person account as 8 KB.
explanation: A person account is an Account plus a Contact, so it is counted at 4 KB. 8 KB is the figure for a campaign record.
