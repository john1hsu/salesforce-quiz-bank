true_statement: In each seasonal release, Salesforce upgrades sandboxes 4 to 6 weeks before it upgrades production orgs.
false_statement: In each seasonal release, Salesforce upgrades sandboxes 1 to 2 weeks after it upgrades production orgs.
explanation: Sandboxes get the new release first, several weeks ahead of production, giving teams time to test. Customers can't choose their own upgrade date.
