true_statement: Salesforce Edge Network is turned on in the Routing section of the My Domain Setup page, which requires the Customize Application permission.
false_statement: Salesforce Edge Network is turned on in the Session Settings Setup page, which requires the Modify All Data permission.
explanation: 'Edge routing is a My Domain setting: edit Routing and select Use Salesforce Edge Network, with Customize Application. Session Settings and Modify All Data are not involved.'
