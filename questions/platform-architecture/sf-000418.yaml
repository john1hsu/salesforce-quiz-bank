id: sf-000418
product_area: platform-architecture
true_statement: Rolling back to an Apex savepoint undoes later DML, but static variables keep the values they had before the rollback.
false_statement: Rolling back to an Apex savepoint undoes later DML and also restores static variables to the values they had at the savepoint.
explanation: Database.rollback only discards database changes and releases locks; in-memory static state such as recursion guards is untouched. The false statement wrongly claims statics are reset too.
