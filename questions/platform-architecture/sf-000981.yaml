id: sf-000981
product_area: platform-architecture
true_statement: Because Salesforce Edge Network uses data-center-specific certificates, clients that pin should pin the intermediate certificate rather than the leaf.
false_statement: Because Salesforce Edge Network uses one certificate shared by all data centers, clients that pin should pin the leaf certificate rather than the intermediate.
explanation: Edge Network serves certificates specific to each data center, so a pinned leaf can break when traffic lands elsewhere. Pinning the intermediate certificate is the documented guidance.
