id: sf-000778
product_area: platform-architecture
true_statement: Under NIST's PaaS model, the consumer controls its deployed applications but not the underlying servers, operating systems or storage.
false_statement: Under NIST's PaaS model, the consumer controls its deployed applications and the underlying operating systems, but not the servers or storage.
explanation: NIST SP 800-145 leaves the network, servers, operating systems and storage to the provider in PaaS. Control over operating systems is what distinguishes IaaS.
