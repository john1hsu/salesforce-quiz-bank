id: sf-001822
product_area: platform-architecture
true_statement: In Briefcase Builder, a custom metadata type can be the target only of a top-level rule, with one rule per type.
false_statement: In Briefcase Builder, a custom metadata type can be the target only of a related object rule, with one rule per type.
explanation: Custom metadata types can be primed, but only as top-level rule targets, one rule each and with no other fields. They can't be reached through related object rules.
