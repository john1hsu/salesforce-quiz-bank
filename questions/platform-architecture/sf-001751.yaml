true_statement: Custom objects use Dynamic Actions on mobile by default, while standard objects need a setting in the Salesforce Mobile App area of Setup.
false_statement: Standard objects use Dynamic Actions on mobile by default, while custom objects need a setting in the Salesforce Mobile App area of Setup.
explanation: Mobile support for dynamic actions is automatic only for custom objects. For standard objects an admin must turn it on in the mobile app settings; the false statement swaps the two.
