id: sf-001755
product_area: platform-architecture
true_statement: To show the Dynamic Highlights Panel in the Salesforce mobile app, an admin must turn on the setting it shares with Dynamic Forms for mobile.
false_statement: The Dynamic Highlights Panel appears in the Salesforce mobile app as soon as the page is saved, with no separate mobile setting needed.
explanation: Desktop users see the panel on save, but mobile needs Dynamic Forms and Dynamic Highlights Panel on Mobile enabled in Setup. Without it, mobile users get no highlights area unless a standard Highlights Panel is also on the page.
