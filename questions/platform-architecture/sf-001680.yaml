id: sf-001680
product_area: platform-architecture
true_statement: Trailhead recommends that quick action layouts in the Salesforce mobile app have fewer than five fields and never more than eight.
false_statement: Trailhead recommends that quick action layouts in the Salesforce mobile app have fewer than ten fields and never more than fifteen.
explanation: Short action layouts keep mobile data entry fast, so the guidance is under five fields with eight as the ceiling. The false version roughly doubles both numbers.
