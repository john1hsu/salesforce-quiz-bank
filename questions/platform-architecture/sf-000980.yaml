id: sf-000980
product_area: platform-architecture
true_statement: After an org moves to Salesforce Edge Network, only Salesforce Customer Support can switch it back.
false_statement: After an org moves to Salesforce Edge Network, an admin can switch it back by clearing the Routing option in Setup.
explanation: The move is one-way from the admin's point of view; reversing it takes a Customer Support request. That is why firewalls and pinned certificates should be checked before enabling it.
