id: sf-001328
product_area: platform-architecture
true_statement: Experienced Page Time ends when a Lightning page shows no further activity for about two frames, and Salesforce reports it at the 75th percentile.
false_statement: Experienced Page Time ends when a Lightning page fires its browser load event, and Salesforce reports it at the 95th percentile.
explanation: EPT waits for roughly 33 ms of inactivity because subcomponents load after their parents, so a plain load event would mislead. The reported figure is P75, not P95.
