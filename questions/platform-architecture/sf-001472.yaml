id: sf-001472
product_area: platform-architecture
true_statement: License provisioning applies only to production orgs; Demo, Developer, Scratch and Trial orgs are not provisioned that way.
false_statement: License provisioning applies to production, Developer and Scratch orgs; only Demo and Trial orgs are not provisioned that way.
explanation: Salesforce runs provisioning on purchases, upgrades and license-definition patches for production orgs only. Developer and Scratch orgs are excluded along with Demo and Trial orgs.
