id: sf-001820
product_area: platform-architecture
true_statement: A single Briefcase Builder rule can return at most 50,000 records, and when more match, the rule's orderBy decides which are kept.
false_statement: A single Briefcase Builder rule can return at most 10,000 records, and when more match, the rule's orderBy decides which are kept.
explanation: recordLimit caps a rule at 50,000 matching records, and results must also fit the 50,000 maximum across active briefcases. 10,000 understates the cap.
