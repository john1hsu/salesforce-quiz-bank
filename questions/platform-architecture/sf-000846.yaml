product_area: platform-architecture
true_statement: 'NIST''s cloud reference architecture, SP 500-292, names five actors: cloud consumer, provider, auditor, broker and carrier.'
false_statement: 'NIST''s cloud reference architecture, SP 500-292, names four actors: cloud consumer, provider, broker and carrier, with no auditor.'
explanation: SP 500-292 includes the cloud auditor as a fifth actor, responsible for independent assessment of cloud services. Leaving it out drops the role that links to programmes like FedRAMP.
