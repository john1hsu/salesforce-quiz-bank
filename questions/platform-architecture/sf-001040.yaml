id: sf-001040
product_area: platform-architecture
true_statement: In the extra trigger run caused by a workflow field update, Trigger.old holds the values from before the user's original update.
false_statement: In the extra trigger run caused by a workflow field update, Trigger.old holds the values that the workflow field update just set.
explanation: Salesforce's example changes a field from 1 to 10, workflow bumps it to 11, and Trigger.old in the repeat run still shows 1. It does not reflect the workflow's intermediate value.
