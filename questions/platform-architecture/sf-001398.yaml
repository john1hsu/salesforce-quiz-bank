id: sf-001398
product_area: platform-architecture
true_statement: Under Abadi's PACELC model, default Dynamo, Cassandra and Riak are classed PA/EL, favouring availability under partition and latency otherwise.
false_statement: Under Abadi's PACELC model, default Dynamo, Cassandra and Riak are classed PC/EC, favouring consistency under partition and otherwise.
explanation: 'Abadi puts these Dynamo-style stores in PA/EL: they stay available during partitions and trade consistency for lower latency in normal running. PC/EC is his class for systems such as VoltDB/H-Store and Megastore.'
