id: sf-001042
product_area: platform-architecture
true_statement: Anyone can subscribe to Salesforce Trust Notifications, even without a Salesforce user license.
false_statement: Only users with an active Salesforce user license and admin rights can subscribe to Salesforce Trust Notifications.
explanation: Trust Notifications are open to any subscriber who confirms by email, with no license required. Admin-only delivery applies to Salesforce's incident emails and webinar invites, not to Trust subscriptions.
