id: sf-000772
product_area: platform-architecture
true_statement: Every External ID field on an object also uses up one of that object's custom index slots.
false_statement: External ID fields have their own index allocation, so they don't use up any of the object's custom index slots.
explanation: Marking a field as an External ID indexes it, and that index counts against the same per-object custom index cap. Adding integration keys can quietly exhaust slots needed for tuning.
