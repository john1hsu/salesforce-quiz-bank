id: sf-000773
product_area: platform-architecture
true_statement: A custom big object's index can't be edited or deleted once deployed, so changing it means building a new big object.
false_statement: A custom big object's index can be edited after deployment, as long as the big object doesn't yet hold any records.
explanation: Big object indexes are permanent after deployment, whatever the data volume. The only way to change one is to define a new big object.
