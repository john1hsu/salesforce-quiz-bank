id: sf-000776
product_area: platform-architecture
true_statement: Group membership locking can still occur while sharing calculations are deferred.
false_statement: Deferring sharing calculations prevents group membership locking until the calculations are resumed.
explanation: Deferral suspends sharing rule and group membership calculation, but the locks on membership tables are still taken. It isn't a way to avoid lock errors.
