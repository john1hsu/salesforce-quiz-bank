true_statement: Since early 2026, Scale Insights can be generated on demand, with an allowance of three on-demand insights per week per org.
false_statement: Since early 2026, Scale Insights can be generated on demand, with an allowance of three on-demand insights per day per org.
explanation: On-demand generation joined the scheduled insights, but the stated allowance is weekly, at three per org. A daily allowance of three would be seven times as generous.
