id: sf-000775
product_area: platform-architecture
true_statement: Granular locking, which is on by default, lets group membership operations run at the same time when the roles or groups involved are unrelated.
false_statement: Granular locking, which must be enabled by Salesforce Support, lets group membership operations run at the same time when the roles or groups involved are unrelated.
explanation: Granular locking is already on in orgs by default and relaxes the single global lock for unrelated changes. No Support request is needed to get it.
