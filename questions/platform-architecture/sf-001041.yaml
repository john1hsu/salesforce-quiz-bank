id: sf-001041
product_area: platform-architecture
true_statement: Salesforce measured bulk same-record updates as roughly 10 to 20 times faster in before-save flows than in Workflow Rules or Process Builder.
false_statement: Salesforce measured bulk same-record updates as roughly 2 to 3 times faster in before-save flows than in Workflow Rules or Process Builder.
explanation: Before-save flows change the record in memory and avoid a recursive save, which Salesforce measured at about 10 to 20 times faster in bulk. The smaller multiple understates the gap.
