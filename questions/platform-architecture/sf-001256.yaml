id: sf-001256
product_area: platform-architecture
true_statement: Apex cursor daily allowances are charged when the cursor is created, so a cursor over N rows uses N rows of the daily row allowance immediately.
false_statement: Apex cursor daily allowances are charged as rows are fetched, so a cursor over N rows uses the daily row allowance only for the rows actually fetched.
explanation: Creation is the billing moment, which is why opening a new cursor in every Queueable hop drains the daily limits fast. Fetching rows does not change what was already charged.
