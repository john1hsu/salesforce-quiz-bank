id: sf-001754
product_area: platform-architecture
true_statement: If field-level security hides the Dynamic Highlights Panel's primary field from a user, the panel shows the record Name instead.
false_statement: If field-level security hides the Dynamic Highlights Panel's primary field from a user, the panel shows the next field in its list instead.
explanation: The primary field falls back to the record Name when the user can't see it. It also can't carry a visibility rule or be a cross-object field.
