product_area: platform-architecture
true_statement: For a multi-org enterprise, Salesforce recommends a single Data Cloud Home Org with the other orgs attached as companion orgs.
false_statement: For a multi-org enterprise, Salesforce recommends a separate Data Cloud instance in every production org, each kept independent.
explanation: The provisioning guide favours one Home Org hosting Data Cloud, with companion orgs connected. Separate instances are reserved for strict autonomy, residency or compliance needs.
