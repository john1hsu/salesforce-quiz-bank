id: sf-000638
product_area: platform-architecture
true_statement: If a property's type differs between a Lightning web component's JavaScript and its js-meta.xml, the configuration file's type wins in Lightning App Builder.
false_statement: If a property's type differs between a Lightning web component's JavaScript and its js-meta.xml, the JavaScript type wins in Lightning App Builder.
explanation: The builder uses the type declared in the component's configuration file when the two disagree, not the type implied by the JavaScript.
