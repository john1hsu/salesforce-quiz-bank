id: sf-000358
product_area: platform-architecture
true_statement: A standard index qualifies when a filter matches under 30% of the first million records and under 15% of records beyond that.
false_statement: A standard index qualifies when a filter matches under 50% of the first million records and under 25% of records beyond that.
explanation: The Large Data Volumes guide publishes 30% and 15% as the standard-index thresholds. Custom indexes use the tighter 10% and 5% thresholds; 50% and 25% are not used.
