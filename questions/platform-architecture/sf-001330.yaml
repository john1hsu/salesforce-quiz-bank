id: sf-001330
product_area: platform-architecture
true_statement: When timing a Lightning page by hand, avoid opening it in a new tab or reloading it, because the framework bootstrap then inflates the measurement.
false_statement: When timing a Lightning page by hand, always open it in a new tab or reload it, because that removes the framework bootstrap from the measurement.
explanation: A fresh tab or reload triggers the framework bootstrap counted in first-page-load EPT. Navigating within the session gives the subsequent-load figure that tuning should target.
