id: sf-000148
product_area: platform-architecture
true_statement: An Apex transaction trying to lock a record already locked by another transaction waits up to 10 seconds before an exception is thrown.
false_statement: An Apex transaction trying to lock a record already locked by another transaction waits up to 60 seconds before an exception is thrown.
explanation: The lock wait is capped at 10 seconds, after which a QueryException or DmlException is raised; API clients see this as UNABLE_TO_LOCK_ROW.
