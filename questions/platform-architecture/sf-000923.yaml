id: sf-000923
product_area: platform-architecture
true_statement: In a Hyperforce Operating Zone, MySearch, Chatbot and some Einstein features aren't part of the OZ products, so license parity must be checked before buying.
false_statement: In a Hyperforce Operating Zone, MySearch, Chatbot and all Einstein features are included in the OZ products, so license parity is guaranteed.
explanation: Salesforce vets each feature for data leaving the zone and drops ones that would. MySearch, Chatbot and some Einstein features are excluded from the OZ SKUs.
