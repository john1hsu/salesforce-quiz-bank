product_area: platform-architecture
true_statement: Salesforce Sites allows one site in Developer Edition and up to 25 sites in Enterprise and Performance editions.
false_statement: Salesforce Sites allows five sites in Developer Edition and up to 100 sites in Enterprise and Performance editions.
explanation: Developer Edition gets a single site with no page-view allocation, while Enterprise and Performance allow 25. The false version inflates both allowances.
