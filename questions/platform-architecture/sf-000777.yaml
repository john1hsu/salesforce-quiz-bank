id: sf-000777
product_area: platform-architecture
true_statement: Even with granular locking, role reparenting, such as changing a partner account's owner, blocks almost every other group membership update.
false_statement: With granular locking, role reparenting, such as changing a partner account's owner, runs alongside other group membership updates without blocking them.
explanation: Granular locking helps unrelated changes, but reparenting a role still takes a lock that blocks nearly all other group updates. Such changes are best scheduled apart from other jobs.
