true_statement: Hyperforce is designed to survive the loss of an entire availability zone plus one more component failure in another zone, with a 99.99% availability objective.
false_statement: Hyperforce is designed to survive the loss of an entire region plus one more availability zone failure, with a 99.999% availability objective.
explanation: 'Salesforce calls the goal AZ+1: a whole AZ down plus one further failure elsewhere, at 99.99%. Region-wide failures are covered only by the separately sold Out of Region Disaster Recovery.'
