id: sf-001613
product_area: platform-architecture
true_statement: While an org is read-only during a site switch, Apex callouts keep running but any DML performed after the callout fails.
false_statement: While an org is read-only during a site switch, Apex callouts are blocked but DML performed in the same transaction still succeeds.
explanation: Read-only mode stops writes, not outbound calls. Code can check System.getApplicationReadWriteMode() for READ_ONLY and defer its DML.
