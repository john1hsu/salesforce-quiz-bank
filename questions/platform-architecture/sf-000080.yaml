id: sf-000080
product_area: platform-architecture
true_statement: Record-triggered flows with no trigger order value run after flows numbered 1 to 1,000 and before flows numbered 1,001 to 2,000.
false_statement: Record-triggered flows with no trigger order value run after all flows numbered 1 to 2,000.
explanation: Numbered flows 1 to 1,000 go first, then unnumbered flows by activation date, then 1,001 to 2,000. Unnumbered flows are not pushed to the very end.
