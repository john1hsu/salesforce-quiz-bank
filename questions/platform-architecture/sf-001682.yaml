id: sf-001682
product_area: platform-architecture
true_statement: In the Salesforce mobile app, the default app is the first Lightning app listed in the App Launcher.
false_statement: In the Salesforce mobile app, the default app is always the Sales app, regardless of the App Launcher order.
explanation: The mobile menu mirrors the active Lightning app, and the starting app is whichever Lightning app comes first in the App Launcher. No single app is hard-wired as the default.
