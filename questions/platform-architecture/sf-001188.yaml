product_area: platform-architecture
true_statement: In Salesforce Go, the Feature Sets tab groups features that solve one business problem, while the Features tab is the full filterable inventory.
false_statement: In Salesforce Go, the Features tab groups features that solve one business problem, while the Feature Sets tab is the full filterable inventory.
explanation: Feature Sets are curated collections aimed at a business goal such as keeping deals on track. The Features tab lists everything, filterable by setup status, availability and cloud, so the false statement reverses the tabs.
