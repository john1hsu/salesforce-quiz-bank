id: sf-000492
product_area: platform-architecture
true_statement: Skinny tables leave out soft-deleted records in the Recycle Bin, which can shrink the volume a query scans.
false_statement: Skinny tables keep soft-deleted records from the Recycle Bin alongside live rows, so a query scans the same volume as the base table.
explanation: Excluding soft-deleted rows is one of the reasons skinny tables speed up reads, alongside narrower rows and avoiding the standard/custom field join.
