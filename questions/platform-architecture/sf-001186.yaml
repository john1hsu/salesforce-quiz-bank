id: sf-001186
product_area: platform-architecture
true_statement: In Salesforce Go's license view, a user counts as active for a feature if they opened it in the last 30 days.
false_statement: In Salesforce Go's license view, a user counts as active for a feature if they opened it in the last 90 days.
explanation: Salesforce Go reports licenses available, assigned and active, where active means use within the last 30 days. Because the window is 30 days rather than 90, features used only quarterly can look unadopted.
