id: sf-001541
product_area: platform-architecture
true_statement: A sandbox refreshed during the sandbox preview window moves to a non-preview instance and can lose the early upgrade.
false_statement: A sandbox refreshed during the sandbox preview window moves to a preview instance and keeps the early upgrade.
explanation: Instance placement follows the most recent refresh. Refreshing before the cutoff usually lands a sandbox on preview, but refreshing inside the window sends it to a non-preview instance.
