product_area: platform-architecture
true_statement: In Dynamic Interactions, only Lightning web components can fire source events, while Aura or LWC components can be targets.
false_statement: In Dynamic Interactions, Aura or LWC components can fire source events, while only Lightning web components can be targets.
explanation: Sources must be Lightning web components; targets may be either LWC or Aura. The false statement reverses which side allows Aura.
