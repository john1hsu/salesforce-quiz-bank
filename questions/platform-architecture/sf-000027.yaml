id: sf-000027
product_area: platform-architecture
true_statement: A synchronous Apex transaction can issue up to 100 SOQL queries, while an asynchronous transaction can issue up to 200.
false_statement: A synchronous Apex transaction can issue up to 150 SOQL queries, while an asynchronous transaction can issue up to 300.
explanation: The per-transaction SOQL query cap is 100 in synchronous Apex and doubles to 200 in asynchronous Apex. The figure 150 belongs to the DML statement limit, not SOQL queries.
