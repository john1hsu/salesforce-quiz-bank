id: sf-000420
product_area: platform-architecture
true_statement: In current API versions, each Database.setSavepoint call counts against the DML statement limit but not the DML row limit.
false_statement: In current API versions, each Database.setSavepoint call counts against the DML row limit but not the DML statement limit.
explanation: Savepoints and rollbacks each use one DML statement from the 150-statement allowance; since API 60.0 they no longer consume DML rows. The false statement swaps the two limits.
