id: sf-000076
product_area: platform-architecture
true_statement: In SalesforceDB the tenant ID is part of the primary key, which clusters each tenant's data together in a shared database.
false_statement: In SalesforceDB each tenant gets its own separate physical database, which keeps each tenant's data together.
explanation: One instance runs a single shared database and schema; isolation comes from the tenant ID in the primary key, tenant predicates on queries and per-tenant encryption keys, not separate databases.
