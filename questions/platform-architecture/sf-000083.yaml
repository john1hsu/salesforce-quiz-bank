id: sf-000083
product_area: platform-architecture
true_statement: A sandbox that nobody logs into for 180 days becomes eligible for deletion, and a deleted sandbox cannot be recovered.
false_statement: A sandbox that nobody logs into for 365 days becomes eligible for deletion, and a deleted sandbox cannot be recovered.
explanation: Salesforce flags sandboxes with no logins for 180 days as eligible for deletion, and deletion is permanent. A full year of inactivity is longer than the actual threshold.
