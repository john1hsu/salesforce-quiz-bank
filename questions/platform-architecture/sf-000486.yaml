true_statement: Under the operating-model framework, highly standardized and integrated businesses favour as few Salesforce orgs as possible.
false_statement: Under the operating-model framework, highly diversified businesses with little shared process favour as few Salesforce orgs as possible.
explanation: Standardized, integrated operating models gain most from consolidation. Diversified businesses with little common process are the ones likely to keep several orgs.
