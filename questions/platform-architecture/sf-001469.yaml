id: sf-001469
product_area: platform-architecture
true_statement: A trailing S in an instance name, as in JPN156S, marks a sandbox instance paired with the production instance JPN156.
false_statement: A trailing S in an instance name, as in JPN156S, marks a standby disaster-recovery instance paired with the production instance JPN156.
explanation: Sandboxes live on their own instances whose names add an S to the paired production instance. The suffix has nothing to do with disaster-recovery standbys.
