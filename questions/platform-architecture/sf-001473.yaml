id: sf-001473
product_area: platform-architecture
true_statement: Platform-level permissions are set by Salesforce provisioning and can't be changed by an admin, while platform-level preferences such as time zone can be edited in Setup.
false_statement: Platform-level preferences such as time zone are set by Salesforce provisioning and can't be changed by an admin, while platform-level permissions can be edited in Setup.
explanation: Perms are switched on or off from the purchase by the provisioning system, so admins can't toggle them. Prefs like language or time zone are configurable settings an admin edits; the false statement swaps the two.
