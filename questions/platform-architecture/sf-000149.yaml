id: sf-000149
product_area: platform-architecture
true_statement: Making a callout automatically releases any record locks taken with SOQL FOR UPDATE in that transaction.
false_statement: Making a callout keeps record locks taken with SOQL FOR UPDATE in place until the transaction commits.
explanation: A callout drops FOR UPDATE locks and logs a FOR_UPDATE_LOCKS_RELEASE event, so a lock, callout, update sequence loses its protection. Keep callouts out of the locked window.
