id: sf-000211
product_area: platform-architecture
true_statement: The query optimizer considers a custom index when a filter matches under 10% of records, capped at 333,333 records.
false_statement: The query optimizer considers a custom index when a filter matches under 30% of records, capped at one million records.
explanation: Custom indexes have the stricter 10% threshold with a 333,333-record cap. The 30% figure with a one-million cap is the starting point for standard indexes.
