id: sf-000908
product_area: platform-architecture
true_statement: Even in a Hyperforce Operating Zone, setup metadata such as object names and custom Apex code, plus search queries, is stored in the United States.
false_statement: In a Hyperforce Operating Zone, setup metadata such as object names and custom Apex code, plus search queries, never leaves the zone.
explanation: Salesforce documents administrative data, including object names, URLs, Apex code and search queries (not results), as stored in the US, one of the zone's defined exceptions.
