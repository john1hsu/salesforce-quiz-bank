product_area: platform-architecture
true_statement: In NIST SP 500-292, the IaaS provider controls the host operating system and the hypervisors that expose virtual machines.
false_statement: In NIST SP 500-292, the IaaS consumer controls the host operating system and the hypervisors that expose virtual machines.
explanation: The provider owns the physical resources plus the host OS and hypervisor layer; the consumer is responsible for guest operating systems, middleware and applications on top.
