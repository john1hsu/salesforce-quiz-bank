id: sf-000077
product_area: platform-architecture
true_statement: Salesforce's query optimizer keeps tenant-, group- and user-level statistics and runs pre-queries to measure selectivity before choosing a plan.
false_statement: Salesforce's query optimizer keeps only table-level statistics shared by all tenants and picks a plan without measuring selectivity first.
explanation: Conventional statistics ignore what each user can see, so the platform tracks statistics per tenant, group and user and checks selectivity with pre-queries before planning.
