id: sf-000359
product_area: platform-architecture
true_statement: For AND filters, the query optimizer still uses their indexes unless one condition returns more than 20% of the object's records.
false_statement: For AND filters, the query optimizer still uses their indexes unless one condition returns more than 50% of the object's records.
explanation: 'Compound AND conditions keep their indexes up to a 20% threshold per condition. OR conditions are different: every field must be indexed, with a 10% threshold.'
