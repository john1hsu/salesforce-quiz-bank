id: sf-001255
product_area: platform-architecture
true_statement: An Apex cursor can hold at most 50 million rows, and a transaction can make at most 100 fetch() calls across its cursors.
false_statement: An Apex cursor can hold at most 5 million rows, and a transaction can make at most 100 fetch() calls across its cursors.
explanation: The documented ceiling is 50 million rows per cursor, sync or async, with 100 fetch calls per transaction. Five million understates the cursor size by a factor of ten.
