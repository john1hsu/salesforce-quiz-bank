id: sf-000771
product_area: platform-architecture
true_statement: Salesforce's automation decision guide matches 1 to 200 records to record-triggered Flow and bulk loads of 2,000 to 10,000 or more to an Apex trigger framework.
false_statement: Salesforce's automation decision guide matches 1 to 200 records to an Apex trigger framework and bulk loads of 2,000 to 10,000 or more to record-triggered Flow.
explanation: Low-density automation suits Flow, while high-volume bulk API loads push toward a coded trigger framework. The false version swaps the two recommendations.
