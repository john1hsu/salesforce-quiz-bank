true_statement: On Hyperforce, a supercell groups several cells that share services, marking out a larger blast radius for those shared components.
false_statement: On Hyperforce, a supercell splits one cell into several smaller units, shrinking the blast radius of each unit's components.
explanation: 'Supercells sit above cells: they bundle multiple cells around shared services, so a failure in those services can reach every cell in the group. They don''t subdivide a cell.'
