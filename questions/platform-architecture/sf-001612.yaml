product_area: platform-architecture
true_statement: Without an Event Monitoring license, API Total Usage event log files are available as daily files covering the last 24 hours.
false_statement: Without an Event Monitoring license, API Total Usage event log files are available as hourly files kept for 30 days.
explanation: API Total Usage logs are free, but unlicensed orgs get only daily files for the last 24 hours. Hourly and daily files kept for 30 days require an Event Monitoring license.
