id: sf-001329
product_area: platform-architecture
true_statement: For Lightning Experience, Salesforce recommends network latency of 150 ms or lower and a download speed of at least 3 Mbps.
false_statement: For Lightning Experience, Salesforce recommends network latency of 500 ms or lower and a download speed of at least 1 Mbps.
explanation: Lightning pages need many round trips, so Salesforce asks for 150 ms or less and 3 Mbps or more, checked on the org's Speedtest page. The looser figures are not its guidance.
