id: sf-001539
product_area: platform-architecture
true_statement: Salesforce strongly recommends against deploying changes from a sandbox on the preview release to an environment still on the current release.
false_statement: Salesforce recommends deploying changes from a sandbox on the preview release to an environment still on the current release to test compatibility.
explanation: Moving metadata from a newer version into an older one risks incompatibilities, so Salesforce advises keeping preview and non-preview environments separate during the preview window.
