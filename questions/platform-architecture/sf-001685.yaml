id: sf-001685
product_area: platform-architecture
true_statement: Salesforce can disable an org's Sites if page views exceed 110% of the allocation for four straight months or reach 300% in a single month.
false_statement: Salesforce can disable an org's Sites if page views exceed 100% of the allocation for one month or reach 150% in a single day.
explanation: Sites are disabled, after notice to admins, only for sustained overuse past 110% over four months or a spike to 300% in one month. The false version sets much tighter thresholds.
