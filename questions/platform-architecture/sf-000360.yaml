true_statement: SystemModstamp is indexed by default but LastModifiedDate is not, so filtering on SystemModstamp is the selective choice.
false_statement: LastModifiedDate is indexed by default but SystemModstamp is not, so filtering on LastModifiedDate is the selective choice.
explanation: SystemModstamp is among the default indexed fields, while LastModifiedDate is unindexed, which is why Trailhead recommends SystemModstamp for date-based filters.
