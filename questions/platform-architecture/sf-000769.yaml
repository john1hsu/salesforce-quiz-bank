id: sf-000769
product_area: platform-architecture
true_statement: Inside an Apex trigger, a SOQL for loop adds no batching benefit, because triggers already receive their records in batches.
false_statement: Inside an Apex trigger, a SOQL for loop is needed to split Trigger.new into batches, because triggers receive all records at once.
explanation: Trailhead points out that triggers are already batched by the platform, so the SOQL for loop's memory batching gains nothing there. It still helps for large result sets elsewhere.
