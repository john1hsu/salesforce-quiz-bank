id: sf-000712
product_area: platform-architecture
true_statement: Marking a field as an External ID indexes it automatically, but only Auto Number, Email, Number and Text fields can be External IDs.
false_statement: Marking a field as an External ID indexes it automatically, but only Text, Picklist, Date and Currency fields can be External IDs.
explanation: External ID is the self-service route to an index, and it is limited to Auto Number, Email, Number and Text fields. Picklist, Date and Currency fields can't be flagged this way.
