id: sf-000713
product_area: platform-architecture
true_statement: Custom indexes can't be built on long text area, rich text area or encrypted text fields, or on non-deterministic formula fields.
false_statement: Custom indexes can be built on long text area and rich text area fields, but not on any formula field.
explanation: Long and rich text areas, encrypted text and non-deterministic formulas are the excluded field types. Deterministic formulas can be indexed, so ruling out every formula is wrong too.
