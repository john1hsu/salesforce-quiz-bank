id: sf-001540
product_area: platform-architecture
true_statement: Salesforce's three yearly seasonal upgrades are applied automatically to every customer and need only about five minutes of scheduled maintenance.
false_statement: Salesforce's three yearly seasonal upgrades are applied when each customer opts in and need about five hours of scheduled maintenance.
explanation: Every org is upgraded automatically, keeping all customers on one version, and the upgrade takes roughly five minutes of maintenance. Customers cannot opt out, and the window is not hours long.
