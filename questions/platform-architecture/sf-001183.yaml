id: sf-001183
product_area: platform-architecture
true_statement: A custom domain on the Salesforce CDN can serve only subdomains such as www.example.com, so a registrable domain like example.com needs a third-party CDN.
false_statement: A custom domain on the Salesforce CDN can serve only registrable domains such as example.com, so a subdomain like www.example.com needs a third-party CDN.
explanation: The Salesforce CDN option for custom domains supports subdomains only. A third-party CDN in front of the domain is the only CDN route for registrable (apex) domains, so the false statement swaps which domain type each option handles.
