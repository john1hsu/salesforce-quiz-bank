id: sf-001257
product_area: platform-architecture
true_statement: An Apex pagination cursor skips deleted rows so each page stays full, unlike a standard cursor whose record set is fixed at creation.
false_statement: An Apex standard cursor skips deleted rows so each batch stays full, unlike a pagination cursor whose record set is fixed at creation.
explanation: Pagination cursors, built for UI paging with fetchPage, leave out deleted rows to keep pages full. Standard cursors lock in their record IDs when created, like a QueryLocator.
