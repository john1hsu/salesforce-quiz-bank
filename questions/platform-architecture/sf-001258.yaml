id: sf-001258
product_area: platform-architecture
true_statement: An instance refresh is maintenance that changes the hostname of every org on an instance, while an org migration moves a single org to a different instance.
false_statement: An org migration is maintenance that changes the hostname of every org on an instance, while an instance refresh moves a single org to a different instance.
explanation: A refresh acts on a whole instance and its orgs, putting them read-only while it runs. A migration is about one org changing instance, for example moving to Hyperforce.
