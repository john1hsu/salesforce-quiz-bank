id: sf-000914
product_area: platform-architecture
true_statement: Under NIST's SaaS definition, the consumer doesn't control servers, storage or application capabilities, except possibly limited user-specific application settings.
false_statement: Under NIST's SaaS definition, the consumer doesn't control servers or storage but does control the application's capabilities and its runtime.
explanation: NIST leaves the SaaS consumer only limited, user-specific configuration. Controlling the application and its runtime is closer to PaaS, where consumers deploy their own apps.
