true_statement: In NIST's deployment models, a community cloud serves a group of organizations with shared concerns such as mission or compliance.
false_statement: In NIST's deployment models, a hybrid cloud serves a group of organizations with shared concerns such as mission or compliance.
explanation: A community cloud is the shared-concern model. A hybrid cloud binds two or more deployment models together so data and applications can move between them.
