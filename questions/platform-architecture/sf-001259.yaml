id: sf-001259
product_area: platform-architecture
true_statement: Instance-wide Trust Notifications for scheduled maintenance go out about ten days before it starts, while maintenance needing customer action is emailed to admins months ahead.
false_statement: Instance-wide Trust Notifications for scheduled maintenance go out about ten weeks before it starts, while maintenance needing customer action is emailed to admins days ahead.
explanation: Salesforce aims for months of email notice when admins must change settings or references, and about ten days for instance-wide Trust Notifications. The swapped timings reverse that order.
