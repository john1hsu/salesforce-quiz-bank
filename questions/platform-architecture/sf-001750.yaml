id: sf-001750
product_area: platform-architecture
true_statement: If a user can't access the field that a Dynamic Actions visibility filter checks, that criterion evaluates to true and the action can still appear.
false_statement: If a user can't access the field that a Dynamic Actions visibility filter checks, that criterion evaluates to false and the action is hidden.
explanation: An unreadable filter field counts as a match, so the action shows. That is why visibility rules on hidden fields aren't a reliable way to keep an action from someone.
