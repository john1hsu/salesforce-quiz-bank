id: sf-000640
product_area: platform-architecture
true_statement: A single item stored in Platform Cache can be at most 100 KB, for both org and session cache.
false_statement: A single item stored in Platform Cache can be at most 1 MB, for both org and session cache.
explanation: Items over 100 KB throw Cache.ItemSizeLimitExceededException. 1 MB is the minimum partition size, not the item limit.
