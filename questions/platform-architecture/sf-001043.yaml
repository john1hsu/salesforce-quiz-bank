id: sf-001043
product_area: platform-architecture
true_statement: A sandbox refresh adds the source instance's Trust Notification subscribers automatically, but after an org migration you must update your subscription yourself.
false_statement: An org migration moves your Trust Notification subscription automatically, but after a sandbox refresh you must update the subscription yourself.
explanation: Refreshes copy subscribers to the destination instance, while org migrations leave the old subscription in place. The false version reverses which event is handled for you.
