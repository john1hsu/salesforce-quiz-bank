true_statement: A sandbox template is required when creating a Partial Copy sandbox and optional when creating a Full sandbox.
false_statement: A sandbox template is required when creating a Full sandbox and optional when creating a Partial Copy sandbox.
explanation: Partial Copy sandboxes need a template to choose the sample data, while a Full sandbox copies all data and can take a template only optionally. The false version reverses them.
