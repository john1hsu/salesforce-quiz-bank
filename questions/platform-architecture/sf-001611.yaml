id: sf-001611
product_area: platform-architecture
true_statement: A REST API call to a retired API version returns HTTP 410 GONE, while a SOAP API call returns 500 UNSUPPORTED_API_VERSION.
false_statement: A REST API call to a retired API version silently falls back to the oldest supported version instead of returning an error.
explanation: 'Retired versions are refused outright with version-specific errors: 410 GONE for REST, 500 UNSUPPORTED_API_VERSION for SOAP and 400 InvalidVersion for Bulk API. There is no fallback.'
