true_statement: A workflow field update fires before-update and after-update triggers once more, but custom validation rules do not run again.
false_statement: A workflow field update runs custom validation rules once more, but before-update and after-update triggers do not fire again.
explanation: The extra save caused by a workflow field update re-fires update triggers, even for an original insert, while custom validation, flows and duplicate rules are skipped on that pass.
