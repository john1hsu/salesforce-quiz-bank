true_statement: Salesforce's org strategy guidance says apparent platform limit problems should be raised with the account team before they drive an org split.
false_statement: Salesforce's org strategy guidance says apparent platform limit problems are the clearest signal that a single org should be split into several.
explanation: The guidance cautions against splitting orgs reactively over limits; such issues go to the account team first. Org splits should follow the business, technology, governance and operations factors.
