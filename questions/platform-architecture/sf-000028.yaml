id: sf-000028
product_area: platform-architecture
true_statement: A screen flow starts a new transaction each time the user clicks Next, so each screen's work gets its own set of governor limits.
false_statement: A screen flow runs as one transaction from its first screen to its last, so the work on every screen shares one set of governor limits.
explanation: Each Next click in a screen flow begins a fresh transaction with fresh limits. It is an autolaunched flow, not a screen flow, that runs inside the launching transaction and shares its limits.
