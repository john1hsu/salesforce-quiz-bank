id: sf-001184
product_area: platform-architecture
true_statement: The Lightning CDN, which serves static Lightning Component framework JavaScript and CSS, is turned on with a checkbox in Session Settings.
false_statement: The Lightning CDN, which serves static Lightning Component framework JavaScript and CSS, is turned on with a checkbox in My Domain settings.
explanation: Admins enable the Lightning CDN through the 'Enable Content Delivery Network (CDN) for Lightning Component framework' option in Session Settings. My Domain settings is where other routing choices live, not this checkbox.
