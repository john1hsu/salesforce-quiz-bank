id: sf-001397
product_area: platform-architecture
true_statement: Code Analyzer's ApexGuru engine runs in Advanced Mode when ApexGuru is enabled in the org or its parent org family, and the mode can't be chosen manually.
false_statement: Code Analyzer's ApexGuru engine runs in Advanced Mode only when the developer passes a flag requesting it, whatever the org's ApexGuru setting.
explanation: The engine picks Advanced Mode, using runtime data, automatically when ApexGuru is on for the org or its parent family, and otherwise falls back to Basic Mode static analysis. There's no manual mode switch.
