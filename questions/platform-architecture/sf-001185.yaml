id: sf-001185
product_area: platform-architecture
true_statement: On an LWR site, an Apex method's result is cached on the CDN only if it is annotated @AuraEnabled(cacheable=true scope='global').
false_statement: On an LWR site, an Apex method's result is cached on the CDN whenever it is annotated @AuraEnabled(cacheable=true), with no scope setting needed.
explanation: LWR sites can cache public Apex results at the CDN, but only for methods marked cacheable with global scope. Plain cacheable=true is not enough, and globally scoped methods should return only public data because the CDN is a shared cache.
