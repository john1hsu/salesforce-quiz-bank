true_statement: During a recursive save, assignment rules and after-save record-triggered flows are skipped, but before triggers and validation rules run again.
false_statement: During a recursive save, before triggers and validation rules are skipped, but assignment rules and after-save record-triggered flows run again.
explanation: A recursive pass skips the middle steps of the save order, including assignment rules and after-save flows, while early steps such as before triggers and validation repeat. The false version swaps which steps are skipped.
