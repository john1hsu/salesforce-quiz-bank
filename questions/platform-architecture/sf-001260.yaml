id: sf-001260
product_area: platform-architecture
true_statement: Heroku Connect authorized against an org without My Domain must be re-authorized after an instance refresh, whereas a My Domain hostname avoids that step.
false_statement: Heroku Connect authorized against an org with My Domain must be re-authorized after an instance refresh, whereas an instance hostname avoids that step.
explanation: Heroku Connect ties its authorization to the org's hostname. A stable My Domain hostname survives the refresh, while an instance hostname changes and breaks the authorization.
