id: sf-001400
product_area: platform-architecture
true_statement: In Gilbert and Lynch's CAP proof, consistency means atomic, linearizable operations, which is narrower than the C in ACID transactions.
false_statement: In Gilbert and Lynch's CAP proof, consistency means the same thing as the C in ACID transactions, that each transaction preserves database invariants.
explanation: Gilbert and Lynch define consistency as a single total order where each operation appears to take effect instantly, and they explicitly say this differs from ACID's consistency. Equating the two is a common confusion.
