id: sf-000029
product_area: platform-architecture
true_statement: Certified managed packages get their own allocation for most per-transaction limits, but CPU time is shared across the whole transaction.
false_statement: Certified managed packages get their own allocation for most per-transaction limits, but SOQL queries are shared across the whole transaction.
explanation: Security-reviewed managed packages receive separate per-namespace counts for limits such as SOQL queries, up to a cumulative 11x cap. Heap, CPU time, execution time and namespace count remain shared by everything in the transaction.
