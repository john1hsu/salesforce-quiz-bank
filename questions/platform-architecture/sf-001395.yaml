id: sf-001395
product_area: platform-architecture
true_statement: ApexGuru labels a method critically expensive when it uses at least 5% of CPU time, and expensive when it uses 2 to 5%.
false_statement: ApexGuru labels a method critically expensive when it uses at least 20% of CPU time, and expensive when it uses 10 to 20%.
explanation: ApexGuru's expensive-methods report flags methods at 5% or more of CPU time as critically expensive and those at 2 to 5% as expensive. The higher bands in the false version aren't its thresholds.
