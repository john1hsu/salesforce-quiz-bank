id: sf-000419
product_area: platform-architecture
true_statement: The allOrNone parameter on Database.insert defaults to true, so one failing record makes the whole call throw an exception.
false_statement: The allOrNone parameter on Database.insert defaults to false, so valid records save and failures come back as SaveResult errors.
explanation: By default Database methods behave like plain DML and abort on the first failing record. Partial success with SaveResult errors happens only when allOrNone is explicitly set to false.
