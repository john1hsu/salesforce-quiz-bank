id: sf-000213
product_area: platform-architecture
true_statement: To delete a million or more records, Salesforce's LDV guide recommends the hard-delete option of Bulk API or Bulk API 2.0.
false_statement: To delete a million or more records, Salesforce's LDV guide recommends a normal delete and letting the Recycle Bin empty itself.
explanation: Soft-deleted rows stay in the Recycle Bin and still weigh on performance. Hard delete skips that, and children should be deleted before parents.
