id: sf-001681
product_area: platform-architecture
true_statement: Every record shown on a user's offline Landing Page in the Salesforce mobile app must also be included in that user's briefcase.
false_statement: Records shown on a user's offline Landing Page in the Salesforce mobile app are primed automatically, so they don't need to be in the user's briefcase.
explanation: The offline Landing Page relies on the briefcase for record details, so its records must be primed through Briefcase Builder. Nothing is primed automatically outside the briefcase.
