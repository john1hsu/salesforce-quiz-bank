id: sf-001795
product_area: data-model
true_statement: A Currency field with zero decimal places truncates entered values, so 23.5 is stored as 23.
false_statement: A Currency field with zero decimal places rounds half away from zero, so 23.5 is stored as 24.
explanation: Currency fields with at least one decimal place round half away from zero, but with zero decimal places they truncate instead. That is why 23.5 becomes 23.
