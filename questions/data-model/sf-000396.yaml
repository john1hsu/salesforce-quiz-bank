id: sf-000396
product_area: data-model
true_statement: With no custom retention policy, Field Audit Trail archives field history after 18 months in production and after one month in sandboxes.
false_statement: With no custom retention policy, Field Audit Trail archives field history after 24 months in production and after six months in sandboxes.
explanation: The default HistoryRetentionPolicy moves history into FieldHistoryArchive after 18 months in production and one month in sandboxes; a custom policy is deployed through Metadata API.
