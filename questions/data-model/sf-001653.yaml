id: sf-001653
product_area: data-model
true_statement: A rich text area field holds up to 131,072 characters, and that limit counts HTML tags and formatting as well as visible text.
false_statement: A rich text area field holds up to 131,072 characters, and that limit counts only visible text, not the HTML tags or formatting.
explanation: Rich text is stored as HTML, so every tag and formatting character uses the budget and heavily styled content fills the field sooner. The false version exempts the markup.
