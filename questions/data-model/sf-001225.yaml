id: sf-001225
product_area: data-model
true_statement: Each object can have at most five active required lookup filters.
false_statement: Each object can have at most twenty-five active required lookup filters.
explanation: Salesforce limits each object to five active required lookup filters, and every unique related-object reference in a required filter counts against the target object's limit. Twenty-five overstates it; only optional filters in Classic are unlimited.
