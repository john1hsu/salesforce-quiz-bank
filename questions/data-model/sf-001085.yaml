id: sf-001085
product_area: data-model
true_statement: If two records in the same SOAP upsert call share an external ID value, both are marked as errors and neither is saved.
false_statement: If two records in the same SOAP upsert call share an external ID value, the first is inserted and the second updates it.
explanation: SOAP upsert rejects every record in the call that repeats an external ID value, so neither duplicate is written. It does not process them in order as an insert followed by an update.
