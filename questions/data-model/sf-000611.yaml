id: sf-000611
product_area: data-model
true_statement: Datacloud.FindDuplicates.findDuplicates() accepts at most 50 unsaved records per call, all of the same object type.
false_statement: Datacloud.FindDuplicates.findDuplicates() accepts at most 200 unsaved records per call, all of the same object type.
explanation: The Apex method checks records against active duplicate rules in batches of up to 50 records of one object. 200 overstates the batch size.
