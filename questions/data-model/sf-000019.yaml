id: sf-000019
product_area: data-model
true_statement: Roll-up summary fields can be created only on the master side of a master-detail relationship.
false_statement: Roll-up summary fields can be created on the parent side of either a lookup or a master-detail relationship.
explanation: Declarative COUNT, SUM, MIN and MAX roll-ups are a feature of master-detail parents only. A lookup parent cannot host a roll-up summary field, which is one reason to pick master-detail.
