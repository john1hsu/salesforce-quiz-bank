id: sf-001723
product_area: data-model
true_statement: In SOQL, INCLUDES ('AAA;BBB','CCC') matches records with both AAA and BBB selected, or with CCC selected.
false_statement: In SOQL, INCLUDES ('AAA;BBB','CCC') matches records with AAA or BBB selected, and also with CCC selected.
explanation: A semicolon inside one quoted string means all those values must be selected, while separate comma-separated strings are alternatives. The false statement treats the semicolon as OR.
