true_statement: Trailhead's data management material places identity resolution under data validation, as the step that matches and reconciles duplicate records.
false_statement: Trailhead's data management material places identity resolution under data retention, as the step that decides how long duplicate records are kept.
explanation: In the delivery stage, validation includes identity resolution, which finds and merges duplicates. Retention belongs to maintenance and sets how long data is kept.
