id: sf-000607
product_area: data-model
true_statement: A custom address field uses nine custom fields from an object's allocation, while a geolocation field uses three.
false_statement: A custom address field uses three custom fields from an object's allocation, while a geolocation field uses nine.
explanation: 'Compound fields count more than once against the per-object limit: geolocation counts as three and a custom address as nine. The false statement swaps the two figures.'
