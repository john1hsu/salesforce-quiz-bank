id: sf-000047
product_area: data-model
true_statement: After a detail record saves, its parent's roll-up is recalculated and the parent saves, which can cascade to a grandparent's roll-up.
false_statement: After a detail record saves, its parent's roll-up is recalculated by a nightly batch job, so a grandparent's roll-up updates the next day.
explanation: 'Roll-up recalculation is a step in the save order of execution: the parent is recalculated and saved right away, and a change there can trigger the grandparent''s roll-up in turn. There is no nightly batch for native roll-ups.'
