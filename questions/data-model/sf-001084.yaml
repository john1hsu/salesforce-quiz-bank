product_area: data-model
true_statement: Salesforce recommends Data Loader for CSV files of up to 150,000,000 records and points larger loads to a partner or AppExchange product.
false_statement: Salesforce recommends Data Loader for CSV files of up to 5,000,000 records and points larger loads to a partner or AppExchange product.
explanation: Data Loader's documented ceiling is 150 million records per file. Five million is far below that guidance.
