id: sf-000878
product_area: data-model
true_statement: On a ContentDocumentLink, ShareType C grants Collaborator access, letting the user edit the file as well as view it.
false_statement: On a ContentDocumentLink, ShareType C grants Inferred access, taken from the linked record or library permission.
explanation: ShareType values are V for Viewer, C for Collaborator (view plus edit) and I for Inferred. The false statement assigns the meaning of I to C.
