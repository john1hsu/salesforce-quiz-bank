id: sf-001087
product_area: data-model
true_statement: An Apex upsert that names no match field matches on record ID, inserting rows with a null ID and updating rows that have one.
false_statement: An Apex upsert that names no match field matches on the Name field, inserting rows with a new name and updating rows whose name exists.
explanation: Without a named field, Apex upsert uses the Salesforce record ID as the key. Name is never used as an implicit match field.
