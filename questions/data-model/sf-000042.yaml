id: sf-000042
product_area: data-model
true_statement: Salesforce treats it as ownership skew when a single user owns more than 10,000 records of one object.
false_statement: Salesforce treats it as ownership skew when a single user owns more than 100,000 records of one object.
explanation: The ownership skew threshold Salesforce gives is 10,000 records of a single object owned by one user, the same figure used for parent-child skew. 100,000 overstates it tenfold.
