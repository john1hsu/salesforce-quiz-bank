id: sf-000123
product_area: data-model
true_statement: On a junction object, the first master-detail field created becomes the primary relationship and supplies the junction's owner, page colour and icon.
false_statement: On a junction object, the second master-detail field created becomes the primary relationship and supplies the junction's owner, page colour and icon.
explanation: 'Creation order decides primacy: the first master-detail field is primary, and junction records take their owner and look from that primary master; the second field is secondary.'
