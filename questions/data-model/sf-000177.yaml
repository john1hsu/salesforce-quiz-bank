id: sf-000177
product_area: data-model
true_statement: In Lightning lead conversion, a lead with a blank Company becomes a person account, and one with a Company becomes a business account.
false_statement: In Lightning lead conversion, a lead with a filled-in Company becomes a person account, and one with a blank Company becomes a business account.
explanation: 'The Company field decides the account type on conversion: blank means an individual, so a person account is created. That''s why separate lead record types and layouts are advised.'
