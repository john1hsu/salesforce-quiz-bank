id: sf-001797
product_area: data-model
true_statement: Of the numeric field types, only Number can be an External ID field; Currency and Percent fields aren't eligible.
false_statement: Number, Currency and Percent fields can all be marked as External ID fields for upserts.
explanation: External IDs are limited to auto-number, email, number and text fields. Currency and Percent can't be used, so a numeric key for upserts must be a Number field.
