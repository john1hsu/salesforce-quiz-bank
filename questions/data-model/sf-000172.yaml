id: sf-000172
product_area: data-model
true_statement: A single SOQL query can include at most 55 child-to-parent relationships and at most 20 parent-to-child relationships.
false_statement: A single SOQL query can include at most 20 child-to-parent relationships and at most 55 parent-to-child relationships.
explanation: The ceiling is 55 for child-to-parent traversals and 20 for parent-to-child subqueries. Each type in a TYPEOF clause counts toward the limit, but reusing a relationship counts once.
