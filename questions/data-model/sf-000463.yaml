id: sf-000463
product_area: data-model
true_statement: A standard object can't be the detail side of a master-detail relationship whose master is a custom object, so a lookup must be used instead.
false_statement: A standard object can be the detail side of a master-detail relationship whose master is a custom object, as long as the object has no record types.
explanation: Standard objects such as Account or Case can't be master-detail children of a custom parent, whatever their configuration. A lookup relationship is the workaround.
