true_statement: In Lightning Experience, the highlights panel on a record page takes its fields from the object's compact layout.
false_statement: In Lightning Experience, the highlights panel on a record page takes its fields from the object's page layout.
explanation: The compact layout supplies the highlights panel fields. The page layout still provides the related lists, buttons, links and quick actions rendered on the Lightning page.
