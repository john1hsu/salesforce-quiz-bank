id: sf-000955
product_area: data-model
true_statement: Indirect contacts don't appear in reports built on the standard Accounts and Contacts report type.
false_statement: Indirect contacts appear alongside direct contacts in reports built on the standard Accounts and Contacts report type.
explanation: The standard Accounts and Contacts report type follows only the primary account link, so indirect relationships need other reporting, such as a report type on the relationship object.
