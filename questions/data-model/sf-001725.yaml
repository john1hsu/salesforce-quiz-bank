id: sf-001725
product_area: data-model
true_statement: An import or API update to a multi-select picklist must include every value the record should keep, because the new string replaces the old one.
false_statement: An import or API update to a multi-select picklist only needs the values to add, because new values are appended to the existing selection.
explanation: The field stores one semicolon-delimited string, so an update overwrites the whole selection. Sending only new values drops the ones that were already selected.
