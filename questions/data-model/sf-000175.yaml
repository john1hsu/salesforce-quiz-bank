id: sf-000175
product_area: data-model
true_statement: Enabling person accounts requires the organization-wide default for contacts to be Controlled by Parent.
false_statement: Enabling person accounts requires the organization-wide default for contacts to be Private.
explanation: Contacts must inherit access from their account before person accounts can be turned on. The other prerequisites are a business account record type and Read on contacts wherever profiles can read accounts.
