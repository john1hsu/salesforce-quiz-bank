id: sf-001513
product_area: data-model
true_statement: After a name field changed from Auto Number to Text, Heroku Connect saved record IDs as names until the mapping's field metadata was refreshed.
false_statement: After a name field changed from Auto Number to Text, Heroku Connect saved record IDs as names until the org's search index was rebuilt.
explanation: Heroku Connect caches the name field's type in its mapping, so after the type change it kept writing IDs as names until that mapping's field metadata was refreshed. A search index rebuild has nothing to do with the cached mapping.
