id: sf-000174
product_area: data-model
true_statement: Custom objects on the detail side of a master-detail relationship can't use sharing rules, manual sharing or queues.
false_statement: Custom objects on the detail side of a master-detail relationship can use sharing rules and queues, but not manual sharing.
explanation: Detail records inherit access from their master and have no owner of their own, so sharing rules, manual sharing and queues are all unavailable to them.
