id: sf-001159
product_area: data-model
true_statement: A global value set can hold at most 1,000 values, and inactive values count toward that limit.
false_statement: A global value set can hold at most 1,000 active values, and inactive values don't count toward that limit.
explanation: The 1,000-value cap on a GlobalValueSet includes inactive values, so retired values still use up capacity.
