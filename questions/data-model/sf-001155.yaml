true_statement: Salesforce's LDV guide aims divisions at orgs with more than one million records in a single object and more than 35 licenses.
false_statement: Salesforce's LDV guide aims divisions at orgs with more than ten million records in a single object and more than 500 licenses.
explanation: The large data volumes guide sets the divisions threshold at over one million records in one object plus over 35 licenses. The false figures are far higher than documented.
