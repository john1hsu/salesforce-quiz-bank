true_statement: Trailhead describes data governance as setting quality policies and accountability, and data stewardship as monitoring and coordinating fixes against them.
false_statement: Trailhead describes data stewardship as setting quality policies and accountability, and data governance as monitoring and coordinating fixes against them.
explanation: Governance defines the standards and who is accountable; stewardship carries them out by monitoring, investigating and fixing. The false version swaps the two roles.
