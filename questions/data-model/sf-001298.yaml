id: sf-001298
product_area: data-model
true_statement: When a SOQL DISTANCE call mixes a geolocation field with GEOLOCATION(), the field must be the first argument, or the query fails as malformed.
false_statement: When a SOQL DISTANCE call mixes a geolocation field with GEOLOCATION(), the GEOLOCATION() literal must be the first argument, or the query fails as malformed.
explanation: The field goes first and the literal point second. Reversing that order makes the query malformed.
