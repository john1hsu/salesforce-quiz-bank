id: sf-001722
product_area: data-model
true_statement: A destructive field type conversion publishes a single change event whose recordIds header is the object's key prefix plus an asterisk.
false_statement: A destructive field type conversion publishes one change event per affected record, each listing that record's ID in recordIds.
explanation: When a conversion nulls the field everywhere, Change Data Capture sends one event with a wildcard such as 001* instead of an event per record. Subscribers must treat it as affecting all records of the object.
