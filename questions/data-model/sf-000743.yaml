product_area: data-model
true_statement: During a save, custom validation rules run after before-save Apex triggers and before duplicate rules are evaluated.
false_statement: During a save, custom validation rules run before before-save Apex triggers and after duplicate rules are evaluated.
explanation: Validation sees the values that before-save automation set, and duplicate rules come afterwards. The false version reverses both neighbours in the order of execution.
