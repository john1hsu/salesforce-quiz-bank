id: sf-001720
product_area: data-model
true_statement: Converting a Text field to a Picklist fails if the field holds more than 4,000 unique values.
false_statement: Converting a Text field to a Picklist fails if the field holds more than 400 unique values.
explanation: The cap on distinct values for a Text-to-Picklist conversion is 4,000, counted case-insensitively and including soft-deleted values still in the Recycle Bin. 400 is far too low.
