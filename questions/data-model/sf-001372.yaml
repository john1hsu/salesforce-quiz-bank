id: sf-001372
product_area: data-model
true_statement: Fields in a field set's Available for the Field Set container belong to the set but stay hidden until an admin moves them into In the Field Set.
false_statement: Fields in a field set's Available for the Field Set container are shown by default, while fields in In the Field Set stay hidden until needed.
explanation: In the Field Set holds the fields displayed by default, in order; Available for the Field Set holds members that are hidden until moved across. The false version reverses the two containers.
