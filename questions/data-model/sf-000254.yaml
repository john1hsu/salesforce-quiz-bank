true_statement: To give record types different Opportunity Stage values, you assign each record type a different sales process.
false_statement: To give record types different Opportunity Stage values, you trim the Stage picklist directly on each record type.
explanation: 'Opportunity Stage, Case and Solution Status and Lead Status are reserved: their values come from a business process, not record type picklist trimming. So you vary them by assigning a different process to each record type.'
