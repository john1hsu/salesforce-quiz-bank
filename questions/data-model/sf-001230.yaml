id: sf-001230
product_area: data-model
true_statement: In a multicurrency org, a currency amount's decimal places come from that currency's setup, not from the custom currency field's own setting.
false_statement: In a multicurrency org, a currency amount's decimal places come from the custom currency field's own setting, not from that currency's setup.
explanation: Once multiple currencies are on, decimals are set per currency in Manage Currencies and the field-level decimal setting is ignored. The false statement reverses which setting wins.
