id: sf-001442
product_area: data-model
true_statement: On a custom object, Bulk API, sharing and Streaming API access are enabled as a set, so turning on one requires the other two.
false_statement: On a custom object, Bulk API, reports and activities are enabled as a set, so turning on one requires the other two.
explanation: The object definition ties Bulk API, sharing and Streaming API together as one group of switches. Reports and activities are separate settings that can be toggled on their own.
