id: sf-000741
product_area: data-model
true_statement: Apex tests call Test.getStandardPricebookId() to get the standard price book's ID before inserting standard-price entries.
false_statement: Apex tests must set SeeAllData=true to query the standard price book's ID before inserting standard-price entries.
explanation: Tests don't see org data by default, and Test.getStandardPricebookId() returns the standard book's ID without opening that access. SeeAllData isn't needed for it.
