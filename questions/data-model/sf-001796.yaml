id: sf-001796
product_area: data-model
true_statement: In the API, a numeric field's precision is its total number of digits and its scale is the digits after the decimal point.
false_statement: In the API, a numeric field's precision is the digits before the decimal point and its scale is the digits after it.
explanation: In the API, precision counts every digit, so the digits to the left equal precision minus scale; 256.99 has precision 5 and scale 2. The setup UI's Length means only the left-hand digits, which causes confusion.
