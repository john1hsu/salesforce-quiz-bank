id: sf-001585
product_area: data-model
true_statement: Trailhead treats a field that suddenly stops being populated as a data drift signal that can point to a broken integration or a changed process.
false_statement: Trailhead treats a field that suddenly stops being populated as normal record ageing that needs no investigation by data stewards.
explanation: Data drift is the gradual change that erodes quality, and automated checks flag signals like a field going quiet so stewards can trace the integration or process behind it.
