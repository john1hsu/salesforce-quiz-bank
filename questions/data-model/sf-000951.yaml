id: sf-000951
product_area: data-model
true_statement: Salesforce archives activities in the background once they are 365 days old, and a standard query() excludes archived rows while queryAll() returns them.
false_statement: Salesforce archives activities in the background once they are 90 days old, and both query() and queryAll() return archived rows.
explanation: Events and closed tasks are archived after a year. Ordinary queries skip archived activities, so queryAll() or an IsArchived filter is needed to reach them.
