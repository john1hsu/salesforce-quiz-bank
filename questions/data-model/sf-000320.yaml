id: sf-000320
product_area: data-model
true_statement: Inserting a big object record whose index values already exist overwrites the existing record instead of creating a duplicate.
false_statement: Inserting a big object record whose index values already exist fails with a duplicate error instead of overwriting the record.
explanation: 'Big object writes are idempotent on the index: a matching index overwrites the stored record. That is why a failed load can simply be retried.'
