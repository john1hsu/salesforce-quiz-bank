id: sf-000823
product_area: data-model
true_statement: A custom field created in Schema Builder is visible and editable for most internal profiles by default.
false_statement: A custom field created in Schema Builder is visible only to the System Administrator profile by default.
explanation: New fields default to visible and editable for internal profiles, except ones cloned from Partner User or Customer Portal Manager. That permissive default is why field access should be reviewed afterwards.
