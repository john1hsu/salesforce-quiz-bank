id: sf-001299
product_area: data-model
true_statement: A geolocation value counts as null only when both latitude and longitude are null, and a record with just one coordinate set is treated as unset in distance filters.
false_statement: A geolocation value counts as null when either latitude or longitude is null, and a record with just one coordinate set is filtered as if the missing one were zero.
explanation: Nullness is judged on both coordinates together, yet a half-filled location is still ignored when filtering or sorting by distance. Missing coordinates are not treated as zero.
