id: sf-001438
product_area: data-model
true_statement: An auto-number field holds up to 10 digits plus up to 20 characters of prefix and suffix, which makes 30 characters its maximum length.
false_statement: An auto-number field holds up to 8 digits plus up to 12 characters of prefix and suffix, which makes 20 characters its maximum length.
explanation: The number part can reach 10 digits and the surrounding prefix and suffix another 20 characters, so type conversions treat 30 characters as the limit. The 8-digit, 20-character figures are invented.
