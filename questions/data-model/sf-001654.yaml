id: sf-001654
product_area: data-model
true_statement: Images inserted into a rich text area field must be GIF, JPEG or PNG files of no more than 1 MB each.
false_statement: Images inserted into a rich text area field must be GIF, JPEG or PNG files of no more than 5 MB each.
explanation: The rich text editor caps each uploaded image at 1 MB in those three formats. The false version raises the size limit to 5 MB.
