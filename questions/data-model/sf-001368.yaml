id: sf-001368
product_area: data-model
true_statement: Once an admin turns on the Use custom address fields setting, it can't be disabled again, so enabling it is a one-way org-wide decision.
false_statement: Once an admin turns on the Use custom address fields setting, it can be disabled again as long as no custom address fields remain in the org.
explanation: Salesforce states the custom address field setting can't be disabled after it is enabled. There is no route back by deleting the fields first, which is why it should be treated as a permanent choice.
