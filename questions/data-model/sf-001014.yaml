true_statement: Field dependencies aren't enforced when only the controlling field is updated, and the Data Import Wizard ignores them entirely.
false_statement: Field dependencies are enforced whenever the controlling field is updated, but the Data Import Wizard ignores them entirely.
explanation: Updating just the controller skips the dependency check, as do Data Import Wizard loads, so a validation rule is needed when a bad combination must never be stored.
