product_area: data-model
true_statement: Roll-up summary fields offer COUNT, SUM, MIN and MAX, with no native average.
false_statement: Roll-up summary fields offer COUNT, SUM, AVERAGE and MAX, with no native minimum.
explanation: The four roll-up types are COUNT, SUM, MIN and MAX. Averages are not available natively, while MIN is, so the false statement swaps the supported and missing operations.
