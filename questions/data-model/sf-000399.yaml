id: sf-000399
product_area: data-model
true_statement: In Bulk API 2.0, batch errors push processing into single-row mode, which sharply slows the job, so data should be cleaned first.
false_statement: In Bulk API 2.0, batch errors cause the whole job to be rejected at once, so data should be cleaned first.
explanation: Errors don't abort the job; they drop processing to one row at a time, which is why cleaning data before a bulk load matters for speed.
