id: sf-000256
product_area: data-model
true_statement: Apex describe methods such as getRecordTypeInfosByDeveloperName() return record types even when the running user has no access to them.
false_statement: Apex describe methods such as getRecordTypeInfosByDeveloperName() return only the record types the running user has access to.
explanation: DescribeSObjectResult lists every record type regardless of the user's access. To honour access in a custom UI, check isAvailable() on each RecordTypeInfo instead of relying on the describe result being filtered.
