id: sf-001515
product_area: data-model
true_statement: In Apex describe results, isNameField() returns true for an object's Name field while isCustom() returns false for it, even on custom objects.
false_statement: In Apex describe results, isNameField() returns true for an object's Name field and isCustom() also returns true for it on custom objects.
explanation: The name field is a standard field even on a custom object, so isCustom() reports false while isNameField() reports true. The false statement treats it as a custom field.
