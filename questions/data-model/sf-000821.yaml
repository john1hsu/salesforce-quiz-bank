id: sf-000821
product_area: data-model
true_statement: In Schema Builder, each object move on the canvas is saved automatically, and an Auto-Layout can't be undone.
false_statement: In Schema Builder, object moves are saved only when you click Save, and an Auto-Layout can be undone.
explanation: Schema Builder autosaves the layout as you move objects, and Auto-Layout is final. There is no manual save or undo step for the arrangement.
