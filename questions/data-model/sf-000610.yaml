id: sf-000610
product_area: data-model
true_statement: A duplicate rule set to BypassSharingRules still catches duplicates the saving user can't see.
false_statement: A duplicate rule set to EnforceSharingRules still catches duplicates the saving user can't see.
explanation: BypassSharingRules ignores sharing when matching, so hidden duplicates are still detected. EnforceSharingRules respects sharing, so a duplicate invisible to the user won't block or flag their save.
