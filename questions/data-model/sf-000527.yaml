true_statement: TYPEOF can't be used in Bulk API queries, so large extracts of polymorphic fields filter on the Type qualifier instead.
false_statement: The Type qualifier can't be used in Bulk API queries, so large extracts of polymorphic fields use TYPEOF instead.
explanation: TYPEOF is unsupported in Bulk API and PushTopic queries, so bulk extracts rely on filters like What.Type. The false statement reverses which construct is blocked.
