id: sf-000125
product_area: data-model
true_statement: A parent with more than 200 junction records can't be deleted while the junction has a roll-up summary field rolling up to the other parent.
false_statement: A parent with more than 2,000 junction records can't be deleted while the junction has a roll-up summary field rolling up to the other parent.
explanation: The deletion block applies above 200 junction records when a roll-up to the other parent exists; the junction records must be deleted first. The threshold is 200, not 2,000.
