true_statement: 'When Data Loader uses Bulk API or Bulk API 2.0, a field is blanked by putting #N/A in the CSV cell, because the Insert null values setting doesn''t apply.'
false_statement: When Data Loader uses Bulk API or Bulk API 2.0, a field is blanked by enabling the Insert null values setting and leaving the CSV cell empty.
explanation: 'The Insert null values option has no effect with either bulk engine, so bulk loads clear fields with the #N/A marker instead of relying on empty cells.'
