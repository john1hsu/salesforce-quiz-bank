id: sf-001862
product_area: data-model
true_statement: Object Manager is available only in Lightning Experience; Salesforce Classic has no equivalent single view of standard and custom objects.
false_statement: Object Manager is available in both Lightning Experience and Salesforce Classic as the single view of standard and custom objects.
explanation: Salesforce's style guide states Object Manager is Lightning-only, and the one-list view of all objects was billed as a Lightning advantage. Classic users reach object settings another way.
