id: sf-001443
product_area: data-model
true_statement: A custom object record created through the API without a name value takes its record ID as its name.
false_statement: A custom object record created through the API without a name value takes the object's label as its name.
explanation: When an API insert leaves the name field empty, Salesforce fills it with the record ID. It does not fall back to the object's label.
