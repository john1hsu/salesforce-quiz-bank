id: sf-001580
product_area: data-model
true_statement: In Trailhead's data management vocabulary, a system of reference is the trusted access point when several systems of record disagree.
false_statement: In Trailhead's data management vocabulary, a system of engagement is the trusted access point when several systems of record disagree.
explanation: The system of record holds the authoritative copy where data is created, and the system of reference reconciles across several of them. Systems of engagement are the screens people interact with.
