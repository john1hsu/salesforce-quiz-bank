id: sf-001792
product_area: data-model
true_statement: An undeleted custom field comes back with a _del suffix on its developer name, so references to the old API name must be updated.
false_statement: An undeleted custom field comes back with its original developer name, so references to the old API name keep working.
explanation: Restoring a field brings back its data but appends _del to the developer name. Code, formulas or integrations that used the original API name have to be repointed.
