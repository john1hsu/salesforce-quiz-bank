true_statement: Dynamic Forms field visibility rules re-evaluate while the user edits, but section visibility rules apply only after the record is saved.
false_statement: Dynamic Forms section visibility rules re-evaluate while the user edits, but field visibility rules apply only after the record is saved.
explanation: Field-level rules respond during editing, whereas section rules are evaluated after save. The false statement swaps which rule type is live.
