id: sf-001652
product_area: data-model
true_statement: The Data Import Wizard processes jobs asynchronously through the Bulk API, and progress shows on the Bulk Data Load Jobs page in Setup.
false_statement: The Data Import Wizard writes records synchronously through the SOAP API, so the browser must stay open until every record is saved.
explanation: Unlike the older per-object wizards, the unified wizard hands work to the Bulk API and emails the user when it finishes. Synchronous writing was the old wizards' behaviour.
