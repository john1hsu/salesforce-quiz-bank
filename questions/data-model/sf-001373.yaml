id: sf-001373
product_area: data-model
true_statement: A Visualforce standard controller loads field set fields automatically, while a custom controller must add them to its own SOQL query.
false_statement: Both Visualforce standard and custom controllers load field set fields automatically, so neither needs to add them to a SOQL query.
explanation: Only standard controllers fetch field set members for you. A custom controller builds its own query, usually from each member's field path, so it must include those fields itself.
