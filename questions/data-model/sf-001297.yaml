id: sf-001297
product_area: data-model
true_statement: In a SOQL WHERE clause, the DISTANCE function supports only the < and > comparison operators, not equality.
false_statement: In a SOQL WHERE clause, the DISTANCE function supports <, > and = comparisons, so a query can match an exact distance.
explanation: Location-based SOQL compares distances only with less-than or greater-than. Equality isn't supported, which fits the approximate nature of the distance calculation.
