id: sf-001369
product_area: data-model
true_statement: The SOQL DISTANCE function works with standard address and geolocation fields but not with custom address fields.
false_statement: The SOQL DISTANCE function works with standard address and custom address fields but not with geolocation fields.
explanation: DISTANCE is listed as unsupported for custom address fields, while standard addresses and geolocation fields support it. The false version wrongly excludes geolocation fields, which are built for distance queries.
