id: sf-001013
product_area: data-model
true_statement: A Visualforce page can include at most 10 dependent picklist pairs across all objects, and it fails at runtime if the controlling field is missing.
false_statement: A Visualforce page can include at most 25 dependent picklist pairs across all objects, and it fails at runtime if the controlling field is missing.
explanation: apex:inputField renders dependencies automatically, but Visualforce caps a page at 10 dependent picklist pairs, not 25.
