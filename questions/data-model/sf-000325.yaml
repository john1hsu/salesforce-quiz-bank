id: sf-000325
product_area: data-model
true_statement: External object API names end in __x, marking records that live in an external system rather than in the org.
false_statement: External object API names end in __e, marking records that live in an external system rather than in the org.
explanation: External objects use the __x suffix. They are defined against an external data source and fetched on demand rather than stored in Salesforce.
