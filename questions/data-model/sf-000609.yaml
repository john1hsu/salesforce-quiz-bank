product_area: data-model
true_statement: In Salesforce Duplicate Management, an object can have up to 5 active matching rules.
false_statement: In Salesforce Duplicate Management, an object can have up to 3 active matching rules.
explanation: Each object allows five active matching rules. Three is the number of matching rules a single duplicate rule can reference, which is a different limit.
