id: sf-001300
product_area: data-model
true_statement: With State and Country/Territory Picklists, the integration value is what Apex, SOQL and API integrations see in the text State and Country fields, while the label is never stored on the record.
false_statement: With State and Country/Territory Picklists, the label is what Apex, SOQL and API integrations see in the text State and Country fields, while the integration value is never stored on the record.
explanation: Integration values act like API names and are written to the text fields; labels are looked up from the code for display. Code that compares against labels won't match stored values.
