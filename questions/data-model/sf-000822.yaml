product_area: data-model
true_statement: Schema Builder can't export a schema for reuse in another org; moving a data model between orgs needs metadata deployment.
false_statement: Schema Builder can export a schema as a file that is imported into another org to recreate the data model.
explanation: Salesforce's considerations state that schemas can't be exported from Schema Builder. Objects and fields move between orgs as metadata instead.
