id: sf-001229
product_area: data-model
true_statement: When updating a CurrencyType record through the API, omitting IsActive makes it default to false, which can deactivate a live currency.
false_statement: When updating a CurrencyType record through the API, omitting IsActive keeps its current value, so a live currency stays active.
explanation: CurrencyType updates must supply every field because a missing IsActive defaults to false and silently deactivates the currency. The existing value is not preserved.
