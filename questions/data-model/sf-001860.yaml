id: sf-001860
product_area: data-model
true_statement: DATETIMEVALUE(TODAY()) produces midnight GMT, so a San Francisco user on daylight time sees 5:00 p.m. on the previous day.
false_statement: DATETIMEVALUE(TODAY()) produces midnight in the user's time zone, so a San Francisco user on daylight time sees 12:00 a.m. that day.
explanation: Text and Date conversions to Date/Time happen in GMT, and display then shifts to the viewer's zone. Formulas can't see the user's time zone, so local midnight isn't what you get.
