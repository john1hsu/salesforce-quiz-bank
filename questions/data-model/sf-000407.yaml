id: sf-000407
product_area: data-model
true_statement: Values that Apex or Flow write into tracked fields while a record is being created are included in its field history creation entry.
false_statement: Values that Apex or Flow write into tracked fields while a record is being created appear in field history only after a user later edits those fields.
explanation: Record creation logs a single created entry. Typed-in values aren't logged as changes, but values automation sets during the create transaction are captured in that entry.
