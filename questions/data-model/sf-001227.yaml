id: sf-001227
product_area: data-model
true_statement: Adding a lookup filter leaves existing values that fail it in place; the next edit of such a record forces a valid value.
false_statement: Adding a lookup filter immediately clears existing values that fail it, leaving those lookup fields blank.
explanation: A new filter doesn't retroactively change data, so non-matching values stay until someone edits the record and must then choose a valid one. Nothing is cleared automatically.
