id: sf-001301
product_area: data-model
true_statement: State and Country/Territory Picklists can't be moved with change sets, so their AddressSettings configuration is promoted through Metadata API deployments.
false_statement: State and Country/Territory Picklists are moved with change sets, because the Metadata API AddressSettings type can't be deployed between orgs.
explanation: Change sets are one of the channels the feature doesn't support. The AddressSettings metadata type, a single Address.settings file, is how the configuration travels as code.
