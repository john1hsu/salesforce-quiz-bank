id: sf-000465
product_area: data-model
true_statement: Every Salesforce record gets an automatically generated 18-character, case-insensitive record ID as its identity field.
false_statement: Every Salesforce record gets an automatically generated 12-character, case-sensitive record ID as its identity field.
explanation: The identity field the API generates on create is an 18-character ID that is case-insensitive. A 12-character case-sensitive ID is not what the platform uses.
