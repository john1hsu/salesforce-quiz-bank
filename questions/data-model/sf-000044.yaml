id: sf-000044
product_area: data-model
true_statement: A user who must own very many records should have no role, or sit alone in a separate top-level role, to limit sharing recalculation.
false_statement: A user who must own very many records should sit at the bottom of the role hierarchy, under their manager's role, to limit sharing recalculation.
explanation: Keeping a skewed owner out of the hierarchy, or isolated in its own top-level role, avoids recalculating access for everyone above them. Placing them beneath a manager adds more users whose access must be updated when ownership or roles change.
