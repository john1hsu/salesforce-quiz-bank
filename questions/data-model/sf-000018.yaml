id: sf-000018
product_area: data-model
true_statement: A custom object can have at most 2 master-detail relationships, though it can have many lookup relationships.
false_statement: A custom object can have at most 3 master-detail relationships, though it can have many lookup relationships.
explanation: Salesforce caps a custom object at two master-detail relationship fields, while lookups have no such small cap. Three is the number of custom detail levels allowed in a multilevel chain, not the per-object master-detail limit.
