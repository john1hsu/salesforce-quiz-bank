id: sf-000956
product_area: data-model
true_statement: The AccountContactRelation object doesn't support lookup, master-detail or roll-up summary fields, so richer relationship data calls for a custom junction object.
false_statement: The AccountContactRelation object supports lookup, master-detail and roll-up summary fields, so it can replace any custom junction object.
explanation: The relationship object has a limited schema with no lookups, roll-ups, record types or approvals. When the relationship needs its own children or approvals, build a custom junction object.
