id: sf-001012
product_area: data-model
true_statement: A controlling field can be a standard or custom picklist or a checkbox, but a dependent field must be a custom picklist or multi-select picklist.
false_statement: A dependent field can be a standard or custom picklist or a checkbox, but a controlling field must be a custom picklist or multi-select picklist.
explanation: 'The roles are asymmetric: checkboxes and standard picklists can control a dependency, but only custom picklists and multi-select picklists can be dependent.'
