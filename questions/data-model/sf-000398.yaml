id: sf-000398
product_area: data-model
true_statement: To avoid parent-child data skew, Salesforce suggests no parent should hold 10,000 or more child records, using several placeholder parents if needed.
false_statement: To avoid parent-child data skew, Salesforce suggests no parent should hold 100,000 or more child records, using several placeholder parents if needed.
explanation: The large-data-volume guidance sets the parent-child threshold at 10,000 children, spreading children across placeholder parents when no natural parent exists. 100,000 is ten times too high.
