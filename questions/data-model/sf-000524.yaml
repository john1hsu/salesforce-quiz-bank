id: sf-000524
product_area: data-model
true_statement: When a new custom field is added to a page layout, it lands by default as the last field in the layout's first section.
false_statement: When a new custom field is added to a page layout, it lands by default as the first field in the layout's last section.
explanation: Salesforce places a newly added custom field at the end of the first section, where admins can then drag it elsewhere. It is not dropped at the top of the last section.
