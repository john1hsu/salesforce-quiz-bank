true_statement: For an initial data load, Salesforce advises creating roles before sharing rules and placing users in roles before loading their records.
false_statement: For an initial data load, Salesforce advises creating sharing rules before roles and loading records before placing users in roles.
explanation: Setting up roles and role membership first, then adding sharing rules one at a time, avoids repeated sharing recalculation as the data arrives.
