id: sf-001651
product_area: data-model
true_statement: When the Data Import Wizard links contacts to a manager through Reports To, it can match only on Salesforce ID or email, not on name.
false_statement: When the Data Import Wizard links contacts to a manager through Reports To, it can match on the manager's full name or email, but not on Salesforce ID.
explanation: Reports To lookups in the wizard resolve by record ID or email address; names are not a supported match key. The false version reverses which keys are allowed.
