id: sf-001859
product_area: data-model
true_statement: The SOQL literal LAST_N_DAYS:n includes today and so spans n+1 days, while NEXT_N_DAYS:n starts tomorrow.
false_statement: The SOQL literal NEXT_N_DAYS:n includes today and so spans n+1 days, while LAST_N_DAYS:n starts yesterday.
explanation: LAST_N_DAYS counts the current day as well as the previous n, whereas NEXT_N_DAYS begins with tomorrow. The false statement swaps which literal includes today.
