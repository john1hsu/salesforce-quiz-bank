id: sf-001514
product_area: data-model
true_statement: An external object's name field is chosen by setting isNameField to true on one of its custom fields.
false_statement: An external object's name field is chosen by setting nameField to Auto Number in the external data source definition.
explanation: External objects don't get a name field from the wizard; instead one of their custom fields is flagged with isNameField. The false version points at the wrong metadata and type.
