id: sf-000687
product_area: data-model
true_statement: In Apex, Formula.recalculateFormulas() refreshes every formula on a list of in-memory SObjects without saving the records.
false_statement: In Apex, Formula.recalculateFormulas() refreshes every formula on a list of SObjects and then saves the records to the database.
explanation: The method recalculates formula values on records held in memory and performs no DML; it only uses SOQL when fields the formulas need are missing.
