id: sf-000045
product_area: data-model
true_statement: An object starts with 25 roll-up summary fields; Salesforce Support can raise that, but 40 per object is the hard maximum.
false_statement: An object starts with 25 roll-up summary fields; Salesforce Support can raise that, but 100 per object is the hard maximum.
explanation: The default allocation is 25 per object and Support can increase it only up to a hard ceiling of 40. A 100-field ceiling does not exist.
