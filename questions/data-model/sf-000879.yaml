id: sf-000879
product_area: data-model
true_statement: Deleting a ContentDocument cascades to its links, but those cascaded ContentDocumentLink deletions don't fire ContentDocumentLink triggers.
false_statement: Deleting a ContentDocument cascades to its links, and each cascaded ContentDocumentLink deletion fires the ContentDocumentLink delete trigger.
explanation: When a document is deleted its versions and links go with it, but the link deletions happen without running ContentDocumentLink triggers, so trigger logic that relies on them will miss those deletes.
