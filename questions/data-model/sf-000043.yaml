id: sf-000043
product_area: data-model
true_statement: Lookup skew can occur on any lookup field, including custom ones, because it comes from record locking rather than the sharing model.
false_statement: Lookup skew can occur only under a private sharing model, because it comes from sharing recalculation rather than record locking.
explanation: Saving a record locks the target of each lookup field, so many records pointing at one target contend for locks regardless of sharing settings. Unlike account skew, lookup skew is not tied to the sharing model.
