id: sf-001228
product_area: data-model
true_statement: With Advanced Currency Management, opportunity amounts convert at the dated exchange rate in force on the opportunity's Close Date.
false_statement: With Advanced Currency Management, opportunity amounts convert at the dated exchange rate in force on the opportunity's Created Date.
explanation: ACM ties opportunity and opportunity product conversion to the Close Date, so moving that date into another rate period changes the converted amount. The creation date plays no part in picking the rate.
