id: sf-001724
product_area: data-model
true_statement: A custom multi-select picklist can have up to 500 values, and a user can select up to 100 of them on one record.
false_statement: A custom multi-select picklist can have up to 500 values, and a user can select up to 50 of them on one record.
explanation: Salesforce Help caps a custom multi-select picklist at 500 values, with at most 100 selectable at once on a record. Fifty understates the per-record selection limit.
