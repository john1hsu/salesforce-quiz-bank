id: sf-001016
product_area: data-model
true_statement: An approval step can route to the manager named on the record owner's user record, or to a custom hierarchical field used as the approver field.
false_statement: An approval step can route only to the submitter's manager via the standard Manager field; custom hierarchical fields can't be used as the approver field.
explanation: Approvers can be resolved from the submitter's or record owner's Manager, and a custom hierarchical field can serve as the approver field when the approval chain differs from the reporting line.
