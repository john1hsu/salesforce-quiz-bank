id: sf-000319
product_area: data-model
true_statement: A custom big object's index can contain at most five custom fields, and their text fields may total no more than 100 characters.
false_statement: A custom big object's index can contain at most ten custom fields, and their text fields may total no more than 255 characters.
explanation: The big object index, which serves as its composite primary key, takes one to five required custom fields with text fields capped at 100 characters combined. Ten fields and 255 characters overstate both limits.
