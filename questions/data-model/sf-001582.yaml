true_statement: Under the U.S. Evidence Act of 2018, every executive agency must appoint a Chief Data Officer.
false_statement: Under the U.S. Evidence Act of 2018, every executive agency must appoint a Chief Information Security Officer to lead data governance.
explanation: The Evidence Act requires a Chief Data Officer in each executive agency, and OMB guidance has the CDO chair the data governance body. The CISO is not the role it mandates.
