id: sf-001439
product_area: data-model
true_statement: Date tokens such as {YYYY} and {MM} in an auto-number display format take their values from the record's creation date evaluated in GMT.
false_statement: Date tokens such as {YYYY} and {MM} in an auto-number display format take their values from the record's creation date in the creating user's time zone.
explanation: Auto-number date tokens are evaluated in GMT, not in the user's local time zone, so records created near midnight can show an unexpected date. The false statement swaps in the user's time zone.
