id: sf-001226
product_area: data-model
true_statement: In Lightning Experience every lookup filter behaves as required, even one set up as optional.
false_statement: In Lightning Experience every lookup filter behaves as optional, even one set up as required.
explanation: Optional lookup filters, which let users show all results and save a non-matching value, are a Classic-only behaviour. Lightning Experience enforces every filter as required regardless of the Setup choice.
