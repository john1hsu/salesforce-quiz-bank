id: sf-001158
product_area: data-model
true_statement: A Salesforce global value set is always restricted, so its picklist fields can store only values defined in the set.
false_statement: A Salesforce global value set is always unrestricted, so its picklist fields can store values that aren't defined in the set.
explanation: Global value sets cannot be made unrestricted, which is how they keep data clean; writes with unknown values fail rather than adding new values.
