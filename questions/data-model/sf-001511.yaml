id: sf-001511
product_area: data-model
true_statement: Compact layouts can't be assigned by profile; one primary compact layout applies to all users, with overrides possible only per record type.
false_statement: Compact layouts can be assigned by profile like page layouts, so each profile can see a different primary compact layout.
explanation: 'Unlike page layouts, compact layouts have no profile-based assignment: the primary layout serves every user of the object, and only record type overrides can vary it. The false statement borrows the page layout assignment model.'
