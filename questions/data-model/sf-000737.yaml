id: sf-000737
product_area: data-model
true_statement: Trailhead notes that, on average, 120 business addresses and 75 phone numbers change every 30 minutes, so data quality needs continuous care.
false_statement: Trailhead notes that, on average, 120 business addresses and 75 phone numbers change every 24 hours, so data quality needs continuous care.
explanation: The decay figure is per 30 minutes, which is why quality is treated as ongoing rather than a one-time cleanup. Per day understates how fast contact data goes stale.
