id: sf-000020
product_area: data-model
true_statement: Converting a lookup to a master-detail relationship switches the child object's org-wide default to Controlled by Parent.
false_statement: Converting a lookup to a master-detail relationship keeps the child object's existing org-wide default, such as Private.
explanation: Once the relationship becomes master-detail, the detail records take their access from the master, so the child's org-wide default changes to Controlled by Parent. Its earlier sharing setting does not survive the conversion.
