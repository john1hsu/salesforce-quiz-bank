id: sf-001864
product_area: data-model
true_statement: Setup pages, including Object Manager, are served from the *.salesforce-setup.com domain, which locked-down networks may need to allow.
false_statement: Setup pages, including Object Manager, are served from the *.my.site.com domain, which locked-down networks may need to allow.
explanation: Setup has its own salesforce-setup.com domain, so restrictive networks must allow it before Object Manager loads. my.site.com is not the Setup domain.
