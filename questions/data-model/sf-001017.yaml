id: sf-001017
product_area: data-model
true_statement: The User object can't be the master side of a master-detail relationship, so user-to-user links rely on lookup-style fields.
false_statement: The User object can be the master side of a master-detail relationship, so user-to-user links can use master-detail fields.
explanation: The object reference lists User among the standard objects barred from being the master in a master-detail relationship, which is why hierarchical and lookup fields are used.
