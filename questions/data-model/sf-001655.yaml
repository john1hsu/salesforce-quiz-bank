id: sf-001655
product_area: data-model
true_statement: By default, images uploaded through lightning-input-rich-text are accessible to all users in the org, and share-with-entity-id narrows that access.
false_statement: By default, images uploaded through lightning-input-rich-text are visible only to the uploading user, and share-with-entity-id widens that access.
explanation: Uploaded images start out org-wide, so a developer who wants them tied to a record, group or user must set share-with-entity-id. The false version assumes a private default.
