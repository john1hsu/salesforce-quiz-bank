id: sf-000877
product_area: data-model
true_statement: To create a Salesforce file through the API, you insert a ContentVersion, and Salesforce creates the parent ContentDocument automatically.
false_statement: To create a Salesforce file through the API, you insert a ContentDocument first, then attach the bytes with a ContentVersion.
explanation: ContentDocument supports query, update and delete but not create. Inserting a ContentVersion with no ContentDocumentId makes the platform generate the parent document for you.
