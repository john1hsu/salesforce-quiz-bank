id: sf-000526
product_area: data-model
true_statement: With Shared Activities enabled, a single task or event can be related to up to 50 contacts, one of which is the primary contact.
false_statement: With Shared Activities enabled, a single task or event can be related to up to 10 contacts, one of which is the primary contact.
explanation: Shared Activities lets one activity relate to as many as 50 contacts with one marked primary. The limit is 50, not 10, and turning the setting off requires Salesforce Support.
