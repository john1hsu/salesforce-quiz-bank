id: sf-000739
product_area: data-model
true_statement: Price book entries can never be deleted; to retire one, set its IsActive field to false.
false_statement: Price book entries can be deleted once no opportunity line items use them; otherwise set IsActive to false.
explanation: PricebookEntry records can't be deleted under any condition, so deactivation is the only way to retire them. The false version invents a deletion path.
