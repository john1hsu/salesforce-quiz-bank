id: sf-001794
product_area: data-model
true_statement: An auto-number field keeps counting while it is deleted, so after an undelete it carries the correct current values.
false_statement: An auto-number field stops counting while it is deleted, so after an undelete it resumes from the value it had when deleted.
explanation: Numbering continues in the background during the soft-delete window. A restored auto-number field therefore picks up where the sequence actually is, not where it was at deletion.
