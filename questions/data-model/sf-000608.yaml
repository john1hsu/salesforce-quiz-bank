id: sf-000608
product_area: data-model
true_statement: All long and rich text area fields on one object share a combined budget of 1,638,400 characters.
false_statement: All long and rich text area fields on one object share a combined budget of 131,072 characters.
explanation: There's no count limit on long and rich text fields, but together they can't exceed 1,638,400 characters per object. 131,072 is the maximum length of a single such field, not the shared budget.
