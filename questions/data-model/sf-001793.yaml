id: sf-001793
product_area: data-model
true_statement: The Purge button on the Deleted Fields page appears once an org reaches 75% of its custom field allocation and has fields ready for hard delete.
false_statement: The Purge button on the Deleted Fields page appears once an org reaches 90% of its custom field allocation and has fields ready for hard delete.
explanation: Salesforce shows Purge at 75% of the allocation so admins can free space early instead of waiting out the retention window. Ninety percent is the wrong threshold.
