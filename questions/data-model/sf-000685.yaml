id: sf-000685
product_area: data-model
true_statement: A two-column Dynamic Forms Field Section counts as three components on the page, because each column counts as a component.
false_statement: A two-column Dynamic Forms Field Section counts as one component on the page, because columns don't count as components.
explanation: The section itself plus each of its columns counts toward component limits, so two columns make three. Treating the section as a single component undercounts it.
