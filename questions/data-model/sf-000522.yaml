id: sf-000522
product_area: data-model
true_statement: A field marked required on a page layout but read-only in field-level security is read-only for the user.
false_statement: A field marked required on a page layout but read-only in field-level security is required and editable for the user.
explanation: Field-level security overrides any less restrictive layout setting, so the stricter read-only access wins. The layout's required flag can't open up editing that FLS denies.
