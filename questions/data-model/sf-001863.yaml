product_area: data-model
true_statement: While viewing a record, choosing Edit Object from the gear icon jumps straight to that object's page in Object Manager.
false_statement: While viewing a record, choosing Edit Page from the gear icon jumps straight to that object's page in Object Manager.
explanation: Edit Object is the shortcut into Object Manager for the current object. Edit Page is a different menu item, so it isn't the route described.
