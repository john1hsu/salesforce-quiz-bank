id: sf-000736
product_area: data-model
true_statement: Salesforce's Data Quality module checks the age dimension by reporting on Last Modified Date to see what share of records is recent.
false_statement: Salesforce's Data Quality module checks the age dimension by reporting on Created Date to see what share of records is recent.
explanation: Age is about how recently a record was updated, so the check uses Last Modified Date. Created Date says nothing about whether old records have been kept current.
