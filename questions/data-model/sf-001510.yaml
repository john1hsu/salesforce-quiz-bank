id: sf-001510
product_area: data-model
true_statement: A compact layout can hold up to 10 fields, including the Name field.
false_statement: A compact layout can hold up to 25 fields, including the Name field.
explanation: Each object's compact layout is capped at 10 fields, Name included, even though surfaces such as the highlights panel display only the first few. 25 overstates the cap.
