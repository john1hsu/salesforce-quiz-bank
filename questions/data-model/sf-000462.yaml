id: sf-000462
product_area: data-model
true_statement: Users can still read records whose business process their profile can't create or edit, so business processes shouldn't be used for access control.
false_statement: Users can't read records whose business process their profile can't create or edit, so business processes can serve as access control.
explanation: Profile assignment of a process governs creating and editing, not reading. Salesforce warns against relying on business processes as a security control.
