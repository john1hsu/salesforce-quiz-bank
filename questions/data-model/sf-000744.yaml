id: sf-000744
product_area: data-model
true_statement: A new validation rule also applies to existing records, so a user editing an unrelated field on a non-compliant record is blocked.
false_statement: A new validation rule applies only to records created after it is activated, so editing an unrelated field on an older record still saves.
explanation: Rules are checked on every save, old records included, which is why guards like ISNEW() or ISCHANGED() matter. Activation date doesn't exempt existing data.
