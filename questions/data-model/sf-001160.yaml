id: sf-001160
product_area: data-model
true_statement: Global value sets created at API version 57.0 or later get a __gvs suffix on their developer name, which deployments must include.
false_statement: Global value sets created at API version 57.0 or later get a __gs suffix on their developer name, which deployments must include.
explanation: From API 57.0, Salesforce appends __gvs to new global value set names, and package.xml entries and fullName values must use it.
