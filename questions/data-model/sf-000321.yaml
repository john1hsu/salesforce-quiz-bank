id: sf-000321
product_area: data-model
true_statement: In a SOQL query on a big object, range operators are allowed only on the last index field being filtered.
false_statement: In a SOQL query on a big object, range operators are allowed only on the first index field being filtered.
explanation: Big object queries must filter index fields in order from the first, with = or IN on each, and only the last filtered field may use a range operator.
