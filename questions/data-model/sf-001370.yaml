id: sf-001370
product_area: data-model
true_statement: A managed or unmanaged package containing a custom address field installs only in an org that already has custom address fields enabled.
false_statement: A managed or unmanaged package containing a custom address field enables the custom address fields setting automatically in the org it installs into.
explanation: The installing org must have the feature turned on beforehand, otherwise the package install fails. Installing a package doesn't switch the setting on for you.
