id: sf-001086
product_area: data-model
true_statement: Upsert matching on an external ID is case-sensitive unless the field is Unique and set to treat values as duplicates regardless of case.
false_statement: Upsert matching on an external ID is case-insensitive unless the field is Unique and set to treat values as distinct by case.
explanation: By default the key comparison respects case; only a Unique field configured as case-insensitive makes upsert ignore case. The false statement flips the default.
