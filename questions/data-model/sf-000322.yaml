id: sf-000322
product_area: data-model
true_statement: By default an object can have up to 25 external ID fields; raising that requires a Salesforce Support case.
false_statement: By default an object can have up to 100 external ID fields; raising that requires a Salesforce Support case.
explanation: The default allocation is 25 external IDs per object. Because each one is indexed, they also draw on the shared default of 25 custom indexes per object, so 100 is far too high.
