id: sf-001584
product_area: data-model
true_statement: In IBM's split of the role, a technical data steward understands the pipelines, ETL jobs and warehouses, while a business steward owns one function's data.
false_statement: In IBM's split of the role, a business data steward understands the pipelines, ETL jobs and warehouses, while a technical steward owns one function's data.
explanation: Business stewards are tied to a function such as sales or service; technical stewards know the systems that move the data; an enterprise steward coordinates them. The false version swaps the first two.
