id: sf-000323
product_area: data-model
true_statement: Upserting on a non-unique external ID field requires the View All Data permission, while a unique external ID needs no special permission.
false_statement: Upserting on a unique external ID field requires the View All Data permission, while a non-unique external ID needs no special permission.
explanation: The extra permission applies to the non-unique case, where Salesforce must see all potential matches. Marking the external ID Unique avoids both this requirement and multiple-match errors.
