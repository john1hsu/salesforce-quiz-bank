id: sf-000881
product_area: data-model
true_statement: In a hierarchical Data 360 tag taxonomy, a child tag inherits the governance policies attached to its parent tag.
false_statement: In a hierarchical Data 360 tag taxonomy, a parent tag inherits the governance policies attached to each of its child tags.
explanation: Building tags as a hierarchy lets policies flow downward, so a child tag picks up its parent's policies. Inheritance does not run upward from children to parents.
