id: sf-001302
product_area: data-model
true_statement: 'Editing a state or country integration value isn''t retroactive: records already saved keep the old value, and hard-coded references must be updated.'
false_statement: 'Editing a state or country integration value is retroactive: records already saved are rewritten with the new value, and hard-coded references update automatically.'
explanation: A changed integration value applies only to future saves. Existing records and anything that hard-codes the old value, such as rules or integrations, must be handled separately.
