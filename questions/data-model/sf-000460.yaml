id: sf-000460
product_area: data-model
true_statement: A Salesforce support process filters the values offered in the case Status picklist.
false_statement: A Salesforce support process filters the values offered in the case Priority picklist.
explanation: Each business process type is bound to one lifecycle field, and for support processes that field is case Status. Priority is not governed by a business process.
