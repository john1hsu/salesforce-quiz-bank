id: sf-000461
product_area: data-model
true_statement: A value added to an object's master picklist is not added to existing business processes; it must be added to each one by hand.
false_statement: A value added to an object's master picklist is added automatically to every existing business process on that object.
explanation: Existing processes and record types keep their own selected values, so new master values need to be added to each manually.
