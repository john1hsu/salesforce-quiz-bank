id: sf-001156
product_area: data-model
true_statement: A SOSL search scoped WITH DIVISION to one division also returns records that sit in the global division.
false_statement: A SOSL search scoped WITH DIVISION to one division excludes records that sit in the global division.
explanation: Global-division records appear in every division-scoped search, which is why leaving many records there weakens the filtering benefit.
