product_area: data-model
true_statement: A REST upsert by external ID whose value matches more than one record returns HTTP 300 with the list of candidate records.
false_statement: A REST upsert by external ID whose value matches more than one record updates the most recently modified of those records.
explanation: 'Upsert never guesses between several matches: the REST API answers 300 and lists the candidates. Zero matches insert (201) and exactly one match updates (200).'
