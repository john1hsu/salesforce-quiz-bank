id: sf-001371
product_area: data-model
true_statement: An object can hold up to 2,000 field sets, but one Visualforce page can reference at most 50 of them.
false_statement: An object can hold up to 2,000 field sets, but one Visualforce page can reference at most 10 of them.
explanation: The documented ceilings are 2,000 field sets per object and 50 referenced by a single Visualforce page. Ten is well below the real per-page limit.
