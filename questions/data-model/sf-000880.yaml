id: sf-000880
product_area: data-model
true_statement: Data 360's Suggest Tags feature reads object and field metadata, not field values, and every suggestion needs administrator approval.
false_statement: Data 360's Suggest Tags feature scans stored field values, and its suggestions are applied automatically without administrator approval.
explanation: Suggest Tags works only from metadata about objects and fields and never inspects the data itself. An administrator must approve each proposed tag before it takes effect.
