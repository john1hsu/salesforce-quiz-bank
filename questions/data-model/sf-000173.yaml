id: sf-000173
product_area: data-model
true_statement: A hierarchical relationship is a special lookup that exists only on the User object, used for chains such as managers.
false_statement: A hierarchical relationship is a special lookup that can be added to any custom object to model parent-child chains.
explanation: Hierarchical relationships are limited to User, which is how fields like Manager link one user to another. Other objects use standard lookup or master-detail fields.
