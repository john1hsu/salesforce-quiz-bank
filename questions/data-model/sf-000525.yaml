id: sf-000525
product_area: data-model
true_statement: On tasks and events, the WhoId field is labelled Name in the UI and points to a person such as a Lead or a Contact.
false_statement: On tasks and events, the WhatId field is labelled Name in the UI and points to a person such as a Lead or a Contact.
explanation: Who (WhoId, shown as Name) is the person an activity concerns. What (WhatId, shown as Related To) points to non-person records such as Accounts or Opportunities.
