id: sf-000606
product_area: data-model
true_statement: A deleted custom field and its data are kept for up to 15 days, counting against the object's field allocation until hard-deleted.
false_statement: A deleted custom field and its data are kept for up to 30 days, counting against the object's field allocation until hard-deleted.
explanation: Deleted fields linger for up to 15 days so they can be restored, and they still consume allocation in the meantime. Thirty days is the wrong retention window; Erase or Purge starts the hard delete sooner.
