id: sf-001861
product_area: data-model
true_statement: In a Salesforce formula, subtracting one Time value from another returns a number of milliseconds.
false_statement: In a Salesforce formula, subtracting one Time value from another returns a number of minutes.
explanation: Time differences come back in milliseconds, which is why the check-out example divides by 3,600,000 to get hours. Date differences are days and Date/Time differences are decimal days.
