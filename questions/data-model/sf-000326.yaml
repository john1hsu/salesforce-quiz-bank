id: sf-000326
product_area: data-model
true_statement: An indirect lookup links a child external object to a parent standard or custom object by matching a unique external ID field on the parent.
false_statement: An indirect lookup links a child external object to a parent standard or custom object by matching the parent's 18-character Salesforce record ID.
explanation: External records rarely hold Salesforce IDs, so an indirect lookup matches a remote column against a unique external ID field on the parent record instead.
