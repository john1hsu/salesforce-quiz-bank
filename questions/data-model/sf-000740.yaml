id: sf-000740
product_area: data-model
true_statement: Once an opportunity has product line items, neither its price book nor its CurrencyIsoCode can be changed.
false_statement: Once an opportunity has product line items, its price book can still be changed, but its CurrencyIsoCode can't.
explanation: Line items lock both the opportunity's price book and its currency, because every line item must come from an entry in that book and currency. Swapping the book is blocked too.
