id: sf-001440
product_area: data-model
true_statement: Changing an auto-number field's display format applies only to new records; existing records keep the old format unless you convert, mass-update and convert back.
false_statement: Changing an auto-number field's display format reformats every existing record automatically, so old and new records always share one format.
explanation: Format changes are not retroactive. To restyle existing values you temporarily convert the field to Text, update the values with Data Loader, then convert it back to Auto Number.
