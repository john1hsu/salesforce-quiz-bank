id: sf-001015
product_area: data-model
true_statement: A hierarchical relationship field prevents choosing a user who reports to the record's user directly or indirectly, so the chain can't loop.
false_statement: A hierarchical relationship field allows choosing any active user, including one who reports to the record's user, so loops must be prevented by validation rules.
explanation: 'Cycle protection is what makes the field hierarchical: like the Manager field, it blocks picking a direct or indirect report, so automation can walk the chain safely.'
