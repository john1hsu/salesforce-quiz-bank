id: sf-000195
product_area: identity
true_statement: In the Salesforce client credentials flow, every access token carries the permissions of the app's designated run-as user.
false_statement: In the Salesforce client credentials flow, every access token carries the permissions of the admin who approved the app.
explanation: The app is configured with a run-as user and tokens act with that user's access. Salesforce advises a dedicated integration user limited by permission sets.
