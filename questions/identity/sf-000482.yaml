id: sf-000482
product_area: identity
true_statement: A login flow is assigned to a user license and profile, so only users with that profile go through it.
false_statement: A login flow is assigned to a permission set, so only users holding that permission set go through it.
explanation: In Setup each login flow is tied to a license and profile, which lets different profiles get different flows. Permission sets aren't the assignment mechanism.
