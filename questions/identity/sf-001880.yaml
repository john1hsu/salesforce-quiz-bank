id: sf-001880
product_area: identity
true_statement: In Salesforce, a token granted the full OAuth scope gets no refresh token unless the refresh_token scope is selected as well.
false_statement: In Salesforce, a token granted the full OAuth scope also gets a refresh token, so the refresh_token scope needn't be selected.
explanation: Although full is described as covering all other scopes, it doesn't return a refresh token. Apps that must run unattended need refresh_token (offline_access) selected too.
