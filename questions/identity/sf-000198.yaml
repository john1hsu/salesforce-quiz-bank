id: sf-000198
product_area: identity
true_statement: An Auth. Provider's consumer secret is replaced with a placeholder when retrieved through the Metadata API.
false_statement: An Auth. Provider's consumer secret is retrieved in plain text through the Metadata API, so it deploys with the definition.
explanation: Since November 2022 retrievals mask the secret. Deployments have to restore it or it must be re-entered in Setup.
