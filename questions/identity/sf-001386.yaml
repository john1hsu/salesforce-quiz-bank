id: sf-001386
product_area: identity
true_statement: Under RFC 7636, a PKCE code_verifier is a random string of 43 to 128 characters.
false_statement: Under RFC 7636, a PKCE code_verifier is a random string of 16 to 32 characters.
explanation: PKCE requires the client's code_verifier to be between 43 and 128 characters, from which the code_challenge is derived. A 16 to 32 character verifier would be too short to meet the standard.
