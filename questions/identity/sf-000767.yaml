id: sf-000767
product_area: identity
true_statement: Salesforce's SCIM API supports PATCH and filtering, but not bulk operations or sorting.
false_statement: Salesforce's SCIM API supports PATCH, filtering and bulk operations through /Bulk, but not sorting.
explanation: The service provider configuration advertises PATCH, filters and password changes, while bulk, sorting and ETags are unsupported. The RFC's /Bulk endpoint isn't available.
