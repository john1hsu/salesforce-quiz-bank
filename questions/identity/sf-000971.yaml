id: sf-000971
product_area: identity
true_statement: When challenging a user, Salesforce prompts for the most secure registered method and ranks a security key above Salesforce Authenticator.
false_statement: When challenging a user, Salesforce prompts for the most secure registered method and ranks Salesforce Authenticator above a security key.
explanation: The precedence runs passkey, then physical security key, then Salesforce Authenticator, then TOTP apps. A security key is the more secure, phishing-resistant method, so it comes first.
