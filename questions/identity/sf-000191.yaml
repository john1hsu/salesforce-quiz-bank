id: sf-000191
product_area: identity
true_statement: An OAuth 2.0 refresh token is presented only to the authorization server, never to resource servers.
false_statement: An OAuth 2.0 refresh token is presented to resource servers in place of an access token once it expires.
explanation: Refresh tokens are exchanged at the token endpoint for new access tokens. Resource servers accept only access tokens.
