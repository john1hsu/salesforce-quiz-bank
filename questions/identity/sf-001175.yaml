id: sf-001175
product_area: identity
true_statement: Renewing a certificate by uploading the existing one through the Metadata API copies its X.509 parameters but generates a new key pair.
false_statement: Renewing a certificate by uploading the existing one through the Metadata API copies its X.509 parameters and keeps the original key pair.
explanation: The Metadata API Certificate type can't import or export private keys, so an upload reuses only the certificate's parameters and creates fresh keys. The original private key never travels with it.
