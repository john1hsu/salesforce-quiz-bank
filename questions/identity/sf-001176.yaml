id: sf-001176
product_area: identity
true_statement: Salesforce rotates its inbound TLS server certificate unless you bring your own, but rotating certificates used to sign SAML or JWT assertions is the customer's job.
false_statement: Salesforce rotates the certificates used to sign SAML or JWT assertions, but rotating its inbound TLS server certificate is the customer's job.
explanation: Salesforce's guidance gives it responsibility for the inbound TLS server certificate by default, while SSO and JWT signing certificates, like outbound mutual-TLS ones, are customer-managed. The false version reverses that split.
