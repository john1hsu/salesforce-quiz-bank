id: sf-001248
product_area: identity
true_statement: Because personal data must not appear in request URIs, SCIM puts sensitive filters in a POST to a /.search endpoint rather than a GET query string.
false_statement: Because personal data must not appear in request bodies, SCIM puts sensitive filters in a GET query string rather than a POST to a /.search endpoint.
explanation: RFC 7644 keeps personal data out of URIs, which get logged, so sensitive searches go in the body of a POST to /.search. Moving them into a GET query string would expose them in the URI.
