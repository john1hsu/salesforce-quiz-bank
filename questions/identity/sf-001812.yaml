id: sf-001812
product_area: identity
true_statement: For Mobile SDK biometric authentication, BIOMETRIC_AUTHENTICATION_TIMEOUT sets the minutes before the lock and defaults to 15 when omitted.
false_statement: For Mobile SDK biometric authentication, BIOMETRIC_AUTHENTICATION_TIMEOUT sets the minutes before the lock and defaults to 5 when omitted.
explanation: The custom attribute on the connected app controls how long the app may sit in the background before locking, with a 15-minute default. Five minutes is not the default.
