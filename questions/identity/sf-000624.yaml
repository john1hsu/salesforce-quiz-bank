product_area: identity
true_statement: Standard SAML just-in-time provisioning requires the Email, LastName, ProfileId and Username attributes to create a user.
false_statement: Standard SAML just-in-time provisioning requires the Email, FirstName, ProfileId and Username attributes to create a user.
explanation: The required User attributes for standard JIT are Email, LastName, ProfileId and Username. FirstName is optional, like Role or Department.
