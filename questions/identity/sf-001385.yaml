id: sf-001385
product_area: identity
true_statement: The OauthTokenExchangeHandler metadata type, introduced in API version 60.0, can mark a default handler used when a request omits the token_handler parameter.
false_statement: The OauthTokenExchangeHandler metadata type, introduced in API version 60.0, requires every token exchange request to name its handler in the token_handler parameter.
explanation: The metadata's enablements tie a handler to specific apps and can flag one as the default, which applies when the request leaves out token_handler. Naming the handler in every request isn't mandatory.
