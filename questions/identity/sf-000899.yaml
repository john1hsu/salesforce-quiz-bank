id: sf-000899
product_area: identity
true_statement: With Salesforce refresh token rotation enabled, every refresh issues a new refresh token and invalidates the old one, and rotation can't be turned off once on.
false_statement: With Salesforce refresh token rotation enabled, every refresh issues a new refresh token while the old one stays valid, and rotation can be turned off at any time.
explanation: Rotation replaces the refresh token on each use so a stolen token dies at the next legitimate refresh. Salesforce makes the setting irreversible once enabled.
