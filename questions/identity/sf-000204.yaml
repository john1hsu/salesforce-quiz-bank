id: sf-000204
product_area: identity
true_statement: In a Salesforce SAML configuration, the Entity ID must match an Audience value in the IdP's assertion.
false_statement: In a Salesforce SAML configuration, the Entity ID must match the Issuer element in the IdP's assertion.
explanation: The Entity ID identifies the org, usually its My Domain URL, and is checked against the assertion's Audience. The Issuer field is the one that must match the IdP's Issuer element.
