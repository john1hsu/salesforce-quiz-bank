id: sf-000069
product_area: identity
true_statement: When a sandbox is created or refreshed, only packaged external client apps are copied into it, not local ones.
false_statement: When a sandbox is created or refreshed, both local and packaged external client apps are copied into it.
explanation: Local external client apps stay in their home org and are skipped by sandbox copies; only packaged ones come across, so sandbox setup has to account for that.
