id: sf-000193
product_area: identity
true_statement: The Salesforce OAuth JWT bearer flow never issues a refresh token, and scopes can't be requested in the assertion.
false_statement: The Salesforce OAuth JWT bearer flow issues a refresh token with each access token, and scopes are requested in the assertion.
explanation: JWT bearer returns only an access token, with scopes coming from the app's policy or API Access Control. The server simply signs a new JWT when it needs another token.
