id: sf-000838
product_area: identity
true_statement: The LogoutEventStream event fires for UI logouts, but simply closing the browser never publishes it.
false_statement: The LogoutEventStream event fires for UI logouts and is also published whenever the user closes the browser.
explanation: Only explicit UI logouts publish the event, plus timeouts when Force logout on session timeout is on. Closing the browser leaves no logout event to act on.
