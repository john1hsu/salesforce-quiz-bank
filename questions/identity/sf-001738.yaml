id: sf-001738
product_area: identity
true_statement: Only users with the View Setup and Configuration permission can be added as delegated administrators.
false_statement: Only users with the Manage Users permission can be added as delegated administrators.
explanation: Delegated administrators need View Setup and Configuration so they can reach the Setup pages they manage. Requiring Manage Users would defeat the purpose, since delegation exists to avoid handing out that broad permission.
