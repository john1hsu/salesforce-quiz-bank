id: sf-001598
product_area: identity
true_statement: Salesforce doesn't issue user authentication certificates; an enterprise CA or PIV issuer does, and admins upload each user's public certificate to the org.
false_statement: Salesforce issues user authentication certificates itself from Certificate and Key Management, so no enterprise CA or PIV issuer is needed.
explanation: UserAuthCertificate records are documented as externally uploaded. The certificate comes from the organization's own PKI or smart-card issuer, and the org stores the public certificate per user.
