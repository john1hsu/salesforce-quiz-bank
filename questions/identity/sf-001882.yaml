id: sf-001882
product_area: identity
true_statement: From Mobile SDK 13.2, an app that requests no scopes receives all of the scopes configured on its app definition.
false_statement: From Mobile SDK 13.2, an app that requests no scopes receives only the api and refresh_token scopes from its app definition.
explanation: Clients can ask for a subset of the configured scopes; in 13.2 and later, asking for none yields every scope set on the app. It isn't narrowed to api and refresh_token.
