id: sf-001810
product_area: identity
true_statement: Viewing Setup > App Menu needs View Setup and Configuration, and changing app order or visibility there needs Customize Application.
false_statement: Viewing Setup > App Menu needs View Setup and Configuration, and changing app order or visibility there needs Modify All Data.
explanation: The App Menu page is read with View Setup and Configuration and edited with Customize Application. Modify All Data is not the permission it asks for.
