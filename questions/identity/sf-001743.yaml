id: sf-001743
product_area: identity
true_statement: When a managed package is licensed to the whole org, only an admin with Manage Users can grant the publisher login access.
false_statement: When a managed package is licensed to the whole org, any user in the org can grant the publisher login access.
explanation: Org-wide licensing means no individual user holds a package licence, so the publisher drops out of ordinary users' grant lists. An admin with Manage Users must grant the access instead.
