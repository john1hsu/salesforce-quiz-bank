id: sf-000629
product_area: identity
true_statement: Since Winter '26, a single trusted IP range can cover at most 16,777,216 IPv4 addresses.
false_statement: Since Winter '26, a single trusted IP range can cover at most 65,536 IPv4 addresses.
explanation: The range size cap is 16,777,216 IPv4 addresses, and the same cap applies to profile ranges. 65,536 is far smaller than the real limit.
