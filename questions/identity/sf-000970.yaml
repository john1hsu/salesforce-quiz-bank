id: sf-000970
product_area: identity
true_statement: Identity Verification History keeps six months of verification attempts, so longer audit evidence has to be exported.
false_statement: Identity Verification History keeps twelve months of verification attempts, so longer audit evidence has to be exported.
explanation: The VerificationHistory object retains records for six months. Twelve months is too long, which is why teams with longer retention needs export the data.
