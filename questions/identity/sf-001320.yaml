id: sf-001320
product_area: identity
true_statement: Login History records a Forwarded-for IP from the X-Forwarded-For header, but that field isn't populated for OAuth and SSO logins.
false_statement: Login History records a Forwarded-for IP from the X-Forwarded-For header, and that field is populated only for OAuth and SSO logins.
explanation: Source IP is always the first client address to reach Salesforce, while Forwarded-for comes from the header. OAuth and SSO logins leave the Forwarded-for field empty.
