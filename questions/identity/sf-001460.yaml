id: sf-001460
product_area: identity
true_statement: Each account in Salesforce Authenticator gets its own 6-digit TOTP code that rotates every 30 seconds and works without a data connection.
false_statement: Each account in Salesforce Authenticator gets its own 6-digit TOTP code that rotates every 5 minutes and works without a data connection.
explanation: The app's offline passcodes follow the TOTP standard and change every 30 seconds per connected account. A five-minute rotation is far longer than the app uses.
