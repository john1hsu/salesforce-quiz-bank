id: sf-000895
product_area: identity
true_statement: A profile with the External Identity license can access up to ten custom objects, and custom objects from managed packages don't count toward that.
false_statement: A profile with the External Identity license can access up to ten custom objects, including any custom objects installed from managed packages.
explanation: External Identity grants a short list of standard objects plus at most ten custom objects per profile. Managed-package custom objects are excluded from the count.
