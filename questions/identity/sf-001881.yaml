id: sf-001881
product_area: identity
true_statement: The Salesforce web OAuth scope includes visualforce, and visualforce on its own reaches only customer-built Visualforce pages.
false_statement: The Salesforce visualforce OAuth scope includes web, and web on its own reaches only customer-built Visualforce pages.
explanation: web is the broader scope for Salesforce-hosted pages and contains visualforce; visualforce alone is limited to customer-created Visualforce. The false statement reverses which scope contains the other.
