id: sf-000699
product_area: identity
true_statement: A Developer Edition org includes 10 Identity Connect permission set licenses, while Enterprise, Performance and Unlimited Editions pay extra for it.
false_statement: A Developer Edition org includes 100 Identity Connect permission set licenses, while Enterprise, Performance and Unlimited Editions pay extra for it.
explanation: Identity Connect is a paid add-on in the main editions, and Developer Edition ships with ten of its permission set licenses. One hundred overstates that allowance.
