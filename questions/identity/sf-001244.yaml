id: sf-001244
product_area: identity
true_statement: In Salesforce's inbound mTLS pattern, the JWT bearer signing certificate may be self-signed, but the mTLS client certificate must be CA-signed.
false_statement: In Salesforce's inbound mTLS pattern, the mTLS client certificate may be self-signed, but the JWT bearer signing certificate must be CA-signed.
explanation: 'The two certificates do different jobs: the JWT signing certificate can be self-signed, while the certificate uploaded for mutual authentication must be signed by a CA. Swapping those requirements is a common setup failure.'
