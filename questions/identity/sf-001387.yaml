id: sf-001387
product_area: identity
true_statement: Salesforce requires PKCE on partner-built connected apps and external client apps used by more than two customer production orgs, for public and confidential clients.
false_statement: Salesforce requires PKCE on partner-built connected apps and external client apps used by more than two customer production orgs, but only for public clients.
explanation: 'The partner requirement covers both client types: public clients send just the code_verifier, and confidential clients send it along with the client_secret. Exempting confidential clients is the error.'
