product_area: identity
true_statement: For External Identity users, Salesforce recommends staying under 10 million unique logins per month to avoid extra charges or degraded functionality.
false_statement: For External Identity users, Salesforce recommends staying under 1 million unique logins per month to avoid extra charges or degraded functionality.
