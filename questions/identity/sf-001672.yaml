id: sf-001672
product_area: identity
true_statement: Because the user never logs in through a Salesforce page, the username-password OAuth flow can't issue refresh tokens.
false_statement: Because the client already holds the user's password, the username-password OAuth flow always issues a long-lived refresh token.
explanation: With no interactive Salesforce login there is no refresh token, so apps needing one must use a redirect-based flow such as the web server flow. Holding the password does not unlock refresh tokens.
