id: sf-000067
product_area: identity
true_statement: The Use Any API Client permission lets a user reach any connected app, even one restricted to admin-approved users.
false_statement: The Use Any API Client permission lets a user reach any self-authorize connected app, but not one restricted to admin-approved users.
explanation: This permission bypasses the admin-approved restriction entirely, which is why holders of it should be audited. It is not limited to self-authorize apps.
