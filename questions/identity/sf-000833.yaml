id: sf-000833
product_area: identity
true_statement: SAML 2.0 was approved as an OASIS Standard in March 2005, merging SAML 1.x, Liberty ID-FF and Shibboleth.
false_statement: SAML 2.0 was approved as an OASIS Standard in March 2012, merging SAML 1.x, Liberty ID-FF and Shibboleth.
explanation: OASIS members approved SAML 2.0 in March 2005, folding in Liberty's ID-FF and Internet2's Shibboleth. 2012 is several years too late.
