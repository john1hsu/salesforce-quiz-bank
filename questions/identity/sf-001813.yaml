id: sf-001813
product_area: identity
true_statement: Since Mobile SDK 9.2, app lock relies on the device's system passcode, so org-level PIN length settings are ignored.
false_statement: Since Mobile SDK 9.2, app lock relies on an app-specific PIN, so org-level PIN length settings are enforced.
explanation: From 9.2 onward the SDK defers to the operating system passcode or biometrics, so older guidance on PIN length no longer applies. There is no separate app PIN governed by the org.
