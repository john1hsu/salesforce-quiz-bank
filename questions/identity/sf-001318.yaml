id: sf-001318
product_area: identity
true_statement: The Login History page in Setup lists up to 20,000 login records from the past six months; the full six months can be downloaded as CSV or GZIP.
false_statement: The Login History page in Setup lists up to 20,000 login records from the past twelve months; the full twelve months can be downloaded as CSV or GZIP.
explanation: Login History keeps six months of data, and the page and list views stop at 20,000 rows. Longer retention needs scheduled exports or Event Monitoring.
