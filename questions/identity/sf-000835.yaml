id: sf-000835
product_area: identity
true_statement: A SAML response sent through the browser on the HTTP POST binding must be digitally signed with XML Signature.
false_statement: A SAML response sent through the browser on the HTTP POST binding must be encrypted, while signing it is optional.
explanation: Because the POST response passes through the user's browser, SAML requires an XML signature to protect its integrity. OASIS also notes encryption alone does not provide integrity.
