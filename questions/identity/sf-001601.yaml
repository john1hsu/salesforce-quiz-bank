id: sf-001601
product_area: identity
true_statement: Once an admin enables security keys or built-in passkeys in an org, every user can use them; admins can't restrict them to admins only.
false_statement: Once an admin enables security keys or built-in passkeys in an org, they can be restricted to admins only through a permission set.
explanation: Enabling the method in Identity Verification settings opens it to all users in the org. There is no option to scope it to privileged users alone.
