id: sf-000832
product_area: identity
true_statement: A sandbox's custom domain is added in the production org that owns the sandbox, using the Associated Org field.
false_statement: A sandbox's custom domain is added in the sandbox itself, using the Associated Org field.
explanation: The Associated Org field can be edited only from production, so the domain is configured there and pointed at the sandbox. It is not set up inside the sandbox.
