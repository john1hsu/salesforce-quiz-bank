id: sf-000201
product_area: identity
true_statement: In inbound SSO, an external identity provider authenticates the user and Salesforce acts as the service provider.
false_statement: In inbound SSO, Salesforce authenticates the user as the identity provider and signs them in to third-party apps.
explanation: Inbound means users arrive at Salesforce already authenticated by another IdP. Salesforce acting as the identity provider for other apps is outbound SSO.
