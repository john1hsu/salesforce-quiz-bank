id: sf-000479
product_area: identity
true_statement: Headless login, registration and passwordless flows use the Authorization Code and Credentials flow, requested with response_type=code_credentials.
false_statement: Headless login, registration and passwordless flows use the OAuth username-password flow, requested with grant_type=password.
explanation: These flows post credentials to the authorize endpoint with response_type=code_credentials and then exchange the returned code for a token. The username-password grant isn't used.
