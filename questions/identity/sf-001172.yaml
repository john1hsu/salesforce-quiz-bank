id: sf-001172
product_area: identity
true_statement: Since December 2025, the Approve Uninstalled Connected Apps permission is what lets a user self-authorize uninstalled apps while API Access Control is on.
false_statement: Since December 2025, the Use Any API Client permission is what lets a user self-authorize uninstalled apps while API Access Control is on.
explanation: Salesforce moved self-authorization of uninstalled apps to the new Approve Uninstalled Connected Apps permission, meant for trusted admins and developers. Use Any API Client stopped granting that ability in the same change.
