id: sf-001673
product_area: identity
true_statement: RFC 9700, the 2025 OAuth security best current practice, says the resource owner password credentials grant must not be used.
false_statement: RFC 9700, the 2025 OAuth security best current practice, says the resource owner password credentials grant may still be used by confidential clients.
explanation: RFC 9700 goes beyond RFC 6749's advice to minimize the grant and forbids it outright, citing credential exposure and its poor fit with multi-step login. It makes no exception for confidential clients.
