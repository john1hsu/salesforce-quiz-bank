id: sf-001457
product_area: identity
true_statement: By default, Salesforce as an identity provider signs assertions with a self-signed SHA-256 certificate, though a CA-signed one can be chosen.
false_statement: By default, Salesforce as an identity provider signs assertions with a CA-signed SHA-256 certificate, though a self-signed one can be chosen.
explanation: The default signing certificate is self-signed; admins may switch to another self-signed or a CA-signed certificate. The false statement reverses which kind is the default.
