id: sf-000897
product_area: identity
true_statement: Experience Cloud objects such as Cases, Orders and Tasks aren't included in the External Identity license; users need a Community license for them.
false_statement: Experience Cloud objects such as Cases, Orders and Tasks are included in the External Identity license once the default profile is cloned.
explanation: The license is identity-focused and excludes service objects like Cases, Contracts, Orders and Tasks. Cloning the profile can't grant objects the license lacks; upgrading users to a Community license can.
