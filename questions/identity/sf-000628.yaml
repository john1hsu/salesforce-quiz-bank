id: sf-000628
product_area: identity
true_statement: SAML bearer assertion and JWT bearer flows always enforce profile IP restrictions, whatever a connected app's IP relaxation policy says.
false_statement: SAML bearer assertion and JWT bearer flows always skip profile IP restrictions, whatever a connected app's IP relaxation policy says.
explanation: These server-to-server flows ignore IP relaxation and always apply the profile's ranges, which matters when an integration's egress IPs change.
