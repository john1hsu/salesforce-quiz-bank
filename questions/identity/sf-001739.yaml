id: sf-001739
product_area: identity
true_statement: Delegated administrators can't create or change relationships on a delegated custom object or set its org-wide sharing defaults.
false_statement: Delegated administrators can create relationships on a delegated custom object and set its org-wide sharing defaults, but can't create a custom tab for it.
explanation: Custom object delegation covers nearly everything, including creating a custom tab, but relationships and org-wide defaults stay with full admins. The false statement reverses which rights are excluded.
