id: sf-000545
product_area: identity
true_statement: A connected app that requires a High Assurance session blocks JWT bearer flow logins, because only OAuth flows with a user approval step can meet it.
false_statement: A connected app that requires a High Assurance session blocks web server flow logins, because only OAuth flows without a user approval step can meet it.
explanation: Raising a session to High Assurance needs an interactive approval step, which the web server, user-agent and refresh token flows have. Server-to-server flows such as JWT bearer lack it and are blocked.
