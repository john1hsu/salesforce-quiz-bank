id: sf-000188
product_area: identity
true_statement: After a My Domain rename, only the most recent previous name redirects, so successive renames break older links.
false_statement: After a My Domain rename, every previous name keeps redirecting, so successive renames never break older links.
explanation: Salesforce redirects just the last former hostname. Renaming twice leaves the oldest URLs broken, which is why hard-coded URLs need review.
