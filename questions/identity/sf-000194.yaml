id: sf-000194
product_area: identity
true_statement: The OAuth username-password flow is blocked by default in orgs created in Summer '23 or later, though it can be re-enabled.
false_statement: The OAuth username-password flow is allowed by default in orgs created in Summer '23 or later, though admins can block it.
explanation: Newer orgs start with the username-password flow blocked. Salesforce recommends keeping it and the user-agent flow blocked and using JWT bearer or client credentials instead.
