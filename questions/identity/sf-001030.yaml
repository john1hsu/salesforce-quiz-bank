id: sf-001030
product_area: identity
true_statement: The X.509 certificate uploaded to an app for the Salesforce JWT bearer flow can't exceed 4 KB; a DER-encoded file helps if it does.
false_statement: The X.509 certificate uploaded to an app for the Salesforce JWT bearer flow can't exceed 16 KB; a DER-encoded file helps if it does.
explanation: Salesforce caps the signing certificate at 4 KB and suggests DER encoding to shrink an oversized file. 16 KB is not the documented limit.
