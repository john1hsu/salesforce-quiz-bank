id: sf-001530
product_area: identity
true_statement: The IdpEventLog object supports only describeSObjects(), query() and retrieve(), so its entries are read-only through the API.
false_statement: The IdpEventLog object supports create(), update() and delete() as well as query(), so admins can purge its entries through the API.
explanation: IdpEventLog exposes only describe, query and retrieve calls, making it a read-only object queried with SOQL. No write or delete calls are available on it.
