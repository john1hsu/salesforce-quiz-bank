id: sf-000766
product_area: identity
true_statement: A DELETE request on a Salesforce SCIM /Users/<id> resource deactivates the user rather than deleting the record.
false_statement: A DELETE request on a Salesforce SCIM /Users/<id> resource permanently deletes the record, while a PATCH only deactivates the user.
explanation: Both PATCH and DELETE set the user inactive; the record stays queryable and can be reactivated. Salesforce doesn't hard-delete users through SCIM.
