id: sf-000542
product_area: identity
true_statement: Where phishing-resistant MFA isn't feasible yet, CISA recommends number matching to counter MFA push-bombing.
false_statement: Where phishing-resistant MFA isn't feasible yet, CISA recommends SMS one-time codes to counter MFA push-bombing.
explanation: CISA's interim fix for push-bombing is number matching, which makes the user confirm a code shown at login. FIDO/WebAuthn remains the phishing-resistant goal; SMS codes are not the recommended answer.
