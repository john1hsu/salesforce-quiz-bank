id: sf-001603
product_area: identity
true_statement: WebAuthn security keys work in Chrome, Edge Chromium, Firefox and Safari, while older U2F keys work only in Chrome and Edge Chromium.
false_statement: U2F security keys work in Chrome, Edge Chromium, Firefox and Safari, while newer WebAuthn keys work only in Chrome and Edge Chromium.
explanation: WebAuthn has broad browser support, whereas the legacy U2F standard is limited to Chrome 41 or later and Edge Chromium.
