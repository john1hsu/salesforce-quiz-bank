id: sf-001879
product_area: identity
true_statement: The redirect_uri sent to the singleaccess endpoint must be a relative path; absolute URLs are rejected.
false_statement: The redirect_uri sent to the singleaccess endpoint must be an absolute URL; relative paths are rejected.
explanation: The landing page is given as a path such as lightning/setup/ManageUsers/home, and absolute URLs fail. Without it, the user lands on the My Domain or site home page.
