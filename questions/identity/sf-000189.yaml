true_statement: With enhanced domains, Experience Cloud sites are served at MyDomainName.my.site.com.
false_statement: With enhanced domains, Experience Cloud sites are served at MyDomainName.my.salesforce-sites.com.
explanation: Enhanced domains put the My Domain name in every URL. Experience Cloud sites use my.site.com, while my.salesforce-sites.com is the format for Salesforce Sites.
