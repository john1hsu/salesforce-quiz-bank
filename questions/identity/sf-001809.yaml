id: sf-001809
product_area: identity
true_statement: All standard and custom apps start out visible in the App Launcher; hiding them all by default takes a request to Salesforce Customer Support.
false_statement: All standard and custom apps start out hidden in the App Launcher; showing them all by default takes a request to Salesforce Customer Support.
explanation: Apps are visible by default and can be hidden one by one in App Menu. Only a blanket hidden-by-default setup needs Support's help, not the reverse.
