id: sf-001811
product_area: identity
true_statement: In Enhanced Mobile App Security, a Critical violation wipes the app's data and logs the user out, while Error blocks access without a logout.
false_statement: In Enhanced Mobile App Security, an Error violation wipes the app's data and logs the user out, while Critical blocks access without a logout.
explanation: 'Critical is the harshest severity: data wipe plus logout. Error only blocks access until the user fixes the problem. The false statement swaps the two levels.'
