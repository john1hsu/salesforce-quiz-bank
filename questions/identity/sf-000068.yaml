id: sf-000068
product_area: identity
true_statement: Tightening a connected app's refresh token policy does not end active sessions, because the policy is checked only when a refresh token is used.
false_statement: Tightening a connected app's refresh token policy ends active sessions at once, because the policy is checked on every API request.
explanation: The refresh token policy is evaluated only at the moment a refresh token is exchanged, so existing sessions keep running until then. It is not checked on each request.
