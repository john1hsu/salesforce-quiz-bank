id: sf-001600
product_area: identity
true_statement: For Salesforce mobile apps, certificate-based authentication is switched on through an MDM key, RequireCertAuth, rather than in Setup.
false_statement: For Salesforce mobile apps, certificate-based authentication is switched on in Setup's Identity Verification page rather than through an MDM key.
explanation: Mobile CBA is driven by managed app configuration from a mobile device management suite. RequireCertAuth starts the flow, and on Android ManagedAppCertAlias picks the certificate.
