id: sf-001878
product_area: identity
true_statement: Calling the singleaccess endpoint again before its frontdoor URL expires returns the same URL without extending its expiry.
false_statement: Calling the singleaccess endpoint again before its frontdoor URL expires returns a new URL and resets the expiry.
explanation: Within the one-minute window, repeat calls hand back the identical URL and its original expiry. A fresh URL is issued only after the first one has expired.
