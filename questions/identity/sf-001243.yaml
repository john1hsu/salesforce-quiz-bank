id: sf-001243
product_area: identity
true_statement: Clients calling Salesforce APIs over mutual TLS must connect on port 8443 instead of the default port 443.
false_statement: Clients calling Salesforce APIs over mutual TLS connect on the default port 443, and Salesforce negotiates the client certificate there.
explanation: Inbound API mTLS in Salesforce runs on the dedicated port 8443, and a named credential targeting such an org must state it explicitly. Port 443 is the ordinary one-way TLS endpoint.
