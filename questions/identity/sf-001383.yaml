id: sf-001383
product_area: identity
true_statement: A Salesforce token exchange handler is an Apex class that extends Auth.Oauth2TokenExchangeHandler and overrides validateIncomingToken and getUserForTokenSubject.
false_statement: A Salesforce token exchange handler is an Apex class that implements Auth.RegistrationHandler and overrides createUser and updateUser.
explanation: Token exchange uses its own handler base class, Auth.Oauth2TokenExchangeHandler, with one method to validate the incoming token and one to map its subject to a user. Auth.RegistrationHandler belongs to auth provider single sign-on, not this flow.
