id: sf-001808
product_area: identity
true_statement: A user's own App Launcher arrangement overrides the default app order an admin sets under Setup > App Menu.
false_statement: The default app order an admin sets under Setup > App Menu overrides a user's own App Launcher arrangement.
explanation: Users can reorder their App Launcher, and that personal order wins. So later changes to the admin's default may never reach users who already customised theirs.
