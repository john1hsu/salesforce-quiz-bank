id: sf-000182
product_area: identity
true_statement: If no default account is set for site self-registration and person accounts are enabled, Salesforce creates person accounts for new users.
false_statement: If no default account is set for site self-registration, Salesforce puts every new user's contact under one shared placeholder account it creates.
explanation: Self-registration normally links new contacts to a configured default account. With none set, Salesforce falls back to person accounts, but only when the org has them enabled.
