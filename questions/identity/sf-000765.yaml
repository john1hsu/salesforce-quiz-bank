id: sf-000765
product_area: identity
true_statement: An OpenID provider's discovery document is fetched from its issuer URL with /.well-known/openid-configuration appended.
false_statement: An OpenID provider's discovery document is fetched from its issuer URL with /.well-known/jwks.json appended.
explanation: Discovery uses the openid-configuration path, and the document it returns then points to the JWKS signing-key URL. The JWKS isn't the discovery document itself.
