id: sf-000836
product_area: identity
true_statement: When Salesforce is the SAML service provider and several session indexes arrive, it keeps only the first one.
false_statement: When Salesforce is the SAML service provider and several session indexes arrive, it keeps only the most recent one.
explanation: Salesforce as SP stores just the first session index, which can't exceed 512 characters. Later indexes in the same exchange are not kept.
