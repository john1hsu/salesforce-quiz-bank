id: sf-000190
product_area: identity
true_statement: RFC 9700 requires public OAuth clients to use PKCE with the S256 method.
false_statement: RFC 9700 requires public OAuth clients to use PKCE with the plain method.
explanation: The 2025 OAuth security best practice makes PKCE with S256 mandatory for public clients. The plain method is weaker and is forbidden outright in the OAuth 2.1 draft.
