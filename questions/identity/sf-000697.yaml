id: sf-000697
product_area: identity
true_statement: Identity Connect syncs one way from Active Directory, so an edit made in Salesforce to a mapped field is overwritten on the next sync.
false_statement: Identity Connect syncs both ways with Active Directory, so an edit made in Salesforce to a mapped field is written back to AD on the next sync.
explanation: AD is the source of truth and Identity Connect only needs read access to it; it never writes to AD. Salesforce-side edits to mapped fields are simply replaced unless the field is left out of the mapping.
