id: sf-001104
product_area: identity
true_statement: In RFC 8628, a slow_down response while polling tells the device client to add 5 seconds to its polling interval.
false_statement: In RFC 8628, a slow_down response while polling tells the device client to stop polling because the device code has expired.
explanation: slow_down asks the client to back off by 5 seconds and keep polling. Stopping is the response to access_denied or expired_token, not slow_down.
