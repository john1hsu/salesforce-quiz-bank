id: sf-001461
product_area: identity
true_statement: To register Salesforce Authenticator, the app shows a two-word phrase that the user types into the browser, then confirms the connection in the app.
false_statement: To register Salesforce Authenticator, the browser shows a QR code that the user scans with the app, then confirms the connection in the app.
explanation: Registration pairs the app and the user's account by having the user enter the app's two-word phrase in the browser. QR scanning is how outside TOTP services are typically added, not how a Salesforce account is paired.
