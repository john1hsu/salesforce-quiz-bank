id: sf-000626
product_area: identity
true_statement: Custom SAML just-in-time provisioning uses an Apex class that implements the Auth.SamlJitHandler interface.
false_statement: Custom SAML just-in-time provisioning uses an Apex class that implements the Auth.RegistrationHandler interface.
explanation: The generated SAML JIT handler implements Auth.SamlJitHandler with createUser and updateUser methods. A registration handler is the OpenID Connect counterpart used by authentication providers.
