id: sf-001740
product_area: identity
true_statement: Choosing a role for a delegated administration group's user administration automatically includes all of that role's subordinate roles.
false_statement: Choosing a role for a delegated administration group's user administration covers only that role; each subordinate role must be added separately.
explanation: Delegation follows the role hierarchy downward, so listing a role brings its subordinates along. Delegates can then manage users anywhere beneath it.
