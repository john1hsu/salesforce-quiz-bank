id: sf-000625
product_area: identity
true_statement: For external users, SAML just-in-time provisioning matches accounts on Account.AccountNumber and contacts on Contact.Email.
false_statement: For external users, SAML just-in-time provisioning matches accounts on Account.Name and contacts on Contact.Email.
explanation: Account lookup uses the account number and contact lookup uses email, with multiple matches treated as an error. Account name isn't the matching key.
