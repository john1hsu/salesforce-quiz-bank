id: sf-000183
product_area: identity
true_statement: A Login Discovery page runs an Apex class implementing Auth.LoginDiscoveryHandler, which can send one-time codes via Site.passwordlessLogin.
false_statement: A Login Discovery page runs an Apex class implementing Auth.RegistrationHandler, which can send one-time codes via Site.passwordlessLogin.
explanation: LoginDiscoveryHandler's login method finds the user from the identifier and decides the challenge, such as a passwordless code or a redirect to an identity provider. RegistrationHandler is a different interface.
