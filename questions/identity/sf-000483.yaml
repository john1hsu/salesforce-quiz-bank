id: sf-000483
product_area: identity
true_statement: Login flows don't run for API logins, so controls that must cover integrations need to live elsewhere.
false_statement: Login flows run for API logins as well as UI logins, so they can enforce controls on integrations too.
explanation: API logins, and UI sessions created via frontdoor.jsp from a non-UI login, bypass login flows. Integration controls belong in places such as connected-app policies.
