id: sf-001602
product_area: identity
true_statement: U2F security keys registered before Summer '22 are encrypted with a master key on the Certificate and Key Management page, and deleting that key locks those users out.
false_statement: U2F security keys registered before Summer '22 are encrypted with each user's password hash, so resetting the password locks those users out.
explanation: Legacy U2F registrations depend on a master encryption key stored in Certificate and Key Management. Removing it makes those registrations unusable.
