id: sf-000541
product_area: identity
true_statement: When Salesforce knows an account is compromised, the user must pass an identity challenge and reset the password before getting back in.
false_statement: When Salesforce knows an account is compromised, the user must wait for an administrator to unfreeze the account before getting back in.
explanation: 'Salesforce''s remediation is self-service: an identity challenge followed by a password reset. It does not depend on an admin manually unfreezing the account.'
