id: sf-000005
product_area: identity
true_statement: Since June 26, 2026, Salesforce requires phishing-resistant MFA for privileged users such as System Administrators and users with Modify All Data.
false_statement: Since June 26, 2026, Salesforce requires phishing-resistant MFA for every user, including standard users with no administrative permissions.
explanation: 'MFA is enforced for all users, but the phishing-resistant requirement applies only to privileged users: System Administrators and anyone with Modify All Data, View All Data, Customize Application or Author Apex. Other users can still use methods such as Salesforce Authenticator or TOTP apps.'
