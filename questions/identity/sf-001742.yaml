id: sf-001742
product_area: identity
true_statement: Login flows assigned to either the admin's or the user's profile don't run during a Log In As session.
false_statement: Login flows assigned to the impersonated user's profile run at the start of a Log In As session.
explanation: Log In As skips login flows entirely, whichever profile they are on. Admins can't rely on a login flow to gate or log impersonation.
