id: sf-000203
product_area: identity
true_statement: A user's Federation ID must be unique within an org, and a user present in several orgs should carry the same value in each.
false_statement: A user's Federation ID must be unique across all Salesforce orgs, so a user present in several orgs needs a different value in each.
explanation: Uniqueness is enforced per org. Reusing the same Federation ID for one person across orgs lets a single IdP identity sign in everywhere.
