id: sf-000070
product_area: identity
true_statement: In an external client app, the subscriber admin's Policies stay local and are never packaged, while the developer's Settings travel in the package.
false_statement: In an external client app, the developer's Settings stay local and are never packaged, while the subscriber admin's Policies travel in the package.
explanation: Developers own the Settings, which ship in the package; subscriber admins own the Policies, which they tune per org and which are never packaged. The false version reverses the roles.
