id: sf-000969
product_area: identity
true_statement: With delegated authentication, Salesforce sends the username, password and source IP to the customer's SOAP web service, which returns true or false.
false_statement: With delegated authentication, Salesforce redirects the user to the customer's identity provider, which returns a signed SAML assertion.
explanation: 'Delegated authentication is a credential callout: the customer''s endpoint validates the password and answers true or false. Redirecting for a signed assertion is how SAML single sign-on works.'
