id: sf-000698
product_area: identity
true_statement: In Identity Connect, Scheduled Updates compare every user and group to correct drift, while Live Updates react to AD changes without a full comparison.
false_statement: In Identity Connect, Live Updates compare every user and group to correct drift, while Scheduled Updates react to AD changes without a full comparison.
explanation: Live Updates push changes as they happen but can miss changes made during an outage; Scheduled Updates do the full comparison that catches them. The false version swaps the two modes.
