id: sf-001031
product_area: identity
true_statement: Including the jti claim in a JWT bearer assertion makes Salesforce reject any token it has already seen, giving replay protection.
false_statement: Including the iat claim in a JWT bearer assertion makes Salesforce reject any token it has already seen, giving replay protection.
explanation: The jti claim is a unique token identifier, and Salesforce refuses a jti it has seen before. The iat claim only records when the token was issued.
