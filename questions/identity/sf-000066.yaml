id: sf-000066
product_area: identity
true_statement: A connected app's Permitted Users policy defaults to All users may self-authorize, so each user approves the app on first use.
false_statement: A connected app's Permitted Users policy defaults to Admin approved users are pre-authorized, so access comes only from profiles or permission sets.
explanation: Self-authorization is the default; admin-approved access must be chosen explicitly, and switching to it immediately cuts off users without a profile or permission set grant.
