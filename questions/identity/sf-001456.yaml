id: sf-001456
product_area: identity
true_statement: SAML assertions issued by Salesforce as an identity provider are valid for 5 minutes after issue, with a 30-second clock-skew buffer.
false_statement: SAML assertions issued by Salesforce as an identity provider are valid for 15 minutes after issue, with a 5-minute clock-skew buffer.
explanation: Service providers must accept a Salesforce assertion within 5 minutes of issue, allowing only 30 seconds of clock skew, so clock sync matters. The longer window and buffer are not what Salesforce uses.
