id: sf-000831
product_area: identity
true_statement: Until it is activated, a new custom domain in Salesforce is served over HTTP rather than HTTPS.
false_statement: Until it is activated, a new custom domain in Salesforce is served over HTTPS using Salesforce's default certificate.
explanation: HTTPS starts only after activation, so go-live should be planned around that step. Salesforce's default Edge certificate covers only .my.salesforce.com hostnames, not custom domains.
