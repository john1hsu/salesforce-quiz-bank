id: sf-001599
product_area: identity
true_statement: The Certificate-Based Login button appears after an admin selects Certificate as an authentication service in My Domain's Authentication Configuration.
false_statement: The Certificate-Based Login button appears after an admin selects Certificate as an authentication service in the user's profile login settings.
explanation: CBA is enabled under Identity Verification, but the login option is exposed on the My Domain login page by adding Certificate as an authentication service, which needs Customize Application.
