id: sf-001101
product_area: identity
true_statement: RFC 6749 limits the client credentials grant to confidential clients, so a browser or mobile app that can't keep a secret must not use it.
false_statement: RFC 6749 allows public clients such as browser or mobile apps to use the client credentials grant, provided the secret is sent over TLS.
explanation: The grant authenticates the client with its own secret, so the standard reserves it for confidential clients. TLS protects the secret in transit but doesn't make a public client able to store it.
