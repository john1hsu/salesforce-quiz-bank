id: sf-000071
product_area: identity
true_statement: An external client app's global OAuth settings should be kept out of the package, in a long-lived org such as the Dev Hub.
false_statement: An external client app's global OAuth settings should be included in the package, so every subscriber org holds its own copy.
explanation: Global OAuth settings, which hold the consumer details, belong in a non-ephemeral org that outlives the packages, such as the Dev Hub. Packaging them is explicitly discouraged.
