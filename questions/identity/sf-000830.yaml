id: sf-000830
product_area: identity
true_statement: A custom domain that serves only Experience Cloud sites tops out at 100 sites, because each Experience Cloud site counts as two.
false_statement: A custom domain that serves only Experience Cloud sites tops out at 200 sites, because each Experience Cloud site counts as one.
explanation: The ceiling is 200 sites per domain, but an Experience Cloud site counts double, so the practical cap is 100. Counting each as one would overstate the limit.
