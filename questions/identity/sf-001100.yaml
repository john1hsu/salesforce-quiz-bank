id: sf-001100
product_area: identity
true_statement: When a Salesforce client credentials access token expires, the client requests a new one with its consumer key and secret, since the flow returns no refresh token.
false_statement: When a Salesforce client credentials access token expires, the client renews it with the refresh token returned alongside the original access token.
explanation: The client credentials flow issues only an access token, so renewal means repeating the token request with the app's key and secret. There is no refresh token to use.
