id: sf-000187
product_area: identity
true_statement: A My Domain name can be 3 to 34 characters in production and sandboxes, but only 3 to 27 in a Developer Edition org.
false_statement: A My Domain name can be 3 to 63 characters in production and sandboxes, but only 3 to 27 in a Developer Edition org.
explanation: Production and sandbox names allow up to 34 characters of letters, numbers and hyphens, and can't start with a hyphen. Developer Edition orgs are capped at 27.
