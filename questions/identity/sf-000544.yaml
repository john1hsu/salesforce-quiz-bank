id: sf-000544
product_area: identity
true_statement: Session security level policies can require High Assurance for Manage Users, but they cannot block access to it.
false_statement: Session security level policies can block access to Manage Users, but they cannot require High Assurance for it.
explanation: Manage Users and Manage Permission Sets and Profiles accept a step-up requirement but have no Block option, unlike other protected setup areas. The false version reverses which option exists.
