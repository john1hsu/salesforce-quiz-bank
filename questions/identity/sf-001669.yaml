id: sf-001669
product_area: identity
true_statement: NIST requires rate limiting for OTP verifiers whenever the OTP output is shorter than 64 bits, which covers every 6- or 8-digit TOTP code.
false_statement: NIST requires rate limiting for OTP verifiers only when the OTP output is shorter than 6 digits, so standard 6- or 8-digit TOTP codes are exempt.
explanation: Six or eight decimal digits are far below 64 bits, so ordinary TOTP codes fall under the rate-limiting rule. The false version exempts them.
