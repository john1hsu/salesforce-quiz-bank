id: sf-001174
product_area: identity
true_statement: Salesforce sets a self-signed certificate to expire after one year with a 2048-bit key and after two years with a 4096-bit key.
false_statement: Salesforce sets a self-signed certificate to expire after two years with a 2048-bit key and after one year with a 4096-bit key.
explanation: 'Self-signed certificate expiry is automatic and tied to key size: the default 2048-bit key gets one year, and the slower 4096-bit key gets two. The false version swaps the two lifetimes.'
