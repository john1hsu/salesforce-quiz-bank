id: sf-000186
product_area: identity
true_statement: If an architect certification has lapsed for more than one maintenance cycle, the exam has to be retaken.
false_statement: If an architect certification has lapsed for more than one maintenance cycle, completing the missed maintenance badges reinstates it.
explanation: A recently expired credential may be reinstated through a support case, though not guaranteed. Once it has lapsed beyond one cycle, the only route back is passing the exam again.
