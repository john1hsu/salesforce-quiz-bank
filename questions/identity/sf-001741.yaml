id: sf-001741
product_area: identity
true_statement: The Administrators Can Log in as Any User setting is offered in Enterprise, Performance, Unlimited and Developer Editions, but not Professional Edition or lower.
false_statement: The Administrators Can Log in as Any User setting is offered in Professional, Enterprise, Performance, Unlimited and Developer Editions.
explanation: The any-user login setting can't be activated in Professional Edition or below. In eligible editions where the checkbox is missing, Salesforce has to provision it.
