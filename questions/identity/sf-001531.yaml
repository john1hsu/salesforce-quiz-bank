id: sf-001531
product_area: identity
true_statement: If a transaction security policy requires MFA, Lightning Login isn't supported and enrolled users fall back to logging in with username and password.
false_statement: If a transaction security policy requires MFA, Lightning Login satisfies it and enrolled users keep logging in without a password.
explanation: Salesforce lists MFA-requiring transaction security policies as a case where Lightning Login is unsupported, sending enrolled users back to password login. The false statement assumes the policy accepts Lightning Login.
