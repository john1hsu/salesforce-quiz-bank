id: sf-001035
product_area: identity
true_statement: A Salesforce username must be unique across all Salesforce orgs, while the same email address can be reused across orgs.
false_statement: A Salesforce username only has to be unique within its own org, while an email address must be unique across all orgs.
explanation: Usernames are global identifiers in email format, so no two orgs can share one. Email addresses carry no such restriction and can repeat across orgs.
