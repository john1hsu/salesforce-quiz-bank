id: sf-001319
product_area: identity
true_statement: Since API version 37.0, any user can retrieve their own LoginHistory records, while querying others' requires Manage Users or Monitor Login History.
false_statement: Since API version 37.0, querying any LoginHistory records, including a user's own, requires the Manage Users or Monitor Login History permission.
explanation: The admin permissions are needed to see other users' logins, but API 37.0 opened each user's own records to them. A blanket permission requirement no longer applies.
