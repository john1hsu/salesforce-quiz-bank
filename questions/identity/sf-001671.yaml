id: sf-001671
product_area: identity
true_statement: In the Salesforce username-password OAuth flow, the password parameter carries the user's password with their security token appended.
false_statement: In the Salesforce username-password OAuth flow, the user's security token is sent in its own security_token parameter, separate from the password.
explanation: 'The flow has no separate token field: the security token is concatenated onto the end of the password value. The false version invents a dedicated parameter.'
