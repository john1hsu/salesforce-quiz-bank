id: sf-001102
product_area: identity
true_statement: Salesforce advises using a client credentials token until a request returns 401, then rerunning the flow once and raising an error if that also fails.
false_statement: Salesforce advises requesting a fresh client credentials token before every API call, rather than reusing one until a request returns 401.
explanation: The recommended pattern is to reuse the token and only rerun the flow after a 401, with a single retry. Requesting a token per call is not the guidance.
