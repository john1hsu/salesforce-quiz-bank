true_statement: For CLI JWT logins, the DX guide recommends a connected app rather than an external client app when the Dev Hub will create scratch orgs or sandboxes.
false_statement: For CLI JWT logins, the DX guide recommends an external client app rather than a connected app when the Dev Hub will create scratch orgs or sandboxes.
explanation: The guide generally prefers external client apps, but it carves out Dev Hubs that create scratch orgs or sandboxes, where a connected app is recommended so the new orgs can be authorized with the Dev Hub's key.
