id: sf-000702
product_area: identity
true_statement: Shortening the password expiration period takes effect immediately, but lengthening it applies only from each user's next password change.
false_statement: Lengthening the password expiration period takes effect immediately, but shortening it applies only from each user's next password change.
explanation: A shorter expiration, or switching to never expires, applies at once; a longer one waits until the user next changes the password. The false version reverses which direction is immediate.
