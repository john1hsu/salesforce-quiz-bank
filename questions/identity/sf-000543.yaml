id: sf-000543
product_area: identity
true_statement: The Step-Up Authentication Period setting makes users re-verify after a set number of minutes, up to a maximum of two hours.
false_statement: The Step-Up Authentication Period setting makes users re-verify after a set number of minutes, up to a maximum of 24 hours.
explanation: Step-up policies can force periodic re-verification, but the period tops out at two hours. A 24-hour ceiling overstates the limit.
