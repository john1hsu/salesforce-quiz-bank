id: sf-000627
product_area: identity
true_statement: A login from outside an org's trusted IP ranges can succeed after an identity challenge, but a login outside a profile's login IP ranges is denied.
false_statement: A login from outside a profile's login IP ranges can succeed after an identity challenge, but a login outside an org's trusted IP ranges is denied.
explanation: Trusted IP ranges only skip the verification challenge, while profile login IP ranges are a hard allowlist with no fallback. The false statement swaps the two controls.
