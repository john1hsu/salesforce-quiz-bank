id: sf-001245
product_area: identity
true_statement: For outbound Apex mTLS, Salesforce rotates neither certificate, so the customer must renew and replace them before they expire.
false_statement: For outbound Apex mTLS, Salesforce rotates the org's client certificate automatically, so the customer only manages the server's certificate.
explanation: Salesforce's guidance says it rotates no certificates in outbound Apex mTLS, leaving renewal to the customer, ideally automated and rehearsed in a sandbox. It never rotates customer client certificates in any mTLS flow.
