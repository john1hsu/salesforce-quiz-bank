id: sf-000481
product_area: identity
true_statement: Salesforce login flows run after the user has authenticated, including after SAML SSO, and add logic on top rather than replacing authentication.
false_statement: Salesforce login flows run before the user authenticates and replace the password or SAML SSO step with custom logic.
explanation: A login flow is inserted after authentication succeeds and before the user reaches the org. It extends password, delegated or SSO login; it never substitutes for it.
