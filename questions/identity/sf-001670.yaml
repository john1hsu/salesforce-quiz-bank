id: sf-001670
product_area: identity
true_statement: Salesforce emails a user whenever a new verification method is added to their account, whether the user or an admin added it.
false_statement: Salesforce emails a user about a new verification method only when an admin adds it, not when the user registers it themselves.
explanation: The notification is sent for every newly added method regardless of who added it, so users can spot unexpected registrations. The false version limits it to admin changes.
