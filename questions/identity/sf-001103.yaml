id: sf-001103
product_area: identity
true_statement: Salesforce's device flow token request uses grant_type=device, not the RFC 8628 device_code URN, so generic RFC libraries may need adjusting.
false_statement: Salesforce's device flow token request uses the RFC 8628 device_code URN as its grant_type, so generic RFC libraries work without adjusting.
explanation: Salesforce chose the short grant type value device instead of the standard URN, which is why off-the-shelf RFC 8628 clients may not work unmodified.
