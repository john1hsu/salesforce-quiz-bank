id: sf-000480
product_area: identity
true_statement: Headless Identity's code-and-credentials flow works only against an Experience Cloud site domain, not employee logins through a My Domain login URL.
false_statement: Headless Identity's code-and-credentials flow works against a My Domain login URL for employees as well as against Experience Cloud site domains.
explanation: The flow is limited to site domains such as *.my.site.com and doesn't support employee login through login.salesforce.com or My Domain.
