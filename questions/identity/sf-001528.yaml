id: sf-001528
product_area: identity
true_statement: The Identity Provider Event Log page in Setup shows only the 50 most recent login attempts, so a custom report is needed to see more.
false_statement: The Identity Provider Event Log page in Setup shows the 20,000 most recent login attempts, so a custom report is rarely needed to see more.
explanation: The Setup view of the IdP event log is limited to the latest 50 attempts, and a custom report is the way to look further back. The 20,000 figure belongs to a different page.
