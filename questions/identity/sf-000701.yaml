id: sf-000701
product_area: identity
true_statement: Once a profile has its own password policy, later changes to the org-wide password policy no longer reach that profile's users.
false_statement: Once a profile has its own password policy, later changes to the org-wide password policy still override it for that profile's users.
explanation: A profile-level policy replaces the org-wide one for that profile, so org-wide edits stop applying there. This drift is why admins should check which profiles carry their own settings.
