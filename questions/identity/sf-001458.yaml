id: sf-001458
product_area: identity
true_statement: When a service provider sends ForceAuthn, Salesforce as the identity provider makes the user re-enter credentials even with a live session, with no extra setup.
false_statement: When a service provider sends ForceAuthn, Salesforce as the identity provider reuses a live session unless an admin enables forced reauthentication.
explanation: Salesforce honours ForceAuthn out of the box and prompts for credentials again despite an active session. No org setting is needed to turn that behaviour on.
