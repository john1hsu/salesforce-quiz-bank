id: sf-000837
product_area: identity
true_statement: A Salesforce-initiated OpenID Connect single logout waits about 10 seconds before redirecting to the login page.
false_statement: A Salesforce-initiated OpenID Connect single logout waits about 60 seconds before redirecting to the login page.
explanation: The short pause of roughly 10 seconds gives the relying party time to finish logging out. A full minute is far longer than Salesforce waits.
