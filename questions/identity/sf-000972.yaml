id: sf-000972
product_area: identity
true_statement: In orgs created before Summer '25, admins must turn on passkeys and security keys, while third-party authenticator apps are available automatically.
false_statement: In orgs created before Summer '25, admins must turn on third-party authenticator apps, while passkeys and security keys are available automatically.
explanation: Older orgs need an admin to enable passkeys and security keys, but TOTP authenticator apps work out of the box. Newer orgs allow every method by default.
