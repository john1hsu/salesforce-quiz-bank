id: sf-000900
product_area: identity
true_statement: A Salesforce refresh token IP allowlist can hold at most 256 IP addresses across all of its ranges.
false_statement: A Salesforce refresh token IP allowlist can hold at most 16 IP ranges, with no cap on the addresses they cover.
explanation: The allowlist, used with the web server flow, blocks refresh requests from outside its ranges and is capped at 256 addresses in total, not a count of ranges.
