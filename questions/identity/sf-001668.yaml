id: sf-001668
product_area: identity
true_statement: Both RFC 6238 and NIST require a TOTP verifier to refuse a code that was already accepted once, even if it is still inside its validity window.
false_statement: Both RFC 6238 and NIST allow a TOTP verifier to accept the same code more than once, as long as it is still inside its validity window.
explanation: Rejecting reused codes blocks replay attacks within the time step. The false version permits reuse until the window expires.
