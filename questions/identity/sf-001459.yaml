id: sf-001459
product_area: identity
true_statement: Salesforce Authenticator automation auto-approves a request only when its five factors all match a request the user has approved three times before.
false_statement: Salesforce Authenticator automation auto-approves a request only when its five factors all match a request the user has approved ten times before.
explanation: Automation compares service, username, action, location and client with earlier requests and kicks in after a matching request has been approved three times. Ten approvals is not the threshold.
