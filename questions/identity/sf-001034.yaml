id: sf-001034
product_area: identity
true_statement: Freezing a user blocks login at once but keeps the license in use; only deactivating the user releases the license.
false_statement: Freezing a user blocks login at once and releases the license, just as deactivating the user does.
explanation: Freezing is a stopgap while dependencies are untangled, and the frozen user still holds a license seat. Deactivation is the only step that frees it.
