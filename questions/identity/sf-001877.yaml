id: sf-001877
product_area: identity
true_statement: A frontdoor URL from the Single Access UI Bridge API is valid for up to one minute and can be used only once.
false_statement: A frontdoor URL from the Single Access UI Bridge API is valid for up to fifteen minutes and can be used only once.
explanation: The singleaccess endpoint issues a short-lived, single-use link that expires within a minute. Fifteen minutes is far longer than the documented window.
