id: sf-000834
product_area: identity
true_statement: A transient SAML NameID is a one-time value discarded at session end, while a persistent NameID stays linked to the SP account until removed.
false_statement: A persistent SAML NameID is a one-time value discarded at session end, while a transient NameID stays linked to the SP account until removed.
explanation: Transient identifiers give the user anonymity at the SP because they are thrown away after the session. Persistent identifiers keep a lasting link to the SP account.
