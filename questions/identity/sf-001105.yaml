id: sf-001105
product_area: identity
true_statement: Since Salesforce's September 2025 restrictions, uninstalled connected apps that use the device flow are blocked even for users who authorized them earlier.
false_statement: Since Salesforce's September 2025 restrictions, installed connected apps that use the device flow are blocked even for users who authorized them earlier.
explanation: The restrictions targeted uninstalled apps relying on the device flow, while apps installed in the org kept working. The false statement applies the block to installed apps.
