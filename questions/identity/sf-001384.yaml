id: sf-001384
product_area: identity
true_statement: In the token exchange flow, a new user is created only if isUserCreationAllowed is true in metadata, canCreateUser is true in the call, and no matching user exists.
false_statement: In the token exchange flow, a new user is created whenever isUserCreationAllowed is true in metadata, even if canCreateUser is false in the call.
explanation: 'All three conditions must hold: the metadata allows creation, the runtime passes canCreateUser as true, and the handler finds no existing user. The metadata flag alone doesn''t force creation.'
