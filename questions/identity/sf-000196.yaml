id: sf-000196
product_area: identity
true_statement: For an OpenID Connect Auth. Provider, Salesforce checks the ID token against the issuer and user-info response but doesn't verify its signature.
false_statement: For an OpenID Connect Auth. Provider, Salesforce verifies the ID token's signature before checking it against the issuer and user-info response.
explanation: Signature validation isn't done automatically. If it matters, the registration handler should validate the token itself with Auth.JWTUtil.
