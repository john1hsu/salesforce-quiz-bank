id: sf-001388
product_area: identity
true_statement: The signature in a Salesforce web server flow token response is an HMAC-SHA256 over the identity URL and issue time, keyed with the consumer secret.
false_statement: The signature in a Salesforce web server flow token response is an RSA-SHA256 over the access token, signed with the org's private certificate key.
explanation: Salesforce returns a signature computed with HMAC-SHA256 over the id and issued_at values, using the consumer secret as the key, so the app can check the response came from Salesforce. It isn't an RSA signature over the token.
