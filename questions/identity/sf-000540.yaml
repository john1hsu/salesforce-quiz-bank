id: sf-000540
product_area: identity
true_statement: A default transaction security policy requires step-up authentication for UI report exports of more than 10,000 records.
false_statement: A default transaction security policy requires step-up authentication for UI report exports of more than 1,000 records.
explanation: Salesforce's default guardrail against post-takeover exfiltration kicks in above 10,000 exported records. A 1,000-record threshold understates it by a factor of ten.
