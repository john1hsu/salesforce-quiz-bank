id: sf-001529
product_area: identity
true_statement: In the Identity Provider Event Log, the status NoUserFedId means the user has no Federation Identifier while the service provider expects one.
false_statement: In the Identity Provider Event Log, the status NoUserFedId means the service provider's IdP certificate is missing or invalid.
explanation: 'NoUserFedId is a user-level problem: the app expects a Federation Identifier the user doesn''t have. A missing or invalid certificate shows up as InvalidSettings instead.'
