id: sf-001173
product_area: identity
true_statement: If an app allowlisted under API Access Control is missing OAuth scopes, the fix is to click Block and then Unblock on the Connected Apps OAuth Usage page.
false_statement: If an app allowlisted under API Access Control is missing OAuth scopes, the fix is to uninstall and then reinstall it from the Connected Apps OAuth Usage page.
explanation: The documented remedy for missing scopes on an allowlisted app is a Block followed by an Unblock on Connected Apps OAuth Usage. Uninstalling the app would instead remove it from the allowlist and cut off its users.
