id: sf-001171
product_area: identity
true_statement: In API Access Control's customers-and-partners mode, external users reach the APIs only through apps installed in the Experience Cloud site, while internal users can still use uninstalled apps.
false_statement: In API Access Control's customers-and-partners mode, internal users reach the APIs only through apps installed in the org, while external users can still use uninstalled apps.
explanation: The customers-and-partners mode restricts only external users, limiting them to connected apps installed in the site. Internal users keep access to uninstalled apps, so the false version restricts the wrong group.
