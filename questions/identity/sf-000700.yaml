id: sf-000700
product_area: identity
true_statement: Salesforce password policies can lock users out after 3, 5 or 10 invalid login attempts, for a lockout period of 15, 30 or 60 minutes.
false_statement: Salesforce password policies can lock users out after 3, 5 or 10 invalid login attempts, for a lockout period of 1, 12 or 24 hours.
explanation: The lockout settings offer 3, 5 or 10 attempts and a lockout of 15, 30 or 60 minutes (or 0). Lockout periods measured in many hours aren't among the options.
