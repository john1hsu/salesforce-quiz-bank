id: sf-000763
product_area: identity
true_statement: An OAuth 2.0 request becomes an OpenID Connect request only when its scope includes the value openid.
false_statement: An OAuth 2.0 request becomes an OpenID Connect request only when its scope includes the value profile.
explanation: The openid scope is what turns a plain OAuth exchange into OIDC. The profile scope only asks for a group of profile claims.
