id: sf-000764
product_area: identity
true_statement: OpenID Connect says only the iss and sub claims together reliably identify a user, so email must not be used as a unique key.
false_statement: OpenID Connect says the iss and email claims together reliably identify a user, so email can be used as a unique key.
explanation: Claims such as email or preferred_username can change or be reused, so the spec ties identity to issuer plus subject. Keying users on email is a known pitfall.
