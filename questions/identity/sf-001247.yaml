id: sf-001247
product_area: identity
true_statement: In SCIM, a user's password is a writeOnly attribute, and a service provider must never return it in clear or hashed form.
false_statement: In SCIM, a user's password is a readOnly attribute, and a service provider returns it only in hashed form.
explanation: 'RFC 7643 marks passwords writeOnly: clients can set them, but providers must never return them, hashed or not. readOnly would mean the client can''t set it, and returning a hash is forbidden.'
