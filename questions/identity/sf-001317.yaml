id: sf-001317
product_area: identity
true_statement: Under RFC 7519, a recipient that doesn't identify itself with a value in a JWT's aud claim must reject the token.
false_statement: Under RFC 7519, a recipient that doesn't identify itself with a value in a JWT's iss claim must reject the token.
explanation: The audience claim names the intended recipients, so a party outside it must refuse the token. The issuer claim identifies who created the token, not who should accept it.
