id: sf-001316
product_area: identity
true_statement: Salesforce JWT-based access tokens can be used only against Salesforce REST APIs, so consumers of SOAP APIs should use opaque tokens.
false_statement: Salesforce JWT-based access tokens can be used against both REST and SOAP APIs, so they can replace opaque tokens for every consumer.
explanation: JWT access tokens let off-platform services validate them locally, but they work only with REST APIs. Non-REST consumers such as SOAP clients still need opaque tokens.
