id: sf-001246
product_area: identity
true_statement: SCIM 2.0 index-based paging uses a 1-based startIndex with a count, and because it is stateless, results can shift between pages.
false_statement: SCIM 2.0 index-based paging uses a 0-based startIndex with a count, and because it is stateful, results stay fixed between pages.
explanation: RFC 7644 defines paging with a startIndex that begins at 1 and a count, without server-side state, so data changes can move results between pages. The 0-based, stateful version gets both points wrong.
