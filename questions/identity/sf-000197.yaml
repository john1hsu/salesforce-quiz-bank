id: sf-000197
product_area: identity
true_statement: The Execute Registration As user for an Auth. Provider's registration handler needs the Manage Users permission.
false_statement: The Execute Registration As user for an Auth. Provider's registration handler needs the Modify All Data permission.
explanation: The handler creates and updates users, so its run-as user needs Manage Users. A dedicated service account keeps registration working if an admin leaves.
