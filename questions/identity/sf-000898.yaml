id: sf-000898
product_area: identity
true_statement: The default refresh token policy on a Salesforce connected app is that the refresh token is valid until revoked.
false_statement: The default refresh token policy on a Salesforce connected app is that the refresh token expires if not used for 90 days.
explanation: Out of the box, a refresh token never expires on its own and works until a user or admin revokes it. Inactivity windows and fixed lifetimes are options an admin has to choose.
