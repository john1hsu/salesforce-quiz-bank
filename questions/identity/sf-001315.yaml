id: sf-001315
product_area: identity
true_statement: On a Salesforce external credential using the JWT bearer flow, exp defaults to two minutes ahead when no expiration is set, and the algorithm is fixed to RS256.
false_statement: On a Salesforce external credential using the JWT bearer flow, exp defaults to sixty minutes ahead when no expiration is set, and the algorithm can be set to HS256.
explanation: Admins can edit iss, sub and aud, but an unset expiry becomes two minutes and alg is locked to RS256. Neither a one-hour default nor HS256 is offered.
